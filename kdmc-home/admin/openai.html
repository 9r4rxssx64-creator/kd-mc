<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- media-src : sans lui, la balise <audio> est bloquée SANS message (piège connu :
     une balise <audio> n'est PAS couverte par img-src ni par default-src ici). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" />
<title>KDMC — OpenAI : ce qui consomme (admin)</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0b1409" />
<link rel="stylesheet" href="/design-system.css" />
<style>
  .wrap{max-width:820px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
  .logo{font-weight:800;font-size:22px;letter-spacing:1px;background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  a.home{color:var(--mut);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-height:44px;display:inline-flex;align-items:center}
  .cat{margin:22px 0 10px;color:var(--gold);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:10px}
  .cat::after{content:"";flex:1;height:1px;background:var(--line)}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
  .kpi .l{color:var(--mut);font-size:12px}
  .kpi .v{color:var(--gold2);font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .s{color:var(--subtle);font-size:11.5px;margin-top:4px}
  .tile{padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .tile h3{margin:0;font-size:15px}
  .tile p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.55}
  .btn{min-height:48px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--gold2);font-size:15px;font-weight:600;cursor:pointer;padding:12px 16px;width:100%}
  .btn:active{transform:translateY(1px)}
  .btn.on{border-color:var(--gold);color:var(--gold)}
  .deux{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:520px){.deux{grid-template-columns:1fr 1fr}}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:12px}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .etat{color:var(--subtle);font-size:12.5px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">KDMC<b> ADMIN</b></div>
    <a class="home" href="/admin/#couts">← Tableau de bord</a>
  </div>
  <div id="app"><div class="etat">Vérification de l'accès…</div></div>
</div>
<script src="openai.js"></script>
<!-- Bulle de version (Kevin 9.10 « chaque page a sa bulle, cliquable ») : toucher = forcer la mise à jour -->
<script src="/CMCteams/tools/shared/version-badge-pwa.js" data-project="admin-openai" data-version="v1.1.0" data-color="#c9a227" defer></script>
</body>
</html>
