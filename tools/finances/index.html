  /* Aperçu EN-APP (pas window.open : iOS le bloque dans une PWA installée → « Voir » ne faisait rien).
     Image → <img>, texte → <pre>, PDF → rendu PAGES EN CANVAS via PDF.js vendored (iOS ne dessine PAS
     un PDF dans une iframe → page blanche, capture Kevin IMG_3064) + bouton « Télécharger / Ouvrir »
     (un vrai <a download>, autorisé par iOS au tap). Fermeture = retire l'overlay + révoque le blob. */
  var _docUrl='';
  function _loadPdfjs(){
    return new Promise(function(res,rej){
      if(window.pdfjsLib){ res(window.pdfjsLib); return; }
      var s=document.createElement('script'); s.src='/tools/shared/pdfjs/pdf.min.js';
      s.onload=function(){ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='/tools/shared/pdfjs/pdf.worker.min.js'; res(window.pdfjsLib); }catch(e){ rej(e); } };
      s.onerror=function(){ rej(new Error('PDF.js indisponible')); };

  async function _renderPdfInto(box, bytes){
    var lib=await _loadPdfjs();
    var copy=(bytes instanceof Uint8Array)?bytes.slice(0):new Uint8Array(bytes.slice(0)); /* pdf.js détache le buffer (leçon #65) */
    var pdf=await lib.getDocument({ data:copy }).promise;
    box.innerHTML='';
    var maxPages=Math.min(pdf.numPages,30);
    var cw=Math.min(920,(box.clientWidth||window.innerWidth-24));
    for(var p=1;p<=maxPages;p++){
      var page=await pdf.getPage(p);
      var v0=page.getViewport({scale:1});
      var scale=cw/v0.width*(window.devicePixelRatio||1);
      var vp=page.getViewport({scale:scale});
      var cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      cv.style.cssText='width:100%;height:auto;display:block;border-radius:10px;background:#fff;margin:0 0 8px';
      box.appendChild(cv);

  /* ===== MINIATURES de documents — un vrai visuel partout (image / 1ʳᵉ page du PDF),

  var _thumbCache={}, _thumbQueue=Promise.resolve();
  function _imgThumbFromBlob(blob){ return new Promise(function(res){ var u=URL.createObjectURL(blob); var im=new Image();
    im.onload=function(){ try{ var w=Math.min(192,im.width||192), h=Math.max(1,Math.round((im.height||1)/(im.width||1)*w));
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h);
      res(cv.toDataURL('image/jpeg',0.72)); }catch(e){ res(null); } URL.revokeObjectURL(u); };
    im.onerror=function(){ URL.revokeObjectURL(u); res(null); }; im.src=u; }); }
  async function _pdfThumbFromBytes(bytes){
    var lib=await _loadPdfjs();
    var copy=(bytes instanceof Uint8Array)?bytes.slice(0):new Uint8Array(bytes.slice(0));
    var pdf=await lib.getDocument({ data:copy }).promise;
    var page=await pdf.getPage(1);
    var v0=page.getViewport({scale:1}); var vp=page.getViewport({scale:192/v0.width});

  }
  async function _makeDocThumb(docId){
    if(_thumbCache[docId]!==undefined)return _thumbCache[docId];
    try{ var pk=await idbGet('thumb:'+docId); if(pk){ var dt=await decWith(KEY,pk); _thumbCache[docId]=dt.data||null; return _thumbCache[docId]; } }catch(e){}

    try{ var pack=await idbGet('doc:'+docId);
      if(pack){ var d=await decWith(KEY,pack); var bytes=bufFromB64(d.data);

      }
    }catch(e){ out=null; }
    _thumbCache[docId]=out;
    if(out){ try{ await idbSet('thumb:'+docId, await encWith(KEY,{data:out})); }catch(e){} }

  }

  /* Voix : micro (dictée) + haut-parleur (lecture). */
  function startMic(cb){ var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toast('Micro non supporté sur ce navigateur',true); return null; }
    var r=new SR(); r.lang='fr-FR'; r.interimResults=false; r.maxAlternatives=1;

  function speak(txt){ try{ if(!window.speechSynthesis)return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(String(txt).slice(0,2000)); u.lang='fr-FR'; u.rate=1; speechSynthesis.speak(u); }catch(e){} }
  function stopSpeak(){ try{ if(window.speechSynthesis)speechSynthesis.cancel(); }catch(e){} }

  /* Q&A : cherche dans TOUS les documents/opérations et répond. */
  function buildDocContext(){
    var L=['OPÉRATIONS (date | libellé | montant € | catégorie):'];
    (VAULT.tx||[]).slice(0,700).forEach(function(t){ L.push(ymd(t.date)+' | '+stripSecrets(t.label)+' | '+t.amount.toFixed(2)+' | '+t.category); });
    if((VAULT.devis||[]).length){ L.push(''); L.push('DEVIS non payés (date | libellé | montant €):'); VAULT.devis.forEach(function(d){ L.push(ymd(d.date)+' | '+stripSecrets(d.label)+' | '+Number(d.amount).toFixed(2)); }); }
    if((VAULT.docs||[]).length){ L.push(''); L.push('DOCUMENTS: '+(VAULT.docs||[]).map(function(d){return docTitle(d);}).slice(0,80).join(' · ')); }
    return L.join('\n');
  }
  async function aiAnswer(q){
    return aiCall([{ t:'Tu es mon assistant finances. Réponds à la QUESTION en te basant UNIQUEMENT sur mes données ci-dessous. Donne les montants et dates EXACTS, additionne si besoin, sois concis et clair en français. Si l\'info n\'y est pas, dis-le.\n\n'+buildDocContext()+'\n\nQUESTION : '+q }], 900);
  }
  /* Extrait tous les objets {...} complets (niveau haut) d'un fragment, en respectant les chaînes. */
  function _balancedObjs(str){ var out=[],depth=0,start=-1,inStr=false,esc=false;
    for(var i=0;i<str.length;i++){ var ch=str[i];
      if(inStr){ if(esc)esc=false; else if(ch==='\\')esc=true; else if(ch==='"')inStr=false; continue; }
      if(ch==='"'){ inStr=true; continue; }
      if(ch==='{'){ if(depth===0)start=i; depth++; }
      else if(ch==='}'){ if(depth>0){ depth--; if(depth===0&&start>=0){ out.push(str.slice(start,i+1)); start=-1; } } } }
    return out; }
  /* SAUVETAGE d'une réponse TRONQUÉE (relevé dense coupé par la limite de tokens) : on récupère meta
     + toutes les opérations COMPLÈTES au lieu de tout jeter (« Réponse IA illisible »). Leçon : ne jamais
     perdre 25 opérations parce que la 26e est coupée. */
  function _salvageObj(t){ var res={};
    var mi=t.indexOf('"meta"');
    if(mi>=0){ var m0=t.indexOf('{',mi); if(m0>=0){ var objs=_balancedObjs(t.slice(m0)); if(objs.length){ try{ res.meta=JSON.parse(objs[0]); }catch(e){} } } }
    var ti=t.search(/"(?:tx|transactions)"/); var arr=[];
    if(ti>=0){ var br=t.indexOf('[',ti); if(br>=0){ _balancedObjs(t.slice(br+1)).forEach(function(o){ try{ arr.push(JSON.parse(o)); }catch(e){} }); } }
    else { _balancedObjs(t).forEach(function(o){ try{ var x=JSON.parse(o); if(x&&(x.amount!=null||x.label))arr.push(x); }catch(e){} }); }
    if(arr.length)res.tx=arr;
    return (res.meta||res.tx)?res:null; }
  function extractJson(s){ /* récupère l'objet JSON du texte IA (objet PRIORITAIRE : garde meta.kind/ht/tva/vendor) */
    if(!s)return null;
    var t=String(s).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
    try{ return JSON.parse(t); }catch(e){}
    var c=t.indexOf('{'), d=t.lastIndexOf('}');           /* objet {meta,tx} d'abord — sinon on perdrait meta */
    if(c>=0&&d>c){ try{ return JSON.parse(t.slice(c,d+1)); }catch(e){} }
    var a=t.indexOf('['), b=t.lastIndexOf(']');            /* sinon tableau nu */
    if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
    return _salvageObj(t);                                 /* dernier recours : réponse tronquée → on sauve ce qui est complet */
  }
  var EXTRACT_PROMPT =
    'Tu es un extracteur COMPTABLE de relevés bancaires, factures, tickets, fiches de paie ET devis (France/Monaco/Italie, EUR). '+
    'Analyse le document et renvoie UNIQUEMENT un JSON strict, sans texte autour:\n'+
    '{"meta":{"kind":"releve|facture|ticket|paie|devis|avoir|pub","confidence":0.0,"vendor":"","vendor_id":"","vendor_addr":"","client":"","invoice_no":"","bank":"","account_masked":"","period":"","date":"YYYY-MM-DD","due_date":"YYYY-MM-DD","payment_method":"","total":null,"ht":null,"tva":null,"tva_rate":null,"opening":null,"closing":null},'+
    '"tx":[{"date":"YYYY-MM-DD","label":"désignation exacte de l\'article/ligne","amount":-12.34,"category":"une catégorie parmi la liste","vendor":"","asset":"","qty":null,"unit_price":null,"ht":null,"tva":null,"tva_rate":null}]}\n'+
    'Règles: amount NÉGATIF pour une dépense/débit, POSITIF pour un revenu/crédit. '+
    'Reproduis les montants EXACTEMENT (aucune invention; ligne illisible -> ne pas l\'inventer). '+
    'category ∈ ['+DEFAULT_CATS.map(function(c){return '"'+c+'"';}).join(',')+']. '+
    '--- LES 7 TYPES (choisis LE bon, ne les confonds JAMAIS) ---\n'+
    '1) "releve" = RELEVÉ BANCAIRE (plusieurs opérations, solde ouverture/clôture, IBAN masqué). Un relevé contient SOUVENT 20 à 60 opérations sur le mois — retourne-les TOUTES, une par une, dans tx[] ; ne RÉSUME JAMAIS en une seule ligne. Inclus IMPÉRATIVEMENT les CRÉDITS/entrées en POSITIF : SALAIRE, VIREMENT REÇU, PENSION, REMBOURSEMENT, ALLOCATION — ne liste pas que les débits. Chaque ligne = une tx avec son signe réel. Renseigne TOUJOURS meta.opening (solde de DÉBUT) et meta.closing (solde de FIN) si visibles — ils servent à vérifier que RIEN n\'a été oublié. Ne saute AUCUNE ligne (frais bancaires, prélèvements, virements inclus).\n'+
    '2) "facture" = FACTURE réellement due/payée d\'un fournisseur (n° de facture + montant TTC), Y COMPRIS une facture d\'ABONNEMENT ou un PRÉLÈVEMENT récurrent (Netflix, SFR, EDF, assurance, loyer…). 1 ligne, amount = TTC NÉGATIF ; ht/tva/tva_rate si visibles ; vendor = émetteur.\n'+
    '3) "ticket" = TICKET DE CAISSE / reçu d\'un achat DÉJÀ payé (magasin, resto, carburant, péage…). 1 ligne, amount NÉGATIF.\n'+
    '4) "paie" = FICHE DE PAIE / bulletin de salaire. 1 ligne Revenus, salaire NET POSITIF.\n'+
    '5) "devis" = DEVIS / PROFORMA / BON DE COMMANDE / PRÉVENTIVO / estimation NON encore payée (offre chiffrée de prestation/travaux). meta.kind="devis", meta.total=montant (positif), tx=[] — NE COMPTE PAS une dépense.\n'+
    '6) "avoir" = AVOIR / REMBOURSEMENT / NOTE DE CRÉDIT (le commerçant te REND de l\'argent : retour produit remboursé, geste commercial). 1 ligne, amount POSITIF (argent qui revient), vendor = émetteur.\n'+
    '7) "pub" = PUBLICITÉ / NEWSLETTER / PROMOTION / OFFRE commerciale / code promo / vente flash / panier abandonné / deal (Groupon/Wish/AliExpress…). meta.kind="pub", tx=[]. C\'est une pub MÊME si un prix, une réduction ou « -50% » est affiché.\n'+
    'NE CONFONDS PAS : un DEVIS/PROFORMA/bon de commande (pas encore payé) ≠ une FACTURE (due/payée) ; une OFFRE/PROMO (pub) ≠ un achat facturé ; un AVOIR (argent rendu, POSITIF) ≠ une facture (dépense, NÉGATIVE). '+
    'RÈGLE STRICTE pour un CORPS DE MAIL (texte, pas un PDF) : c\'est une "pub" par DÉFAUT. Ce n\'est une "facture" QUE si on voit à la fois (a) un n° de facture/commande ET (b) un montant réellement payé/débité/prélevé (« total facturé », « payé le », « prélèvement de »). Un prix affiché, une offre, un % de réduction ne sont PAS un achat. En cas de doute : "pub". '+
    'meta.vendor = nom du VENDEUR / marchand / fournisseur (l\'émetteur qui te vend/facture) ; meta.vendor_id = son SIRET ou n° de TVA si visible ; meta.vendor_addr = son adresse si visible ; meta.client = nom de l\'ACHETEUR/destinataire (toi) si visible. '+
    'Pour CHAQUE article/ligne : label = la désignation exacte de l\'article, qty = quantité et unit_price = prix unitaire si visibles (sinon null). '+
    'asset = le NOM de l\'ENGIN / VÉHICULE / MACHINE concerné par cette ligne UNIQUEMENT s\'il est clairement écrit (marque+modèle « Komatsu PC35 », « Piaggio Porter », une immatriculation « AB-123-CD », « pelle », « camion »…) — sinon "" (ne devine JAMAIS un engin qui n\'est pas écrit). '+
    'meta.date = date du document ; meta.due_date = date d\'ÉCHÉANCE / limite de paiement d\'une facture si visible ; meta.payment_method = moyen de paiement (carte, prélèvement, virement, espèces…) si visible. '+
    'Ajoute meta.confidence (0 à 1) = ta certitude sur le kind ; BASSE (≤0.5) si le document est ambigu (pub OU facture ?). '+
    'Réponds en JSON seulement.';
  /* 2e avis indépendant (leçon « plusieurs vérifie ») : un AUTRE moteur tranche juste le TYPE,
     sans ré-extraire — court, rapide, pas cher. Sert à ne JAMAIS compter une pub comme une dépense. */
  var VERIFY_PROMPT =
    'Tu es un vérificateur. Regarde ce document et dis STRICTEMENT s\'il doit compter dans des comptes personnels. '+
    'Réponds UNIQUEMENT ce JSON : {"financial":true,"kind":"facture|ticket|paie|releve|avoir|devis|pub|offre","confidence":0.0,"reason":"court"}. '+
    'financial=true SEULEMENT si c\'est un vrai document comptable : une FACTURE/TICKET réellement payé ou dû, un RELEVÉ bancaire, une FICHE DE PAIE, un AVOIR/remboursement. '+
    'financial=false pour une PUB, une NEWSLETTER, une PROMOTION, une OFFRE commerciale, un code promo, un deal — MÊME si un prix ou une réduction est affiché. '+
    'Un DEVIS (offre de travaux chiffrée non payée) = financial:false, kind="devis". '+
    'confidence entre 0 et 1. En cas de doute réel → financial:false. JSON seulement.';

  /* Filtre pub LOCAL (couche app, AVANT l'IA) — même règle que les workers :
     1 marqueur FORT (désabonner, newsletter, vente flash…) OU ≥2 marqueurs FAIBLES DISTINCTS.
     Appliqué UNIQUEMENT aux corps de mail texte — jamais aux PDF (une vraie facture est un PDF). */
  var PROMO_STRONG_RE=/(d[ée]sabonn|unsubscrib|newsletter|vente\s*(flash|priv[ée]e)|code\s*promo|panier\s+abandonn|black\s*friday|cyber\s*monday|jeu[\s-]*concours|gagnez\b|parrainage|cashback|offre\s+de\s+bienvenue|derni[èe]re\s+chance|derniers?\s+jours\s+pour)/i;
  var PROMO_WEAK_RE=/(-\s?\d{1,2}\s?%|\d{1,2}\s?%\s*de\s*r[ée]duc|promotion\b|promo\b|r[ée]duction|remise\s+(de|exceptionnelle|imm[ée]diate)|soldes\b|offre\s+(sp[ée]ciale|limit[ée]e|exclusive|du\s+jour|exceptionnelle)|bons?\s+plans?|deal\s+du|jusqu.[àa]\s+-?\d{1,2}\s?%|profitez\s+de|d[ée]couvrez\s+(nos|notre|la\s+s[ée]lection)|exclusivit[ée]|s[ée]lection\s+pour\s+vous|meilleures?\s+offres?|ne\s+manquez\s+pas|[àa]\s+saisir|petits?\s+prix|expire\s+(bient[ôo]t|le)|top\s+ventes?|nouveaut[ée]s\s+de)/gi;
  function looksPromoLocal(name, from, text){
    var s=String(name||'')+' '+String(from||'')+' '+String(text||'').slice(0,4000);
    if(PROMO_STRONG_RE.test(s)) return true;
    var weak=s.match(PROMO_WEAK_RE)||[], seen={}, n=0;
    for(var i=0;i<weak.length;i++){ var k=weak[i].toLowerCase().replace(/\s+/g,' ').trim(); if(!seen[k]){ seen[k]=1; n++; } }
    return n>=2;
  }

  /* 2e avis : un AUTRE moteur tranche juste le TYPE (financier ou pub/offre) — court, pas cher.
     Retourne {financial,kind,confidence,reason,by} ou null (indispo → on ne bloque jamais). */
  async function verifyKind(docParts, exclude){
    try{
      var vout=await aiCallSecond(docParts.concat([{t:VERIFY_PROMPT}]), 200, exclude||[]);
      var j=extractJson(vout); if(!j) return null;
      return { financial:(j.financial===true||j.financial==='true'), kind:String(j.kind||'').toLowerCase(),
        confidence:num(j.confidence), reason:String(j.reason||'').slice(0,120), by:_aiLastUsed };
    }catch(e){ return null; }
  }
  /* « Que plusieurs vérifient si il faut » (Kevin) : pour ne JAMAIS compter une pub/offre comme
     une dépense, un 2e moteur INDÉPENDANT vérifie le type sur les cas à risque (corps de mail qui
     crée une opération, faible confiance, ou conflit avec le filtre pub). Désaccord → 3e avis
     (majorité) ; toujours pas tranché → "à vérifier" (le doc est gardé, 0 opération, Kevin décide). */
  async function verifyClassification(out, ctx){
    var j=extractJson(out); if(!j) return out;
    var meta=j.meta||{}; var kind=meta.kind||'a_verifier';
    if(kind==='pub'||kind==='a_verifier') return out;                 /* déjà écarté / déjà à vérifier */
    var conf=num(meta.confidence);
    var creates=(kind==='facture'||kind==='ticket'||kind==='paie'||kind==='avoir');
    var lowConf=(conf!=null && conf<0.6);
    var localPub=ctx.text && looksPromoLocal(ctx.name, ctx.from, ctx.text);
    var need=(ctx.ftype==='texte' && creates) || lowConf || (localPub && creates);
    if(!need) return out;                                             /* PDF facture net + confiant → pas de 2e appel (économie) */
    var v=await verifyKind(ctx.docParts);
    if(!v) return out;                                               /* 2e IA indispo → on garde le 1er avis (jamais de blocage) */
    if(v.financial) return out;                                     /* 2e avis CONFIRME financier → on garde le 1er (type + montants) */
    /* désaccord : 1er = financier, 2e = pub/offre */
    if(v.confidence!=null && v.confidence>=0.7){                     /* 2e confiant que c'est une pub/offre → on écarte */
      j.meta.kind=(v.kind==='devis')?'devis':'pub'; if(j.meta.kind==='pub')j.tx=[]; return JSON.stringify(j);
    }
    var v3=await verifyKind(ctx.docParts, v.by?[v.by]:[]);           /* 2e pas sûr → 3e avis (autre moteur), majorité */
    if(!v3){ j.meta.kind='a_verifier'; return JSON.stringify(j); }   /* pas de 3e → prudence : à vérifier */
    var yes=[true, !!v.financial, !!v3.financial].filter(Boolean).length;

  /* Le worker "kdmc-mail" reçoit les mails envoyés/transférés à factures@kd-mc.com (Cloudflare Email

     on les classe (IA), on dédoublonne, puis on acquitte. Les originaux sont conservés (chiffrés). */
  /* Cœur partagé : récupère les pièces en attente, les importe, dédoublonne, acquitte.
     BURST-DRAIN (gros arriéré) : on BOUCLE — on avale page après page jusqu'à ce que la file
     soit vide (ou 12 pages max ~1440), au lieu de 40 puis attendre 5 min. Tu ouvres l'app une
     fois et elle vide tout d'un coup. Persiste après chaque pièce (rien n'est perdu si coupure). */
  async function _mailPull(onProgress){
    if(!VAULT||!VAULT.aiPinHash) return {ok:false,reason:'no_ai'};
    var grant=await ensureGrant(); if(!grant) return {ok:false,reason:'no_grant'};
    var okc=0,devc=0,dupc=0,pubc=0,avc=0,err=0,ecc=0,total=0;
    var MAX_PAGES=12;
    for(var pg=0; pg<MAX_PAGES; pg++){
      var list;
      try{ var r=await fetch('/__mail/scan',{ headers:{'x-kdmc-admin':grant}, cache:'no-store' });
        if(!r.ok){ if(total) break; return {ok:false,reason:'http_'+r.status}; }
        var j=await r.json(); if(!j.ok){ if(total) break; return {ok:false,reason:j.reason||'erreur'}; } list=j.items||[];
      }catch(e){ if(total) break; return {ok:false,reason:'network'}; }
      if(!list.length){ if(pg===0) return {ok:true,okc:0,devc:0,dupc:0,err:0,count:0}; break; }
      var ackIds=[];
      for(var i=0;i<list.length;i++){ var it=list[i]; if(onProgress)onProgress(total+i+1,total+list.length,it);
        try{ var res=await importBytes(it.b64, it.mime||'application/pdf', it.filename||('mail-'+(it.id||i)), {src:'mail:'+(it.from||'')});
          if(res.dup)dupc++; else if(res.pub)pubc++; else if(res.aVerifier)avc++; else { okc+=res.added; if(res.devis)devc+=res.devis;
            if(res.docId){ var _dr=(VAULT.docs||[]).filter(function(x){return x.id===res.docId;})[0]; if(_dr&&_dr.kind==='releve'&&_dr.reconc&&!_dr.reconc.ok)ecc++; } }
          ackIds.push(it.id); await persist();
        }catch(e){ err++; }
      }
      if(ackIds.length){ try{ await fetch('/__mail/ack',{ method:'POST', headers:{'content-type':'application/json','x-kdmc-admin':grant}, body:JSON.stringify({ids:ackIds}) }); }catch(e){} }
      total+=list.length;
    }
    dedupeAll(); await persist();
    return {ok:true,okc:okc,devc:devc,dupc:dupc,pubc:pubc,avc:avc,err:err,ecc:ecc,count:total};

  function parseFrDate(s){ s=String(s||'').trim();

    return ymd(s); }

    if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===delim){out.push(cur);cur='';} else cur+=c; } } out.push(cur); return out; }

      var rawCat=(ci.cat>=0?(c[ci.cat]||'').trim():''); var cat;

  async function backupPull(){
    var grant=await ensureGrant(); if(!grant) return {ok:false,reason:'no_grant'};
    try{ var r=await fetch('/__fin/vault',{ credentials:'include', headers:{'x-kdmc-admin':grant}, cache:'no-store' });
      if(!r.ok) return {ok:false,reason:'http_'+r.status};
      var j=await r.json(); if(!j.ok) return {ok:false,reason:j.reason||'ko'}; if(j.empty) return {ok:false,reason:'empty'};
      return {ok:true, blob:j.blob, meta:j.meta};

  async function restoreFromCloud(pass){
    var pr=await backupPull(); if(!pr.ok) throw new Error(pr.reason==='empty'?'aucune sauvegarde en ligne':('cloud : '+pr.reason));
    var pack=pr.blob; var key;
    if(KEY && VAULT && VAULT._salt===pack.salt){ key=KEY; }   /* même appareil déjà déverrouillé */
    else { if(!pass){ var er=new Error('need_pass'); er.needPass=true; throw er; } key=await deriveKey(pass, pack.salt); }
    var data=await decWith(key,{iv:pack.iv,ct:pack.ct});
    /* Garde-fou anti-perte : si la sauvegarde en ligne contient MOINS de données que cet appareil
       (sauvegarde plus ancienne), on ne l'applique JAMAIS en silence → on demande confirmation
       (sinon des ajouts récents disparaîtraient). Restaurer une sauvegarde plus riche/égale = OK direct. */
    var localN=((VAULT&&VAULT.tx||[]).length)+((VAULT&&VAULT.docs||[]).length);
    var cloudN=((data.tx||[]).length)+((data.docs||[]).length);
    if(VAULT && cloudN<localN){
      if(!confirm('⚠️ La sauvegarde en ligne a MOINS de données ('+(data.tx||[]).length+' op.) que cet appareil ('+(VAULT.tx||[]).length+' op.).\n\nLa restaurer effacerait tes ajouts récents.\n\nRestaurer quand même ?')){
        var ec=new Error('annulé'); ec.cancelled=true; throw ec;
      }
    }
    data._salt=pack.salt; data.backupOnline=true; VAULT=data; KEY=key;
    localStorage.setItem(LS_VAULT, JSON.stringify({salt:pack.salt, iv:pack.iv, ct:pack.ct, ver:1}));
    audit('restore_cloud',''); await persist(); return data;
  }

  function activeTx(){
    var f=STATE.filter;

  function months(){ var s={}; (VAULT.tx||[]).forEach(function(t){ var k=ym(t.date); if(k)s[k]=1; }); return Object.keys(s).sort(); }
  function analyze(txs){
    var rev=0,dep=0, byCat={}, byMonth={}, internal=0;
    txs.forEach(function(t){
      if(t.recDup)return; /* facture rapprochée d'une ligne bancaire → déjà comptée (anti-doublon) */
      if(t.category==='Virements internes'){ internal+=Math.abs(t.amount); return; }
      var k=ym(t.date); byMonth[k]=byMonth[k]||{rev:0,dep:0};
      if(t.amount>=0){ rev+=t.amount; byMonth[k].rev+=t.amount; }
      else { dep+=(-t.amount); byMonth[k].dep+=(-t.amount);
        byCat[t.category]=(byCat[t.category]||0)+(-t.amount); }
    });
    var net=rev-dep; var rate=rev>0?(net/rev*100):0;
    return { rev:rev, dep:dep, net:net, rate:rate, byCat:byCat, byMonth:byMonth, internal:internal, count:txs.length };
  }
  function topExpenses(txs,n){ return txs.filter(function(t){return t.amount<0 && t.category!=='Virements internes';})
    .sort(function(a,b){return a.amount-b.amount;}).slice(0,n||10); }
  function subscriptions(){
    /* récurrences : même marchand normalisé, ≥2 mois distincts, montant régulier */
    var g={};
    (VAULT.tx||[]).forEach(function(t){ if(t.amount>=0||t.category==='Virements internes')return;
      var k=norm(t.label).split(' ').slice(0,4).join(' '); if(!k)return;
      (g[k]=g[k]||[]).push(t); });
    var subs=[];
    Object.keys(g).forEach(function(k){
      var arr=g[k]; var mset={}; arr.forEach(function(t){ mset[ym(t.date)]=1; });
      var mcount=Object.keys(mset).length;
      if(mcount>=2 && arr.length>=2){
        var avg=arr.reduce(function(s,t){return s+(-t.amount);},0)/arr.length;
        subs.push({ label:arr[0].label, cat:arr[0].category, avg:avg, n:arr.length, months:mcount, key:k });
      }
    });
    return subs.sort(function(a,b){return b.avg-a.avg;});
  }
  function alerts(txs,a){
    var out=[];
    var fees=txs.filter(function(t){return t.category==='Frais bancaires'&&t.amount<0;}).reduce(function(s,t){return s+(-t.amount);},0);
    if(fees>0) out.push({ bad:fees>30, txt:'Frais bancaires sur la période : <b>'+eur(fees)+'</b>'+(fees>30?' — élevé, à surveiller.':'.') });

    /* pic catégorie vs sa moyenne mensuelle */

  /* « Load failed » (Safari) / « Failed to fetch » = fetch réseau échoué (4G instable, connexion

  function _importErrMsg(e){ var m=(e&&e.message)||String(e);

    if(_isNetErr(e)) return 'Réseau instable — réessaie (plutôt en Wi-Fi)';

    if(/429|quota|rate.?limit|too many/i.test(m)) return 'Limite IA atteinte — patiente puis réessaie';
    return m.slice(0,60); }
  /* ---- File d'attente d'import (réseau) : « toujours tout auto » (Kevin) ----
     Un import qui échoue à cause du réseau (Load failed 4G) est GARDÉ (fichier chiffré en

  function pendingCount(){ return ((VAULT&&VAULT.pendingImports)||[]).length; }
  async function enqueuePending(f, isTextFlag){
    try{
      if(!KEY||!VAULT) return false;
      VAULT.pendingImports=VAULT.pendingImports||[];
      if(VAULT.pendingImports.length>=50) return false; /* file pleine — évite de gonfler le coffre à l'infini */
      var buf=await f.arrayBuffer(); var b64=b64FromBuf(buf);
      var id=uid();
      await idbSet('pending:'+id, await encWith(KEY,{name:f.name,mime:f.type||(isTextFlag?'text/plain':'application/octet-stream'),b64:b64,isText:!!isTextFlag}));
      VAULT.pendingImports.unshift({id:id,name:f.name,mime:f.type||'',isText:!!isTextFlag,ts:Date.now(),tries:0});
      await persist();
      return true;
    }catch(e){ return false; }
  }
  var _retryBusy=false;
  async function retryPendingImports(silent){
    if(_retryBusy) return; if(!KEY||!VAULT) return;
    var q=(VAULT.pendingImports||[]); if(!q.length) return;
    if(typeof navigator!=='undefined' && navigator.onLine===false) return; /* toujours hors-ligne → on attend */
    if(!VAULT.aiPinHash) return; /* le classement IA est requis pour lire le document */
    _retryBusy=true;
    var imported=0;
    try{
      var queue=q.slice();
      for(var i=0;i<queue.length;i++){
        var it=queue[i];
        var raw=null;
        try{ var pk=await idbGet('pending:'+it.id); if(pk) raw=await decWith(KEY,pk); }catch(e){}
        if(!raw){ /* original perdu (cache vidé) → on retire proprement */
          VAULT.pendingImports=VAULT.pendingImports.filter(function(x){return x.id!==it.id;}); try{ await idbDel('pending:'+it.id); }catch(e){} await persist(); continue; }
        try{
          if(raw.isText){ var txt=new TextDecoder('utf-8').decode(bufFromB64(raw.b64)); var h=await sha256Hex(txt); if(!docHashExists(h)) await importText(stripSecrets(txt), raw.name||'texte', h, {src:'file'}); }
          else { await importBytes(raw.b64, raw.mime||'application/pdf', raw.name||'document', {src:'file'}); }
          imported++;
          VAULT.pendingImports=VAULT.pendingImports.filter(function(x){return x.id!==it.id;}); try{ await idbDel('pending:'+it.id); }catch(e){}
          await persist();
        }catch(e){
          if(_isNetErr(e)){ /* toujours pas de réseau → on GARDE, on ré-essaiera plus tard */
            var m=(VAULT.pendingImports||[]).filter(function(x){return x.id===it.id;})[0];
            if(m){ m.tries=(m.tries||0)+1; if(m.tries>30){ VAULT.pendingImports=VAULT.pendingImports.filter(function(x){return x.id!==it.id;}); try{ await idbDel('pending:'+it.id); }catch(_){} } }
          } else { /* erreur non réseau (fichier illisible…) → on retire pour ne pas boucler indéfiniment */
            VAULT.pendingImports=VAULT.pendingImports.filter(function(x){return x.id!==it.id;}); try{ await idbDel('pending:'+it.id); }catch(_){} }
          await persist();

  }
  async function handleFiles(list){

    var stat=$('impstat'); var okc=0, err=0, devc=0, dupc=0, pendc=0, avc=0, lines=[];

      var attempt=0, doneOk=false, lastErr=null;
      while(attempt<3 && !doneOk){
        attempt++;
        try{
          var r;
          if(isLocal(f)||isText(f)){
            var txt=await f.text(); var h=await sha256Hex(txt);
            if(docHashExists(h)){ r={added:0,devis:0,dup:true}; }

          }
          else { if(f.size>30*1024*1024) throw new Error('trop volumineux (>30 Mo) — scinde le PDF'); r=await importFile(f); }
          if(r.dup){ dupc++; setLine(i,'⏭️','déjà importé (doublon ignoré)','var(--dim)'); }
          else if(r.pub){ setLine(i,'📣','publicité — écartée','var(--dim)'); }

  /* ---------- Vue COMPARATEUR (compare les prix d'un même travail/produit — factures ET devis) ---------- */
  var COMPARE_KEYWORDS=['batterie','vidange','pneu','frein','plaquette','disque','embrayage','courroie','distribution',
    'amortisseur','étanchéité','étancheité','verin','vérin','remorquage','dépannage','depannage','révision','revision','entretien',
    'filtre','carrosserie','peinture','pare-brise','vitrage','climatisation','clim','échappement','echappement','alternateur',
    'démarreur','demarreur','roue','pneumatique','huile','joint','turbo','injecteur','bougie','rotule','cardan','radiateur','pompe'];
  var COMPARE_VEHICLES=['touareg','navara','nissan','volkswagen','vw','scooter','camion','moto','audi','renault','peugeot','citroen','bmw','mercedes','fiat'];
  function compareItems(){ /* facture/ticket + devis = éléments comparables (dépense réelle vs estimation) */
    var out=[];
    (VAULT.tx||[]).forEach(function(t){ if((t.kind==='facture'||t.kind==='ticket') && t.amount<0) out.push({ label:t.label, amount:Math.abs(t.amount), vendor:t.vendor||'', date:t.date, kind:'facture', docId:t.docId||null }); });
    (VAULT.devis||[]).forEach(function(d){ out.push({ label:d.label||'', amount:Math.abs(d.amount||0), vendor:d.vendor||'', date:d.date, kind:'devis', docId:d.docId||null }); });
    return out;
  }
  function detectVehicle(txt){ var n=norm(txt); for(var i=0;i<COMPARE_VEHICLES.length;i++){ if(n.indexOf(COMPARE_VEHICLES[i])>=0) return COMPARE_VEHICLES[i]; } return ''; }
  function compareGroups(){ /* regroupe par mot-clé de travail/produit détecté ; ≥2 éléments = comparable */
    var items=compareItems(), g={};
    items.forEach(function(it){ var n=norm(it.label+' '+it.vendor); var hit={};
      COMPARE_KEYWORDS.forEach(function(kw){ var k=norm(kw); if(n.indexOf(k)>=0){ var key=k.replace(/[eé]tancheite|etancheite/,'etancheite'); (g[key]=g[key]||[]).push(it); hit[key]=1; } });
    });
    var groups=[];
    Object.keys(g).forEach(function(k){ var arr=g[k].slice().sort(function(a,b){return a.amount-b.amount;});
      if(arr.length<2)return;
      var min=arr[0].amount, max=arr[arr.length-1].amount, sum=arr.reduce(function(s,x){return s+x.amount;},0);
      groups.push({ key:k, label:k.charAt(0).toUpperCase()+k.slice(1), items:arr, min:min, max:max, avg:sum/arr.length, save:max-min });
    });
    return groups.sort(function(a,b){return b.save-a.save;});
  }
  function vendorTotals(){ var v={}; compareItems().forEach(function(it){ if(it.kind!=='facture')return; var k=(it.vendor||it.label||'—').trim(); var g=v[k]=v[k]||{tot:0,n:0}; g.tot+=it.amount; g.n++; });
    return Object.keys(v).map(function(k){return {vendor:k, tot:v[k].tot, n:v[k].n};}).sort(function(a,b){return b.tot-a.tot;}); }
  function viewComparateur(v){

    var intro=el('<div class="card"><h2>💹 Comparateur de prix<span class="r">'+groups.length+' à comparer</span></h2>'+

    groups.forEach(function(gr){

        '<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="k">Moins cher</div><div class="v pos">'+eur0(gr.min)+'</div></div>'+
        '<div class="kpi"><div class="k">Moyenne</div><div class="v">'+eur0(gr.avg)+'</div></div>'+

      gr.items.forEach(function(it,idx){ var pct=gr.max>0?(it.amount/gr.max*100):0; var veh=detectVehicle(it.label+' '+it.vendor);

        var rowC=el('<div class="catrow"'+(hasF?' style="cursor:pointer" title="Voir le document"':'')+'><div class="h"><b>'+(best?'🏆 ':'')+esc((it.vendor||it.label||'—').slice(0,30))+' <span class="chip'+(it.kind==='devis'?' flag':'')+'">'+(it.kind==='devis'?'devis':'facturé')+'</span>'+(veh?' <span class="chip">'+esc(veh)+'</span>':'')+(hasF?' 🖨️':'')+'</b><span class="amt">'+eur(it.amount)+'</span></div><div class="bar"><i style="width:'+pct.toFixed(0)+'%;background:'+(best?'var(--green)':(idx===gr.items.length-1?'var(--red)':'var(--gold)'))+'"></i></div></div>');

  /* ---------- Vue COMPTES (classement auto par type de document, chacun géré pareil) ---------- */
  var ACCOUNTS=[
    {key:'releves', label:'Relevés bancaires', icon:'🏦', kinds:['releve','import']},
    {key:'factures', label:'Factures fournisseurs', icon:'🧾', kinds:['facture']},

  function accountForKind(kind){ for(var i=0;i<ACCOUNTS.length;i++){ if(ACCOUNTS[i].kinds.indexOf(kind)>=0) return ACCOUNTS[i]; }

  function moveDoc(docId, newKind){ /* reclasse un document (et ses opérations) dans un autre compte */

    audit('reclasse', d.name+' → '+accountForKind(newKind).label); persist(); toast('📁 Rangé dans « '+accountForKind(newKind).label+' »'); render();
  }
  function viewComptes(v){
    var groups={}, order=[];

    (VAULT.docs||[]).forEach(function(d){ if(d.kind==='a_verifier')return; G(accountForKind(d.kind)).docs.push(d); });
    (VAULT.tx||[]).forEach(function(t){ if(t.recDup)return; var g=G(accountForKind(t.kind)); g.ops++; if(t.category==='Virements internes')return; if(t.amount<0)g.dep+=(-t.amount); else g.rev+=t.amount; });
    var devN=(VAULT.devis||[]).length; if(devN){ var gd=G(accountForKind('devis')); gd.devisN=devN; gd.devisTot=(VAULT.devis||[]).reduce(function(s,x){return s+Math.abs(x.amount||0);},0); }
    /* Section « À vérifier » : documents où 2 IA n'étaient pas d'accord (pub ? facture ?). 0 opération créée
       tant que Kevin n'a pas tranché — jamais compté à tort (Kevin « pas d'erreur, plusieurs vérifient »). */

        mid.appendChild(acts); row.appendChild(mid); cav.appendChild(row);

  /* ---------- Vue DEVIS (classés à part, non comptés) ---------- */
  /* Engagements = devis ACCEPTÉS non encore payés (à décaisser). Jamais comptés en dépense
     tant que non payés, mais suivis comme engagement (trésorerie prévisionnelle). */
  function devisStatus(d){ return d.status||'attente'; }
  function devisEngaged(){ return (VAULT.devis||[]).filter(function(d){return devisStatus(d)==='accepte';}).reduce(function(s,d){return s+Math.abs(d.amount||0);},0); }
  async function devisAccept(id){ var d=(VAULT.devis||[]).filter(function(x){return x.id===id;})[0]; if(!d)return; d.status='accepte'; d.acceptedAt=Date.now(); audit('devis_accepte',d.label); await persist(); toast('✅ Devis accepté — engagement à payer'); render(); }
  async function devisReset(id){ var d=(VAULT.devis||[]).filter(function(x){return x.id===id;})[0]; if(!d)return; d.status='attente'; await persist(); render(); }
  async function devisPay(d){ VAULT.tx.unshift({ id:uid(), date:ymd(Date.now()), label:d.label, amount:-Math.abs(d.amount), category:d.category||'Autres', vendor:d.vendor||'', docId:d.docId, kind:'facture', ttc:Math.abs(d.amount), pro:false, addedAt:Date.now() }); VAULT.devis=VAULT.devis.filter(function(x){return x.id!==d.id;}); dedupeAll(); await persist(); toast('💳 Devis payé → passé en dépense (catégorie à ajuster)'); render(); }
  async function devisRefuse(id){ if(!confirm('Refuser / supprimer ce devis ?'))return; VAULT.devis=(VAULT.devis||[]).filter(function(x){return x.id!==id;}); await persist(); render(); }
  function viewDevis(v){
    var ds=VAULT.devis||[];
    if(!ds.length){ v.appendChild(el('<div class="card" style="text-align:center;padding:30px"><div style="font-size:38px">🧾</div><h2 style="justify-content:center;margin-top:6px">Aucun devis</h2><p class="muted">Dépose un devis (PDF/photo) dans ➕ Ajouter : il sera rangé ici, séparé de tes dépenses.</p></div>')); return; }
    var attente=ds.filter(function(d){return devisStatus(d)==='attente';}), acceptes=ds.filter(function(d){return devisStatus(d)==='accepte';});
    var totA=attente.reduce(function(s,d){return s+Math.abs(d.amount||0);},0), totE=devisEngaged();
    var head=el('<div class="card"><h2>🧾 Devis<span class="r">'+eur(totA+totE)+' · non compté</span></h2>'+
      '<div class="kpis"><div class="kpi"><div class="k">En attente</div><div class="v">'+eur0(totA)+'</div></div>'+
      '<div class="kpi"><div class="k">✅ Acceptés (engagés)</div><div class="v" style="color:var(--gold2)">'+eur0(totE)+'</div></div></div>'+
      '<p class="tiny" style="margin-top:8px">Un devis n\'est <b>jamais</b> compté en dépense. <b>Accepté</b> = engagement à décaisser (suivi en trésorerie). <b>Payé</b> = bascule en dépense réelle.</p></div>');
    v.appendChild(head);
    function renderList(title, arr){
      if(!arr.length)return;
      var c=el('<div class="card"><h2>'+title+'</h2></div>'); v.appendChild(c);
      arr.slice().sort(function(a,b){return a.date<b.date?1:-1;}).forEach(function(d){
        var acc=devisStatus(d)==='accepte';
        var row=el('<div class="tx"><div class="ic">'+(acc?'✅':'🧾')+'</div><div class="mid"><div class="lb">'+esc(d.label)+'</div><div class="mt">'+esc(ymd(d.date))+(d.vendor?' · '+esc(d.vendor):'')+(acc?' · <span class="chip flag">accepté</span>':'')+'</div></div><div class="am neg">'+eur(d.amount)+'</div></div>');
        var mid=row.querySelector('.mid'); var acts=el('<div class="row" style="margin-top:6px"></div>');
        if((VAULT.docs||[]).some(function(x){return x.id===d.docId&&x.hasFile;})){ var op=el('<button class="btn sm">🖨️ Voir</button>'); op.onclick=function(){openDoc(d.docId);}; acts.appendChild(op); }
        if(!acc){ var ac=el('<button class="btn sm">✅ Accepter</button>'); ac.onclick=function(){ devisAccept(d.id); }; acts.appendChild(ac); }
        else { var rb=el('<button class="btn sm">↩ En attente</button>'); rb.onclick=function(){ devisReset(d.id); }; acts.appendChild(rb); }
        var pay=el('<button class="btn sm gold">💳 Payé</button>'); pay.onclick=function(){ devisPay(d); }; acts.appendChild(pay);
        var del=el('<button class="btn sm danger">🗑</button>'); del.onclick=function(){ devisRefuse(d.id); }; acts.appendChild(del);
        mid.appendChild(acts); c.appendChild(row);
      });
    }
    renderList('✅ Acceptés — à payer (engagements)', acceptes);

          /* Un SEUL code active TOUT : le même hash sert au domaine → mails + sauvegarde en
             ligne s'activent SANS second code, et on récupère les factures tout de suite. */
          try{ if(VAULT.backupOff!==true){ VAULT.backupOnline=true; await persist(); } await ensureGrant(); await backupPush(); }catch(_){}
          toast('✅ IA + mails + sauvegarde activés'); try{ mailAutoScan(true); }catch(_){}
          setTimeout(render,700);
        }catch(e){ msg.style.color='var(--red)'; msg.textContent='❌ '+(e.message||e); }
      };
    }
    /* online backup wiring */
    if(boOn){ updateBackupBadge();
      cBk.querySelector('#bk-now').onclick=async function(){ var m=cBk.querySelector('#bk-msg'); m.textContent='⏳ envoi…'; await backupPush(); m.textContent=(_backupState==='ok'?'✅ sauvegardé en ligne':'⚠️ '+_backupState); };
      cBk.querySelector('#bk-pull').onclick=async function(){ var m=cBk.querySelector('#bk-msg');
        if(!confirm('Remplacer les données de cet appareil par la sauvegarde en ligne ?'))return;
        m.textContent='⏳ restauration…';
        try{ var d=await restoreFromCloud(); toast('☁️ Restauré ('+(d.tx?d.tx.length:0)+' op.)'); render(); }
        catch(e){ if(e.needPass){ var p=prompt('Code du coffre de la sauvegarde en ligne :'); if(!p){m.textContent='';return;} try{ var d2=await restoreFromCloud(p); toast('☁️ Restauré'); render(); }catch(e2){ m.textContent='❌ '+(e2.message||'code incorrect'); } } else m.textContent='❌ '+(e.message||e); } };
      cBk.querySelector('#bk-off').onclick=async function(){ VAULT.backupOnline=false; VAULT.backupOff=true; await persist(); toast('Sauvegarde en ligne désactivée'); render(); };
    } else {
      cBk.querySelector('#bk-on').onclick=function(){
        var m=cBk.querySelector('#bk-msg');
        m.innerHTML='<div class="row" style="margin-top:6px"><input id="bk-code" type="password" inputmode="numeric" placeholder="Ton code admin" class="grow"><button class="btn gold" id="bk-code-go">OK</button></div>';
        var go=cBk.querySelector('#bk-code-go'), inp=cBk.querySelector('#bk-code');
        inp.focus();
        go.onclick=async function(){ var code=(inp.value||'').trim(); if(!code){return;} go.disabled=true; go.textContent='…';
          var lr=await adminLoginCode(code);
          if(!lr.ok){ go.disabled=false; go.textContent='OK'; m.insertAdjacentHTML('beforeend','<div style="color:var(--red);margin-top:6px">❌ '+esc(lr.reason==='code_invalide'?'code incorrect':lr.reason)+'</div>'); return; }
          VAULT.backupOnline=true; VAULT.backupOff=false;
          /* même code → sert aussi au renouvellement auto du grant + à l'IA (un seul code). */
          try{ if(!VAULT.aiPinHash) VAULT.aiPinHash=await sha256Hex(code); }catch(_){}
          await persist(); await backupPush(); toast('☁️ Sauvegarde + mails activés'); try{ mailAutoScan(true); }catch(_){} render();
        };
        inp.addEventListener('keydown',function(e){ if(e.key==='Enter')go.onclick(); });
      };
    }
    /* export wiring */
    cEx.querySelector('#csv1').onclick=exportOpsCsv;
    cEx.querySelector('#csv2').onclick=exportMonthlyCsv;
    cEx.querySelector('#verify').onclick=verifyExport;
    cEx.querySelector('#backup').onclick=exportBackup;
    var rf=cEx.querySelector('#restorefile');
    cEx.querySelector('#restore').onclick=function(){ rf.click(); };
    rf.onchange=function(){ if(rf.files[0])restoreBackup(rf.files[0]); rf.value=''; };
    /* sec wiring */
    cSec.querySelector('#rem').onchange=async function(e){ if(e.target.checked){ localStorage.setItem(LS_REMEMBER,'1'); await persist(); toast('Cet appareil restera déverrouillé'); } else { localStorage.removeItem(LS_REMEMBER); localStorage.removeItem(LS_DEV); toast('Déverrouillage automatique désactivé'); } };
    cSec.querySelector('#dedup').onclick=async function(){ var n=dedupeAll(); await persist(); toast(n?('🧹 '+n+' doublon(s) retiré(s)'):'✅ Aucun doublon'); render(); };
    cSec.querySelector('#pubclean').onclick=cleanPromoDocs;
    cSec.querySelector('#lock2').onclick=lockNow;
    cSec.querySelector('#wipe').onclick=wipeAll;
  }
  function renameCat(oldN,newN){ if(!newN||oldN===newN)return; var cats=VAULT.categories; var i=cats.indexOf(oldN); if(i<0)return; if(cats.indexOf(newN)>=0){ toast('Catégorie déjà existante',true); render(); return; } cats[i]=newN;
    VAULT.tx.forEach(function(t){ if(t.category===oldN)t.category=newN; });
    Object.keys(VAULT.merchantMap).forEach(function(k){ if(VAULT.merchantMap[k]===oldN)VAULT.merchantMap[k]=newN; });
    if(VAULT.budget[oldN]!=null){ VAULT.budget[newN]=VAULT.budget[oldN]; delete VAULT.budget[oldN]; }
    persist(); toast('Renommée'); render(); }
  function delCat(c){ if(!confirm('Supprimer la catégorie « '+c+' » ? Ses opérations passeront en « Autres ».'))return;
    VAULT.categories=VAULT.categories.filter(function(x){return x!==c;});
    if(VAULT.categories.indexOf('Autres')<0)VAULT.categories.push('Autres');
    VAULT.tx.forEach(function(t){ if(t.category===c)t.category='Autres'; });
    Object.keys(VAULT.merchantMap).forEach(function(k){ if(VAULT.merchantMap[k]===c)VAULT.merchantMap[k]='Autres'; });
    persist(); render(); }

  /* ---------- Export ---------- */
  function dl(name, text, mime){ var blob=new Blob([text],{type:mime||'text/plain'}); var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },100); }
  function csvCell(s){ s=String(s==null?'':s); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
  function exportOpsCsv(){
    var rows=[['Date','Libellé','Montant','Catégorie','Type','Document']];
    VAULT.tx.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(t){
      var _dd=VAULT.docs.find(function(d){return d.id===t.docId;}); var doc=_dd?docTitle(_dd):(t.kind?kindLabel(t.kind):'');
      rows.push([ymd(t.date),t.label,String(t.amount).replace('.',','),t.category,kindLabel(t.kind),doc]);
    });
    dl('operations_classees.csv','﻿'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\n'),'text/csv');
    toast('CSV opérations téléchargé');
  }
  function exportMonthlyCsv(){
    var mk=months(); var cats=VAULT.categories.slice();
    var head=['Mois','Revenus','Dépenses','Net'].concat(cats);
    var rows=[head];
    mk.forEach(function(m){ var mm=analyze((VAULT.tx||[]).filter(function(t){return ym(t.date)===m;}));
      var row=[frMonth(m),f2(mm.rev),f2(mm.dep),f2(mm.net)]; cats.forEach(function(c){ row.push(f2(mm.byCat[c]||0)); }); rows.push(row); });
    dl('synthese_mensuelle.csv','﻿'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\n'),'text/csv');
    toast('CSV synthèse téléchargé');
  }
  function f2(n){ return (Number(n)||0).toFixed(2).replace('.',','); }
  async function exportBackup(){
    /* le blob EST déjà chiffré dans localStorage — on l'exporte tel quel */
    var raw=localStorage.getItem(LS_VAULT); if(!raw){ await persist(); raw=localStorage.getItem(LS_VAULT); }
    dl('coffre-finances-'+ymd(Date.now())+'.kdmcfin', raw, 'application/json');
    toast('💾 Sauvegarde chiffrée exportée');
  }
  async function restoreBackup(file){
    try{
      var txt=await file.text(); var pack=JSON.parse(txt);
      if(!pack.salt||!pack.ct){ throw new Error('fichier invalide'); }
      var pass=prompt('Code du coffre de CETTE sauvegarde :'); if(!pass)return;
      var key=await deriveKey(pass, pack.salt);
      var data=await decWith(key,{iv:pack.iv,ct:pack.ct}); /* throw si mauvais code */
      if(!confirm('Restaurer '+(data.tx?data.tx.length:0)+' opérations ? Cela remplacera les données actuelles.'))return;
      data._salt=pack.salt; VAULT=data; KEY=key; localStorage.setItem(LS_VAULT,txt);
      audit('restore',file.name); await persist(); toast('✅ Sauvegarde restaurée'); render();
    }catch(e){ toast('❌ Restauration : '+(e.message||'code incorrect'),true); }
  }

  /* ---------- Verrou / wipe ---------- */
  function lockNow(){
    KEY=null; VAULT=null;
    /* Face ID activé : on GARDE la clé appareil (le gate exigera Face ID pour la réutiliser).
       Sans Face ID : comme avant, la clé part → code obligatoire. */
    if(!faceIdEnrolled()) localStorage.removeItem(LS_DEV);
    showGate();
  }
  function wipeAll(){ if(!confirm('⚠️ EFFACER TOUT le coffre Finances de cet appareil ? Irréversible (sauf sauvegarde exportée).'))return;
    if(!confirm('Confirme une dernière fois : tout supprimer ?'))return;
    localStorage.removeItem(LS_VAULT); localStorage.removeItem(LS_DEV); localStorage.removeItem(LS_REMEMBER);
    localStorage.removeItem(LS_FACEID); localStorage.removeItem(LS_FACEID_OFF);
    KEY=null; VAULT=null; toast('Coffre effacé'); showGate(); }

  /* ============================ Gate (déverrouillage) ============================ */
  function showGate(){
    var existing=!!localStorage.getItem(LS_VAULT);
    /* Face ID dispo pour ce gate = enrôlé + clé appareil présente + WebAuthn supporté */
    var canFace=existing && faceIdEnrolled() && faceIdSupported() && localStorage.getItem(LS_REMEMBER)==='1' && !!localStorage.getItem(LS_DEV);
    var app=$('app');
    app.innerHTML='<div class="gate"><div class="card">'+
      '<div class="ic">💰</div>'+
      '<h2>'+(existing?'Coffre Finances':'Nouveau coffre Finances')+'</h2>'+
      '<p>'+(existing?(canFace?'Un regard suffit — ou entre ton code.':'Entre ton code de coffre pour déverrouiller.'):'Choisis un code de coffre. Il chiffre TOUT (personne ne peut lire sans lui).')+'</p>'+
      (canFace?'<button class="btn gold" id="g-face" style="width:100%;margin-bottom:10px;min-height:48px">🔐 Déverrouiller avec Face ID</button>':'')+
      '<input id="g-pass" type="password" inputmode="numeric" placeholder="Code du coffre" autocomplete="off">'+
      (existing?'':'<input id="g-pass2" type="password" inputmode="numeric" placeholder="Confirme le code" autocomplete="off" style="margin-top:8px">')+
      '<button class="btn '+(canFace?'':'gold')+'" id="g-go" style="margin-top:12px;width:100%">'+(existing?'🔓 Déverrouiller':'Créer mon coffre')+'</button>'+
      '<div class="err" id="g-err"></div>'+
      '<label class="toggle"><input type="checkbox" id="g-rem" '+(localStorage.getItem(LS_REMEMBER)!=='0'?'checked':'')+'> Rester déverrouillé sur cet appareil</label>'+
      '<div class="lk"><a href="#" id="g-cloud">☁️ Restaurer depuis la sauvegarde en ligne</a></div>'+
      '<div id="g-cloudbox"></div>'+
      '</div></div>';
    var go=$('g-go');
    go.onclick=existing?unlock:createVault;
    $('g-pass').addEventListener('keydown',function(e){ if(e.key==='Enter')go.click(); });
    if(!existing){ $('g-pass2').addEventListener('keydown',function(e){ if(e.key==='Enter')go.click(); }); }
    $('g-cloud').onclick=function(e){ e.preventDefault(); cloudRestoreFromGate(); };
    if(canFace){
      var fb=$('g-face');
      fb.onclick=function(){ faceIdUnlockFlow(fb, $('g-err')); };
      /* Tentative auto (si le navigateur l'autorise sans geste) — sinon le bouton reste, 1 tap. */
      setTimeout(function(){ faceIdUnlockFlow(fb, null); },120);
    } else {
      setTimeout(function(){ try{$('g-pass').focus();}catch(e){} },80);
    }
  }
  async function createVault(){
    var p=($('g-pass').value||'').trim(), p2=($('g-pass2').value||'').trim(), err=$('g-err');
    if(p.length<6){ err.textContent='Code trop court (6 min.).'; return; }
    if(p!==p2){ err.textContent='Les deux codes ne correspondent pas.'; return; }
    var salt=b64FromBuf(crypto.getRandomValues(new Uint8Array(16)).buffer);
    KEY=await deriveKey(p,salt);
    VAULT=blankVault(); VAULT._salt=salt;
    if($('g-rem').checked)localStorage.setItem(LS_REMEMBER,'1'); else localStorage.setItem(LS_REMEMBER,'0');
    audit('create','coffre créé'); await persist(); toast('🔐 Coffre créé'); STATE.tab='set'; render();
    maybeOfferFaceId();
  }
  async function unlock(){
    var p=($('g-pass').value||'').trim(), err=$('g-err');
    if(!p){ err.textContent='Entre ton code.'; return; }
    try{
      var pack=JSON.parse(localStorage.getItem(LS_VAULT));
      var key=await deriveKey(p,pack.salt);
      var data=await decWith(key,{iv:pack.iv,ct:pack.ct}); /* throw si mauvais code */
      data._salt=pack.salt; VAULT=data; KEY=key;
      if($('g-rem').checked)localStorage.setItem(LS_REMEMBER,'1'); else { localStorage.setItem(LS_REMEMBER,'0'); localStorage.removeItem(LS_DEV); }
      await persist(); toast('🔓 Déverrouillé'); render(); autoEnableCloud(); mailAutoScan(true); retryPendingImports(true); autoReanalyze();
      maybeOfferFaceId();
    }catch(e){ err.textContent='Code incorrect.'; }
  }
  async function tryAutoUnlock(){
    if(localStorage.getItem(LS_REMEMBER)!=='1')return false;
    var devRaw=localStorage.getItem(LS_DEV), vRaw=localStorage.getItem(LS_VAULT);
    if(!devRaw||!vRaw)return false;
    try{
      var dev=JSON.parse(devRaw), pack=JSON.parse(vRaw);
      if(dev.salt!==pack.salt)return false;
      var key=await crypto.subtle.importKey('raw',bufFromB64(dev.key),{name:'AES-GCM'},true,['encrypt','decrypt']);
      var data=await decWith(key,{iv:pack.iv,ct:pack.ct});
      data._salt=pack.salt; VAULT=data; KEY=key; return true;
    }catch(e){ return false; }
  }

  /* ============================ Face ID (WebAuthn plateforme) ============================
     1ère connexion = code, ensuite reconnu d'un regard. Le code marche TOUJOURS en secours.
     FAIL-OPEN : Face ID indisponible/refusé → on retombe sur le code, on n'efface JAMAIS rien. */
  function faceIdSupported(){ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && navigator.credentials.get); }
  function faceIdCred(){ try{ var o=JSON.parse(localStorage.getItem(LS_FACEID)||'null'); return (o&&o.credId)?o:null; }catch(e){ return null; } }
  function faceIdEnrolled(){ return !!faceIdCred(); }
  async function faceIdAvailable(){
    try{ return faceIdSupported() && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){ return false; }
  }
  async function faceIdEnroll(){
    /* Crée la clé Face ID de CET appareil (rien ne quitte l'appareil). */
    var uid=crypto.getRandomValues(new Uint8Array(16));
    var cred=await navigator.credentials.create({ publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{ name:'Finances KDMC', id:location.hostname },
      user:{ id:uid, name:'kevin@finances', displayName:'Mon coffre Finances' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout:60000, attestation:'none'
    }});
    if(!cred||!cred.rawId) throw new Error('enroll_failed');
    localStorage.setItem(LS_FACEID, JSON.stringify({ credId:b64FromBuf(cred.rawId), ts:Date.now() }));
    return true;
  }
  async function faceIdVerify(){
    /* Demande Face ID / Touch ID. true = visage reconnu. false = refusé/annulé (pas d'effacement). */
    var c=faceIdCred(); if(!c||!faceIdSupported())return false;
    try{
      var a=await navigator.credentials.get({ publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials:[{ type:'public-key', id:bufFromB64(c.credId), transports:['internal'] }],
        userVerification:'required', timeout:60000
      }});
      return !!a;
    }catch(e){ return false; }
  }
  async function faceIdUnlockFlow(btn, err){
    /* Bouton du gate : Face ID → auto-déverrouillage avec la clé de l'appareil. */
    if(btn){ btn.disabled=true; btn.textContent='👤 Regarde ton iPhone…'; }
    var ok=await faceIdVerify();
    if(ok && await tryAutoUnlock()){ toast('🔓 Reconnu — déverrouillé'); render(); autoEnableCloud(); mailAutoScan(true); retryPendingImports(true); autoReanalyze(); return true; }
    if(btn){ btn.disabled=false; btn.textContent='🔐 Déverrouiller avec Face ID'; }
    if(err){ err.style.color='var(--dim)'; err.textContent=ok?'Petit souci de déverrouillage — entre ton code ci-dessous.':'Face ID non reconnu — entre ton code ci-dessous.'; }
    return false;
  }
  function maybeOfferFaceId(){
    /* Proposé UNE fois par appareil, après un déverrouillage réussi PAR CODE. */
    try{
      if(faceIdEnrolled())return;
      if(localStorage.getItem(LS_FACEID_OFF)==='no')return;
      if(localStorage.getItem(LS_REMEMBER)!=='1')return; /* Face ID a besoin de la clé appareil */
      faceIdAvailable().then(function(av){
        if(!av)return;
        var ov=el('<div style="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px">'+
          '<div class="card" style="max-width:340px;text-align:center"><div style="font-size:40px">👤</div>'+
          '<h2 style="justify-content:center">Activer Face ID ?</h2>'+
          '<p class="tiny">La prochaine fois, ton coffre s\'ouvre d\'un regard — plus besoin de taper le code. Le code marche toujours en secours.</p>'+
          '<button class="btn gold" id="fid-yes" style="width:100%;margin-top:10px">✅ Activer Face ID</button>'+
          '<button class="btn" id="fid-later" style="width:100%;margin-top:8px">Plus tard</button>'+
          '<button class="btn" id="fid-no" style="width:100%;margin-top:8px;opacity:.7">Non merci</button></div></div>');
        document.body.appendChild(ov);
        ov.querySelector('#fid-yes').onclick=async function(){
          try{ await faceIdEnroll(); ov.remove(); toast('👤 Face ID activé — la prochaine fois, un regard suffit'); if(STATE.tab==='set')render(); }
          catch(e){ ov.remove(); toast('Face ID non activé ('+((e&&e.name)||'refusé')+') — le code continue de marcher', true); }
        };
        ov.querySelector('#fid-later').onclick=function(){ ov.remove(); };
        ov.querySelector('#fid-no').onclick=function(){ localStorage.setItem(LS_FACEID_OFF,'no'); ov.remove(); };
      });
    }catch(e){}
  }
  async function faceIdDisable(){ localStorage.removeItem(LS_FACEID); localStorage.removeItem(LS_FACEID_OFF); toast('Face ID désactivé — le code reste'); if(STATE.tab==='set')render(); }

  async function cloudRestoreFromGate(){
    var box=$('g-cloudbox'), err=$('g-err');
    var pass=($('g-pass').value||'').trim();
    if(!pass){ err.style.color='var(--red)'; err.textContent='Entre d\'abord ton code de coffre ci-dessus.'; return; }
    box.innerHTML='<div class="row" style="margin-top:8px"><input id="g-acode" type="password" inputmode="numeric" placeholder="Ton code admin" class="grow" autocomplete="off"><button class="btn gold" id="g-acgo">Restaurer</button></div>';
    var inp=$('g-acode'), b=$('g-acgo'); try{inp.focus();}catch(e){}
    b.onclick=async function(){
      var code=(inp.value||'').trim(); if(!code)return; b.disabled=true; b.textContent='…'; err.style.color='var(--dim)'; err.textContent='⏳ connexion…';
      var lr=await adminLoginCode(code);
      if(!lr.ok){ b.disabled=false; b.textContent='Restaurer'; err.style.color='var(--red)'; err.textContent='Code admin : '+(lr.reason==='code_invalide'?'incorrect':lr.reason); return; }
      err.textContent='⏳ restauration…';
      try{ await restoreFromCloud(pass); toast('☁️ Restauré depuis la sauvegarde en ligne'); render(); }
      catch(e2){ b.disabled=false; b.textContent='Restaurer'; err.style.color='var(--red)'; err.textContent='❌ '+(e2.message==='need_pass'?'code de coffre incorrect':(e2.message||e2)); }
    };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter')b.onclick(); });
  }

  /* ============================ Boot ============================ */
  (async function boot(){
    if(!(window.crypto&&crypto.subtle)){ $('app').innerHTML='<div class="gate"><div class="card"><div class="ic">🔒</div><h2>Navigateur non sécurisé</h2><p>Ouvre cette page en HTTPS (chiffrement requis).</p></div></div>'; return; }
    /* Face ID activé sur cet appareil → l'ouverture auto passe par Face ID (gate avec bouton + tentative auto).
       FAIL-OPEN : si WebAuthn n'existe pas ici (autre navigateur), on garde le comportement d'avant. */
    if(faceIdEnrolled() && faceIdSupported() && localStorage.getItem(LS_REMEMBER)==='1' && localStorage.getItem(LS_DEV) && localStorage.getItem(LS_VAULT)){
      showGate(); return;
    }
    if(await tryAutoUnlock()){ render(); autoEnableCloud(); mailAutoScan(true); retryPendingImports(true); autoReanalyze(); return; }
    showGate();
  })();

  /* Sauvegarde en ligne + récupération auto des factures : au retour au premier plan. */
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ if(VAULT && VAULT.backupOnline) backupPush(); mailAutoScan(); retryPendingImports(true); autoReanalyze(); } });
  window.addEventListener('focus',function(){ if(VAULT && VAULT.backupOnline) backupPush(); mailAutoScan(); retryPendingImports(true); autoReanalyze(); });
  /* Le réseau revient → on réimporte tout seul les documents gardés (message visible = « réseau revenu »). */
  window.addEventListener('online',function(){ retryPendingImports(false); });
  /* Filet : re-vérifie les nouvelles factures + réimport des documents en attente toutes les 5 min. */
  setInterval(function(){ if(document.visibilityState==='visible'){ mailAutoScan(); retryPendingImports(true); autoReanalyze(); } }, 5*60*1000);
})();
</script>
