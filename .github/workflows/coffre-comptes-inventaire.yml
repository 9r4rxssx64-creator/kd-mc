name: Coffre — comptes KDMC, inventaire (lecture seule)

# Kevin 2.10.2026 : « Je ne dois avoir qu'un compte KDMC, le mien. Chacun 1 seul compte. Normal. »
# Lit le registre des comptes (KV ACCOUNTS) par l'API Cloudflare et dit : combien de comptes actifs,
# lesquels sont des ROBOTS (sondes, CI), quelles personnes en ont PLUSIEURS — Kevin compris.
# Ne modifie RIEN. Noms affichés seulement pour robots, doublons et Kevin. Reste au coffre.
# Lancement à la main / API uniquement — jamais de cron (gratuit par défaut, Kevin 30.09).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventaire:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 6   # gratuit par défaut (Kevin 30.09) : borné
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inventorier les comptes (lecture seule)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash -eo pipefail {0}
        run: |
          NS=$(node -e "const t=require('fs').readFileSync('services/kdmc-router/wrangler.toml','utf8');const m=t.match(/binding\s*=\s*\"ACCOUNTS\"\s*\n\s*id\s*=\s*\"([a-f0-9]+)\"/);process.stdout.write(m?m[1]:'')")
          [ -n "$NS" ] || { echo "::error::espace KV ACCOUNTS introuvable dans wrangler.toml"; exit 1; }
          NS="$NS" node tools/audit/comptes-inventaire.mjs
