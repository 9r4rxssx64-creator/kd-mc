name: Lingua 📚 — Tester les sources officielles des langues

# Kevin 2026-08-13 : « Intègre les sources, les langues ».
#
# Pourquoi ce workflow existe : depuis l'agent, internet est fermé — publier une adresse
# « de mémoire », c'est risquer d'envoyer l'élève dans le vide. Ici (réseau ouvert), CHAQUE
# adresse est réellement ouverte, et le résultat est écrit dans lingua/sources-langues.js.
# L'application n'affiche QUE les adresses qui ont répondu.
#
# 1×/semaine (un site peut fermer ou déménager) + à la demande. Aucun spam de mails.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 2'   # mardi 06:00 UTC

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # profondeur 1 : on n'a pas besoin de l'historique pour pousser un fichier, et un
        # clone complet de ce dépôt bloque le run plusieurs minutes (mesuré le 2026-08-13).
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: "Ouvrir pour de vrai chaque adresse officielle"
        shell: bash -eo pipefail {0}   # sans pipefail, un `node … | tee` échoué ressortirait VERT
        run: node tools/lingua/verify-sources.mjs --live lingua | tee /tmp/sources.log
      - name: "Publier le résultat (les liens morts ne seront plus affichés)"
        run: |
          if git diff --quiet -- lingua/sources-langues.js; then
            echo "Aucun changement d'état : rien à publier."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="claude/sources-langues-${{ github.run_id }}"
          git checkout -b "$BR"
          git add lingua/sources-langues.js
          git commit -m "Lingua : état réel des sources officielles (chaque adresse ouverte en vrai) [skip ci]"
          git push -u origin "$BR"
          echo "Branche poussée : $BR (le bot fusionne)"
      # 🔗 Les sources des dossiers de langue (une par anecdote, chiffre et mot) sont des
      # articles Wikipédia dont j'écris le TITRE : s'il est faux, le lien tombe sur une page
      # « créer cet article » et l'élève se retrouve dans le vide. La CI les ouvre à ma place.
      - name: "Ouvrir chaque source des dossiers de langue (anecdotes, chiffres, mots)"
        shell: bash -eo pipefail {0}
        run: node tools/lingua/verify-histoires.mjs lingua --liens | tee -a /tmp/sources.log
      - name: "Résumé lisible"
        if: always()   # le résumé doit s'écrire même si un lien est trouvé mort
        run: |
          {
            echo "## 📚 Sources officielles des langues"
            echo ""
            echo '```'
            tail -50 /tmp/sources.log || echo "(pas de log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
