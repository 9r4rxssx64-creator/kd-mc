# ⬅️ RAPATRIÉ ici le 5.09.2026 (Kevin : « rapatrie tout sur GitHub intelligemment
#    en respectant les règles »). Il teste / déploie / publie CE dépôt — c'est
#    exactement l'usage prévu par les conditions GitHub Actions.
#    ⛔ AUCUNE exécution programmée : c'est le VOLUME automatique (~97/jour) qui a
#    fait suspendre le compte le 15/08, pas ce workflow-ci. On le lance à la main
#    (bouton « Run workflow ») — et c'est moi qui appuie, via l'API. Ne PAS remettre
#    de cron : la garde npm run test:actions-conformes échoue en le nommant.
#    Sa destination et sa raison sont écrites dans
#    .github/workflows-desactives/DESTINATIONS.json.
name: Lingua — Vérif voix + Coach EN VRAI (le serveur répond vraiment)

# Kevin 2026-08-11 « la voix est trop robot » → on est passé au moteur naturel
# (gpt-4o-mini-tts). Ce contrôle frappe le VRAI domaine et vérifie qu'il revient bien
# du son, pour chaque voix, y compris les 5 nouvelles voix « HD ». Il ne juge PAS la
# beauté du son (ça, c'est l'oreille de Kevin) — il prouve la partie vérifiable :
# le serveur répond, avec de l'audio, et le bouton 🐢 Lent marche encore.
# Depuis le 2026-08-11, on vérifie AUSSI que le Coach répond encore et qu'il respecte
# ses consignes (une seule question, format ___ pour les trous) : ses consignes ont été
# durcies côté serveur, et rien ne prouvait en vrai qu'il répondait toujours.
# À la demande uniquement (aucun cron → aucun mail).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # gratuit par défaut (Kevin 30.09) : un job sans borne tourne 6 h et brûle le quota
    steps:
      - name: "Chaque voix renvoie-t-elle du vrai son ?"
        shell: bash -eo pipefail {0}
        run: |
          # texte unique à chaque exécution → on force une VRAIE synthèse (pas le cache)
          MOT="bonjour-$(date +%s)"
          KO=0; RES=''
          for V in coral sage ballad verse ash nova shimmer fable alloy echo onyx antonin; do
            F=/tmp/$V.mp3
            CODE=$(curl -sS -D /tmp/h_$V -H "Referer: https://lingua.kd-mc.com/" -o $F -w "%{http_code}" "https://lingua.kd-mc.com/__lingua/tts?v=$V&t=$MOT" || echo 000)
            TYPE=$(file -b --mime-type $F 2>/dev/null || echo '?')
            TAILLE=$(wc -c < $F)
            if [ "$CODE" = "200" ] && [ "$TAILLE" -gt 2000 ] && ! head -c 200 $F | grep -q '"ok":false'; then
              echo "✅ $V — $TAILLE octets de son ($TYPE)"; RES="$RES $V=OK:${TAILLE}o:$(grep -i "^x-voix" /tmp/h_$V | tr -d "\r\n " | cut -c1-40)"
            else
              echo "❌ $V — HTTP $CODE, $TAILLE octets : $(head -c 200 $F)"; RES="$RES $V=KO:HTTP${CODE}:$(head -c 120 $F | tr -d '\n\r"%')"
              KO=$((KO+1))
            fi
          done
          echo "--- comme l'APP : avec la langue (&l=…) → Chirp 3 HD attendu, puis Bee (gratuit=1) ---"
          APP=''
          for L in en fr es de; do
            C=$(curl -sS -D /tmp/h_l -H "Referer: https://lingua.kd-mc.com/" -o /tmp/l.mp3 -w "%{http_code}" "https://lingua.kd-mc.com/__lingua/tts?v=coral&l=$L&t=hello-$MOT" || echo 000)
            APP="$APP l=$L:HTTP$C:$(wc -c < /tmp/l.mp3)o:$(grep -i '^x-voix' /tmp/h_l | tr -d '\r\n ' | cut -c1-32):$(grep -i '^content-type' /tmp/h_l | tr -d '\r\n ' | cut -c1-30)"
          done
          C=$(curl -sS -D /tmp/h_b -H "Referer: https://bee.kd-mc.com/" -o /tmp/b.mp3 -w "%{http_code}" "https://lingua.kd-mc.com/__lingua/tts?v=nova&gratuit=1&l=fr&t=bonjour-$MOT" || echo 000)
          APP="$APP bee:HTTP$C:$(wc -c < /tmp/b.mp3)o:$(grep -i '^x-voix' /tmp/h_b | tr -d '\r\n ' | cut -c1-32)"
          echo "::notice title=Voix comme l'app::$APP"
          echo "--- bouton 🐢 Lent (vitesse ralentie : doit continuer de marcher) ---"
          CODE=$(curl -sS -D /tmp/h_lent -H "Referer: https://lingua.kd-mc.com/" -o /tmp/lent.mp3 -w "%{http_code}" "https://lingua.kd-mc.com/__lingua/tts?v=coral&s=0.6&t=$MOT" || echo 000)
          T=$(wc -c < /tmp/lent.mp3)
          if [ "$CODE" = "200" ] && [ "$T" -gt 2000 ]; then echo "✅ 🐢 Lent — $T octets"; else echo "❌ 🐢 Lent — HTTP $CODE, $T octets"; KO=$((KO+1)); fi
          echo "::notice title=Lent (réel)::HTTP $CODE ${T}o $(head -c 100 /tmp/lent.mp3 | tr -d '\n\r"%' | cut -c1-100) · $(grep -i "^x-voix" /tmp/h_lent | tr -d '\r\n ' | cut -c1-40)"
          echo
          echo "::notice title=Voix Lingua (réel)::$KO en échec ·$RES"
          if [ "$KO" -gt 0 ]; then
            echo "::error title=Voix Lingua en échec::$KO voix sans son ·$RES"
            echo "$KO voix en échec. Rappel : le serveur est FAIL-OPEN — l'app retombe alors sur la"
            echo "voix du téléphone et le dit à l'écran (jamais de silence), mais c'est à corriger."
            exit 1
          fi
          echo "Toutes les voix répondent avec du vrai son. Le choix se fait à l'oreille dans Profil → 🔊 Voix."

      - name: "Le Coach répond-il encore, et respecte-t-il ses consignes ?"
        shell: bash -eo pipefail {0}
        run: |
          KO=0
          curl -sS -H 'Referer: https://lingua.kd-mc.com/' -o /tmp/coach.json -w 'HTTP %{http_code}\n' -X POST \
            -H 'content-type: application/json' \
            --data '{"lang":"en","langName":"anglais","level":"Debutant","levelIndex":1,"messages":[{"role":"user","text":"Donne-moi un exercice pour completer un mot dans une phrase."}]}' \
            https://lingua.kd-mc.com/__lingua/ai || true
          if grep -q '"ok":true' /tmp/coach.json; then
            echo "✅ Le Coach répond."
          else
            echo "❌ Le Coach ne répond pas : $(head -c 300 /tmp/coach.json)"; KO=$((KO+1))
          fi
          REP=$(python3 -c "import json;print(json.load(open('/tmp/coach.json')).get('reply',''))" 2>/dev/null || echo "")
          echo "----- sa réponse -----"; echo "$REP"; echo "----------------------"
          # Consigne « un mot à compléter » → il doit écrire des tirets bas ___ (l'app en fait une case)
          if echo "$REP" | grep -q '__'; then echo "✅ Il utilise bien le format ___ (case à remplir dans l'app)";
          else echo "⚠️ Pas de ___ dans CETTE réponse — l'app affichera du texte simple (pas bloquant : une IA n'obéit pas à 100%)"; fi
          # La phrase à trou doit être dans la LANGUE APPRISE (vu en vrai : « J'ai ___ mon sac à dos »
          # proposé à quelqu'un qui apprend l'anglais → n'apprend rien).
          PHRASE=$(echo "$REP" | grep -o '[^.!?]*__[^.!?]*' | head -1 || true)
          if [ -n "$PHRASE" ]; then
            echo "phrase de l'exercice : $PHRASE"
            if echo "$PHRASE" | grep -qiE "(^| )(j'ai|je |tu |il |elle |nous |vous |mon |ma |mes |le |la |les |une |des |dans |pour |avec )"; then
              echo "⚠️ Cette phrase a l'air FRANÇAISE — l'exercice doit être dans la langue apprise"
            else
              echo "✅ La phrase de l'exercice est bien dans la langue apprise"
            fi
          fi
          # Consigne « une seule question à la fois » → pas de liste 1. 2. 3.
          if echo "$REP" | grep -qE '(^|[^0-9])3[.)] '; then echo "⚠️ Il semble poser 3 questions d'un coup (consigne « une seule » non respectée cette fois)";
          else echo "✅ Une seule question à la fois"; fi
          [ "$KO" -eq 0 ] || exit 1
