name: Audit LINGUA (tout, sur le vrai domaine)

# Kevin 27.09.2026 : « Fais ton audit de lingua, toutes les fonctions, voix, etc.
# Tout. Réel tjs ».
#
# Pourquoi un robot et pas une session : depuis un agent Claude, le proxy répond
# 403 au CONNECT sur *.kd-mc.com. Ce runner, lui, a Internet — c'est le seul
# endroit d'où l'on peut MESURER au lieu d'affirmer.
#
# Pourquoi les annotations : le journal du job est servi par
# productionresultssa*.blob.core.windows.net, que le proxy refuse ; les artefacts
# aussi (téléchargement testé le 27.09 : 403). Les ANNOTATIONS sortent par
# api.github.com — le seul canal qui traverse. On y recopie donc le rapport.
#
# ⛔ PAS DE CRON ICI. GitHub a suspendu le compte le 15/08/2026 pour des
#    workflows qui interrogeaient des sites tiers en boucle. Ce robot se lance
#    À LA MAIN, point.
#
# Coût : les voix passent par /__lingua/tts, facturé au caractère. La sonde dit
# UN mot court par voix (~90 caractères pour les 12), et le worker met en cache.

on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Passer outre le plafond de 2 vérifications réelles par jour (Kevin seulement — chaque run coûte du quota Cloudflare)"
        type: boolean
        default: false
      base:
        description: "Adresse à auditer"
        default: "https://lingua.kd-mc.com"

permissions:

  actions: read   # le plafond compte les exécutions du jour par l'API
  contents: read

concurrency:
  group: audit-lingua
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # Borne de temps : 16 langues + 12 voix, ~10 min quand tout va bien. Sans borne,
    # GitHub laisse tourner SIX HEURES — six heures de quota brûlées pour rien.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Plafond — 2 vérifications réelles par jour, toutes familles confondues (Kevin 27.09)
        # Le 27.09, les robots ont mis le domaine à terre (1 000 écritures KV, puis 100 000 requêtes :
        # 48 surfaces en HTTP 429 pour tout le monde). Compté par l'API GitHub, jour UTC, sans écrire
        # nulle part. Plafonné = run vert qui le DIT et ne frappe rien. Kevin seul passe outre (« forcer »).
        id: plafond
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCER: ${{ inputs.forcer }}
          # 8.10 : le budget du jour (requêtes Workers) est lu aussi — une vérification réelle coûte 5 000 à 10 000 requêtes
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KDMC_BUDGET_ROBOTS_PCT: ${{ vars.KDMC_BUDGET_ROBOTS_PCT || '' }}
        run: node tools/ci/plafond-verifs.mjs

      - name: Installer Chromium
        if: steps.plafond.outputs.ok == 'true'
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Auditer Lingua pour de vrai
        if: steps.plafond.outputs.ok == 'true'
        # `pipefail` OBLIGATOIRE : sans lui le code de sortie est celui de `tee`
        # (toujours 0) et un audit qui dit « ÉCHEC » ressortirait VERT. Un contrôle
        # qui ment est pire que pas de contrôle.
        shell: bash -euo pipefail {0}
        # 8.10 : l'adresse passe par env:, jamais dans le shell (garde test:workflows-shell)
        env:
          BASE: ${{ inputs.base || 'https://lingua.kd-mc.com' }}
        # `stdbuf -oL` : vers un TUYAU, Node met sa sortie en mémoire tampon et
        # n'écrit qu'à la fin — dix minutes de silence qu'on prend pour un blocage.
        run: stdbuf -oL -eL node tools/smoke/audit-lingua.mjs "$BASE" 2>&1 | tee /tmp/lingua.log

      - name: Rapport lisible depuis l'agent (annotations)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/lingua.log ] || { echo "::notice title=Audit Lingua::(pas de journal)"; exit 0; }
          # Tout le rapport est fait de lignes qui PORTENT un verdict : on garde
          # ✅ ❌ ⚠, les en-têtes, le détail par langue et le total.
          # 27.09 nuit : les suites hexa sont MASQUÉES (jamais une empreinte dans un rapport) au lieu de
          # faire JETER la ligne : les URL des paquets Apex (index-3f9a2b1c.js) effaçaient la raison même
          # d'un rouge — « Apex AI » rouge sans un mot d'explication.
          grep -aE '✅|❌|⚠|=== AUDIT LINGUA|AUDIT LINGUA (OK|ÉCHEC)|version servie|^   ·' /tmp/lingua.log \
            | grep -avE 'code admin|pinhash|PIN_HASH' | sed -E '/empreinte/!s/[0-9a-f]{8,}/…/g' \
            | tail -110 > /tmp/rap.txt || tail -60 /tmp/lingua.log > /tmp/rap.txt
          # Une annotation = 12 lignes max. GitHub impose d'encoder %, CR et LF.
          split -l 12 -d /tmp/rap.txt /tmp/bl_
          n=0
          for f in /tmp/bl_*; do
            n=$((n+1))
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Audit Lingua ${n}::${msg}"
          done
          echo "::notice title=Audit Lingua bilan::${n} bloc(s) publies en annotations"

      - name: Journal complet en artefact (si on peut le télécharger un jour)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-lingua-${{ github.run_id }}
          path: /tmp/lingua.log
          if-no-files-found: ignore
          retention-days: 7
