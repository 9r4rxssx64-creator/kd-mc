# ⬅️ RAPATRIÉ ici le 5.09.2026 (Kevin : « rapatrie tout sur GitHub intelligemment
#    en respectant les règles »). Il teste / déploie / publie CE dépôt — c'est
#    exactement l'usage prévu par les conditions GitHub Actions.
#    ⛔ AUCUNE exécution programmée : c'est le VOLUME automatique (~97/jour) qui a
#    fait suspendre le compte le 15/08, pas ce workflow-ci. On le lance à la main
#    (bouton « Run workflow ») — et c'est moi qui appuie, via l'API. Ne PAS remettre
#    de cron : la garde npm run test:actions-conformes échoue en le nommant.
#    Sa destination et sa raison sont écrites dans
#    .github/workflows-desactives/DESTINATIONS.json.
name: Auto-deploy agent sur Vercel
# Une seule execution a la fois par branche : un nouveau commit remplace
# l'ancien au lieu de s'empiler dans la file d'attente GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # un deploiement ne doit jamais etre coupe en plein vol


# Quand un commit modifie tools/agent/* → redéploie automatiquement sur Vercel
# (Vercel le fait déjà nativement si l'intégration GitHub est active,
#  ce workflow est un backup explicite)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/agent/**'
      - 'tools/integrations/**'

# Droits minimum (24.09.2026) : ce robot ne fait que lire. Explicite, pour ne jamais dépendre du
# réglage par défaut du dépôt (le dépôt public est réglé en lecture seule).
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify via Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=🚀 Agent KDMC : nouveau commit poussé. Vercel redéploie..."
          fi
