name: Vérif RÉELLE — Tableau de bord admin (version servie, lignes cliquables, filtres)

# Kevin 18.11.2026 : « chaque information cliquable et atterrir au bon endroit ». Le robot, connecté en admin (code = SECRET, empreinte, jamais écrite ni journalisée),
# ouvre la vraie page admin, lit la version affichée, compte les lignes cliquables du Journal, essaie le filtre par app. LECTURE SEULE (tout envoi est absorbé).
# AU DÉPÔT PUBLIC : verdicts et nombres seulement. À la main seulement.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version attendue (ex. 2.7.28) — vide = on lit seulement celle qui est affichée"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verif-live-admin-tableau
  cancel-in-progress: false

jobs:
  verif:
    runs-on: ubuntu-24.04   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud).
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: La vraie page admin, connecté en admin, en lecture seule — verdicts et nombres seulement
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          SANS_NOMS: "1"
          VERSION_ATTENDUE: ${{ inputs.version }}
        # `pipefail` OBLIGATOIRE : sans lui le code de sortie est celui de `tee` (toujours 0) et un robot qui dit « ÉCHEC » ressortirait vert.
        shell: bash -euo pipefail {0}
        run: |
          set +e
          stdbuf -oL -eL node tests/verif-live-admin-tableau.mjs 2>&1 | tee /tmp/verif-admin-tableau.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rapport lisible depuis l'agent (annotations, nombres seulement)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/verif-admin-tableau.log ] || { echo "::notice title=Vérif Tableau admin::(pas de journal)"; exit 0; }
          grep -aE '✅|❌|⚠|ℹ️|=== VÉRIF|^   ↳' /tmp/verif-admin-tableau.log \
            | grep -avE 'code admin|pinhash|PIN_HASH' | sed -E 's/[0-9a-f]{16,}/…/g' \
            | head -60 > /tmp/rap.txt || tail -40 /tmp/verif-admin-tableau.log > /tmp/rap.txt
          split -l 12 -d /tmp/rap.txt /tmp/bl_
          n=0
          for f in /tmp/bl_*; do
            n=$((n+1))
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Vérif Tableau admin ${n}::${msg}"
          done
          echo "::notice title=Vérif Tableau admin bilan::${n} bloc(s) publiés en annotations"

      - name: Verdict
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
