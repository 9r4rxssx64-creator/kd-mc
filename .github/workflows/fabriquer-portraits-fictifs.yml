name: Pièces d'essai du Studio Avatars — portraits de personnes fictives (texte → image, gratuit)

# Kevin 29.10.2026 : avatars / marionnettes dans Créa Studio. Pour vérifier le suivi du visage SANS jamais afficher une vraie personne dans un journal
# public, ce robot fait fabriquer 3 portraits de personnes qui n'existent pas + 1 photo de chien par le service gratuit (FLUX.1-schnell, Workers AI),
# connecté en admin par le domaine (code = SECRET, jamais écrit). Les images sont déposées en artefact du run pour être REGARDÉES.
# AU DÉPÔT PUBLIC (minutes gratuites). À la main seulement (jamais de cron : règle absolue). 4 images = quelques dizaines de neurones sur 10 000/jour.

on:
  workflow_dispatch:
    inputs:
      jeu:
        description: "portraits (pièces d'essai) ou mascottes (4 styles mignons de Bee et Bourricot, pont 1307)"
        default: portraits

permissions:
  contents: read

concurrency:
  group: fabriquer-portraits-fictifs
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Fabriquer les portraits fictifs
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          CAPTURES: /tmp/portraits
          JEU: ${{ inputs.jeu || 'portraits' }}
        shell: bash -euo pipefail {0}
        run: |
          set +e
          stdbuf -oL -eL node tests/fabriquer-portraits-fictifs.mjs 2>&1 | tee /tmp/portraits.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Les portraits, à regarder (personnes fictives)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portraits-fictifs-${{ github.run_id }}
          path: /tmp/portraits/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Rapport lisible depuis l'agent (annotations, nombres seulement)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/portraits.log ] || { echo "::notice title=Portraits fictifs::(pas de journal)"; exit 0; }
          msg=$(grep -aE '✅|❌|=== PORTRAITS' /tmp/portraits.log | grep -avE 'code admin|pinhash' | sed -E 's/[0-9a-f]{16,}/…/g' | head -12 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Portraits fictifs::${msg}"

      - name: Verdict
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
