<!doctype html>
<html lang="fr" data-tableau-unique>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- connect-src : la caisse (kdmc-vente) pour la section Commerce, comme commerce.html. media-src : rien (pas de son ici). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://kdmc-vente.9r4rxssx64.workers.dev; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" />
<title>KDMC — Tableau de bord admin</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0b1409" />
<link rel="stylesheet" href="/design-system.css?v=2.7.12" />
<link rel="stylesheet" href="/kdmc-boite.css?v=2.0.5" />
<link rel="stylesheet" href="commerce.css?v=2.7.12" />
<link rel="stylesheet" href="tableau.css?v=2.7.12" />
<style>
  /* ── TABLEAU DE BORD UNIQUE (Kevin 10.10 : « Fais un seul tableau de bord admin pour tout. Regroupe tout intelligemment et
     clairement. ») — du plus urgent au moins urgent. Mobile d'abord (375 px), cibles ≥ 44 px, aucun défilement horizontal. */
  .wrap{max-width:980px}
  /* overflow-x:hidden (design-system) fait du body un conteneur de défilement : la barre collante ne collait plus. clip coupe pareil sans ça. */
  html,body{overflow-x:clip}
  .traiter{margin:4px 0 12px;padding:14px;border-radius:18px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(232,184,48,.10),rgba(17,28,20,.7));scroll-margin-top:70px}
  .traiter h1{margin:0;font-size:18px;color:var(--gold2);display:flex;align-items:center;gap:8px}
  .traiter .sous{margin:4px 0 12px;color:var(--mut);font-size:13px}
  .cpts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .live{margin:0 0 12px;padding:12px 14px;border-radius:18px;border:1px solid var(--line2);background:rgba(17,28,20,.6)}
  .live h2{margin:0 0 10px;font-size:15px;color:var(--txt,#eee);display:flex;align-items:center;gap:8px}
  .live h2 b{margin-left:auto;font-size:22px;color:var(--mut)}
  .live.a-du-monde h2 b{color:#4ade80}
  .live .pt{width:10px;height:10px;border-radius:50%;background:#6b7280;flex:none}
  .live.a-du-monde .pt{background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:livept 1.6s infinite}
  @keyframes livept{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  @media (prefers-reduced-motion:reduce){.live.a-du-monde .pt{animation:none}}
  .live-l{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .live-p{flex:none;display:flex;align-items:center;gap:8px;min-height:48px;max-width:240px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.08);color:inherit;font:inherit;text-align:left;cursor:pointer}
  .live-p .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#14532d;color:#bbf7d0;flex:none;position:relative}
  .live-p .av::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid #0b130d}
  .live-p .tx{display:flex;flex-direction:column;min-width:0}
  .live-p .tx b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-p .ou{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-vide{margin:0;color:var(--mut);font-size:13px}
  @media(min-width:640px){.cpts{grid-template-columns:repeat(5,1fr)}}
  .cpt{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;min-height:84px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(10,18,12,.7);color:var(--txt);font:inherit;text-align:left;cursor:pointer}
  .cpt:active{transform:scale(.98)}
  .cpt .n{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ok)}
  .cpt .l{font-size:13px;font-weight:600;line-height:1.25}
  .cpt .s{font-size:12.5px;color:var(--subtle)}
  .cpt.urgent{border-color:rgba(245,158,11,.75);box-shadow:0 0 0 1px rgba(245,158,11,.3);background:rgba(245,158,11,.10)}
  .cpt.urgent .n{color:#fbbf24}
  .cpt.inconnu .n{color:var(--mut)}
  .cpt.perime{border-style:dashed;opacity:.82}   /* chiffre du dernier relevé, pas encore remis à jour : jamais présenté comme neuf */
  .cpt.perime .n{font-style:italic}
  .cpt[hidden]{display:none}
  .tbnav{position:sticky;top:0;z-index:30;margin:0 -18px 10px;padding:8px 18px;background:rgba(8,13,7,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tbnav::-webkit-scrollbar{display:none}
  .tbnav a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap}
  .tbnav a b{background:#dc2626;color:#fff;border-radius:999px;padding:1px 7px;font-size:13px}
  .cherche{position:relative;margin:0 0 14px}
  .cherche input{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--field);color:var(--txt);font-size:16px}
  .cherche input:focus{outline:none;border-color:var(--gold)}
  .res{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .res[hidden]{display:none}
  .res button{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:15px;text-align:left;cursor:pointer}
  .res button span{color:var(--subtle);font-size:13px;margin-left:auto;white-space:nowrap}
  .res .rien{color:var(--mut);font-size:14px;padding:8px 2px}
  details.sec{margin:0 0 12px;border:1px solid var(--line);border-radius:18px;background:rgba(17,28,20,.45);scroll-margin-top:68px}
  details.sec>summary{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;cursor:pointer;list-style:none}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary .ic{font-size:22px;width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:11px;background:var(--gold-glow)}
  details.sec>summary .tt{display:flex;flex-direction:column;min-width:0}
  details.sec>summary .tt b{font-size:16px}
  details.sec>summary .tt span{font-size:13.5px;color:var(--mut)}
  details.sec>summary::after{content:"▸";margin-left:auto;color:var(--gold);transition:transform .15s}
  .etatcompte{min-height:44px;padding:0 14px}   /* 15.10 : cible tactile ≥ 44 px (garde verify-admin-unique) */
  details.sec[open]>summary::after{transform:rotate(90deg)}
  details.sec[open]>summary{border-bottom:1px solid var(--line)}
  .corps{padding:4px 14px 16px;min-width:0}
  .corps>.cat:first-child{margin-top:12px}
  .rien-ok{color:var(--ok);font-size:14px;margin:10px 2px}
  .mess{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .mess button{display:block;width:100%;text-align:left;min-height:56px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(10,18,12,.6);color:var(--txt);font:inherit;cursor:pointer}
  .mess button.nv{border-color:rgba(245,158,11,.7)}
  .mess .qui{font-weight:700;font-size:14.5px}
  .mess .quoi{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .srcs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .grosbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#11160c;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
  .cardrow .ver{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--gold2);font-size:12.5px}
  .info{font-size:13px;color:var(--mut);margin:10px 2px;line-height:1.5}
  .info b{color:var(--txt)}
  /* ── 16.10 (Kevin : « je passe mon temps à tout descendre, je trouve jamais rien… range, classe, organise ») : ACCUEIL à tuiles, puis UNE
     rubrique à la fois, découpée en onglets. L'adresse suit (#personnes/bloquer) : retour du téléphone et liens directs marchent. */
  .hors-vue,.hors-onglet{display:none!important}[data-va]{cursor:pointer;position:relative}.kv>[data-va]:active,.tlrow[data-va]:active{background:rgba(201,162,39,.12)}.kv>[data-va]>span::after{content:' ›';color:var(--gold,#c9a227)}.tlrow[data-va]{min-height:44px}.filtre-journal{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:8px 12px;border:1px solid rgba(201,162,39,.4);border-radius:12px}.filtre-journal button{min-height:44px}.kv a{color:var(--gold,#c9a227)}.lien-info{text-decoration:underline;text-decoration-color:rgba(201,162,39,.5);text-underline-offset:3px;min-height:44px}span.lien-info{display:inline-block;line-height:44px}[data-va]:active{transform:scale(.98)}.kpi[data-va]::after,.pill[data-va]::after{content:'›';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gold,#c9a227);font-size:20px;opacity:.7}.pill[data-va]{padding-right:26px}
  body[data-vue="accueil"] #tb-nav{display:none}
  body:not([data-vue="accueil"]) #tb-accueil,body:not([data-vue="accueil"]) #a-traiter,body:not([data-vue="accueil"]) #tb-live,body:not([data-vue="accueil"]) .cherche{display:none}
  body:not([data-vue="accueil"]) details.sec>summary{display:none}
  body:not([data-vue="accueil"]) details.sec{border:0;background:none}
  body:not([data-vue="accueil"]) .corps{padding:0 0 16px}
  .tbnav .retour-tb{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);color:var(--gold2);text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
  .tbnav a[aria-current="page"]{border-color:var(--gold);color:var(--gold2);background:var(--gold-glow)}
  .tuiles-sec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:640px){.tuiles-sec{grid-template-columns:repeat(3,1fr)}}
  .tuile-sec{position:relative;display:flex;flex-direction:column;gap:6px;min-height:104px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(17,28,20,.6);color:var(--txt);text-decoration:none}
  .tuile-sec:active{transform:scale(.98)}
  .tuile-sec .ic{font-size:24px}
  .tuile-sec .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .tuile-sec .tt b{font-size:15px;line-height:1.2}
  .tuile-sec .tt .r{font-size:13px;color:var(--mut);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tuile-sec .bd{position:absolute;top:10px;right:10px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#dc2626;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
  .tuile-sec .bd[hidden]{display:none}
  .raccourcis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
  .racc{min-height:52px;padding:10px 12px;border-radius:14px;border:1px solid var(--line2);background:rgba(10,18,12,.7);color:var(--txt);font:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
  .racc:active{transform:scale(.98)}
  .onglets{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:2px 0 12px;padding:2px 0}
  .onglets::-webkit-scrollbar{display:none}
  .onglets a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap;background:rgba(10,18,12,.55)}
  .onglets a[aria-selected="true"]{border-color:var(--gold);color:#11160c;background:linear-gradient(135deg,var(--gold2),var(--gold));font-weight:700}
  .onglets a b{background:#dc2626;color:#fff;border-radius:999px;padding:1px 7px;font-size:13px}
</style>
</head>

</body>
