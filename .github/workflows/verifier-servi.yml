name: Vérifier ce qui est SERVI (même derrière la porte du domaine, connecté en admin, lecture seule)

# Kevin 25.10.2026 : « Trouve des solutions, crée, pour ne jamais être bloqué comme ça » (une session ne peut pas lire une page derrière la porte ;
# le Lenovo n'est pas toujours allumé). Le robot du dépôt PUBLIC a le secret (empreinte jamais écrite ni journalisée) : il se connecte comme Kevin,
# LECTURE SEULE, ouvre chaque adresse *.kd-mc.com sur iPhone 13 (Safari) et portable, et rend des NOMBRES : version servie, haut vs « ← Portail »,
# boutons cachés, débordement, petites cibles. Le journal d'un dépôt public se lit par tous : AUCUN texte de page, balise#id.classe et nombres seulement.
# À la main seulement, jamais de cron. Lecture : annotations « Servi N » (gh api repos/…/check-runs/<job>/annotations).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses *.kd-mc.com à lire, séparées par des espaces (ex. autorisations.kd-mc.com https://kd-mc.com/liens/)"
        required: true
      ecrans:
        description: "Écrans à lire, séparés par des virgules (vide = les 5). Ex. portable pour mesurer la version de Bee sur tout le domaine"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verifier-servi
  cancel-in-progress: false

jobs:
  servi:
    runs-on: ubuntu-24.04   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium et WebKit (Safari)
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          # 12.11 : `--with-deps` restait 20 min sur le miroir apt muet (run 43056126562). On télécharge
          # chaque moteur avec un délai, puis on n'installe les bibliothèques système (apt, borné) que
          # si le moteur ne démarre pas tel quel. Un moteur absent est dit, jamais attendu sans fin.
          lancer() { node -e "(async()=>{const p=require('playwright');try{const b=await p['$1'].launch();await b.close();process.exit(0);}catch(e){console.error(String(e.message).split('\n')[0].slice(0,200));process.exit(1);}})()" 2>/tmp/lance.log; }
          OK=""
          for moteur in chromium webkit; do
            for essai in 1 2; do
              if timeout 240 ./node_modules/.bin/playwright install "$moteur" > "/tmp/dl-$moteur.log" 2>&1; then break; fi
              echo "::warning title=Servi::téléchargement $moteur essai $essai en échec : $(tail -n 2 "/tmp/dl-$moteur.log" | tr '\n' ' ' | cut -c1-250)"
            done
            if ! lancer "$moteur"; then
              echo "::warning title=Servi::$moteur ne démarre pas tel quel ($(cut -c1-160 /tmp/lance.log)) : bibliothèques système (6 min au plus)"
              sudo timeout -k 20 360 env "PATH=$PATH" ./node_modules/.bin/playwright install-deps "$moteur" > "/tmp/deps-$moteur.log" 2>&1 || echo "::warning title=Servi::bibliothèques $moteur incomplètes : $(tail -n 2 "/tmp/deps-$moteur.log" | tr '\n' ' ' | cut -c1-250)"
            fi
            if lancer "$moteur"; then OK="${OK:+$OK,}$moteur"; else echo "::warning title=Servi::$moteur ne se lance pas : $(cut -c1-200 /tmp/lance.log)"; fi
          done
          echo "::notice title=Servi::moteurs qui se lancent : $OK"
          case ",$OK," in *,chromium,*) ;; *) echo "::error title=Servi::Chromium ne se lance pas"; exit 1;; esac
          case ",$OK," in *,webkit,*) echo "WEBKIT_OK=1" >> "$GITHUB_ENV";; esac

      - name: Lire les pages servies — nombres et sélecteurs seulement
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          WEBKIT: ${{ env.WEBKIT_OK }}
          URLS: ${{ inputs.urls }}
          SERVI_ECRANS: ${{ inputs.ecrans }}
        shell: bash -euo pipefail {0}
        run: |
          set +e
          # shellcheck disable=SC2086
          stdbuf -oL -eL node tools/plateformes/verifier-servi.mjs $URLS 2>&1 | tee /tmp/servi.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rapport lisible depuis l'agent (annotations)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/servi.log ] || { echo "::notice title=Servi::(pas de journal)"; exit 0; }
          sed -E 's/[0-9a-f]{16,}/…/g' /tmp/servi.log | cut -c1-600 > /tmp/servi.txt
          split -l 5 -d /tmp/servi.txt /tmp/sv_
          n=0
          for f in /tmp/sv_*; do n=$((n+1)); msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::notice title=Servi ${n}::${msg}"; done

      - name: Verdict (le robot a tourné jusqu'au bout)
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
