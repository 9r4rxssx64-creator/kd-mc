name: Lingua — TOUTES LES PLATEFORMES (Chromium + WebKit/Safari + Firefox, compte local fictif)

# Kevin 22.10.2026 : « teste toujours tout sur l'ordinateur, iPhone, Android, toutes les plateformes… aucun bug visuel, fonctionnel, de fluidité ». WebKit = le moteur de Safari
# (iPhone / iPad), absent des sessions : ce robot le fournit. AU DÉPÔT PUBLIC (minutes gratuites et illimitées, 0 minute du coffre). Compte LOCAL fictif seulement :
# le vrai code de lingua/ servi tel quel, aucune connexion, aucun secret, aucune donnée de Kevin. À la main seulement, jamais de cron.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingua-plateformes
  cancel-in-progress: false

jobs:
  plateformes:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium, WebKit et Firefox (téléchargement, lancement, bibliothèques seulement pour ceux qui ne démarrent pas)
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud).
        # 23.10, runs 40005190242 puis 40006199277 : `--with-deps` / `install-deps` (apt, miroir azure lent) a mangé 18 min ou laissé le verrou dpkg pris (apt tourne en ROOT :
        # un `timeout` d'utilisateur ne peut pas le tuer). Donc : (1) télécharger les navigateurs (pas d'apt) ; (2) essayer de LANCER chaque moteur tel quel ;
        # (3) seulement pour ceux qui ne démarrent pas, installer leurs bibliothèques sous `sudo timeout` (root tue root) ; (4) relancer pour savoir ce qui marche.
        timeout-minutes: 16
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          for moteur in chromium webkit firefox; do
            for essai in 1 2; do
              if timeout 240 ./node_modules/.bin/playwright install "$moteur" > "/tmp/dl-$moteur.log" 2>&1; then break; fi
              echo "::warning title=lingua-plateformes::téléchargement $moteur essai $essai en échec : $(tail -n 2 "/tmp/dl-$moteur.log" | tr '\n' ' ' | cut -c1-250)"
            done
          done
          lancer() { node -e "(async()=>{const p=require('playwright');try{const b=await p['$1'].launch();await b.close();process.exit(0);}catch(e){console.error(String(e.message).split('\n')[0].slice(0,200));process.exit(1);}})()" 2>/tmp/lance.log; }
          OK=""
          for moteur in chromium webkit firefox; do
            if ! lancer "$moteur"; then
              echo "::warning title=lingua-plateformes::$moteur ne démarre pas tel quel ($(cat /tmp/lance.log | cut -c1-160)) : installation de ses bibliothèques (6 min au plus)"
              sudo timeout -k 20 360 env "PATH=$PATH" ./node_modules/.bin/playwright install-deps "$moteur" > "/tmp/deps-$moteur.log" 2>&1 || echo "::warning title=lingua-plateformes::bibliothèques $moteur incomplètes : $(tail -n 2 "/tmp/deps-$moteur.log" | tr '\n' ' ' | cut -c1-250)"
            fi
            if lancer "$moteur"; then OK="${OK:+$OK,}$moteur"; else echo "::warning title=lingua-plateformes::$moteur ne se lance pas : $(cat /tmp/lance.log | cut -c1-200)"; fi
          done
          echo "Moteurs qui se lancent : $OK"
          echo "::notice title=lingua-plateformes::moteurs qui se lancent : $OK"
          case ",$OK," in *,chromium,*) ;; *) echo "::error title=lingua-plateformes::Chromium ne se lance pas"; exit 1;; esac
          echo "ENGINES_OK=$OK" >> "$GITHUB_ENV"

      - name: La matrice d'appareils (iPhone, Android, tablettes, portables, grand écran)
        timeout-minutes: 14   # un moteur figé ne tient plus le robot : l'étape s'arrête, les annotations restent lisibles
        env:
          ENGINES: ${{ env.ENGINES_OK }}
          EXIGE_PLAYWRIGHT: "1"
        run: node tools/plateformes/verif-lingua-plateformes.mjs
