name: Bee — TOUTES LES PLATEFORMES (Chromium + WebKit/Safari + Firefox, aucune donnée réelle)

# Kevin 22.10.2026 : « teste toujours tout sur l'ordinateur, iPhone, Android, toutes les plateformes… aucun bug visuel, fonctionnel, de fluidité ».
# Le vrai widget de Bee (javis/javis-widget.js) dans de vrais navigateurs, sur la matrice d'appareils de tools/plateformes/verif-plateformes-bee.mjs.
# WebKit = Safari / iPhone et Firefox n'existent pas dans les sessions : ce robot les fournit. AU DÉPÔT PUBLIC (minutes gratuites et illimitées,
# 0 minute du coffre). Faux domaine local, faux cerveau : aucune donnée, aucun secret, aucune connexion. À la main seulement, jamais de cron.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bee-plateformes
  cancel-in-progress: false

jobs:
  plateformes:
    # un travail PAR MOTEUR, en parallèle
    strategy:
      fail-fast: false
      matrix:
        moteur: [chromium, webkit, firefox]
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le moteur ${{ matrix.moteur }}
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud)
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps ${{ matrix.moteur }}

      - name: La matrice d'appareils (iPhone, Android, tablettes, portables, grand écran)
        timeout-minutes: 20
        env:
          ENGINES: ${{ matrix.moteur }}
          EXIGE_PLAYWRIGHT: "1"
        run: node tools/plateformes/verif-plateformes-bee.mjs
