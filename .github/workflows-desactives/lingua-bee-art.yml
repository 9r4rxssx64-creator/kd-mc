name: "KDMC Lingua — Génère la mascotte Bee (images IA, à la demande)"

# Génère les POSES de la mascotte Bee à partir de l'image de référence choisie par Kevin
# (lingua/bee/bee-src.webp) via l'API images/edits d'OpenAI (clé secret OPEN_AI_API_KEY).
# Manuel uniquement (workflow_dispatch) — zéro cron, zéro mail (règle anti-spam).
# Les variantes sont committées sur la branche claude/bee-mascot-art ([skip ci]) pour que
# l'agent puisse les récupérer, les détourer et les intégrer.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Variantes de pose depuis l'abeille de référence (images/edits)
        env:
          OPENAI_KEY: ${{ secrets.OPEN_AI_API_KEY }}
        run: |
          set -e
          if [ -z "${OPENAI_KEY:-}" ]; then echo "::error::OPEN_AI_API_KEY absente"; exit 1; fi
          if [ ! -f lingua/bee/bee-src.webp ]; then echo "::error::lingua/bee/bee-src.webp introuvable (référence)"; exit 1; fi
          mkdir -p /tmp/out
          KEEP="Keep the EXACT same character design: same face, same big sparkling eyes with heart reflections, same blush cheeks, same yellow head tuft, same brown antennae, same fluffy collar with honey hexagon pendant, same striped body, same translucent wings, same colors and same cartoon style, same plain cream background."
          gen_edit () {
            NAME="$1"; ACTION="$2"
            echo "== $NAME =="
            HTTP=$(curl -sS -o /tmp/img.json -w "%{http_code}" https://api.openai.com/v1/images/edits \
              -H "Authorization: Bearer $OPENAI_KEY" \
              -F "model=gpt-image-1" \
              -F "image[]=@lingua/bee/bee-src.webp;type=image/webp" \
              -F "prompt=$KEEP Now show this same character $ACTION" \
              -F "size=1024x1024" -F "quality=high" -F "n=1") || HTTP=000
            if [ "$HTTP" = "200" ] && jq -e '.data[0].b64_json' /tmp/img.json >/dev/null 2>&1; then
              jq -r '.data[0].b64_json' /tmp/img.json | base64 -d > "/tmp/out/$NAME.png"
              echo "  OK ($(wc -c < /tmp/out/$NAME.png) octets)"
              return 0
            fi
            echo "::warning::$NAME non générée (http=$HTTP) : $(jq -r '.error.message // "?"' /tmp/img.json 2>/dev/null | head -c 200)"
            return 1
          }
          OK=0
          gen_edit "party" "jumping for joy and celebrating with both arms up, surrounded by small confetti and stars" && OK=$((OK+1))
          gen_edit "read"  "sitting down and adorably reading a small purple book held in her hands, eyes looking at the book" && OK=$((OK+1))
          gen_edit "point" "curiously pointing up with one hand, asking a question, mouth open as if speaking" && OK=$((OK+1))
          echo "Variantes générées : $OK/3"
          [ "$OK" -ge 1 ] || { echo "::error::aucune variante générée"; exit 1; }

      - name: Commit sur la branche d'art (récupérée par l'agent)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="claude/bee-art-${GITHUB_RUN_ID}"
          git checkout -B "$BR"
          mkdir -p lingua/bee-art
          cp /tmp/out/*.png lingua/bee-art/ 2>/dev/null || true
          git add lingua/bee-art/
          git commit -m "art(lingua): variantes de pose de Bee (référence Kevin) [skip ci]" || { echo "rien à committer"; exit 0; }
          git push origin "$BR"

      - name: Artefact (trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bee-mascot-art
          path: /tmp/out/
          retention-days: 30
