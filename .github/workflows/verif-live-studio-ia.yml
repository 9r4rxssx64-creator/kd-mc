name: Vérif RÉELLE — IA du Studio créa comme Kevin (cartoon par style + « faire vivre la photo », vrai service)

# Kevin 25.10.2026 : « Le rendu est vraiment dégueulasse… qualité professionnelle commerciale ». Règles « Réel toujours » et « Connecte-toi réel comme moi » :
# le code admin vient du SECRET (empreinte, jamais écrite ni journalisée) et part au DOMAINE (/__admin/login) comme quand Kevin le tape ; le pass obtenu
# sert au vrai service crea-ai.kd-mc.com, exactement comme l'app. L'image envoyée est DESSINÉE par le robot (aucune photo de personne) ; les rendus
# (entrée + cartoon toon3d + cartoon anime + instants « faire vivre ») sont déposés en artefact pour être REGARDÉS : un nombre ne dit pas si c'est beau.
# AU DÉPÔT PUBLIC (minutes gratuites et illimitées, 0 minute du coffre). À la main seulement (jamais de cron : règle absolue), par l'API.
# Coût : 2 images + 3 instants = 5 appels Gemini (quota gratuit du jour) ; à lancer avec mesure.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verif-live-studio-ia
  cancel-in-progress: false

jobs:
  verif:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud).
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: IA du Studio, connecté en admin, vrai service (cartoon par style + instants)
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          CAPTURES: /tmp/rendus
        # `pipefail` OBLIGATOIRE : sans lui le code de sortie est celui de `tee` (toujours 0) et un robot qui dit « ÉCHEC » ressortirait vert.
        shell: bash -euo pipefail {0}
        run: |
          set +e
          stdbuf -oL -eL node tests/verif-live-studio-ia.mjs 2>&1 | tee /tmp/verif-studio-ia.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Les rendus, à regarder (entrée dessinée + sorties de l'IA — aucune personne réelle)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-ia-rendus-${{ github.run_id }}
          path: /tmp/rendus/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Rapport lisible depuis l'agent (annotations, nombres seulement)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/verif-studio-ia.log ] || { echo "::notice title=Vérif Studio IA::(pas de journal : rien n'a tourné)"; exit 0; }
          grep -aE '✅|❌|⚠|ℹ️|=== VÉRIF' /tmp/verif-studio-ia.log \
            | grep -avE 'code admin|pinhash|PIN_HASH' | sed -E 's/[0-9a-f]{16,}/…/g' \
            | head -40 > /tmp/rap.txt || tail -40 /tmp/verif-studio-ia.log > /tmp/rap.txt
          split -l 12 -d /tmp/rap.txt /tmp/bl_
          n=0
          for f in /tmp/bl_*; do
            n=$((n+1))
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Vérif Studio IA ${n}::${msg}"
          done
          echo "::notice title=Vérif Studio IA bilan::${n} bloc(s) publiés en annotations"

      - name: Verdict
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
