"Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 5, "name": "Croustades à la Monégasque", "portions": "4 personnes", "ingredients": "1 bloc de pâte feuilletée, 100g de chair de homard cuite, 100g de moules décochées, 50g de champignons, 20cl de sauce américaine de crustacés bien relevée, 1 œuf.", "method": "Étaler la pâte feuilletée. Découper des disques à l'emporte-pièce et évider le centre de la moitié d'entre eux pour faire des anneaux. Superposer un anneau sur chaque disque plein en collant à l'œuf pour former des petites caisses (croustades). Cuire au four à 200°C pendant 15 minutes jusqu'à ce que le feuilletage lève et dore. Couper la chair de homard, les moules et les champignons en petits dés. Les sauter une minute au beurre, puis les lier avec la sauce américaine chaude réduite. Remplir le centre des croustades chaudes et servir.", "key": "croustades a la monegasque", "histoire": "Cette recette illustre la rencontre entre la grande cuisine feuilletée française et les produits de la mer de la Riviera. Servies chaudes au début des repas officiels à Monaco, ces croustades croustillantes étaient garnies de homard et de moules liés à la sauce américaine. C'était le type d'entrée sophistiquée que l'on servait lors des soirées d'opéra au théâtre de Monte-Carlo.", "resume": "Caisses individuelles vol-au-vent en pâte feuilletée, garnies à chaud d'un salpicon de chair de homard, de moules décochées et de champignons sautés, le tout lié par une sauce américaine de crustacés très réduite.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 33, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 6, "name": "Feuilleté de Ris de Veau à la Monégasque", "portions": "4 personnes", "ingredients": "400g de pâte feuilletée inversée, 200g de ris de veau, 4 croûtes en pâte à choux (crêtes de coq), 50g d'olives de Nice dénoyautées, 20cl de sauce Allemande (velouté de veau lié aux œufs et crème).", "method": "Étaler la pâte feuilletée et couper deux grands rectangles. Dorer à l'œuf le dessus et cuire au four à 200°C pendant 25 minutes pour faire une grande boîte feuilletée. Évider le centre pour en faire une boîte. Couper les ris de veau blanchis en morceaux et les sauter au beurre. Ajouter les olives de Nice blanchies coupées en morceaux. Lier avec la sauce Allemande chaude crémée. Mettre cette garniture onctueuse au centre du feuilleté chaud, décorer avec les crêtes de coq et remettre le chapeau de pâte avant de servir.", "key": "feuillete de ris de veau a la monegasque", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 34, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 7, "name": "Œufs à la Huguenotte Monte-Carlo", "portions": "4 personnes", "ingredients": "4 œufs frais, 4 belles tranches de pain de mie, 50g de beurre, 15cl de jus de viande très corsé, 5cl de Madère vieux, 1 petite truffe noire, 30g de jambon cru de pays.", "method": "Couper les tranches de pain de mie en cercles réguliers et les faire frire à la poêle dans le beurre pour obtenir des croûtons croustillants. Dans une casserole, faire réduire de moitié le jus de viande et le Madère vieux pour obtenir une sauce sirupeuse. Y ajouter le jambon et la truffe coupés en dés minuscules (brunoise). Pocher les œufs dans de l'eau frémissante vinaigrée pendant 3 minutes, puis les égoutter sur un linge. Poser un œuf poché chaud sur chaque croûton frit, puis napper généreusement de sauce chaude truffée.", "key": "ufs a la huguenotte monte carlo", "histoire": "Le terme « à la Huguenotte » fait référence à une très ancienne méthode française où l'on cuisinait les aliments directement dans un jus de viande très réduit et corsé. Auguste Escoffier et les chefs de Monte-Carlo ont repris ce nom historique pour créer un entremets chaud de prestige, associant la douceur de l'œuf poché à la puissance d'une réduction de jus de veau au Madère et à la truffe noire.", "resume": "Œufs pochés 3 minutes à l'eau vinaigrée, dressés sur de grands croûtons frits au beurre ; nappés d'une réduction sirupeuse de jus de veau corsé et de Madère vieux, enrichie d'une brunoise de jambon cru et truffe noire.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 35, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 8, "name": "Œufs Monaco", "portions": "4 personnes", "ingredients": "4 œufs frais, 30cl de gelée de volaille transparente liquide, 1 truffe noire, 1 œuf dur (pour le blanc).", "method": "Prendre 4 moules individuels. Mettre un fond de gelée de volaille liquide et placer au frais pour faire figer. Découper des formes d'étoiles dans la truffe noire et de petits disques dans le blanc d'œuf dur. Déposer ces décors directement sur la gelée figée au fond des moules. Pocher les 4 œufs frais pendant 3 minutes (le jaune doit rester coulant), les laisser refroidir et les sécher. Poser un œuf dans chaque moule sur le décor. Remplir les moules avec le reste de gelée de volaille liquide froide. Réserver 3 heures au réfrigérateur. Démouler après un passage rapide du fond des moules dans l'eau chaude.", "key": "ufs monaco", "histoire": "Les œufs en gelée étaient les stars incontournables des buffets de l'Hôtel de Paris. Pour les dîners patriotiques ou princiers, les cuisiniers coulaient une gelée de volaille transparente comme du cristal. Au fond du moule, ils disposaient une étoile de truffe noire et un disque de blanc d'œuf pour que, une fois démoulé, l'œuf semble porter le blason officiel de la Principauté de Monaco.", "resume": "Œufs pochés froids moulés individuellement dans une gelée de volaille limpide ; le fond du moule est préalablement décoré d'une étoile de truffe noire et d'un disque de blanc d'œuf dur simulant le blason de la Principauté.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 36, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 9, "name": "Œufs Monte-Carlo", "portions": "4 personnes", "ingredients": "4 œufs frais, 4 fonds de tartelettes cuits en pâte brisée, 150g de ratatouille coupée très fine, 2 jaunes d'œufs, 100g de beurre, 1 cuillère à café de concentré de tomate.", "method": "Réchauffer la ratatouille fine et en garnir le fond des tartelettes chaudes. Pocher les 4 œufs frais dans de l'eau frémissante vinaigrée pendant 3 minutes pour que le blanc soit pris mais le jaune coulant. Poser un œuf poché chaud dans chaque tartelette sur la ratatouille. Faire une sauce hollandaise en fouettant les deux jaunes d'œufs avec un filet d'eau sur un bain-marie, puis incorporer le beurre petit à petit. Ajouter le concentré de tomate pour colorer la sauce en rose (sauce Aurore). Napper les œufs de cette sauce avant de servir.", "key": "ufs monte carlo", "histoire": "Ce plat est un hommage aux couleurs de l'aurore sur la mer Méditerranée. La sauce Aurore (une hollandaise teintée en rose par une pointe de tomate) venait napper un œuf poché coulant posé sur une ratatouille niçoise traditionnelle. C’était le déjeuner favori des artistes et des hivernants qui venaient chercher le soleil d'hiver sur les terrasses de Monte-Carlo.", "resume": "Œufs pochés dressés dans des croûtes de tartelettes garnies de ratatouille fine chaude ; l'œuf est entièrement masqué d'une sauce hollandaise montée au bain-marie et teintée en rose par une pointe de concentré de tomate (sauce Aurore).", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 37, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 10, "name": "Œufs pochés à la Monégasque", "portions": "4 personnes", "ingredients": "4 œufs frais, 2 grandes tomates mûres, 1 gousse d'ail, 2 jaunes d'œufs, 100g de beurre, 4 filets d'anchois, huile d'olive.", "method": "Couper les tomates en deux, enlever les graines, saler et laisser dégorger. Les badigeonner d'huile d'olive, frotter l'intérieur à l'ail et cuire au four à 180°C pendant 10 à 12 minutes pour les griller légèrement sans qu'elles s'effondrent. Pocher les œufs frais pendant 3 minutes et mettre un œuf chaud dans chaque demi-tomate. Réaliser une sauce hollandaise sur bain-marie avec les jaunes d'œufs et le beurre fondu. Napper chaque œuf de sauce bien chaude et poser deux filets d'anchois en croix sur le dessus avant de servir.", "key": "ufs poches a la monegasque", "histoire": "Dans cette recette, on retrouve la rencontre magique des produits de la terre et de la mer. La demi-tomate grillée au four et frottée à l'ail représente le terroir provençal, tandis que les filets d'anchois au sel croisés rappellent la tradition des pêcheurs du port de Monaco. Nappé d'une hollandaise brûlante, ce plat était une entrée chaude très populaire dans les grands hôtels.", "resume": "Œufs pochés logés au cœur de demi-tomates évidées, frottées d'ail et grillées au four ; l'œuf est nappé d'une sauce hollandaise brûlante et couronné de deux filets d'anchois croisés en diagonale.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 38, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 11, "name": "Œufs sur le Plat à la Monégasque", "portions": "4 personnes", "ingredients": "4 œufs frais, 20cl de sauce tomate épaisse, 30g de beurre d'anchois, 1 cuillère à soupe de câpres, 1 bouquet de persil plat.", "method": "Prendre des petits plats individuels allant au four. Tapisser le fond de sauce tomate chaude mélangée hors du feu avec le beurre d'anchois. Casser les œufs directement sur le lit de tomate sans crever les jaunes. Cuire au four à 180°C pendant 5 à 6 minutes jusqu'à ce que le blanc soit pris mais le jaune liquide. À la sortie du four, parsemer les œufs de câpres fines et d'un hachis de persil plat frais avant de servir directement.", "key": "ufs sur le plat a la monegasque", "histoire": "Une façon typiquement méridionale de revisiter les œufs au miroir du matin. Au lieu de les cuire simplement au beurre, votre grand-père tapissait le plat en terre d'un lit de sauce tomate richement liée hors du feu avec du beurre d'anchois. Les œufs cuisaient doucement au four sur ce tapis rouge, offrant un goût puissant et relevé par les câpres à la sortie du four.", "resume": "Œufs cuits au miroir au four dans des plats en terre, sur un lit de sauce tomate de pays préalablement montée et liée hors du feu avec du beurre d'anchois ; parsemés de câpres et de persil plat haché.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 39, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 12, "name": "Omelette Monte-Carlo", "portions": "2 personnes", "ingredients": "6 œufs frais, 20g de truffe noire, 50g de champignons de Paris, 5cl de crème liquide, 40g de beurre fin, 6 pointes d'asperges vertes cuites.", "method": "Hacher finement les champignons et les faire suer au beurre. Ajouter la crème fraîche et les deux tiers de la truffe hachée menu. Réduire pour faire une duxelles truffée liée. Battre les œufs à la fourchette avec du sel. Fondre le beurre dans une poêle bien chaude, verser les œufs et remuer pour créer une texture baveuse. Mettre la duxelles au centre et rouler l'omelette en forme de fuseau. Glisser sur le plat, lustrer de beurre fondu, décorer des pointes d'asperges chaudes et du reste de truffe en rondelles.", "key": "omelette monte carlo", "histoire": "L'omelette de palace par excellence. Les chefs de Monte-Carlo rivalisaient d'adresse pour rouler cette omelette en forme de fuseau parfait, \"lustrée\" au pinceau avec du beurre fondu pour la faire briller sous les lustres des salles à manger. Son cœur baveux dissimulait une duxelles de champignons truffée à la crème, et elle était élégamment bordée de pointes d'asperges vertes.", "resume": "Omelette baveuse cuite au beurre fin, fourrée en son centre d'une duxelles de champignons de couche et de truffes noires liée à la crème fraîche ; roulée en fuseau, lustrée au beurre fondu et bordée de pointes d'asperges.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 2, "id": 40, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 13, "name": "Petites Bouchées à la Monégasque", "portions": "6 personnes", "ingredients": "18 bouchées feuilletées (mini vol-au-vent), 200g de thon blanc à l'huile égoutté, 4 cœurs d'artichauts cuits, 100g de champignons de Paris, 30g de beurre, 30g de farine, 30cl de fumet de poisson, 1 cuillère à soupe de concentré de tomate, 5cl de crème liquide, 1 filet de jus de citron, sel, poivre blanc, persil plat.", "method": "Réchauffer les bouchées feuilletées au four doux à 150°C et retirer délicatement les chapeaux. Tailler les cœurs d'artichauts et les champignons en petits dés réguliers (salpicon). Faire suer les champignons au beurre jusqu'à évaporation complète de leur eau, puis ajouter les artichauts. Préparer le velouté : fondre le beurre, ajouter la farine et cuire ce roux 2 minutes sans coloration. Mouiller peu à peu avec le fumet de poisson chaud en fouettant, et laisser épaissir 5 minutes à feu doux. Incorporer le concentré de tomate pour teinter la sauce d'un rose franc, puis la crème. Émietter le thon blanc à la fourchette, le mêler au salpicon, et lier le tout avec le velouté rose bien chaud. Rectifier avec un filet de jus de citron, du sel et du poivre blanc. Garnir les bouchées à ras bord, replacer les chapeaux et parsemer de persil haché. Servir aussitôt, très chaud.", "method_note": "Méthode reconstituée d'après la description du manuscrit : salpicon chaud de thon blanc, cœurs d'artichauts et champignons, lié d'un velouté de poisson teinté au concentré de tomate.", "key": "petites bouchees a la monegasque", "histoire": "Ces mini-vol-au-vent feuilletés faisaient fureur lors des thés dansants et des réceptions mondaines à Monaco. La garniture de thon blanc à l'huile et de cœurs d'artichauts, liée par une sauce veloutée rose, offrait une alternative maritime aux traditionnelles bouchées à la reine faites de volaille. Un grand classique des cocktails de la Riviera.", "resume": "Mini-vol-au-vent feuilletés, garnis d'un salpicon chaud de thon blanc à l'huile, de cœurs d'artichauts et de champignons liés par une sauce veloutée de poisson teintée de rose au concentré de tomate.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 6, "id": 41, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 1, "name": "Alose à la Monégasque", "portions": "4 personnes", "ingredients": "1 alose de 1,2 kg, 1 gros bouquet de fenouil sauvage séché, 10cl d'huile d'olive, 2 citrons, 6 filets d'anchois au sel, 2 cuillères à soupe de câpres.", "method": "Vider et écailler l'alose, faire des incisions sur les flancs, saler et poivrer. Étaler le fenouil séché au fond d'un grand plat à rôtir et poser le poisson dessus. Arroser d'un filet d'huile d'olive et cuire au four à 190°C pendant 20 à 25 minutes. Rincer et hacher les anchois et les câpres. Chauffer le reste d'huile d'olive, y faire fondre les anchois à la fourchette, ajouter les câpres et le jus des citrons. Lever les filets du poisson cuit et les napper de cette sauce tiède.", "key": "alose a la monegasque", "histoire": "L'alose est un poisson migrateur que les pêcheurs monégasques attrapaient au printemps lorsqu'il longeait les côtes de la Riviera. Comme sa chair possède de nombreuses petites arêtes, la cuisson d'époque sur un lit épais de fenouil sauvage séché permettait non seulement de parfumer la chair par fumage, mais aussi d'assouplir les arêtes. La sauce tiède aux anchois et aux câpres venait apporter le relief nécessaire à ce poisson blanc très fin, créant un classique dominical sur le Rocher.", "resume": "Poisson entier entaillé, salé, poivré, cuit au four ou à la braise sur un lit épais de fenouil sauvage séché qui va fumer la chair ; servi en filets nappés d'un beurre chaud fondu aux anchois écrasés, câpres et jus de citron.", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 42, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 2, "name": "Bar à la Monégasque", "portions": "4 personnes", "ingredients": "1 bar de 1,5 kg, 25cl de vin blanc sec, 1 oignon, 1 carotte, 1 bouquet garni, 1 piment doux rouge, 2 tomates, 1 cuillère de câpres, 4 filets d'anchois, 1 jaune d'œuf, 1 cuillère de concentré de tomate, huile d'olive, vinaigre.", "method": "Faire un court-bouillon avec le vin blanc, l'eau, l'oignon, la carotte et le bouquet garni. Y pocher le bar entier pendant 18 minutes. Lever les filets nets et laisser tiédir. Monder les tomates et le piment doux, les couper en petits dés. Hacher les anchois et les câpres. Faire une mayonnaise avec le jaune d'œuf, le vinaigre et l'huile d'olive, ajouter le concentré de tomate pour la teinter en rose. Incorporer les dés de légumes, d'anchois et de câpres à la mayonnaise et en napper le poisson.", "key": "bar a la monegasque", "histoire": "Le bar de ligne (ou loup de mer) est le seigneur de la mer azuréenne. Pour les grands déjeuners d’été, votre grand-père aimait servir ce poisson poché, puis refroidi à cœur. Toute l'originalité résidait dans sa sauce : une mayonnaise maison colorée en rose tendre par une pointe de tomate fraîche, et relevée par le croquant du piment doux rouge et le sel des anchois. Une entrée marine d'une fraîcheur absolue sous le soleil de la Principauté.", "resume": "Bar de ligne poché entier au court-bouillon (vin blanc, légumes, aromates) ; les filets nets refroidis sont nappés d'une mayonnaise rose (concentré de tomate) enrichie d'une fine brunoise de tomates, piments doux, anchois et câpres.", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 43, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 3, "name": "Bouillabaisse à la Monégasque", "portions": "4 personnes", "ingredients": "2 kg de poissons de roche assortis, 4 langoustines, 4 pommes de terre, 2 tomates, 1 oignon, 3 gousses d'ail, 1 dosette de safran, 10cl d'huile d'olive, 1 branche de fenouil.", "method": "Faire suer l'oignon et deux gousses d'ail émincés dans l'huile d'olive. Ajouter les tomates concassées, le fenouil et les petits poissons de roche. Saisir 5 minutes, mouiller avec 2 litres d'eau bouillante, ajouter le safran et cuire 20 minutes avant de passer au moulin à légumes. Remettre le bouillon filtré sur le feu avec les pommes de terre en tranches épaisses pendant 10 minutes. Ajouter les poissons nobles en tronçons et les langoustines, pocher 8 minutes à vive ébullition. Piler la dernière gousse d'ail avec les foies de rougets réservés, lier avec une louche de bouillon chaud et reverser dans le faitout pour épaissir la soupe.", "key": "bouillabaisse a la monegasque", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "infos": [{"fact": "Jusqu'au XIXe siècle, la bouillabaisse était un plat de pêcheurs marseillais anti-gaspillage : on y cuisinait les poissons de roche abîmés, trop petits ou invendables au marché (rascasse, grondin, congre, saint-pierre…).", "source_url": "https://generationvoyage.fr/bouillabaisse-marseille/", "source_name": "generationvoyage.fr"}], "id": 44, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 4, "name": "Boulettes de Poisson à la Monégasque", "portions": "4 personnes", "ingredients": "400g de chair de dorade, 1 gousse d'ail, 1 bouquet de persil, 1 œuf, 50g de mie de pain, 5cl de lait, farine, huile d'olive. Sauce : 1 jaune d'œuf, 1 cuillère de moutarde, 15cl d'huile d'olive, 4 filets d'anchois, 1 cuillère de câpres.", "method": "Tremper la mie dans le lait. Hacher finement le poisson, l'ail et le persil. Mélanger le tout avec la mie essorée, l'œuf entier, du sel et du poivre. Façonner des boulettes de la taille d'une noix, les rouler dans la farine et les pocher 6 à 8 minutes dans de l'eau salée frémissante. Laisser refroidir. Faire une mayonnaise avec le jaune, la moutarde et l'huile d'olive. Piler les anchois et les câpres au mortier pour faire une pâte fine et l'ajouter à la mayonnaise. Napper les boulettes froides de cette sauce.", "key": "boulettes de poisson a la monegasque", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 45, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 5, "name": "Canard Sauvage Monte-Carlo", "portions": "4 personnes", "ingredients": "2 canards sauvages, 100g de purée d'oranges amères, 15cl de jus de canard corsé, 10cl de porto rouge, 2 oranges bigarades (zestes).", "method": "Rôtir les canards sauvages au four à 200°C pour que la chair reste saignante ou rosée. Lever les aiguillettes (filets). Blanchir les zestes des oranges amères dans l'eau bouillante pendant 5 minutes, puis les couper en fine julienne. Dans une casserole, mélanger le jus de canard, le porto rouge et les zestes blanchis, faire réduire de moitié. Étaler un lit de purée d'oranges amères chaudes au fond du plat, disposer les aiguillettes de canard par-dessus et napper avec la sauce réduite au porto et aux zestes.", "key": "canard sauvage monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 46, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 6, "name": "Caneton à la Monégasque", "portions": "4 personnes", "ingredients": "1 gros caneton, jus de carcasse, 10cl de porto, 1 cuillère à café de purée de tomates, 80g d'olives de Nice dénoyautées.", "method": "Rôtir le caneton au four pour qu'il reste saignant. Lever les aiguillettes. Presser la carcasse pour en extraire tous les sucs de viande. Dans une petite casserole, mélanger ce jus de carcasse avec le porto et la purée de tomates, puis faire réduire doucement pour obtenir une sauce onctueuse. Blanchir les olives de Nice dans de l'eau bouillante pendant 2 minutes pour enlever l'excès de sel, puis les ajouter à la sauce. Dresser les aiguillettes de caneton sur un plat chaud et les napper généreusement de cette sauce aux olives.", "key": "caneton a la monegasque", "histoire": "Pour ce grand classique des tables bourgeoises de la Principauté, le caneton était rôti saignant. Les aiguillettes étaient découpées en salle par le maître d'hôtel. La sauce était une merveille locale : un jus réalisé à partir de la carcasse pressée, réduit au porto rouge et enrichi d'un coulis de tomates serré et de petites olives de Nice blanchies pour apporter de l'amertume et du sel.", "resume": "Caneton rôti au four (chair rose), aiguillettes levées ; servies avec une réduction de jus de carcasse pressée au porto, une pointe de purée de tomates et des olives de Nice dénoyautées préalablement blanchies 2 minutes.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 47, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 7, "name": "Caneton au Sang Monte-Carlo", "portions": "4 personnes", "ingredients": "1 gros caneton de Rouen, 15cl de Porto rouge, 2 mandarines locales (jus), 40g de beurre de truffe noire.", "method": "Rôtir le caneton au four pendant 20 minutes (il doit rester très saignant). Lever les filets et les cuisses. Passer la carcasse à la presse à canard pour en extraire le sang et les sucs. Dans une casserole en argent ou en cuivre, faire réduire le Porto rouge avec le jus de mandarine de moitié. Hors du feu, ajouter le sang récupéré de la carcasse en fouettant doucement pour épaissir la sauce sans la faire bouillir (liaison au sang). Incorporer le beurre de truffe noire en morceaux pour faire briller la sauce. Napper les filets de caneton chauds avec cette préparation royale.", "key": "caneton au sang monte carlo", "histoire": "Inspiré de la célèbre recette du \"Caneton à la presse\" de la Tour d'Argent à Paris, ce plat a été adapté à Monte-Carlo pour la clientèle des tirs au pigeon et du Casino. La sauce, hautement technique, était liée au sang de la carcasse extrait sous les yeux des clients grâce à une presse en argent. Votre grand-père y ajoutait du jus de mandarine locale pour apporter une note d'agrumes acidulée, et liait le tout au beurre de truffe noire.", "resume": "Caneton rôti 20 minutes (très saignant), carcasse passée à la presse pour en extraire le sang et les sucs ; jus réduit de moitié au Porto et jus de mandarine, lié hors du feu au sang (sauce épaissie) et monté au beurre de truffe.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 48, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 8, "name": "Chateaubriand à la Monégasque", "portions": "4 personnes", "ingredients": "1 belle pièce de cœur de filet de bœuf de 800g (Chateaubriand), 4 grandes tranches de pain de mie, 50g de beurre fin, 50g de beurre d'anchois, 12 tomates cerises, un filet d'huile d'olive.", "method": "Ficeler le Chateaubriand et le faire griller à la poêle ou au barbecue selon la cuisson désirée (idéalement saignant). Faire frire les tranches de pain de mie au beurre dans une poêle pour obtenir de grands croûtons dorés. Faire confire les tomates cerises entières au four avec un filet d'huile d'olive pendant 10 minutes. Dresser le Chateaubriand sur les croûtons frits. Déposer un gros morceau de beurre d'anchois sur la viande chaude pour qu'il fonde délicatement, et entourer le plat avec les tomates cerises confites.", "key": "chateaubriand a la monegasque", "histoire": "Le Chateaubriand (la pièce la plus épaisse et la plus tendre du filet de bœuf) était le plat préféré des riches hivernants britanniques. Pour lui donner son caractère méridional, votre grand-père le dressait sur un grand canapé de pain de mie doré au beurre fin, puis déposait au sommet un disque de beurre d'anchois frais. En fondant sur la viande saignante, ce beurre salé créait un contraste terre-mer extraordinaire, rehaussé par des tomates cerises confites au four.", "resume": "Épaisse pièce de filet de bœuf grillée (saignante), dressée sur de grands croûtons de pain de mie frits au beurre fin ; surmontée d'un gros morceau de beurre d'anchois fondant et entourée de tomates cerises confites au four.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 49, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 9, "name": "Chateaubriand Monte-Carlo", "portions": "4 personnes", "ingredients": "1 pièce de cœur de filet de bœuf de 800g, 50g de beurre de truffe noire, 400g de pommes de terre.", "method": "Faire griller le Chateaubriand à feu vif pour marquer la viande, puis terminer la cuisson doucement au beurre pour qu'il reste saignant. À l'aide d'une cuillère parisienne, couper les pommes de terre en petites billes régulières (taille d'une noisette) et les faire rissoler doucement à la poêle dans du beurre clarifié jusqu'à ce qu'elles soient bien dorées (pommes parisiennes). Dresser la viande sur un plat chaud, l'accompagner des petites pommes parisiennes croustillantes et déposer le beurre de truffe sur la viande au moment de servir.", "key": "chateaubriand monte carlo", "histoire": "C’était le plat de résistance par excellence des soupers fins servis après les soirées de gala au Casino. Cette pièce de bœuf magistrale exigeait une cuisson parfaite, d'abord marquée à feu vif à la poêle pour emprisonner les sucs, puis rôtie doucement au beurre. Escorté de petites pommes de terre parisiennes méticuleusement tournées en billes et rissolées, ce plat était couronné d'un généreux morceau de beurre de truffe noire qui parfumait toute la salle.", "resume": "Filet de bœuf saisi à feu vif puis terminé doucement au beurre (saignant) ; dressé chaud sur le plat de service, escorté de petites billes de pommes de terre rissolées au beurre (pommes parisiennes) et de beurre de truffe noire.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 50, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 10, "name": "Daurade braisée à la Monégasque", "portions": "4 personnes", "ingredients": "1 daurade royale de 1,2 kg, 1 branche de fenouil sauvage, 1 citron, 2 oignons, 3 tomates, 2 gousses d'ail, 50g d'olives de Nice, 10cl de vin blanc, 10cl d'huile d'olive.", "method": "Vider et écailler la daurade, saler, poivrer et glisser le fenouil et deux rondelles de citron à l'intérieur. Étaler les oignons émincés et l'ail écrasé dans un grand plat en terre, poser le poisson dessus. Mouiller avec le vin blanc et la moitié de l'huile d'olive, cuire au four à 180°C. Après 10 minutes, ajouter les tomates mondées concassées, les olives de Nice et le reste d'huile d'olive. Arroser souvent le poisson avec son jus pendant encore 15 minutes.", "key": "daurade braisee a la monegasque", "histoire": "La daurade royale est le poisson noble par excellence du terroir méridional. Les ménagères monégasques la préparaient à l'étouffée au four dans de grands plats en terre cuite. Le poisson cuisait lentement au milieu des tomates gorgées de soleil, des oignons doux et des petites olives noires de Nice. Le jus du poisson et le vin blanc se mêlaient à l'huile d'olive pour former une sauce courte et sirupeuse que l'on sauçait avec du pain frais.", "resume": "Poisson entier farci de fenouil et de citron, cuit au four dans un plat en terre sur un lit d'oignons émincés et d'ail ; mouillé de vin blanc et d'huile d'olive, entouré à mi-cuisson de tomates concassées et d'olives de Nice.", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 51, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 11, "name": "Écrevisses Monte-Carlo", "portions": "4 personnes", "ingredients": "16 écrevisses vivantes, 1 carotte, 1 oignon, 40g de beurre, 5cl de vieux Cognac, 15cl de crème liquide entière, 1 petite truffe noire, 10cl de vin blanc sec.", "method": "Châtrer les écrevisses. Couper la carotte et l'oignon en dés minuscules (mirepoix) et les faire suer au beurre dans une sauteuse. Ajouter les écrevisses et remuer à feu vif jusqu'à ce qu'elles deviennent rouges. Flamber au Cognac chaud. Mouiller au vin blanc sec et cuire à couvert 6 minutes. Retirer les écrevisses et décortiquer les queues. Filtrer le jus de cuisson, ajouter la crème liquide et l'essence de la truffe noire râpée, réduire jusqu'à ce que la sauce soit onctueuse. Réchauffer les queues dedans une minute.", "key": "ecrevisses monte carlo", "histoire": "Bien que Monaco soit un port de mer, les écrevisses d'eau douce (souvent acheminées par train depuis les rivières de l'arrière-pays ou de Lyon) étaient un produit de grand luxe fort recherché dans les palaces de Monte-Carlo. Pour ce plat de gala, les crustacés étaient flambés au vieux Cognac devant les clients, puis nappés d'une réduction de crème double et d'une essence de truffe noire. Le summum du chic de la Belle Époque.", "resume": "Écrevisses jetées vivantes sur une mirepoix minuscule de carotte et oignon suée au beurre, flambées au Cognac, mouillées au vin blanc ; les queues décortiquées sont servies dans le jus réduit lié à la crème et truffe noire râpée.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 52, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 12, "name": "Filet de Bœuf à la Monégasque", "portions": "4 personnes", "ingredients": "1 rôti de filet de bœuf de 800g, 20cl de jus de viande lié, 4 petites tomates, 100g de champignons de Paris, 4 cœurs d'artichauts, 400g de pommes de terre, huile d'olive, beurre.", "method": "Faire rôtir le filet de bœuf au four à 200°C pour qu'il reste saignant. Préparer l'accompagnement : évider les petites tomates et les farcir avec les champignons hachés et cuits au beurre (duxelles). Étuvé les cœurs d'artichauts au beurre et faire rissoler les pommes de terre à la poêle. Dresser le rôti de bœuf sur un grand plat, entourer avec les tomates farcies, les artichauts et les pommes de terre rissolées, et servir le jus de viande chaud à part.", "key": "filet de b uf a la monegasque", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 53, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 4, "tome_title": "La Marée, les Viandes Nobles, Volailles, Gibiers & Sauces", "icon": "🍖", "num": 13, "name": "Filet de Bœuf à la Monte-Carlo", "portions": "4 personnes", "ingredients": "1 rôti de filet de bœuf de 800g, 50g de beurre de truffe noire, 400g de pommes de terre, 100g de champignons de Paris, 20cl de jus de viande lié, 40g de beurre clarifié, huile d'olive, sel, poivre du moulin.", "method": "Sortir le filet une heure avant de le cuire et l'assaisonner généreusement de sel et de poivre du moulin. Le saisir à feu vif sur toutes ses faces dans un filet d'huile d'olive, afin d'emprisonner les sucs. Terminer la cuisson au four à 200°C en arrosant régulièrement, de façon à garder la viande bien saignante à cœur. À l'aide d'une cuillère parisienne, tailler les pommes de terre en billes régulières de la taille d'une noisette. Les faire rissoler doucement au beurre clarifié jusqu'à ce qu'elles soient dorées et croustillantes (pommes parisiennes). Faire sauter à part les champignons émincés au beurre. Laisser reposer le rôti 10 minutes sous une feuille d'aluminium avant de le trancher. Dresser les tranches de filet sur un plat chaud et les entourer des pommes parisiennes et des champignons. Déposer sur la viande le beurre de truffe noire en fines lamelles au moment de servir, pour qu'il fonde et parfume le plat. Servir le jus de viande bien chaud à part.", "method_note": "Le manuscrit ne portait que le titre. Recette reconstituée d'après le Filet de Bœuf à la Monégasque et la garniture Monte-Carlo (pommes parisiennes et beurre de truffe noire) du Chateaubriand Monte-Carlo, deux recettes sœurs du même répertoire.", "key": "filet de b uf a la monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 54, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 1, "name": "La Pissaladière Monégasque (La Pissaladiera)", "portions": "4 personnes", "ingredients": "250g de pâte à pain fine, 4 gros oignons doux, 4 cuillères à soupe d'huile d'olive, 3 belles tomates bien mûres, 8 filets d'anchois au sel, 12 petites olives noires de Nice, 1 pincée de sucre, sel, poivre.", "method": "Émincer les oignons très finement. Les faire confire doucement à la poêle avec l'huile d'olive, le sel et le sucre pendant 30 minutes à couvert sans les laisser dorer. Pendant ce temps, monder, épépiner et concasser les tomates, puis les ajouter aux oignons. Laisser mijoter encore 15 minutes pour que l'eau des tomates s'évapore et s'intègre à la fondue d'oignons. Étaler la pâte très finement sur une plaque huilée. Répartir ce mélange d'oignons et de tomates sur toute la surface. Disposer les anchois rincés en croisillons et ajouter les olives noires de Nice. Enfournez à 220°C pendant 15 minutes jusqu'à ce que la pâte soit bien croustillante.", "key": "la pissaladiere monegasque la pissaladiera", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "infos": [{"fact": "La pissaladière tire son nom du pissalat, du niçois « peis salat » (« poisson salé ») : une pâte d'anchois fermentée qui garnit traditionnellement cette galette d'oignons confits et d'olives noires.", "source_url": "https://www.jours-de-marche.fr/specialites/pissaladiere.html", "source_name": "jours-de-marche.fr"}], "id": 55, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}, "dialectes": [{"lang": "niçard", "name": "Pissaladiera", "fr": "pâte à pain garnie d'oignons fondus, de pissalat ou anchois et de petites olives noires de Nice", "url": "https://www.france.fr/en/article/monaco-food-and-drinks-specialties/", "quote": "A speciality made from bread dough, onions, pissalat or anchovies, tomatoes, olive oil and small black olives from Nice."}]}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 2, "name": "Les Raviolis de Blettes à la Monégasque", "portions": "4 personnes", "ingredients": "300g de pâte fraîche aux œufs. Farce : 200g de vert de blettes, 100g de brousse de chèvre (ou ricotta), 1 œuf, 30g de parmesan râpé, 1 cuillère à café de marjolaine séchée. Sauce : 30cl de coulis de tomates fraîches, 1 gousse d'ail, 2 cuillères d'huile d'olive.", "method": "Laver et hacher finement le vert des blettes. Les faire suer à sec dans une poêle pendant 5 minutes, puis les presser fortement dans un linge pour éliminer toute l'eau. Dans un bol, mélanger les blettes essorées, la brousse, le parmesan, l'œuf entier et la marjolaine. Saler et poivrer. Étaler la pâte fraîche très finement. Déposer de petits tas de farce, recouvrir d'une autre bande de pâte, chasser l'air avec les doigts et découper de gros raviolis carrés. Faire pocher dans de l'eau bouillante salée pendant 4 minutes. Pendant ce temps, chauffer le coulis de tomates avec l'huile d'olive et l'ail écrasé. Égoutter les raviolis et les napper de cette sauce tomate simple avant de servir.", "key": "les raviolis de blettes a la monegasque", "cat": "Spécialités du Terroir", "cat_icon": "🌿", "base": 4, "infos": [{"fact": "À Nice, la farce des raviolis (li raiolà) est traditionnellement composée de daube de bœuf et de vert de blettes finement haché — ce qui justifie l'appellation « raviolis à la niçoise ». Le plat est attesté dans la région dès le XVIe siècle.", "source_url": "https://variations-gourmandes.blogspot.com/2018/06/les-raviolis-nicois.html", "source_name": "variations-gourmandes"}], "id": 56, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 3, "name": "Les Petits Farcis du Rocher", "portions": "4 personnes", "ingredients": "4 mini-courgettes rondes, 4 petits oignons, 4 mini-aubergines. Farce : la chair évidée des légumes, 1 tranche de mie de pain rassise, 5cl de lait, 40g de parmesan, 1 gousse d'ail, 1 bouquet de basilic frais, 150g de restes de pot-au-feu hachés, 1 œuf, huile d'olive.", "method": "Laver les légumes. Couper les chapeaux, évider délicatement l'intérieur à l'aide d'une petite cuillère et réserver la chair. Faire blanchir les coques de légumes vides 3 minutes à l'eau bouillante, puis les refroidir. Hacher finement la chair des légumes extraite et la faire sauter à la poêle avec un filet d'huile d'olive et l'ail écrasé. Dans un saladier, mélanger cette chair cuite, la mie de pain trempée dans le lait et essorée, la viande de pot-au-feu hachée, le parmesan, le basilic ciselé et l'œuf entier. Remplir les légumes avec cette farce parfumée, replacer les chapeaux, arroser d'un filet d'huile d'olive et cuire au four à 180°C pendant 35 minutes.", "key": "les petits farcis du rocher", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "infos": [{"fact": "Les petits farcis niçois (légumes évidés puis garnis) étaient à l'origine une façon astucieuse d'utiliser les restes de viande braisée, de rôti ou de pot-au-feu avant de devenir un plat à part entière.", "source_url": "https://www.jours-de-marche.fr/specialites/petits-farcis-nicois.html", "source_name": "jours-de-marche.fr"}], "id": 57, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 4, "name": "Le Ragoût de Seiche à la Monégasque (Sepia en toupin)", "portions": "4 personnes", "ingredients": "800g de petites seiches nettoyées, 4 cuillères à soupe d'huile d'olive, 3 échalotes, 10cl de vin blanc sec, 20cl de coulis de tomates fraîches, 2 gousses d'ail, 1 branche de sarriette, sel, poivre.", "method": "Couper les corps des seiches nettoyées en larges lanières et laisser les tentacules entières. Dans une cocotte en terre cuite (u toupin) ou un faitout, faire chauffer l'huile d'olive et y faire suer les échalotes émincées. Ajouter les morceaux de seiche et les faire sauter à feu vif pendant 5 minutes pour qu'ils raffermissent. Mouiller avec le vin blanc sec et laisser réduire de moitié. Ajouter le coulis de tomates fraîches, les gousses d'ail écrasées et la branche de sarriette. Couvrir hermétiquement la cocotte et laisser mijoter à feu très doux pendant 1 heure jusqu'à ce que la seiche soit extrêmement tendre et la sauce bien courte.", "key": "le ragout de seiche a la monegasque sepia en toupin", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "infos": [{"fact": "L'encre de seiche parfume et teinte en noir profond les préparations méditerranéennes. Historiquement, la seiche faisait partie des produits « modestes » que les pêcheurs gardaient, les poissons nobles partant à la criée.", "source_url": "https://www.saporissimo.fr/articles/histoire-de-l-encre-de-seiche-en-cuisine-pa177/", "source_name": "saporissimo.fr"}], "id": 58, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 5, "name": "Langouste Soufflée à la Monte-Carlo", "portions": "4 personnes", "ingredients": "1 belle langouste vivante d'environ 1 kg, 150g de blancs de brochet crus, 2 blancs d'œufs, 20cl de crème liquide entière très froide, 1 petite truffe noire coupée en dés, salt, poivre.", "method": "Fendre la langouste en deux dans le sens de la longueur. Retirer délicatement la chair crue de la queue en veillant à garder les carapaces intactes. Passer la chair de langouste crue et les blancs de brochet au mixeur pour obtenir une pâte fine. Ajouter les blancs d'œufs, du sel et du poivre, puis passer le tout à travers un tamis fin. Placer ce mélange dans un bol posé sur un lit de glace et incorporer la crème liquide très froide petit à petit en mélangeant à la spatule pour obtenir une mousseline onctueuse. Ajouter les dés de truffe noire. Garnir les carapaces vides avec cette farce mousseline en lissant le dessus. Cuire au four au bain-marie à 170°C pendant 18 à 20 minutes : la farce va gonfler comme un soufflé à l'intérieur de la carapace. Servir immédiatement.", "key": "langouste soufflee a la monte carlo", "resume": "Carapaces évidées de leur chair crue ; celle-ci est mixée avec des blancs de brochet, blancs d'œufs et crème sur glace pour faire une mousseline fine truffée ; la farce remise dans les carapaces est soufflée au four au bain-marie.", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 59, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 6, "name": "Noisettes de Chevreuil à la Monte-Carlo", "portions": "4 personnes", "ingredients": "8 noisettes de filet de chevreuil, 40g de beurre fin, 4 croûtons de pain de mie frits, 2 pêches de pays, 100g de gelée de groseilles rouges, 15cl de sauce Poivrade corsée, 5cl de crème liquide.", "method": "Saisir les noisettes de chevreuil à la poêle dans le beurre chaud pour qu'elles restent bien saignantes. Les réserver au chaud. Déposer les noisettes sur les croûtons de pain frits disposés sur le plat de service. Pocher les moitiés de pêches dans un sirop léger, les égoutter et remplir le centre de chaque demi-fruit avec une bonne cuillère de gelée de groseilles rouges. Ajouter la crème liquide à la sauce Poivrade chaude pour l'adoucir légèrement. Disposer les demi-pêches à la groseille tout autour de la viande et napper le chevreuil avec la sauce Poivrade onctueuse.", "key": "noisettes de chevreuil a la monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 60, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 7, "name": "Noisettes de Sanglier Monte-Carlo", "portions": "4 personnes", "ingredients": "8 noisettes de jeune sanglier, marinade au vin rouge et herbes, 40g de beurre clarifié, 20cl de sauce Grand Veneur, 2 poires, 80g d'airelles au sirop.", "method": "Sortir les noisettes de sanglier de leur marinade et les sécher soigneusement. Les faire sauter à la poêle dans le beurre clarifié bien chaud pendant 3 minutes de chaque côté pour qu'elles restent juteuses. Éplucher les poires, les couper en deux et les faire pocher dans un sirop léger jusqu'à ce qu'elles soient tendres. Les égoutter et remplir le creux central de chaque demi-poire avec les airelles au sirop. Dresser la viande sur un plat chaud, la napper avec la sauce Grand Veneur noire et brillante, et escorter le tout avec les demi-poires aux airelles.", "key": "noisettes de sanglier monte carlo", "histoire": "Le sanglier noir des montagnes azuréennes était préparé ici selon les règles les plus strictes de la Haute Gastronomie. Après une longue marinade aux aromates et au vin rouge, les noisettes étaient saisies au beurre clarifié pour rester juteuses. La sauce Grand Veneur, d'un noir brillant, était traditionnellement liée au sang. Le contraste sucré apporté par des demi-poires pochées remplies d'airelles au sirop complétait ce grand plat de gibier.", "resume": "Médaillons de jeune sanglier marinés sautés au beurre clarifié (saignants) ; nappés d'une sauce Grand Veneur noire et brillante liée au sang frais hors du feu, escortés de demi-poires pochées remplies d'airelles au sirop.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 61, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 8, "name": "Les Oreillettes Monégasques (De ganses)", "portions": "pour un grand plat", "ingredients": "250g de farine de blé, 50g de sucre, 50g de beurre mou, 2 œufs, 2 cuillères à soupe d'eau de fleur d'oranger, 1 pincée de sel, huile de friture, sucre glace.", "method": "Dans un saladier, mélanger la farine, le sucre et le sel. Ajouter les œufs entiers, le beurre mou et la fleur d'oranger. Pétrir énergiquement jusqu'à obtenir une pâte lisse et ferme. Envelopper dans un linge et laisser reposer 1 heure. Séparer la pâte en morceaux et l'étaler au rouleau le plus finement possible (comme une feuille de papier). À l'aide d'une roulette dentelée, couper des bandes de 3 cm de large et 10 cm de long, puis faire une fente au centre pour y passer une extrémité et former un nœud (ganse). Plonger les oreillettes dans un bain de friture bien chaud : elles doivent gonfler et dorer en quelques secondes. Les égoutter sur du papier absorbant et les poudrer généreusement de sucre glace.", "key": "les oreillettes monegasques de ganses", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "infos": [{"fact": "Les oreillettes sont des beignets à pâte fine et croustillante (Languedoc, Provence, Rouergue). Douceur de carnaval à l'origine, elles figurent aussi parmi les treize desserts du réveillon de Noël.", "source_url": "https://culture-crunch.com/2022/02/28/oreillettes-beignets-de-provence/", "source_name": "culture-crunch.com"}], "id": 62, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}, "dialectes": [{"lang": "niçard", "name": "Li gansa nissardi", "fr": "ganses : beignets de carnaval en forme de nœud (du niçois « gansa »)", "url": "https://www.ptitchef.com/recettes/dessert/les-ganses-du-carnaval-de-nice--li-gansa-nissardi-fid-1544489", "quote": "Les ganses du carnaval de nice – li gansa nissardi"}]}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 9, "name": "Le Panettone de Saint-Nicolas (U Panetùn)", "portions": "1 gros gâteau", "ingredients": "500g de farine, 1 sachet de levure de boulanger, 120g de beurre, 100g de sucre, 3 œufs, 10cl de lait tiède, 80g de raisins secs, 40g d'amandes, 40g de pignons de pin, 80g de zestes de citrons et d'oranges amères confits en dés.", "method": "Délayer la levure dans le lait tiède avec une cuillère de sucre. Mélanger la farine, le reste du sucre et une pincée de sel. Incorporez les œufs battus, le beurre fondu et le lait avec la levure. Pétrir longuement jusqu'à ce que la pâte se détache des parois. Laisser lever 2 heures sous un linge. Incorporer ensuite à la pâte les raisins secs, les pignons, les amandes concassées et les dés de fruits confits de la Riviera. Déposer la pâte dans un moule à bords très hauts et laisser lever à nouveau 1 heure. Enfourner à 170°C pendant 45 à 50 minutes jusqu'à ce que la brioche soit bien haute et dorée.", "key": "le panettone de saint nicolas u panetun", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 1, "infos": [{"fact": "Originaire de Milan, le panettone trouve ses racines au Moyen Âge, où l'on enrichissait le pain pour célébrer Noël. Une légende attribue sa création à un commis nommé Toni (« pan di Toni ») à la cour des Sforza.", "source_url": "https://easygusto.fr/blogs/easygusto-blog-cuisine-italienne/lhistoire-du-panettone-de-milan-a-votre-table", "source_name": "easygusto.fr"}], "id": 63, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 5, "tome_title": "Les Recettes Retrouvées & Spécialités du Terroir", "icon": "🌿", "num": 10, "name": "Le Soufflé Glacé aux Mandarines de Monte-Carlo", "portions": "4 personnes", "ingredients": "4 jaunes d'œufs, 120g de sucre, 5cl d'eau, le jus et le zeste râpé de 4 mandarines de pays, 3cl de liqueur de mandarine, 25cl de crème liquide entière.", "method": "Cuire l'eau et le sucre à 115°C dans une casserole pour faire un sirop. Battre les jaunes d'œufs au fouet électrique tout en versant le sirop chaud en filet jusqu'à refroidissement complet (appareil à bombe). Incorporer le jus filtré, les zestes râpés des mandarines fraîches et la liqueur de mandarine. Monter la crème liquide entière en chantilly très ferme. L'incorporer délicatement à l'appareil à la mandarine à l'aide d'une maryse. Entourer un moule à soufflé d'une bande de papier sulfurisé qui dépasse du bord de 3 cm. Verser la préparation jusqu'en haut du papier et lisser. Placer au congélateur pendant au moins 5 heures. Retirer délicatement le papier avant de servir pour donner l'illusion d'un soufflé chaud qui a gonflé.", "key": "le souffle glace aux mandarines de monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 64, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 1, "name": "Loup de Mer à la Monégasque (U Luvu)", "portions": "4 personnes", "ingredients": "1 loup de mer (bar) de 1,2 kg, 4 cuillères à soupe d'huile d'olive, 1 branche de sauge, 2 oignons, 4 têtes d'artichauts violets émincées, 50g d'olives de Nice, 10cl de vin blanc, sel, poivre.", "method": "Vider et nettoyer le loup. Saler et poivrer l'intérieur avec la branche de sauge. Dans un grand plat allant au four, faire un lit avec les oignons émincés et les fines tranches d'artichauts violets crus. Poser le poisson par-dessus. Arroser avec l'huile d'olive et le vin blanc. Enfourner à 180°C pendant 25 minutes. À mi-cuisson, parsemer les olives de Nice tout autour et arroser régulièrement le poisson avec le jus du plat pour que la chair reste nacrée et fondante.", "key": "loup de mer a la monegasque u luvu", "histoire": "Le loup de mer (bar) est le roi de la côte rocheuse de la Principauté. Dans les familles monégasques, la tradition dominicale consistait à le cuire au four sur un lit d'oignons doux et surtout d'artichauts violets émincés très fins. Les artichauts confisaient dans le vin blanc et l'huile d'olive en s'imprégnant du jus du poisson, tandis que les olives de Nice apportaient la touche salée finale de ce grand plat familial.", "resume": "Poisson entier farci d'une branche de sauge, cuit au four dans un grand plat sur un lit épais d'oignons émincés et de fines tranches d'artichauts violets crus ; mouillé de vin blanc et d'huile d'olive, olives de Nice à mi-cuisson.", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "infos": [{"fact": "Le bar commun (Dicentrarchus labrax) s'appelle « bar » dans l'Atlantique et « loup » en Méditerranée. Ce nom de « loup » lui vient de sa voracité : il se gave de tout ce qu'il croise (sardines, anchois, crustacés).", "source_url": "https://fr.wikipedia.org/wiki/Loup_(poisson)", "source_name": "Wikipédia"}], "id": 65, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 2, "name": "Le Poulet en Cocotte au Citron de Menton à la Monégasque", "portions": "4 personnes", "ingredients": "1 beau poulet fermier, 4 cuillères à soupe d'huile d'olive, 1 citron de Menton non traité, 10 gousses d'ail en chemise, 1 branche de romarin, 10cl de bouillon de volaille, sel, poivre.", "method": "Couper le citron en quatre. Assaisonner l'intérieur du poulet et y glisser les morceaux de citron et le romarin. Dans une cocotte en fonte, faire chauffer l'huile d'olive et y faire dorer le poulet sur toutes ses faces. Ajouter les gousses d'ail entières avec leur peau (en chemise) tout autour. Mouiller avec le bouillon de volaille. Fermer la cocotte hermétiquement et laisser cuire à feu très doux pendant 50 minutes. Le citron va confire et donner une sauce acidulée unique.", "key": "le poulet en cocotte au citron de menton a la monegasque", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "infos": [{"fact": "Le citron de Menton bénéficie d'une IGP depuis 2015. Sa spécificité ne tient pas aux variétés mais aux conditions pédoclimatiques d'une petite zone microclimatique littorale ; la Fête du Citron attire chaque année plus de 250 000 visiteurs.", "source_url": "https://fr.wikipedia.org/wiki/Citron_de_Menton", "source_name": "Wikipédia"}], "id": 66, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 3, "name": "La Daube de Bœuf à la Monégasque (A Dauba)", "portions": "6 personnes", "ingredients": "1,2 kg de paleron de bœuf, 1 bouteille de vin rouge corsé, 2 oignons, 2 carottes, 2 gousses d'ail, 1 bande de couenne de porc, 50g de cèpes séchés, 1 bande de zeste d'orange séché, huile d'olive.", "method": "La veille, faire mariner le bœuf en morceaux dans le vin rouge avec les oignons et les carottes coupés. Le lendemain, faire tremper les cèpes. Dans une cocotte, tapisser le fond avec la couenne de porc. Faire dorer les morceaux de viande égouttés à l'huile d'olive, puis ajouter les légumes de la marinade et l'ail. Mouiller avec le vin de la marinade filtré. Ajouter les cèpes réhydratés et le zeste d'orange (secret du terroir pour parfumer). Couvrir et laisser mijoter à feu minuscule pendant 4 heures.", "key": "la daube de b uf a la monegasque a dauba", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 6, "infos": [{"fact": "Le mot « daube » vient du provençal « adobar » (« préparer, arranger ») : un ragoût de bœuf mariné au vin et braisé lentement en daubière. La variante niçoise se distingue en y incorporant des cèpes.", "source_url": "https://fr.wikipedia.org/wiki/Daube_proven%C3%A7ale", "source_name": "Wikipédia"}], "id": 67, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 4, "name": "Les Beignets de Sardines à la Monégasque", "portions": "4 personnes", "ingredients": "12 sardines fraîches, 100g de farine, 1 œuf, 10cl de bière blonde, 1 cuillère d'huile d'olive, 1 gousse d'ail, 1 bouquet de persil, huile de friture.", "method": "Ouvrir les sardines en portefeuille par le ventre, retirer l'arête centrale et la tête, puis les laver et les sécher. Hacher l'ail et le persil, et en parsemer l'intérieur des sardines repliées. Faire la pâte à frire : mélanger la farine, le jaune d'œuf, l'huile d'olive et la bière. Laisser reposer 20 minutes, puis incorporer le blanc d'œuf monté en neige. Tremper chaque sardine dans cette pâte et les plonger dans la friture chaude pendant 3 minutes jusqu'à ce qu'elles soient bien croustillantes.", "key": "les beignets de sardines a la monegasque", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 68, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 5, "name": "Tournedos Rossini à la Monte-Carlo", "portions": "4 personnes", "ingredients": "4 tournedos de bœuf, 4 tranches de foie gras frais, 1 truffe noire fraîche, 4 tranches de pain de mie, 50g de beurre, 5cl de Madère, 50g de caviar frais.", "method": "Frire le pain de mie au beurre pour obtenir des croûtons. Saisir les tournedos au beurre (saignants) et les poser sur les croûtons. Poêler rapidement les tranches de foie gras à sec. Déglacer la poêle au Madère avec la truffe hachée menu pour faire la sauce. Poser le foie gras chaud sur le bœuf, napper de sauce au Madère. Pour la touche exclusive \"Monte-Carlo\" des grands banquets, déposer une belle cuillère de caviar frais au sommet du foie gras juste avant de servir.", "key": "tournedos rossini a la monte carlo", "resume": "Filets de bœuf sautés saignants, posés sur croûtons frits, surmontés d'une tranche de foie gras poêlée et nappés de sauce Madère truffée ; couronnés au sommet d'une belle cuillère de caviar frais juste avant l'envoi.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "infos": [{"fact": "Le tournedos Rossini (médaillon de bœuf, foie gras poêlé, lamelles de truffe, sauce Madère) est nommé d'après le compositeur italien Gioachino Rossini (1792-1868), gastronome passionné, pour ou par qui le plat aurait été imaginé.", "source_url": "https://fr.wikipedia.org/wiki/Tournedos_Rossini", "source_name": "Wikipédia"}], "id": 69, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 6, "name": "Filets de Sole à la Crème de Champagne Monte-Carlo", "portions": "4 personnes", "ingredients": "4 beaux filets de sole, 20cl de Champagne brut, 2 échalotes, 15cl de crème fraîche double, 30g de beurre, 1 petite truffe noire, sel, poivre.", "method": "Hacher les échalotes et les faire suer au beurre dans une sauteuse. Y déposer les filets de sole pliés en deux. Mouiller avec le Champagne brut. Cuire à couvert à feu très doux pendant 6 minutes. Retirer les filets délicatement. Faire réduire le Champagne de cuisson de trois quarts, ajouter la crème fraîche double et laisser épaissir. Ajouter la truffe noire coupée en fine julienne. Remettre le poisson une minute dans la sauce pour l'enrober et servir chaud.", "key": "filets de sole a la creme de champagne monte carlo", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 70, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 7, "name": "Ris de Veau Régence Monte-Carlo", "portions": "4 personnes", "ingredients": "300g de ris de veau blanchis, 100g de quenelles de volaille en dés, 50g de crêtes de coq, 1 truffe noire, 20cl de sauce suprême blanche, 4 coques de vol-au-vent feuilletées.", "method": "Couper les ris de veau braisés, les quenelles et la truffe en petits dés réguliers (salpicon). Réchauffer les coques de feuilletage au four. Dans une casserole, mélanger la sauce suprême blanche avec le salpicon et les crêtes de coq. Laissez mijoter 3 minutes pour lier l'ensemble. Remplir généreusement le cœur des vol-au-vent feuilletés bien chauds avec cette garniture de palace et servir immédiatement.", "key": "ris de veau regence monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 71, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 8, "name": "Le Stockfish à la Monégasque des Familles (U Stocafissu)", "portions": "6 personnes", "ingredients": "1 kg de stockfish (morue séchée) trempé pendant 10 jours, 10cl d'huile d'olive, 4 oignons, 4 gousses d'ail, 500g de tomates mûres, 100g d'olives noires de Nice, 1 verre de cognac, 50g de pignons de pin, 1 bouquet de coriandre en grains.", "method": "Couper le stockfish réhydraté en morceaux. Dans une immense marmite en fonte, faire fondre les oignons et l'ail émincés dans l'huile d'olive. Ajouter le poisson et faire revenir 10 minutes. Flamber au cognac. Ajouter les tomates concassées, les olives de Nice, les pignons et la coriandre en grains. Couvrir d'eau à hauteur et laisser mijoter à feu très doux pendant 3 heures sans jamais remuer à la cuillère (secouer la marmite) pour ne pas briser la chair, jusqu'à obtention d'une sauce brune collante.", "key": "le stockfish a la monegasque des familles u stocafissu", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 6, "infos": [{"fact": "Le stocafi, considéré comme un plat national monégasque, est un ragoût de stockfish (morue séchée) mijoté avec tomates, oignons, ail, câpres et olives noires. La consommation de morue séchée, tradition d'origine scandinave, s'est répandue dans toute l'Europe à partir du XIIe siècle.", "source_url": "https://en.gastronomiac.com/lexicon/stocafi-monegasque-cuisine/", "source_name": "gastronomiac.com"}], "id": 72, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}, "dialectes": [{"lang": "munegascu", "name": "Stocafi", "fr": "ragoût de stockfish (morue séchée) réhydraté et mijoté en sauce tomate à l'ail, olives noires et petits légumes", "url": "https://www.gastronomiac.com/lexique_culinaire/stocafi-cuisine-monegasque/", "quote": "Stocafi is a dish of dried cod, stewed in tomato sauce and flavored with black olives and small vegetables."}, {"lang": "niçard", "name": "Estocafic", "fr": "stockfish (poisson séché) mijoté à la niçoise ; le mets se dit aussi estocaficada", "url": "https://fr.wikipedia.org/wiki/Estocafic", "quote": "les résidents anglais à Nice le nommèrent ironiquement « Stockfish » et les Niçois « Estocafic »"}]}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 9, "name": "Les Ganses de la Saint-Jean (Pâtisserie populaire de Monaco)", "portions": "pour un grand plat", "ingredients": "250g de farine, 50g de sucre, 50g de beurre, 2 œufs, 2 cuillères de liqueur de pastis (ou anis), 1 pincée de sel, huile de friture, sucre glace.", "method": "Pétrir tous les ingrédients ensemble pour former une pâte à pain lisse et ferme. Laisser reposer 1 heure sous un linge. Étaler la pâte au rouleau de façon extrêmement fine. Découper des bandes de 2 cm de large avec une roulette dentelée, puis faire un nœud lâche au centre de chaque bande. Plonger les ganses dans de l'huile de friture très chaude pendant 1 minute en les retournant : elles doivent gonfler et devenir croustillantes. Égoutter et poudrer de sucre glace.", "key": "les ganses de la saint jean patisserie populaire de monaco", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "infos": [{"fact": "À Nice, pendant le Carnaval, on prépare les « ganses » : de petites lanières de pâte à la fleur d'oranger, façonnées, frites et saupoudrées de sucre glace ; leur forme rappellerait le foulard du costume traditionnel des hommes du Carnaval.", "source_url": "https://culture-crunch.com/2021/02/17/ganses-de-nice/", "source_name": "culture-crunch.com"}], "id": 73, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 6, "tome_title": "L'Ultime Moisson des Recettes de la Riviera", "icon": "🌾", "num": 10, "name": "La Tarte aux Pignons et Citron de la Condamine", "portions": "6 personnes", "ingredients": "1 pâte brisée. Crème : 3 citrons de pays (jus et zestes râpés), 3 œufs, 100g de sucre, 50g de beurre mou, 60g de pignons de pin.", "method": "Foncer un moule de pâte brisée et piquer le fond. Dans un saladier, fouetter les œufs et le sucre, ajouter le jus et les zestes fins des citrons, puis le beurre mou pour obtenir une crème homogène. Verser cette crème au citron sur le fond de tarte cru. Parsemer généreusement toute la surface avec les pignons de pin sauvages. Enfourner à 180°C pendant 25 à 30 minutes : la crème doit être prise et les pignons joliment dorés et torréfiés. Servir froid.", "key": "la tarte aux pignons et citron de la condamine", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "infos": [{"fact": "Classique provençal, la tarte aux pignons associe une pâte sucrée et une crème d'amande, recouverte de pignons de pin — fruit du pin parasol (Pinus pinea).", "source_url": "https://culture-crunch.com/2021/09/14/tarte-aux-pignons-provencale/", "source_name": "culture-crunch.com"}], "id": 74, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 1, "name": "La Pissaladière Rouge à la Monégasque", "portions": "4 personnes", "ingredients": "250g de pâte à pain, 5 gros oignons doux, 4 cuillères à soupe d'huile d'olive, 150g de sauce tomate de pays (très réduite et mijotée), 10 filets d'anchois au sel, 50g de pissalat (pâte d'anchois et de sardines fermentée), 15 olives noires de Nice, 1 pincée de sucre.", "method": "Émincez les oignons le plus finement possible. Faites-les compoter très doucement à la poêle avec l'huile d'olive et une pincée de sucre pendant 40 minutes, sans aucune coloration. En fin de cuisson, incorporez le pissalat pour le dissoudre dans les oignons. Étalez la pâte à pain finement sur une plaque huilée. Tartinez la pâte d'une couche régulière de sauce tomate réduite, puis étalez la fondue d'oignons par-dessus. Disposez les filets d'anchois rincés en formant les traditionnels croisillons, puis déposez les olives noires de Nice. Laissez lever 15 minutes à température ambiante, puis enfournez à 220°C pendant 12 à 15 minutes jusqu'à ce que la pâte soit croustillante.", "key": "la pissaladiere rouge a la monegasque", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "infos": [{"fact": "La pissaladière tire son nom du pissalat, du niçois « peis salat » (« poisson salé ») : une pâte d'anchois fermentée qui garnit traditionnellement cette galette d'oignons confits et d'olives noires.", "source_url": "https://www.jours-de-marche.fr/specialites/pissaladiere.html", "source_name": "jours-de-marche.fr"}], "id": 75, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 2, "name": "Les Tourtons de Blettes au Brocciu à la Monégasque", "portions": "4 personnes", "ingredients": "250g de farine de blé, 5cl d'huile d'olive, 1 œuf, eau tiède. Farce : 200g de vert de blettes, 150g de brocciu frais (ou brousse de brebis), 1 œuf, 40g de parmesan râpé, une pincée de muscade, huile de friture.", "method": "Préparez la pâte en mélangeant la farine, le sel, l'œuf, l'huile d'olive et assez d'eau tiède pour façonner une boule souple. Laissez reposer 30 minutes. Pour la farce, hachez le vert des blettes et faites-le blanchir 2 minutes à l'eau bouillante. Égouttez-le longuement et pressez-le dans un torchon pour en extraire toute l'eau. Dans un récipient, écrasez le brocciu à la fourchette, ajoutez les blettes, le parmesan, l'œuf entier, le sel, le poivre et la muscade. Étalez la pâte très finement. Déposez de petits tas de farce, repliez la pâte et découpez des carrés ou des ronds à l'emporte-pièce. Plongez les tourtons par petites séries dans l'huile de friture bien chaude (180°C) pendant 2 à 3 minutes jusqu'à ce qu'ils soient bien gonflés et dorés.", "key": "les tourtons de blettes au brocciu a la monegasque", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 76, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 3, "name": "Les Petits Farcis de la Condamine à la Grivoise", "portions": "4 personnes", "ingredients": "4 petites tomates fermes, 4 mini-poivrons, 4 cœurs d'artichauts. Farce : 150g de chair à saucisse locale, 100g de blancs de volaille cuits, la chair des légumes évidés, 1 tranche de pain rassis trempée dans du bouillon, 1 œuf, 1 gousse d'ail hachée, un bouquet de marjolaine sauvage, huile d'olive.", "method": "Évidez délicatement les tomates, les poivrons et les artichauts pré-cuits à blanc. Récupérez la chair extraite et hachez-la. Faites-la sauter à la poêle avec un filet d'huile d'olive et l'ail. Dans un grand récipient, mélangez la chair à saucisse crue, la volaille hachée, le pain rassis bien essoré, la chair des légumes cuite, la marjolaine effeuillée et l'œuf entier. Salez et poivrez généreusement. Remplissez les légumes avec cette farce riche (dite à la grivoise), déposez-les dans un plat de cuisson arrosé d'huile d'olive et enfournez à 180°C pendant 40 minutes en arrosant à mi-cuisson.", "key": "les petits farcis de la condamine a la grivoise", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "infos": [{"fact": "Les petits farcis niçois (légumes évidés puis garnis) étaient à l'origine une façon astucieuse d'utiliser les restes de viande braisée, de rôti ou de pot-au-feu avant de devenir un plat à part entière.", "source_url": "https://www.jours-de-marche.fr/specialites/petits-farcis-nicois.html", "source_name": "jours-de-marche.fr"}], "id": 77, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 4, "name": "Le Ragò de Calamars à l'Huile de Palme et Citronnelle", "portions": "4 personnes", "ingredients": "800g de petits calamars nettoyés, 3 cuillères à soupe d'huile de palme (ou d'huile de coco vierge pour retrouver les saveurs des escales des navigateurs monégasques), 2 bâtons de citronnelle, 1 morceau de gingembre frais, 2 oignons, 15cl de lait de coco, 1 cuillère de concentré de tomates, 1 piment oiseau, sel.", "method": "Taillez les blancs de calamars en anneaux et laissez les tentacules entières. Fendez les bâtons de citronnelle en deux et écrasez-les. Dans une sauteuse, faites chauffer l'huile de palme et faites-y revenir les oignons émincés, le gingembre râpé et le piment oiseau. Ajoutez les calamars et faites-les sauter vivement pendant 3 minutes pour qu'ils rendent leur eau. Égouttez-les et réservez-les. Dans la même sauteuse, versez le concentré de tomates, le lait de coco et la citronnelle. Laissez mijoter et réduire pendant 10 minutes à feu doux pour concentrer les arômes. Remettez les calamars dans la sauce parfumée et poursuivez la cuisson à feu très doux pendant 15 minutes jusqu'à ce qu'ils soient tendres.", "key": "le rago de calamars a l huile de palme et citronnelle", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 78, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 5, "name": "Langouste des Souverains au Beurre de Truffe d'Alba Monte-Carlo", "portions": "4 personnes", "ingredients": "1 grosse langouste vivante d'environ 1,2 kg, 1 bouteille de vin de Champagne brut, 2 échalotes, 80g de beurre de truffe blanche d'Alba, 1 petite truffe blanche fraîche (pour le service), sel fin, poivre blanc.", "method": "Plongez la langouste entière dans un court-bouillon frémissant pendant 12 minutes, puis plongez-la dans l'eau glacée. Décortiquez délicatement la queue et tranchez la chair en médaillons réguliers. Dans une casserole, faites réduire les échalotes hachées menu avec le vin de Champagne jusqu'à ce qu'il ne reste plus que deux cuillères à soupe de liquide. Hors du feu, incorporez le beurre de truffe blanche d'Alba en petits dés tout en fouettant énergiquement pour monter la sauce en un beurre blanc onctueux et très parfumé. Disposez les médaillons de langouste chauds sur le plat de service, nappez-les entièrement de cette émulsion impériale et râpez la truffe blanche fraîche en fines lamelles directement sur le plat avant de servir.", "key": "langouste des souverains au beurre de truffe d alba monte carlo", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 79, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 6, "name": "Noisettes de Chevreuil aux Figues de l'Arrière-Pays Monte-Carlo", "portions": "4 personnes", "ingredients": "8 noisettes de filet de chevreuil parées, 40g de beurre doux, 8 figues fraîches bien mûres de l'arrière-pays, 2 cuillères à soupe de miel de pays, 15cl de sauce Poivrade traditionnelle, 5cl de liqueur de vieux Cognac, sel, poivre.", "method": "Lavez les figues et coupez-les en deux. Dans une petite poêle, faites fondre une noisette de beurre avec le miel et faites-y caraméliser doucement les figues face coupée vers le bas pendant 5 minutes. Réservez-les. Dans une grande poêle avec le reste de beurre bien chaud, saisissez les noisettes de chevreuil pendant 2 à 3 minutes de chaque côté pour les garder bien saignantes. Retirez-les de l
