name: "Dépôt public — publier depuis le coffre (train toutes les 2 h, 0 minute du coffre)"

# 17.10.2026 (Kevin : « relais Cloudflare pour que la publication vers le dépôt public redevienne 100 % automatique » — décision (b),
# puis « Fais toutes les actions auto, trouve des solutions, crée »).
#
# Ce robot vit et tourne dans le dépôt PUBLIC (minutes gratuites, illimitées). Il fait exactement ce qu'une session fait après une
# fusion : il ouvre le coffre (clé en LECTURE SEULE), exporte + VÉRIFIE (rien de sensible, fail-fermé), aligne le dépôt public et pousse.
# Qui l'appelle : le cron du worker kdmc-outlook (toutes les 2 h, seule place de cron gratuite : pas de cron sur GitHub) quand le commit
# de `main` du coffre a changé depuis la dernière publication (marque KV `publication:sha`). Une session qui publie déjà elle-même ne
# gêne pas : le robot dit « déjà à jour » et s'arrête.
# Après un push fait avec le jeton du job, GitHub ne lance aucun autre robot (anti-boucle) : ce robot RELANCE lui-même les déploiements
# que ce push aurait déclenchés (tools/depot-public/robots-a-relancer.mjs, mêmes règles que GitHub) — le routeur pour les pages, un
# worker pour son dossier. Avec le jeton APEX_GITHUB_PAT (s'il existe ici), le push déclenche tout seul et rien n'est relancé à la main.
# Au coffre lui-même : ne fait rien (il ne s'exporte que pour vivre au public). Journal : des nombres, jamais un contenu privé.

on:
  workflow_dispatch:
    inputs:
      coffre_sha:
        description: "Commit du coffre attendu (information ; le robot publie toujours la tête de main)"
        required: false
        default: ""
      origine:
        description: "Qui demande (kdmc-outlook cron, session, Kevin)"
        required: false
        default: "manuel"

permissions:
  contents: write   # pousser l'export sur main du dépôt public
  actions: write    # relancer les déploiements que ce push aurait déclenchés

concurrency:
  group: publier-depuis-coffre
  cancel-in-progress: false

jobs:
  publier:
    if: github.repository == '9r4rxssx64-creator/kd-mc'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # gratuit par défaut (Kevin 30.09) : export ≈ 1 min, clone ≈ 1 min
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Dépendances du relanceur (js-yaml, déjà dans package.json)
        run: npm i --no-save --no-audit --no-fund --ignore-scripts js-yaml@4 >/dev/null 2>&1 || true

      - name: Ouvrir le coffre (clé en lecture seule, 3 essais)
        env:
          CLE: ${{ secrets.COFFRE_CLE_LECTURE }}
        shell: bash -euo pipefail {0}
        run: |
          [ -n "$CLE" ] || { echo "::error::Clé du coffre absente (secret COFFRE_CLE_LECTURE)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/coffre
          chmod 600 ~/.ssh/coffre
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          essai=0
          until GIT_SSH_COMMAND="ssh -i $HOME/.ssh/coffre -o IdentitiesOnly=yes" git clone -q --depth 1 git@github.com:9r4rxssx64-creator/CMCteams.git /tmp/coffre; do
            essai=$((essai+1)); rm -rf /tmp/coffre
            if [ "$essai" -ge 3 ]; then echo "::error::clone du coffre impossible (3 essais)"; exit 1; fi
            sleep $((essai*essai*5))
          done
          rm -f ~/.ssh/coffre
          echo "coffre ouvert : $(git -C /tmp/coffre rev-parse --short=9 HEAD) ($(git -C /tmp/coffre ls-files | wc -l) fichiers)"

      - name: Exporter, vérifier, pousser (publier-local du coffre, jeton du job ou PAT)
        id: pub
        env:
          # Le PAT (s'il existe au public) fait déclencher les robots par le push lui-même ; sinon le jeton du job + relance manuelle.
          KDMC_PUBLIC_PAT: ${{ secrets.APEX_GITHUB_PAT || github.token }}
          AVEC_PAT: ${{ secrets.APEX_GITHUB_PAT != '' }}
        shell: bash -euo pipefail {0}
        run: |
          avant=$(git rev-parse HEAD)
          set +e
          ( cd /tmp/coffre && node tools/depot-public/publier-local.mjs --envoyer ) 2>&1 | tee /tmp/pub.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" = "0" ] || { echo "::error::publication refusée ou échouée (voir ci-dessus : export vérifié fail-fermé)"; exit "$rc"; }
          git fetch -q origin main
          apres=$(git rev-parse origin/main)
          echo "avant=$avant" >> "$GITHUB_OUTPUT"; echo "apres=$apres" >> "$GITHUB_OUTPUT"
          if [ "$avant" = "$apres" ]; then echo "pousse=non" >> "$GITHUB_OUTPUT"; echo "::notice title=Publication::dépôt public déjà à jour — rien n'est parti"; else echo "pousse=oui" >> "$GITHUB_OUTPUT"; echo "::notice title=Publication::poussé $avant → $apres"; fi
          echo "avec_pat=$AVEC_PAT" >> "$GITHUB_OUTPUT"

      - name: Relancer les déploiements que ce push aurait déclenchés (jeton du job = GitHub ne les lance pas)
        if: steps.pub.outputs.pousse == 'oui' && steps.pub.outputs.avec_pat != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AVANT: ${{ steps.pub.outputs.avant }}
          APRES: ${{ steps.pub.outputs.apres }}
        shell: bash -euo pipefail {0}
        run: |
          git fetch -q --depth 50 origin main || true
          git diff --name-only "$AVANT" "$APRES" > /tmp/changes.txt || git show --name-only --pretty=format: "$APRES" > /tmp/changes.txt
          echo "$(wc -l < /tmp/changes.txt) fichier(s) changé(s)"
          git checkout -q "$APRES" -- .github/workflows 2>/dev/null || true
          node tools/depot-public/robots-a-relancer.mjs --fichiers /tmp/changes.txt --workflows .github/workflows > /tmp/robots.txt
          n=0
          while read -r w; do
            [ -n "$w" ] || continue
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${w}/dispatches" -f ref=main >/dev/null 2>&1; then n=$((n+1)); echo "relancé : $w"; else echo "::warning::relance refusée : $w"; fi
          done < /tmp/robots.txt
          echo "::notice title=Déploiements relancés::${n} robot(s) : $(tr '\n' ' ' < /tmp/robots.txt)"
