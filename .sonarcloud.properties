# SonarCloud en « Analyse automatique » lit CE fichier, pas sonar-project.properties (mesuré 9.10.2026 :
# les fichiers de tests/ y étaient classés « code de l'app », 118 « failles » sur main = des harnais qui
# chargent le code de l'app dans une boîte vm). Mêmes règles que sonar-project.properties :
# le vrai code est analysé comme code, les tests comme tests (toujours analysés, avec les règles de tests).
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,apex-ai-v13/**,**/coverage/**,**/*.min.js,**/*.map,backups/**,**/*.pdf,tools/shared/planning-seed.js,lingua/data.js,**/vendor/**,.uptime/**,**/tests/**,**/*.test.js,**/*.test.mjs,**/*.test.ts
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/*.test.js,**/*.test.mjs,**/*.test.ts
sonar.test.exclusions=**/node_modules/**,**/vendor/**,**/tests/fixtures/**
