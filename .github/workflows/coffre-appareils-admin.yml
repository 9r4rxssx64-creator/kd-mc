name: Coffre — appareils de Kevin, sont-ils à lui ? (lecture seule)

# Kevin 29.10.2026 : « Vérifie si c'est connecté d'une tablette Lenovo, si ça vient de mon matériel, et sois capable de dire quand c'est moi ou pas moi. »
# Lit la fiche admin (KV ACCOUNTS) et les clés Face ID (étiquette + dates), range les sessions par appareil, dit lesquels sont RECONNUS.
# Ne modifie RIEN. Reste au coffre (privé) : le journal contient les lieux de Kevin. À la main / API uniquement — jamais de cron.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appareils:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lire les appareils de Kevin (lecture seule)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash -eo pipefail {0}
        run: |
          NS=$(node -e "const t=require('fs').readFileSync('services/kdmc-router/wrangler.toml','utf8');const m=t.match(/binding\s*=\s*\"ACCOUNTS\"\s*\n\s*id\s*=\s*\"([a-f0-9]+)\"/);process.stdout.write(m?m[1]:'')")
          [ -n "$NS" ] || { echo "::error::espace KV ACCOUNTS introuvable dans wrangler.toml"; exit 1; }
          NS="$NS" node tools/audit/appareils-kevin.mjs
