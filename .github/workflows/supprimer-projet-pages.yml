name: Cloudflare — supprimer le projet Pages kdmc-site (manuel, une fois)

# 16.10 (audit extérieur, P0) : kdmc-site-bj5.pages.dev servait TOUT le site sans compte, en contournant les portes du routeur.
# Le routeur n'en dépend plus (SOURCE_PAGES = "assets", déployé et vérifié le 16.10, run 38827591604).
# Cloudflare refuse de supprimer un projet qui a trop de déploiements (Kevin, capture du 16.10 : « Your project has too many
# deployments to be deleted ») : on efface donc chaque déploiement par l'API, puis le projet. Lancement à la main seulement,
# avec le nom exact du projet en confirmation. Aucune tâche programmée, aucun déclencheur automatique.

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Tape exactement : kdmc-site"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supprimer:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # gratuit d'abord : borné (des milliers d'appels en parallèle prennent quelques minutes)
    steps:
      - name: Confirmation
        shell: bash -eo pipefail {0}
        env:
          CONFIRMER: ${{ inputs.confirmer }}
        run: |
          [ "$CONFIRMER" = "kdmc-site" ] || { echo "::error::confirmation absente ou fausse — rien n'est supprimé"; exit 1; }

      - name: Récupérer le dépôt (pour lire le wrangler.toml du routeur)
        uses: actions/checkout@v4
      - name: Garde — SOURCE_PAGES = "assets" dans le wrangler.toml du routeur
        shell: bash -eo pipefail {0}
        run: |
          grep -qE '^SOURCE_PAGES *= *"assets"' services/kdmc-router/wrangler.toml \
            || { echo "::error::le routeur lit encore l'hébergeur Pages — supprimer le projet éteindrait le domaine"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' https://kd-mc.com/)
          [ "$code" = "200" ] || { echo "::error::kd-mc.com ne répond pas 200 ($code) — on ne touche à rien"; exit 1; }

      - name: Effacer tous les déploiements, puis le projet
        shell: bash -eo pipefail {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kdmc-site"
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          code=$(curl -sS -o /tmp/p.json -w '%{http_code}' "${H[@]}" "$API")
          if [ "$code" = "404" ]; then echo "projet déjà absent — rien à faire"; exit 0; fi
          [ "$code" = "200" ] || { echo "::error title=Cloudflare::lecture du projet refusée (HTTP $code) : $(head -c 400 /tmp/p.json)"; exit 1; }
          total=0
          for tour in $(seq 1 200); do
            curl -sS "${H[@]}" "$API/deployments?per_page=25&page=1" -o /tmp/d.json
            ids=$(node -e 'const j=require("/tmp/d.json");if(!j.success){console.error(JSON.stringify(j.errors));process.exit(2)}for(const d of j.result||[])console.log(d.id)')
            [ -n "$ids" ] || break
            n=$(printf '%s\n' "$ids" | wc -l)
            printf '%s\n' "$ids" | xargs -P 8 -I{} curl -sS -o /dev/null -w '%{http_code}\n' -X DELETE "${H[@]}" "$API/deployments/{}?force=true" > /tmp/codes.txt || true
            ok=$(grep -c '^200$' /tmp/codes.txt || true)
            total=$((total + ok))
            echo "tour $tour : $ok/$n déploiement(s) effacé(s) (total $total)"
            [ "$ok" -gt 0 ] || { echo "::error title=Cloudflare::aucun déploiement effacé à ce tour (codes : $(sort /tmp/codes.txt | uniq -c | tr '\n' ' '))"; exit 1; }
          done
          code=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE "${H[@]}" "$API")
          [ "$code" = "200" ] || { echo "::error title=Cloudflare::suppression du projet refusée (HTTP $code) : $(head -c 400 /tmp/del.json)"; exit 1; }
          echo "✅ projet kdmc-site supprimé ($total déploiements effacés avant)"

      - name: Preuve — l'ancienne adresse ne sert plus rien, le domaine répond
        shell: bash -eo pipefail {0}
        run: |
          sleep 20
          p=$(curl -s -o /dev/null -w '%{http_code}' https://kdmc-site-bj5.pages.dev/ || true)
          d=$(curl -s -o /dev/null -w '%{http_code}' https://kd-mc.com/)
          echo "kdmc-site-bj5.pages.dev → $p ; kd-mc.com → $d"
          [ "$d" = "200" ] || { echo "::error::kd-mc.com ne répond plus 200 ($d)"; exit 1; }
