name: Deploy Apex Chat (Cloudflare Workers)
# Une seule execution a la fois par branche : un nouveau commit remplace
# l'ancien au lieu de s'empiler dans la file d'attente GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # un deploiement ne doit jamais etre coupe en plein vol


# Déclenche automatiquement quand messaging-app/workers/** change
# OU manuellement via GitHub Actions UI (workflow_dispatch)

on:
  push:
    # Kevin 26.09.2026 (« limité ») : la PRODUCTION ne se déploie que depuis main.
    # Une branche de travail ne déploie plus rien (incident m122 du 23.09 : un routeur
    # déployé depuis une branche en retard a éteint kit.kd-mc.com). Manuel : workflow_dispatch.
    branches:
      - main
    paths:
      - 'messaging-app/workers/**'
      - 'services/_shared/ia-route.js'   # routage IA commun : le worker l'importe → doit redéployer
      - 'messaging-app/d1-migrations/**'
      - 'messaging-app/deploy.sh'
      - '.github/workflows/deploy-apex-chat.yml'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Appliquer migrations D1 (yes/no)'
        required: false
        default: 'yes'

jobs:
  # Lot E2 (audit A5, F4, 15.10.2026) : PORTE QUALITÉ. Mesuré : le déploiement partait EN
  # PARALLÈLE des tests (aucun `needs`) — main rouge du 09 au 13.10 pendant que la prod se
  # déployait ; le 15.10, tests ✗ et déploiement ✓ sur le même commit. Désormais la suite unitaire
  # complète (avec ses seuils de couverture) tourne ICI, sur CE commit, et `deploy` en dépend :
  # un commit dont les tests échouent n'atteint jamais la production. Dépôt public : minutes
  # gratuites ; borne 15 min (règle « gratuit par défaut »). Garde : tests/verify-apex-chat-fiabilite.mjs.
  tests:
    name: Tests unitaires du commit (porte avant déploiement)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: messaging-app
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'messaging-app/package.json'

      - name: Install deps
        run: npm install

      - name: Tests + seuils de couverture (vitest.config.js)
        run: npx vitest run --coverage

  deploy:
    name: Deploy Cloudflare Workers + Infra
    needs: tests   # porte qualité : jamais de déploiement d'un commit dont les tests échouent
    runs-on: ubuntu-latest
    timeout-minutes: 15   # gratuit par défaut (Kevin 30.09) : un job sans borne tourne 6 h et brûle le quota
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - name: Install Wrangler
        # Majeure épinglée (triage sécu 10/09, zizmor « adhoc-packages ») : sans
        # version, « wrangler » = ce que npm publiera demain, avec le jeton Cloudflare
        # en main. 4.x est ce qui tourne déjà ici (dernier déploiement vert 34520637740).
        run: npm install -g wrangler@4

      - name: Verify token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant"
            echo "Ajoute-le dans Settings → Secrets and variables → Actions"
            exit 1
          fi
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/verify.json
          if ! grep -q '"success":true' /tmp/verify.json; then
            echo "::error::Token invalide"
            exit 1
          fi
          echo "::notice::✅ Token Cloudflare valide"

      - name: Get Account ID
        id: account
        env:
          KEVIN_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # v1.1.126 fix : si secret CLOUDFLARE_ACCOUNT_ID dispo, l'utiliser (token
          # "Edit Cloudflare Workers" n'a pas la permission de lister tous comptes).
          # Sinon fallback API (avec token "Memberships:Read").
          if [ -n "$KEVIN_ACCOUNT_ID" ]; then
            ACC="$KEVIN_ACCOUNT_ID"
            echo "::notice::Account ID depuis secret CLOUDFLARE_ACCOUNT_ID: $ACC"
          else
            # 10/09/2026 : jq à la place de `| python3 -c` (Semgrep gha-curl-pipe-shell — la réponse est
            # une donnée parsée, jamais exécutée ; jq rend ça explicite). `-e` : exit 1 si résultat vide.
            ACC=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
              jq -er '.result[0].id' 2>/dev/null) || {
              echo "::error::Secret CLOUDFLARE_ACCOUNT_ID manquant ET token sans Memberships:Read"
              echo "Solution : ajoute secret CLOUDFLARE_ACCOUNT_ID dans Settings > Secrets"
              exit 1
            }
            echo "::notice::Account ID depuis API: $ACC"
          fi
          echo "id=$ACC" >> $GITHUB_OUTPUT
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV

      # Lot E2 (audit A5, F8) : l'étape « DIAG token + account match » est RETIRÉE. Dans ce dépôt
      # PUBLIC, elle imprimait à chaque déploiement les 10 premiers caractères du jeton Cloudflare
      # (GitHub ne masque que la valeur entière), les politiques complètes du jeton, et la liste des
      # workers et des bases D1 du compte. Son rôle (diagnostic v1.1.131) est terminé depuis
      # longtemps. Garde : tests/verify-apex-chat-fiabilite.mjs (aucun préfixe de jeton imprimé).

      - name: Verify D1 database (hardcoded in wrangler.toml)
        working-directory: messaging-app/workers
        run: |
          # v1.1.131 : D1 ID hardcoded dans wrangler.toml (Kevin créé manuellement).
          # Pas besoin de créer via API (token CF rejette pour raisons inconnues).
          echo "::notice::D1 ID hardcoded:"
          grep "database_id" wrangler.toml | head -1

      - name: Apply D1 migrations (journal _migrations — chaque fichier une seule fois)
        if: github.event.inputs.apply_migrations != 'no'
        working-directory: messaging-app/workers
        run: |
          # Lot E2 (audit A5, F7, 15.10.2026). Avant : les 25 fichiers rejoués à CHAQUE déploiement,
          # « duplicate column » classé « ok » pour le FICHIER entier (or D1 annule un fichier en
          # échec : ses autres instructions n'étaient jamais appliquées), migrations de données
          # rejouées, et un échec n'arrêtait pas les suivantes. Désormais le moteur
          # tools/d1-migrations-runner.mjs tient le journal `_migrations` (nom + empreinte) :
          # chaque fichier UNE fois, dans l'ordre, arrêt au premier vrai échec (le worker n'est
          # alors pas déployé), « déjà là » toléré pour la seule instruction concernée.
          set -o pipefail
          # Signet Time Travel AVANT toute migration : de quoi revenir en arrière
          # (`wrangler d1 time-travel restore apex-chat-main --bookmark=<signet>`).
          signet=$(wrangler d1 time-travel info apex-chat-main 2>&1 | grep -oE "[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}" | head -1 || true)
          echo "signet Time Travel avant migrations : ${signet:-indisponible}"
          echo "- Signet D1 avant migrations : \`${signet:-indisponible}\`" >> "$GITHUB_STEP_SUMMARY"
          node ../tools/d1-migrations-runner.mjs --remote apex-chat-main --dir ../d1-migrations
          echo "=== Vérif tables créées ==="
          wrangler d1 execute apex-chat-main --remote --command "SELECT name FROM sqlite_master WHERE type='table'" 2>&1 | tail -20
          echo "::notice::Migrations D1 appliquées"

      - name: Create R2 bucket (idempotent)
        run: |
          wrangler r2 bucket create apex-chat-media || echo "(bucket existe déjà)"
          echo "::notice::R2 bucket apex-chat-media OK"

      - name: Verify KV namespace (hardcoded in wrangler.toml)
        working-directory: messaging-app/workers
        run: |
          # v1.1.131 : KV ID hardcoded dans wrangler.toml (Kevin créé manuellement).
          echo "::notice::KV ID hardcoded:"
          grep -A1 "APEX_CHAT_CACHE" wrangler.toml | head -3

      - name: Create Cloudflare Queues (idempotent)
        run: |
          for queue in apex-chat-telemetry apex-chat-pipeline-fix apex-chat-letters-deliver apex-chat-timecapsule-open apex-chat-memory-lane apex-chat-dlq; do
            wrangler queues create "$queue" 2>&1 | tail -1 || echo "(  $queue existe déjà)"
          done
          echo "::notice::6 Queues OK (dont la file de rebut)"

      - name: Deploy api-worker (official Cloudflare action)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        env:
          # 17.10 : journal de wrangler écrit à un endroit connu, pour que l'étape suivante en tire la cause d'un échec.
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'messaging-app/workers'
          command: deploy

      - name: Cause lisible d'un déploiement refusé par Cloudflare
        # 17.10 (run 39034604057 : « npx failed with exit code 1 », rien d'autre de lisible depuis une session) :
        # les lignes d'erreur de wrangler deviennent des annotations. Dépôt public : identifiants hexadécimaux masqués.
        if: failure()
        shell: bash
        run: |
          set -u
          f=$(ls -t "$RUNNER_TEMP"/wrangler-logs/*.log 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "::error title=wrangler::aucun journal wrangler trouvé"; exit 0; fi
          grep -iE '✘|\[ERROR\]|error:|code: ?[0-9]{4,}|exceed|limit' "$f" | grep -viE 'authorization|bearer|token' \
            | sed -E 's/[0-9a-f]{32}/***/g' | cut -c1-300 | head -12 | while IFS= read -r l; do echo "::error title=wrangler::$l"; done
          exit 0

      - name: Generate + put secrets (after Worker exists)
        working-directory: messaging-app/workers
        env:
          # Lot E2 (audit A5, F3) : clé DÉDIÉE au chiffrement des sauvegardes D1 → R2. Elle vit dans
          # le secret GitHub BACKUP_ENCRYPTION_KEY du coffre (recopié vers ce dépôt par la bascule)
          # ET hors ligne chez Kevin : c'est ce qui rend une sauvegarde relisible sans le Worker.
          # Jamais générée ici : une clé que personne ne possède ne restaure rien.
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          # Liste des secrets déjà présents sur le Worker (évite régénération destructrice)
          EXISTING=$(wrangler secret list 2>/dev/null || echo '[]')
          has_secret() { echo "$EXISTING" | grep -q "\"$1\""; }

          # printf '%s' (PAS echo) : echo ajoute un \n qui corrompt les secrets
          # comparés caractère par caractère (ex KEVIN_PHONE_E164 → "+33...\n" ne matche jamais)
          put_secret() { printf '%s' "$2" | wrangler secret put "$1"; }

          # JWT_SIGN_KEY : STABLE entre déploiements (régénérer invaliderait tous les JWT existants).
          # Généré une seule fois, conservé tant qu'il existe sur le Worker.
          if has_secret "JWT_SIGN_KEY"; then
            echo "::notice::JWT_SIGN_KEY déjà présent — conservé (pas de régénération)"
          else
            put_secret "JWT_SIGN_KEY" "$(openssl rand -hex 64)"
            echo "::notice::JWT_SIGN_KEY généré (première fois)"
          fi
          # v1.1.163 : si secret GitHub APEX_CHAT_ADMIN_TOKEN défini, on l'aligne
          # côté Cloudflare (force-push). Sinon : conserve l'existant CF ou auto-génère.
          # Permet au workflow apex-chat-auto-force-update.yml d'utiliser la même valeur
          # que celle reconnue par le Worker (cohérence GitHub Secret ↔ env Cloudflare).
          if [ -n "${{ secrets.APEX_CHAT_ADMIN_TOKEN }}" ]; then
            put_secret "APEX_CHAT_ADMIN_TOKEN" "${{ secrets.APEX_CHAT_ADMIN_TOKEN }}"
            echo "::notice::APEX_CHAT_ADMIN_TOKEN aligné depuis GitHub Secret"
          elif has_secret "APEX_CHAT_ADMIN_TOKEN"; then
            echo "::notice::APEX_CHAT_ADMIN_TOKEN déjà présent côté Cloudflare — conservé"
          else
            put_secret "APEX_CHAT_ADMIN_TOKEN" "$(openssl rand -hex 32)"
            echo "::notice::APEX_CHAT_ADMIN_TOKEN auto-généré (1ère fois)"
          fi
          if [ -n "$BACKUP_ENCRYPTION_KEY" ]; then
            put_secret "BACKUP_ENCRYPTION_KEY" "$BACKUP_ENCRYPTION_KEY"
            echo "::notice::BACKUP_ENCRYPTION_KEY aligné depuis le secret GitHub (sauvegardes restaurables)"
          else
            echo "::warning::Secret GitHub BACKUP_ENCRYPTION_KEY absent : la sauvegarde quotidienne reste chiffrée avec JWT_SIGN_KEY, que personne ne peut relire hors du Worker (voir messaging-app/docs/SAUVEGARDE-RESTAURATION.md)."
          fi
          if has_secret "APEX_HANDOFF_TOKEN"; then
            echo "::notice::APEX_HANDOFF_TOKEN déjà présent — conservé"
          else
            put_secret "APEX_HANDOFF_TOKEN" "$(openssl rand -hex 32)"
          fi

          # Helper : push secret seulement si valeur définie (printf, jamais echo)
          push_if_set() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              put_secret "$name" "$value"
              echo "::notice::✓ $name configuré"
            fi
          }

          # === IA (4 providers actifs côté Kevin) ===
          push_if_set "ANTHROPIC_API_KEY" "${{ secrets.ANTHROPIC_API_KEY }}"
          push_if_set "GROQ_API_KEY" "${{ secrets.GROQ_API_KEY }}"
          push_if_set "GEMINI_API_KEY" "${{ secrets.GEMINI_API_KEY }}"
          push_if_set "DEEPSEEK_API_KEY" "${{ secrets.DEEPSEEK_API_KEY }}"

          # === IA failover (optionnels) ===
          push_if_set "OPENROUTER_API_KEY" "${{ secrets.OPENROUTER_API_KEY }}"
          push_if_set "OPEN_AI_API_KEY" "${{ secrets.OPEN_AI_API_KEY }}"
          push_if_set "PERPLEXITI_API_KEY" "${{ secrets.PERPLEXITI_API_KEY }}"

          # === GIF (Giphy) — clé gratuite, optionnelle. Sans elle, /api/gif
          #     répond { disabled:true } et le sélecteur GIF se désactive proprement.
          push_if_set "GIPHY_KEY" "${{ secrets.GIPHY_KEY }}"

          # === SMS Vonage ===
          push_if_set "VONAGE_API_KEY" "${{ secrets.VONAGE_API_KEY }}"
          push_if_set "VONAGE_API_SECRET" "${{ secrets.VONAGE_API_SECRET }}"

          # === Web Push VAPID ===
          push_if_set "VAPID_PRIVATE_KEY" "${{ secrets.VAPID_PRIVATE_KEY }}"

          # === Communications ===
          push_if_set "TELEGRAM_API_KEY" "${{ secrets.TELEGRAM_API_KEY }}"
          push_if_set "EMAILJS_PRIVATE_KEY" "${{ secrets.EMAILJS_PRIVATE_KEY }}"

          # === Recherche & vector DB ===
          push_if_set "TAVILY_API_KEY" "${{ secrets.TAVILY_API_KEY }}"
          push_if_set "PINECONE_API_KEY" "${{ secrets.PINECONE_API_KEY }}"

          # === Auth/Infra ===
          push_if_set "FIREBASE_API_KEY" "${{ secrets.FIREBASE_API_KEY }}"
          push_if_set "FIREBASE_PROJECT_ID" "cmcteams-c16ab"
          push_if_set "FIREBASE_AUTH_DOMAIN" "cmcteams-c16ab.firebaseapp.com"

          # === Reconnaissance Kevin admin via numéro téléphone E.164 ===
          # Audit 17/09/2026 (P0 vie privée) : le numéro était écrit EN CLAIR ici, dans un
          # dépôt PUBLIC, sous un commentaire qui affirmait le contraire. Il vit désormais
          # dans le secret GitHub KEVIN_PHONE_E164 ; s'il est vide, on ne touche pas au
          # secret Cloudflare déjà en place (push_if_set saute) → zéro régression.
          push_if_set "KEVIN_PHONE_E164" "${{ secrets.KEVIN_PHONE_E164 }}"

          # === Cercle de confiance (login SANS SMS) — v1.1.216 ===
          # Numéros lus depuis des SECRETS GitHub (privés, jamais dans le repo).
          # LAURENCE_PHONE_E164 = numéro de Laurence ; TRUSTED_CIRCLE_PHONES =
          # liste CSV (famille/amis). Skip silencieux tant que le secret est vide.
          push_if_set "LAURENCE_PHONE_E164" "${{ secrets.LAURENCE_PHONE_E164 }}"
          push_if_set "TRUSTED_CIRCLE_PHONES" "${{ secrets.TRUSTED_CIRCLE_PHONES }}"

          echo "::notice::Secrets configurés (skip silencieux si vide). Worker prêt à recevoir des requêtes."

      - name: Provision Cloudflare TURN (appels P2P cross-réseau) — idempotent
        working-directory: messaging-app/workers
        run: |
          # v1.1.229 — appels fiables sur réseaux différents (cellulaire/NAT symétrique).
          # Le TURN gratuit OpenRelay est mort. On crée UNE clé TURN Cloudflare Realtime
          # (idempotent : on ne recrée pas si le secret existe déjà) et on pousse
          # CF_TURN_KEY_ID + CF_TURN_TOKEN comme secrets du Worker. Le Worker mint ensuite
          # des credentials éphémères via /api/turn (le token ne sort JAMAIS au client).
          # 21.10.2026 : le nombre de clés « TURN » MONTAIT à chaque déploiement (63 → 71, relevé du Lenovo) : la liste des secrets, illisible ou
          # d'un autre format, valait « pas de clé » et en recréait une. Désormais : liste illisible = on NE CRÉE RIEN ; nom cherché sans guillemets.
          if ! EXISTING=$(wrangler secret list --format json 2>&1); then
            echo "::warning::Liste des secrets illisible — aucune clé TURN créée (TURN conservé tel quel)"
          elif echo "$EXISTING" | grep -q 'CF_TURN_KEY_ID'; then
            echo "::notice::CF_TURN_KEY_ID déjà présent — TURN conservé (pas de nouvelle clé)"
          else
            echo "Création d'une clé TURN Cloudflare Realtime…"
            RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d '{"name":"apex-chat-turn"}')
            echo "$RESP" | python3 -m json.tool 2>/dev/null || echo "$RESP"
            OK=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success'))" 2>/dev/null || echo "False")
            if [ "$OK" != "True" ]; then
              echo "::warning::Création clé TURN ÉCHOUÉE — les appels retomberont en STUN (peuvent ne pas se connecter cross-réseau)."
              echo "::warning::Cause probable : le token CLOUDFLARE_API_TOKEN n'a pas la permission 'Calls' (Account > Cloudflare Calls > Edit). Réponse API ci-dessus."
            else
              KID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['uid'])")
              # Le bearer de la clé TURN est dans result.key (doc Cloudflare), PAS result.token.
              KTOK=$(echo "$RESP" | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; print(r.get('key') or r.get('token') or '')")
              if [ -n "$KID" ] && [ -n "$KTOK" ]; then
                printf '%s' "$KID" | wrangler secret put CF_TURN_KEY_ID
                printf '%s' "$KTOK" | wrangler secret put CF_TURN_TOKEN
                echo "::notice::✅ Clé TURN Cloudflare créée + secrets poussés — appels cross-réseau actifs"
              else
                echo "::warning::Réponse TURN sans uid/token — STUN seul. Réponse : $RESP"
              fi
            fi
          fi

      - name: Vérification LIVE après déploiement (santé + version)
        id: live
        env:
          ATTENDU: ${{ github.sha }}
        run: |
          # Audit 17/09/2026 (P2) : un « deploy success » ne prouvait rien (leçon #95). On
          # interroge le worker réellement en ligne : santé, puis version de package.json.
          BASE="https://apex-chat-api.9r4rxssx64.workers.dev"
          VERSION=$(jq -r .version messaging-app/package.json)
          ok=0
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "tentative $i : HTTP $code — nouvel essai dans 10 s"; sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::/api/health ne répond pas 200 après déploiement : $(cat /tmp/health.json 2>/dev/null)"
            # Retour arrière SEULEMENT si le NOUVEAU CODE lui-même est en cause (le serveur ne répond pas, ou plante).
            # Une base ou un serveur de conversation momentanément KO répond 503 AVEC son détail {checks:…} : c'est
            # une panne d'infrastructure, que l'ancien code subirait aussi — on ne défait pas un bon déploiement pour ça.
            if [ "$code" = "503" ] && jq -e '.checks' /tmp/health.json >/dev/null 2>&1; then
              echo "::warning::Panne d'infrastructure (503 avec détail) — pas de retour arrière"
            else
              echo "rollback=1" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          # Lot E2 : /api/health vérifie D1 et les Durable Objects (503 sinon) ; la sauvegarde y est
          # dite « ok », « stale » (plus de 26 h) ou « unknown ».
          echo "santé : $(cat /tmp/health.json)"
          if jq -e '.checks.backup == "stale"' /tmp/health.json >/dev/null 2>&1; then echo "::warning::La dernière sauvegarde D1 réussie a plus de 26 h"; fi
          # Audit 16.10.2026 : /api/system/config exige un compte (la comparaison ne se faisait jamais).
          # /api/health annonce la version du serveur : on la compare à package.json, avec quelques essais
          # (le code met quelques secondes à se propager sur tous les points d'entrée).
          live=""
          for i in 1 2 3 4 5 6; do
            live=$(curl -s "$BASE/api/health" | jq -r '.version // empty' 2>/dev/null || true)
            [ "$live" = "$VERSION" ] && break
            echo "version annoncée : '$live' (attendue $VERSION) — nouvel essai dans 10 s"; sleep 10
          done
          if [ "$live" = "$VERSION" ]; then
            echo "✅ version en ligne : $live = dépôt"
          else
            echo "::error::Le serveur en ligne annonce '$live' alors que le dépôt est en $VERSION — le déploiement n'a pas pris effet"
            exit 1
          fi

      - name: Retour arrière automatique (le nouveau code ne répond plus)
        # 17.10 : l'échec de cette étape n'est plus masqué (garde test:apex-chat-fiabilite) — masquer était inutile : l'étape ne part que si le job
        # est déjà rouge ; si le retour arrière échoue, elle est rouge aussi, et c'est honnête.
        if: ${{ failure() && steps.live.outputs.rollback == '1' }}
        working-directory: messaging-app/workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Audit 16.10.2026 : avant, un déploiement dont /api/health ne répondait plus restait en ligne tel quel.
          # Les migrations D1 sont additives (CREATE IF NOT EXISTS) : l'ancien code tourne avec les nouvelles tables.
          npx --yes wrangler@4 rollback --message "retour arrière automatique : santé KO après ${{ github.sha }}" -y
          echo "::warning::Retour arrière demandé à Cloudflare — vérifier /api/health et la version"

      - name: Summary
        run: |
