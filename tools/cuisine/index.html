<meta charset="utf-8">
<title>A Cüjina de Mùnegu — Répertoire de la Riviera</title>
<!-- Icône sur l'écran d'accueil : drapeau de Monaco (rouge/blanc) + blason doré — Kevin 2026-09-10 « Drapeau monaco ». Sans ces lignes, l'iPhone prenait une capture sombre de la page. -->
<meta name="theme-color" content="#CE1126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cüjina">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --paper:#FBF8F1; --card:#FFFFFF; --ink:#22303A; --ink-soft:#5A6A72;
  --line:#E4DCC9; --marine:#0E2A34; --marine-soft:#16394A;
  --gold:#B4863B; --gold-bright:#CBA14C; --rouge:#9E3B34; --olive:#5E6B44;
  --chip:#F1EADB; --shadow:0 8px 30px rgba(14,42,52,.10);
  --ground:#EFE8D8; --onmarine:#F4ECD8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F272F; --card:#143039; --ink:#ECE4D3; --ink-soft:#9DB0B4;
  --line:#264048; --marine:#0A1E25; --marine-soft:#16394A;
  --gold:#D9B25A; --gold-bright:#E7C877; --rouge:#D86A61; --olive:#9DAE6E;
  --chip:#1B3A44; --shadow:0 10px 34px rgba(0,0,0,.4);
  --ground:#081A20; --onmarine:#F4ECD8;
}}
:root[data-theme="dark"]{
  --paper:#0F272F; --card:#143039; --ink:#ECE4D3; --ink-soft:#9DB0B4;
  --line:#264048; --marine:#0A1E25; --marine-soft:#16394A;
  --gold:#D9B25A; --gold-bright:#E7C877; --rouge:#D86A61; --olive:#9DAE6E;
  --chip:#1B3A44; --shadow:0 10px 34px rgba(0,0,0,.4);
  --ground:#081A20; --onmarine:#F4ECD8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{max-width:820px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;overflow:hidden}
@media(min-width:860px){.wrap{margin-top:0;box-shadow:var(--shadow)}}
.lbl{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:600;color:var(--gold)}
.ui{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-weight:600;text-wrap:balance;line-height:1.15;margin:0}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--gold)}
.hidden{display:none!important}

/* ---- diamond divider ---- */
.rule{display:flex;align-items:center;gap:14px;color:var(--gold);margin:20px 0}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.rule i{font-style:normal;font-size:12px;letter-spacing:4px}

/* ---- COVER ---- */
#cover{position:fixed;inset:0;z-index:60;background:
   radial-gradient(120% 80% at 50% -10%, #1C4A5C 0%, var(--marine) 55%, #071820 100%);
   color:var(--onmarine);display:flex;flex-direction:column;align-items:center;justify-content:center;
   text-align:center;padding:40px 28px calc(40px + env(safe-area-inset-bottom));transition:opacity .7s ease, transform .7s ease}
#cover.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.crest{width:92px;height:92px;margin-bottom:26px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
.cover-k{font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.4em;font-size:12px;color:var(--gold-bright);margin-bottom:18px}
#cover h1{font-size:clamp(30px,8vw,52px);color:#F6EFDC;line-height:1.05;letter-spacing:.01em}
#cover .sub{font-style:italic;color:#CBB98E;margin-top:16px;font-size:clamp(15px,4.4vw,20px);max-width:22ch}
.cover-line{display:flex;align-items:center;gap:12px;color:var(--gold);margin:30px 0 34px}
.cover-line::before,.cover-line::after{content:"";height:1px;width:46px;background:var(--gold)}
.enter{border:1px solid var(--gold);color:var(--gold-bright);padding:15px 30px;border-radius:40px;
   font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:12.5px;font-weight:600;
   background:rgba(180,134,59,.08);transition:.25s;min-height:52px}
.enter:hover{background:var(--gold);color:var(--marine)}
.cover-foot{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.15em;color:#7C93A0;text-transform:uppercase}

/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:30;background:var(--marine);color:var(--onmarine);
   display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.top .back{font-size:22px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--gold-bright)}
.top .ttl{font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#F2E9D4}
.top .act{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:19px;border-radius:50%;color:var(--gold-bright)}

/* ---- HOME ---- */
.home-hd{background:linear-gradient(180deg,var(--marine),var(--marine-soft));color:var(--onmarine);
   text-align:center;padding:26px 22px 30px;padding-top:calc(20px + env(safe-area-inset-top))}
.home-hd .crest{width:56px;height:56px;margin:0 auto 12px}
.home-hd h1{font-size:clamp(22px,6vw,30px);color:#F5EDD8}
.home-hd .sub{font-style:italic;color:#C6B489;margin-top:8px;font-size:15px}
.home-hd .stat{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.08em;color:#8AA0AC;margin-top:14px;text-transform:uppercase}
.dom-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-family:system-ui,sans-serif;font-size:12px;font-weight:600;padding:6px 13px;border-radius:30px;background:rgba(203,161,76,.14);color:var(--gold-bright);border:1px solid rgba(203,161,76,.4)}
.dom-badge.off{color:#8AA0AC;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);font-weight:500}

.searchbar{position:relative;margin:18px 16px 6px}
.searchbar input{width:100%;padding:15px 16px 15px 46px;border-radius:14px;border:1px solid var(--line);
   background:var(--card);color:var(--ink);font-size:16px;font-family:system-ui,sans-serif}
.searchbar .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--gold);pointer-events:none}
.searchbar input::placeholder{color:var(--ink-soft)}

.section-t{padding:22px 18px 6px;display:flex;align-items:baseline;justify-content:space-between}
.section-t h2{font-size:20px}
.section-t .cnt{font-family:system-ui,sans-serif;font-size:12px;color:var(--ink-soft)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:system-ui,sans-serif;font-size:13px;padding:9px 15px;border-radius:30px;
   background:var(--chip);color:var(--ink);border:1px solid transparent;white-space:nowrap;min-height:40px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--gold);color:#22200f;border-color:var(--gold);font-weight:600}

/* family grid */
.fam-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px 4px}
@media(max-width:400px){.fam-grid{gap:10px}}
.fam{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:var(--shadow);transition:.18s}
.fam:active{transform:scale(.98)}
.fam .ic{font-size:26px}
.fam .nm{font-size:15.5px;line-height:1.25}
.fam .n{font-family:system-ui,sans-serif;font-size:12px;color:var(--ink-soft)}

/* tomes list */
.tome{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);background:var(--card);text-align:left;width:100%}
.tome .rn{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;color:var(--gold);width:52px;flex:0 0 auto}
.tome .ic{font-size:22px;width:26px;text-align:center}
.tome .tx{flex:1}
.tome .tx .t{font-size:15.5px}
.tome .tx .d{font-family:system-ui,sans-serif;font-size:12px;color:var(--ink-soft);margin-top:2px}
.tome .ch{color:var(--gold);font-size:20px}

/* recipe list */
.rlist{padding:6px 0 20px}
.ritem{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.ritem:active{background:var(--chip)}
.ritem .rlft{flex:1;min-width:0}
.ritem .rn2{font-size:16.5px;line-height:1.25;margin-bottom:3px}
.ritem .rmeta{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.ritem .rdial{display:inline-block;margin-top:4px;font-family:system-ui,sans-serif;font-size:11.5px;color:var(--rouge);background:var(--chip);border-radius:20px;padding:2px 10px;letter-spacing:.02em}
.orig{display:inline-flex;align-items:center;gap:5px;font-family:system-ui,sans-serif;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.orig.monaco{background:rgba(158,59,52,.12);color:var(--rouge);border:1px solid rgba(158,59,52,.35)}
.orig.ligurie{background:rgba(94,107,68,.15);color:var(--olive);border:1px solid rgba(94,107,68,.4)}
.ritem .rorig{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stylechip{font-family:system-ui,sans-serif;font-size:10.5px;color:var(--ink-soft);background:var(--chip);border-radius:20px;padding:2px 8px}
.rp-hero .orig{margin-top:12px;font-size:12px;background:rgba(255,255,255,.1);color:#F5EDD8;border:1px solid rgba(255,255,255,.25)}
.orig-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px 4px}
.orig-card{border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:5px;text-align:left;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--card)}
.orig-card:active{transform:scale(.98)}
.orig-card.oc-monaco{border-left:4px solid var(--rouge)}
.orig-card.oc-ligurie{border-left:4px solid var(--olive)}
.orig-card .oc-fl{font-size:26px}
.orig-card .oc-nm{font-size:15.5px;line-height:1.2}
.orig-card .oc-n{font-family:system-ui,sans-serif;font-size:12px;color:var(--ink-soft)}
.rp-hero .dial{margin-top:10px;font-style:italic;color:var(--gold-bright);font-size:15px}
.rp-hero .dial b{font-style:normal;color:#F5EDD8}
.dial-src{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rouge);border-radius:0 12px 12px 0;padding:14px 16px;margin:16px 0;font-size:15px;line-height:1.6}
.dial-src .d-l{display:block;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--rouge);margin-bottom:8px;font-weight:600}
.dial-src .d-n{font-size:20px;font-weight:600;color:var(--ink)}
.dial-src .d-lang{font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.dial-src .d-s{display:block;margin-top:8px;font-family:system-ui,sans-serif;font-size:11.5px}
.dial-src .d-s a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
.lex{padding:6px 16px 30px}
.lex-intro{color:var(--ink-soft);font-style:italic;padding:14px 4px 6px;font-size:15px;line-height:1.6}
.lex-g{margin:18px 0 6px}
.lex-g .lgt{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rouge);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lex-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:9px 0;box-shadow:var(--shadow)}
.lex-item .li-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lex-item .li-n{font-size:18px;font-weight:600;color:var(--gold)}
.lex-item .li-fr{font-size:14.5px;color:var(--ink)}
.lex-item .li-q{font-size:13px;font-style:italic;color:var(--ink-soft);margin-top:6px;border-left:2px solid var(--line);padding-left:10px}
.lex-item .li-s{display:inline-block;margin-top:6px;font-family:system-ui,sans-serif;font-size:11px}
.lex-item .li-s a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
.ritem .rdesc{font-size:13.5px;color:var(--ink-soft);margin-top:5px;font-style:italic;
   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem .fav{font-size:19px;color:var(--line);width:34px;flex:0 0 auto;text-align:center;padding-top:2px}
.ritem .fav.on{color:var(--rouge)}
.empty{text-align:center;color:var(--ink-soft);padding:60px 30px;font-style:italic}
.rthumb{position:relative;width:56px;height:56px;flex:0 0 auto;color:var(--gold);opacity:.95;border-radius:50%;overflow:hidden}
.rthumb svg{width:100%;height:100%}
.rthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.rp-photo{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--marine-soft);display:flex;align-items:center;justify-content:center}
.rp-photo img{width:100%;height:100%;object-fit:cover;display:block}
.rp-photo .illu-hero{position:absolute;margin:0;opacity:.35}
.rp-photo:not(.noimg) .illu-hero{display:none}
.rp-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,30,37,0) 55%,rgba(10,30,37,.55))}
.fam .illu-m{width:46px;height:46px;color:var(--gold)}
.illu-hero{width:96px;height:96px;margin:0 auto 4px;color:var(--gold-bright);display:block}
.illu-hero svg{width:100%;height:100%}
.info-src{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--olive);border-radius:0 12px 12px 0;padding:14px 16px;margin:14px 0;font-size:14.5px;line-height:1.6}
.info-src .i-l{display:block;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--olive);margin-bottom:7px;font-weight:600}
.info-src .i-s{display:block;margin-top:8px;font-family:system-ui,sans-serif;font-size:11.5px}
.info-src .i-s a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}

/* ---- RECIPE PAGE ---- */
.rp{padding:0 0 30px}
.rp-hero{background:linear-gradient(180deg,var(--marine),var(--marine-soft));color:var(--onmarine);padding:26px 22px 30px;text-align:center}
.rp-hero .cat{font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--gold-bright)}
.rp-hero h1{font-size:clamp(23px,6.4vw,32px);color:#F5EDD8;margin:12px 0 4px}
.rp-hero .tt{font-family:system-ui,sans-serif;font-size:12px;color:#93A8B3;letter-spacing:.05em;margin-top:8px}
.rp-body{padding:0 20px}
.histoire{font-style:italic;color:var(--ink);background:var(--chip);border-left:3px solid var(--gold);
   padding:16px 18px;border-radius:0 12px 12px 0;margin:22px 0;font-size:15.5px;line-height:1.65}
.histoire .h-l{display:block;font-family:system-ui,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--gold);margin-bottom:8px}

.block-h{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.block-h .bt{font-size:19px}
.block-h .hl{flex:1;height:1px;background:var(--line)}

/* portions stepper */
.portions{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:4px 0 6px}
.portions .pl{font-family:system-ui,sans-serif;font-size:13px;color:var(--ink-soft)}
.portions .pl b{color:var(--ink);font-size:16px}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--chip);color:var(--gold);font-size:22px;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
.stepper .val{min-width:42px;text-align:center;font-size:17px;font-weight:600}
.pnote{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--ink-soft);margin:2px 2px 8px;text-align:center}

/* ingredients */
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15.5px}
.ings li .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--gold);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;font-family:system-ui,sans-serif}
.ings li.got .ck{background:var(--gold);color:#fff}
.ings li.got .tt2{opacity:.5;text-decoration:line-through}

/* method steps */
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{position:relative;padding:6px 0 18px 46px;font-size:16px;line-height:1.62}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;
   width:32px;height:32px;border-radius:50%;background:var(--marine);color:var(--gold-bright);
   font-family:system-ui,sans-serif;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:1px;background:var(--line)}
.steps li:last-child::after{display:none}
/* étape en cours de lecture à voix haute */
.steps li.reading{color:var(--gold-bright)}
.steps li.reading::before{background:var(--gold);color:#241f0d;animation:pulse 1s infinite}
.timer{display:inline-flex;align-items:center;gap:5px;background:var(--gold);color:#241f0d;
   font-family:system-ui,sans-serif;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;margin:0 2px;vertical-align:baseline}
.timer.run{background:var(--rouge);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}

.note-src{font-family:system-ui,sans-serif;font-size:13px;color:var(--ink-soft);background:var(--chip);border-radius:10px;padding:12px 14px;margin:8px 0}

.rp-actions{display:flex;gap:10px;margin:24px 0 6px}
.rp-actions button{flex:1;padding:14px;border-radius:12px;font-family:system-ui,sans-serif;font-size:13.5px;font-weight:600;
   border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px}
.rp-actions button.pri{background:var(--gold);color:#241f0d;border-color:var(--gold)}
.rp-actions button.on{background:var(--rouge);color:#fff;border-color:var(--rouge)}

/* ---- COURSES ---- */
.courses{padding:8px 16px 30px}
.crecipe{margin:14px 0}
.crecipe .ct{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.crecipe .del{color:var(--rouge);font-size:12px}
.citem{display:flex;gap:11px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.citem .cck{width:22px;height:22px;border-radius:6px;border:2px solid var(--olive);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;color:transparent;font-family:system-ui,sans-serif;font-size:13px}
.citem.done .cck{background:var(--olive);color:#fff}
.citem.done span{opacity:.45;text-decoration:line-through}
.add-row{display:flex;gap:8px;margin:14px 0}
.add-row input{flex:1;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:system-ui,sans-serif;font-size:15px}
.add-row button{padding:0 18px;border-radius:11px;background:var(--gold);color:#241f0d;font-family:system-ui,sans-serif;font-weight:600}
.crs-tools{display:flex;gap:10px;margin:6px 0 16px}

<script id="DATA" type="application/json">{"title": "LE GRAND RÉPERTOIRE CULINAIRE DE LA RIVIERA", "recipes": [{"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 1, "name": "Ananas Monte-Carlo", "portions": "4 personnes", "ingredients": "1 gros ananas mûr avec son plumet, 500g de glace vanille, 100g de cerises confites, 10cl de Grand-Marnier, 3 blancs d'œufs, 150g de sucre.", "method": "Découper le chapeau de l'ananas à 3 cm sous les feuilles. Évider l'intérieur au couteau long sans percer la peau. Couper la chair en dés de 5 mm et les faire macérer 30 minutes dans le Grand-Marnier. Mélanger les dés de fruits égouttés avec la glace vanille assouplie. Remplir la coque de l'ananas et bloquer au congélateur. Monter les blancs en neige ferme en incorporant le sucre à la fin pour obtenir une meringue compacte. À la poche, masquer le sommet de l'ananas de meringue en formant des pointes et y enfoncer les cerises confites. Passer sous le gril du four au maximum pendant 45 à 60 secondes pour dorer les pointes de la meringue. Servir immédiatement.", "key": "ananas monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 0, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 2, "name": "Bavarois Monte-Carlo", "portions": "6 personnes", "ingredients": "50cl de lait entier, 4 jaunes d'œufs, 100g de sucre, 4 feuilles de gélatine (8g), 60g de pâte de pistache, 25cl de crème liquide entière, 150g de framboises, 50g de sucre glace, 30g de dragées blanches.", "method": "Ramollir la gélatine dans l'eau froide. Blanchir les jaunes d'œufs avec le sucre. Chauffer le lait, le verser sur les œufs en fouettant et cuire à feu doux à la nappe sans bouillir. Hors du feu, dissoudre la gélatine essorée et la pâte de pistache. Laisser refroidir. Monter la crème liquide en chantilly ferme et l'incorporer à la maryse. Verser dans un moule à bavarois et réserver 4 heures au frais. Mixer les framboises avec le sucre glace et filtrer au tamis pour faire un coulis rouge miroir. Démouler le bavarois vert, le napper de coulis rouge et décorer la base de dragées blanches concassées.", "key": "bavarois monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 1, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 3, "name": "Biscuit Monte-Carlo", "portions": "12 pièces", "ingredients": "120g de farine, 80g de sucre, 30g de miel, 2 œufs, 40g de beurre fondu, 30g de noix de coco râpée, 1/2 sachet de levure. Garniture : 100g de confiture de framboises sans pépins, 100g de beurre pommade, 60g de sucre glace, 1 cuillère à café d'extrait de vanille.", "method": "Blanchir les œufs avec le sucre et le miel. Ajouter le beurre fondu, puis la farine, la levure et la noix de coco. À la poche, dresser des disques de 5 cm sur une plaque avec papier sulfurisé. Cuire à 180°C pendant 8 à 10 minutes. Laisser refroidir. Battre le beurre pommade avec le sucre glace et la vanille au batteur électrique pour obtenir une crème blanche mousseuse. À la poche, dresser une collerette de crème au beurre sur le contour plat d'un biscuit, poser une cuillère de confiture au centre, puis refermer avec un second biscuit. Réserver au frais.", "key": "biscuit monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 12, "id": 2, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 4, "name": "Bombe Glacée Monaco", "portions": "6 personnes", "ingredients": "Enveloppe : 40cl de crème anglaise vanillée, 2 cuillères à soupe d'eau de fleur d'oranger, 20cl de crème chantilly. Cœur : 3 jaunes d'œufs, 100g de sucre en sirop à 115°C, 150g de purée de framboises filtrée, 50g de fruits confits au kirsch, 20cl de crème chantilly.", "method": "Mélanger la crème anglaise, la fleur d'oranger et la chantilly. Turbiner en sorbetière, puis chemiser les parois d'un moule à bombe sur 1,5 cm d'épaisseur. Bloquer au congélateur 1 heure. Pour le cœur, fouetter les jaunes d'œufs en versant le sirop de sucre chaud jusqu'à refroidissement complet. Incorporer la purée de framboises, les fruits confits au kirsch et les derniers 20cl de chantilly. Remplir le centre vide du moule avec ce parfait rouge. Sceller et congeler 6 heures. Démouler après un passage rapide du moule dans l'eau tiède.", "key": "bombe glacee monaco", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 3, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 5, "name": "Bombe Monte-Carlo", "portions": "6 personnes", "ingredients": "Enveloppe : 40cl de crème anglaise, 60g de pralin en poudre, 20cl de crème chantilly. Cœur : 3 jaunes d'œufs, 100g de sucre en sirop à 115°C, 5cl de liqueur de curaçao blanc, 20cl de crème chantilly.", "method": "Associer la crème anglaise, le pralin et la chantilly. Turbiner en sorbetière et chemiser l'intérieur du moule à bombe. Placer au congélateur. Pour le centre, battre les jaunes avec le sirop de sucre chaud au batteur jusqu'à consistance mousseuse et froide. Ajouter le curaçao blanc et la chantilly. Remplir le cœur du moule avec ce parfait blanc. Fermer le moule et congeler pendant au moins 6 heures avant de démouler.", "key": "bombe monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 4, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 6, "name": "Coupe Monte-Carlo", "portions": "4 personnes", "ingredients": "500g de glace vanille, 1/2 melon, 2 pêches jaunes, 5cl de Grand Marnier, 20cl de crème liquide entière, 20g de sucre glace, 1 cuillère à soupe de sirop de violette.", "method": "Couper le melon et les pêches épluchées en dés de 1 cm. Les faire macérer 20 minutes au frais avec le Grand Marnier. Monter la crème liquide en chantilly ferme avec le sucre glace et le sirop de violette pour lui donner une teinte parme claire. Dans des coupes en cristal, disposer deux boules de glace vanille. Répartir les dés de fruits macérés tout autour, puis surmonter d'une rosace de chantilly à la violette à l'aide d'une poche douille cannelée. Servir immédiatement.", "key": "coupe monte carlo", "histoire": "Ce dessert rafraîchissant était servi lors des chaudes après-midis d'été sur les terrasses du Café de Paris. Les cuisiniers préparaient des dés de melons de Cavaillon et des pêches de la Riviera macérés au Grand-Marnier. Pour donner un air de fête digne de Monte-Carlo, la crème chantilly n'était pas blanche, mais délicatement teintée d'une couleur parme claire grâce à du sirop de violette pure. Une gourmandise florale et fruitée très élégante.", "resume": "Deux belles boules de glace vanille de Bourbon en coupe, entourées de dés de melons et de pêches jaunes macérés au Grand-Marnier, surmontées d'une rosace de chantilly teintée au sirop de violette.", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 5, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 7, "name": "Crème Glacée Monte-Carlo", "portions": "6 personnes", "ingredients": "40cl de lait entier, 10cl de crème fraîche, 5 jaunes d'œufs, 120g de sucre, 50g de pâte de pistache, 80g de coulis de framboises épais, 40g de pralines roses concassées.", "method": "Blanchir les jaunes avec le sucre. Chauffer le lait et la crème, verser sur les œufs et cuire à la nappe à feu doux sans faire bouillir. Incorporer la pâte de pistache hors du feu. Laisser refroidir et turbiner en sorbetière. Lorsque la glace est encore souple à la sortie de la turbine, y incorporer délicatement le coulis de framboises en filet et les pralines roses pour créer un effet marbré vert et rose. Bloquer au congélateur.", "key": "creme glacee monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 6, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 8, "name": "Crème Renversée à la Monégasque", "portions": "6 personnes", "ingredients": "50cl de lait entier, 4 œufs, 100g de sucre, 1 cuillère à soupe d'eau de fleur d'oranger, le zeste de 1/2 citron. Caramel : 100g de sucre, 3cl de sirop de mandarine.", "method": "Cuire le sucre et le sirop de mandarine en caramel blond. En napper le fond d'un moule. Chauffer le lait avec le zeste de citron. Fouetter les œufs et le sucre sans faire mousser, ajouter la fleur d'oranger, puis verser le lait chaud filtré. Verser dans le moule caramélisé. Cuire au bain-marie au four à 160°C pendant 40 à 45 minutes. Laisser refroidir et réserver 4 heures au frais avant de démouler.", "key": "creme renversee a la monegasque", "histoire": "C’est le flan familial du dimanche sur le Rocher, revisité avec les parfums typiques de la Principauté. Au lieu du caramel classique à l'eau, les mères de famille monégasques utilisaient du sirop de mandarine locale pour napper le moule. L'appareil aux œufs, infusé au zeste de citron et à l'eau de fleur d'oranger, cuisait doucement au bain-marie, offrant un dessert d'une douceur incroyable aux accents d'agrumes.", "resume": "Flan aux œufs traditionnel parfumé à la fleur d'oranger et au zeste de citron, cuit au bain-marie dans un moule préalablement nappé d'un caramel blond cuit au sirop de mandarine locale.", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 7, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 9, "name": "Crêpes Monte-Carlo", "portions": "4 personnes", "ingredients": "Pâte : 200g de farine, 3 œufs, 50cl de lait, 20g de beurre fondu, le zeste d'une mandarine. Garniture : 30cl de crème pâtissière, 6 macarons à l'ancienne écrasés, sucre glace.", "method": "Mélanger les ingrédients de la pâte, laisser reposer 30 minutes et cuire des crêpes fines au beurre. Incorporer les macarons écrasés en miettes dans la crème pâtissière froide. Tartiner chaque crêpe de cette crème, puis les plier en quatre. Disposer sur un plat, saupoudrer généreusement de sucre glace et passer un fer rougi au feu (ou un chalumeau) pour caraméliser instantanément.", "key": "crepes monte carlo", "histoire": "Une création née pour rivaliser avec la célèbre crêpe Suzette. Dans cette version de palace, la pâte à crêpes était parfumée aux zestes de mandarines de pays. Chaque crêpe était garnie d'une crème pâtissière froide dans laquelle on avait incorporé des macarons à l'ancienne écrasés. Pliées en quatre et saupoudrées de sucre, elles étaient caramélisées à table par le maître d'hôtel à l'aide d'un fer rougi au feu de bois.", "resume": "Crêpes fines aromatisées au zeste de mandarine, fourrées d'une crème pâtissière froide enrichie de macarons à l'ancienne écrasés, pliées en quatre, poudrées de sucre et caramélisées au fer rouge.", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 8, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 10, "name": "Crêpes Soufflées Monte-Carlo", "portions": "4 personnes", "ingredients": "8 crêpes fines cuites au beurre. Soufflé : 3 blancs d'œufs, 3 jaunes d'œufs, 80g de sucre, 25g de farine, 20cl de lait, 4cl de Grand-Marnier, sucre glace.", "method": "Faire une crème pâtissière épaisse en cuisant le lait, les jaunes, la farine et le sucre. Ajouter le Grand-Marnier hors du feu. Monter les blancs en neige ferme et les incorporer délicatement à la crème tiède. Étaler une belle cuillère de cet appareil sur la moitié de chaque crêpe, puis replier en quatre en triangle sans écraser. Ranger sur une plaque beurrée et cuire à 190°C pendant 6 à 8 minutes jusqu'à ce que les crêpes gonflent. Poudrer de sucre glace.", "key": "crepes soufflees monte carlo", "histoire": "Un spectacle visuel qui émerveillait la clientèle internationale des grands hôtels. Les crêpes fines étaient garnies d'un appareil à soufflé au Grand-Marnier très léger, puis pliées en triangles sans jamais écraser la farce. Enfournées à la minute, les crêpes gonflaient sous l'effet de la chaleur, offrant un dessert soufflé aérien, croustillant à l'extérieur et fondant au cœur.", "resume": "Crêpes fines tartinées d'un appareil à soufflé chaud au Grand-Marnier, pliées en triangles sans écraser la farce, rangées sur plaque beurrée et gonflées de manière spectaculaire au four chaud.", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 9, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 11, "name": "Fougasse Monégasque", "portions": "2 pièces", "ingredients": "500g de farine, 1 sachet de levure de boulanger, 10cl d'huile d'olive, 75g de sucre, 3 cuillères à soupe d'eau de fleur d'oranger, 1 pincée de sel, 50g d'amandes mondées, 30g de pignons de pin, 50g de dragées rouges et blanches concassées, 1 cuillère à café d'anis en grains.", "method": "Diluer la levure dans un peu d'eau tiède. Dans un grand saladier, mélanger la farine, le sucre, le sel et les grains d'anis. Incorporer l'huile d'olive, la fleur d'oranger, la levure activée et assez d'eau tiède pour pétrir une pâte à pain souple et élastique. Laisser lever 2 heures sous un linge. Étaler ensuite la pâte au rouleau sur une épaisseur d'un centimètre pour former deux galettes ovales. Badigeonner la surface d'un pinceau d'huile d'olive. Enfoncer délicatement dans la pâte les amandes, les pignons de pin et les éclats de dragées rouges et blanches. Laisser lever à nouveau 30 minutes. Enfourner à 180°C pendant 20 minutes jusqu'à ce que la fougasse soit cuite mais reste bien blonde.", "key": "fougasse monegasque", "histoire": null, "resume": null, "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 2, "infos": [{"fact": "La fougassette de Grasse est une brioche plate à la fleur d'oranger : sa forme ovale et ses sept trous symboliseraient le visage du Christ, et elle fait partie des treize desserts de Noël de la tradition niçoise.", "source_url": "https://cultivez-vous.nice.fr/patrimoine/les-13-desserts-de-noel/", "source_name": "Ville de Nice"}], "id": 10, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}, "dialectes": [{"lang": "munegascu", "name": "Fugassa (fougasse monégasque)", "fr": "brioche/fougasse sucrée à la fleur d'oranger et à l'anis, décorée de grains d'anis confits (fenuglieti) rouge et blanc aux couleurs du drapeau monégasque", "url": "https://www.fougasse.org/la-fougasse-de-monaco/", "quote": "la tradition veut qu'elle soit décorée aux couleurs du drapeau monégasque avec des grains d'anis confits appelés « fenuglieti » en monégasque, en rouge et blanc"}]}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 12, "name": "Fraises à la Monte-Carlo (ou Fraises Monte-Carlo)", "portions": "4 personnes", "ingredients": "400g de fraises des bois, 3cl de kirsch, 3cl de curaçao, le jus de 1 orange, 500g de glace vanille, 20cl de crème chantilly, 30g de pistaches vertes hachées.", "method": "Équeuter les fraises. Les faire macérer 30 minutes au frais avec le kirsch, le curaçao et le jus d'orange. Dans des coupes, disposer un lit de glace vanille. Répartir les fraises macérées par-dessus avec un peu de jus. À la poche, border le verre d'une rosace de crème chantilly et saupoudrer de pistaches hachées.", "key": "fraises a la monte carlo ou fraises monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 11, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 1, "tome_title": "Les Pâtisseries, Entremets & Douceurs Sucrées", "icon": "🍰", "num": 13, "name": "Le Galapian de Monaco", "portions": "6 personnes", "ingredients": "Pâte sablée : 250g de farine, 125g de beurre, 80g de sucre glace, 50g de poudre d'amandes, 1 œuf, 1 gousse de vanille. Garniture : 200g de melon confit, 150g de poudre d'amandes, 3 blancs d'œufs, 120g de sucre, 50g de cerises confites, 30g d'angélique confite. Lustrage : 3 cuillères à soupe de miel de lavande, 2 cuillères à soupe d'eau.", "method": "Préparer une pâte sablée (beurre, sucre glace, poudre d'amandes, œuf, farine, vanille) et en foncer un moule. Disposer sur le fond des tranches fines de melon confit (3 mm). Recouvrir d'un appareil aux amandes (blancs d'œufs montés, sucre, poudre d'amandes) formé en dôme. Décorer de cerises confites et d'angélique. Cuire à 220°C pendant 12 à 15 minutes. Une fois cuit, lustrer d'un sirop de miel (miel de lavande + eau).", "key": "le galapian de monaco", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "method_note": "Le manuscrit ne donnait que les ingrédients. Méthode reconstituée d'après la recette traditionnelle du galapian d'Apt (spécialité créée en 1994). Les quantités ont été rétablies d'après les ingrédients cités dans la méthode.", "method_source": "Julie Andrieu / Les Fleurons d'Apt", "method_source_url": "https://www.julieandrieu.com/recettes/galapian-aux-fruits-confits-de-michele-gay", "infos": [{"fact": "Le « galapian » est en réalité une spécialité d'Apt (Vaucluse), créée en octobre 1994 par le pâtissier Alain Bouchard à la demande de la Confrérie du Fruit Confit d'Apt.", "source_url": "https://www.julieandrieu.com/recettes/galapian-aux-fruits-confits-de-michele-gay", "source_name": "julieandrieu.com"}], "id": 12, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 1, "name": "Consommés Alexandra Monte-Carlo", "portions": "4 personnes", "ingredients": "1 litre de bouillon de volaille, 2 cailles, 3 jaunes d'œufs, 5cl de crème liquide, 10cl de purée d'asperges vertes, 30g de parmesan râpé, sel, poivre.", "method": "Rôtir les cailles au four. Mettre les carcasses et les sucs dans le bouillon de volaille et mijoter 45 minutes pour corser le tout. Filtrer au tamis de soie. Faire la royale d'asperges : mélanger les jaunes, la crème et la purée d'asperges. Cuire au bain-marie à 120°C pendant 20 minutes jusqu'à ce que ce soit pris, puis couper en petits dés après refroidissement. Faire des paillettes de parmesan en étalant le fromage sur une plaque et en le dorant au four. Servir le consommé brûlant avec les dés de royale et les paillettes.", "key": "consommes alexandra monte carlo", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 13, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 2, "name": "Consommé à la Monégasque (Formule du XIXe siècle)", "portions": "pour 4 personnes", "ingredients": "1 kg de paleron de bœuf, 1 carcasse de perdreau rôti, 2 carottes, 1 poireau, 1 oignon piqué d'un clou de girofle, 100g de pâte à ravioles fine, 100g de feuilles de blettes (vert uniquement), 30g de moelle de bœuf, sel fin.", "method": "1. Placez le paleron de bœuf, la carcasse de perdreau et tous les légumes dans une grande marmite d'eau froide salée. Portez lentement à ébullition. 2. Écumez soigneusement la surface dès les premiers bouillons. Baissez le feu au minimum et laissez mijoter très doucement pendant 4 heures à découvert pour obtenir un consommé double bien concentré. 3. Clarifiez le bouillon chaud en y versant un blanc d'œuf battu, portez à ébullition sans remuer pour que le blanc emprisonne les impuretés, puis filtrez à travers une étamine fine. 4. Préparez la garniture : lavez le vert des blettes et hachez-le très finement. Faites-le suer à la poêle avec une noisette de beurre pendant 5 minutes. Faites pocher la moelle de bœuf dans un peu de bouillon chaud pendant 3 minutes, puis écrasez-la à la fourchette et mélangez-la aux blettes refroidies. Saler et poivrer. 5. Étalez la pâte à ravioles. Déposez de minuscules tas de farce aux blettes, repliez la pâte et découpez de très petits raviolis carrés. Faites-les pocher séparément dans une casserole d'eau bouillante salée pendant 3 minutes, puis égouttez-les. 6. Glissez les mini-ravioles égouttées directement dans le consommé limpide et brûlant juste avant de porter à table.", "key": "consomme a la monegasque formule du xixe siecle", "histoire": "Dans le Monaco du XIXe siècle, les dimanches d'hiver étaient souvent l'occasion de préparer un grand pot-au-feu avec du paleron de bœuf. Les chasseurs du Rocher y ajoutaient parfois un perdreau pour corser le bouillon. La grande originalité de votre grand-père était d'y jeter, au moment du service, de minuscules ravioles de blettes et de moelle de bœuf pochée. C'était le potage de fête par excellence des grandes familles monégasques.", "resume": "Bouillon double de paleron de bœuf et de carcasse de perdreau rôti, clarifié ; garni au moment du service de minuscules ravioles de pâte fine farcies de vert de blettes sué et de moelle de bœuf pochée.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 14, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 3, "name": "Consommé à la Monégasque (Variante au Pesto)", "portions": "pour 4 personnes", "ingredients": "1 litre de bouillon de volaille clarifié et dégraissé, 50g de petites pâtes rondes (type \"perles\"). Pour le pisto frais : 1 bouquet de basilic frais, 2 gousses d'ail, 20g de pignons de pin, 5cl d'huile d'olive vierge, 30g de parmesan râpé, sel fin.", "method": "1. Portez le bouillon de volaille clarifié à ébullition dans une casserole. Jetez-y les pâtes \"perles\" et laissez-les cuire à petits bouillons pendant le temps indiqué sur le paquet (environ 7 à 8 minutes) pour qu'elles restent légèrement al dente. 2. Pendant la cuisson des pâtes, préparez le pisto traditionnel de la Riviera : pelez les gousses d'ail et retirez le germe. Dans un mortier en marbre, pilez les gousses d'ail avec une pincée de sel fin et les pignons de pin jusqu'à obtenir une pâte compacte. 3. Ajoutez les feuilles de basilic frais préalablement lavées et séchées. Broyez-les énergiquement contre les parois du mortier en effectuant des mouvements circulaires jusqu'à ce que les feuilles soient totalement réduites en purée verte. 4. Incorporez le parmesan râpé, puis versez l'huile d'olive vierge en un mince filet tout en continuant de tourner avec le pilon pour monter et lier l'émulsion. 5. Pour le dressage : répartissez le consommé brûlant avec ses petites pâtes perles dans des assiettes creuses. 6. Déposez délicatement une belle cuillère à café de pisto frais au centre de chaque assiette. Servez immédiatement ; les convives mélangeront eux-mêmes la pommade au basilic dans le bouillon chaud pour libérer tous les parfums.", "key": "consomme a la monegasque variante au pesto", "histoire": "Ce bouillon incarne la cuisine d'été du port de Monaco. Les petites pâtes rondes, appelées \"perles\" ou \"plombs\", étaient cuites directement dans le bouillon de volaille. Au moment de servir dans les soupières, on y ajoutait une généreuse cuillère de pisto frais (la version locale du pesto, sans pignons parfois, mais toujours avec beaucoup d'ail et de basilic broyés à l'huile d'olive). En se dissolvant dans le bouillon brûlant, le pisto libérait un parfum qui embaumait toute la salle à manger.", "resume": "Bouillon de volaille limpide cuit avec de petites pâtes rondes \"perles\" al dente ; servi avec une cuillère de pisto de la Riviera (basilic, ail, pignons, parmesan pilés à l'huile d'olive) déposée au centre.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 15, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 4, "name": "Consommé Châtelaine Monte-Carlo", "portions": "pour 4 personnes", "ingredients": "1 litre de bouillon de volaille ambré, 1 pied de céleri branche, 3 jaunes d'œufs, 10cl de purée de marrons de l'arrière-pays (nature, non sucrée), 5cl de lait entier, 1 truffe noire fraîche, 80g de blanc de chapon cuit, sel fin, poivre.", "method": "1. Lavez et émincez finement le pied de céleri branche. Jetez-le dans le bouillon de volaille chaud, portez à frémissement, puis éteignez le feu. Laissez infuser à couvert pendant 30 minutes pour parfumer le bouillon, puis filtrez pour obtenir un liquide limpide. 2. Préparez la royale de marrons : dans un saladier, mélangez vigoureusement les jaunes d'œufs, la purée de marrons nature et le lait jusqu'à obtenir un appareil lisse. Assaisonnez d'une pincée de sel. 3. Versez la préparation dans un ramequin beurré. Faites cuire au bain-marie dans un four préchauffé à 130°C pendant 25 minutes. Laissez refroidir complètement à température ambiante, puis démoulez la royale et taillez-la en petits cubes réguliers de 5 mm. 4. À l'aide d'un couteau très bien aiguisé, taillez la truffe noire fraîche et le blanc de chapon cuit en une julienne d'une finesse extrême (fins filaments). 5. Au moment du service, disposez les cubes de royale de marrons, la julienne de chapon et les filaments de truffe noire au fond d'une soupière chaude. Verser délicatement le consommé de céleri bouillant par-dessus et servez.", "key": "consomme chatelaine monte carlo", "histoire": "Le style \"Châtelaine\" en Haute Cuisine exige toujours l'utilisation de marrons et de céleri. À Monte-Carlo, cette formule est devenue un classique des dîners de chasse automnaux. Le bouillon de volaille était longuement infusé avec du céleri branche, puis clarifié. Les dés de royale de marrons de l'arrière-pays et la fine julienne de chapon truffé en faisaient un potage lourd en arômes mais d'une légèreté absolue en bouche, très prisé des gourmets de l'époque.", "resume": "Bouillon de volaille infusé au céleri branche et filtré ; garni de dés de royale de marrons (jaunes, lait, purée de marrons cuits au bain-marie), d'une fine julienne de blanc de chapon et de filaments de truffe noire.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 16, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 5, "name": "Consommé Monaco", "portions": "pour 4 personnes", "ingredients": "1 litre de bouillon de volaille légèrement lié (type velouté léger), 1 petite carotte, 1 petit navet, 1 truffe noire fraîche, 20g de perles du Japon (tapioca), 10 petites profiteroles vides en pâte à choux (taille d'une noisette), sel.", "method": "1. Épluchez la carotte et le navet. Taillez-les avec patience en une minuscule brunoise (dés microscopiques d'un millimètre de côté). Faites-les pocher à blanc dans une petite casserole d'eau bouillante salée pendant 5 minutes pour qu'ils soient tendres, puis égouttez-les. 2. Portez une casserole d'eau à ébullition et jetez-y les perles du Japon. Laissez-les cuire à petits bouillons pendant une quinzaine de minutes jusqu'à ce qu'elles deviennent totalement transparentes. Égouttez-les et passez-les sous l'eau froide pour stopper la cuisson. 3. Brossez la truffe noire et taillez-la également en petits dés de la même taille que les légumes. 4. Faites chauffer le bouillon de volaille légèrement lié dans une grande casserole. Ajoutez-y les perles du Japon cuites, la brunoise de carotte et navet, ainsi que les dés de truffe noire. Laissez frémir pendant 2 minutes pour infuser les saveurs. 5. Juste au moment de porter la soupière sur la table, jetez les petites profiteroles vides et bien croustillantes directement dans le bouillon chaud pour qu'elles flottent à la surface. Servir immédiatement pour que les choux gardent du croquant.", "key": "consomme monaco", "histoire": "Ce consommé lié et perlé au tapioca (appelé à l'époque perles du Japon) était le potage officiel servi lors des fêtes nationales ou des réceptions au Palais de Monaco. La brunoise de légumes colorés et les dés de truffe noire flottaient parmi les perles transparentes, créant un effet visuel magique. Pour parfaire ce chef-d'œuvre, on jetait au dernier moment de mini-profiteroles en pâte à choux qui restaient croustillantes à la surface du bouillon.", "resume": "Bouillon de volaille blanc enrichi de perles du Japon (tapioca) cuites transparentes, d'une brunoise microscopique de carotte et navet pochée, de dés de truffe et de mini-profiteroles en pâte à choux de la taille d'une noisette.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 17, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 6, "name": "Consommé Monte-Carlo", "portions": "pour 4 personnes", "ingredients": "1 litre de bouillon de volaille riche, 1 blanc d'œuf frais (pour la clarification), 1/2 laitue romaine, 1 petit bouquet de cerfeuil frais, 10 mini-profiteroles sèches en pâte à choux, sel fin.", "method": "1. Pour garantir la limpidité parfaite exigée dans les palaces, clarifiez le bouillon : battez le blanc d'œuf dans le bouillon de volaille froid. Portez le tout à ébullition à feu moyen sans jamais remuer. Le blanc d'œuf va coaguler, monter et emprisonner toutes les impuretés en formant une croûte à la surface. 2. Retirez délicatement cette croûte à l'écumoire et filtrez le consommé à travers un entonnoir garni d'une étamine ou d'un linge fin propre. Le bouillon doit être parfaitement limpide. 3. Lavez la demi-laitue et émincez-la en une très fine chiffonnade. Plongez cette chiffonnade pendant 1 minute seulement dans de l'eau bouillante salée pour la blanchir, puis rafraîchissez-la immédiatement dans de l'eau glacée pour fixer sa couleur. Égouttez-les en pressant dans vos mains. 4. Lavez et effeuillez le cerfeuil frais pour ne garder que les petites pluches. 5. Dans les tasses à consommé ou les assiettes creuses, répartissez la chiffonnade de laitue bien essorée et les pluches de cerfeuil sauvage. Versez le consommé de volaille fumant par-dessus. 6. Servez les petites profiteroles bien sèches et croustillantes dans une assiette à part : les invités s'amuseront à les jeter eux-mêmes dans leur bouillon au dernier moment.", "key": "consomme monte carlo", "histoire": "Un grand classique imaginé par Auguste Escoffier pour la clientèle internationale du Casino. Après les longues soirées de jeu, les riches hivernants réclamaient un bouillon léger pour apaiser l'estomac. Ce consommé de volaille était clarifié au blanc d'œuf jusqu'à devenir aussi transparent que du cristal. La chiffonnade de laitue blanchie et les pluches de cerfeuil apportaient une touche de verdure printanière, et les mini-profiteroles étaient servies à part pour que chacun gère son croquant.", "resume": "Bouillon double de volaille clarifié à la perfection ; garni d'une fine chiffonnade de laitue romaine blanchie et rafraîchie et de pluches de cerfeuil ; accompagné à part d'assiettes de mini-profiteroles sèches et croustillantes.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 18, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 7, "name": "Consommé aux nids d'hirondelles à la Monégasque", "portions": "4 personnes", "ingredients": "1 litre de bouillon de volaille double, 30g de nids d'hirondelles séchés, 1 grosse truffe noire.", "method": "Tremper les nids d'hirondelles dans l'eau tiède pendant 2 heures pour qu'ils gonflent, puis les nettoyer des impuretés. Les pocher doucement dans le bouillon pendant 30 minutes jusqu'à ce qu'ils soient fondants. Couper la truffe en tranches puis en losanges réguliers (forme du blason). Mettre les nids d'hirondelles et les losanges de truffe dans les assiettes, verser le bouillon bouillant filtré.", "key": "consomme aux nids d hirondelles a la monegasque", "histoire": "Au tournant du XXe siècle, la Belle Époque s'est entichée de produits exotiques venus d'Asie. Les nids d'hirondelles (des structures gélatineuses très rares) étaient importés à prix d'or pour les tables de Monte-Carlo. Les chefs locaux ont christianisé ce bouillon asiatique en y ajoutant la touche princière de la Riviera : de grandes lames de truffe noire fraîche taillées en forme de losanges pour imiter le blason de Monaco. C’était le potage le plus cher de la Côte d'Azur.", "resume": "Bouillon de volaille double dans lequel ont poché pendant 30 minutes de véritables nids d'hirondelles réhydratés et nettoyés à la pince ; garni de tranches de truffe noire taillées en losanges (blason).", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 19, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 8, "name": "Consommé Princesse de Monaco", "portions": "4 personnes", "ingredients": "1 litre de bouillon de volaille, 2 blancs d'œufs, 3 jaunes d'œufs, 10cl de purée d'asperges blanches, 5cl de crème, 1 carotte, 1 courgette, 80g de blanc de volaille cuit.", "method": "Clarifier le bouillon avec les blancs d'œufs et filtrer. Faire la royale : mélanger les jaunes, la purée d'asperges et la crème. Cuire au bain-marie à 120°C pendant 20 minutes, puis couper en petits dés. Faire de petites perles de carotte et courgette à la cuillère parisienne et les cuire à l'eau. Couper la volaille en dés. Assembler la royale, les perles de légumes et la volaille, puis verser le consommé brûlant.", "key": "consomme princesse de monaco", "histoire": "Dédié aux princesses de la Maison Grimaldi, ce consommé d'une grande délicatesse exigeait un travail d'orfèvre en cuisine. La carotte et la courgette étaient sculptées à la cuillère parisienne pour obtenir des billes microscopiques, symbolisant des perles précieuses. Accompagné de dés de royale d'asperges blanches et de blancs de volaille, ce potage d'une blancheur immaculée ouvrait les dîners de gala au Palais Princier.", "resume": "Bouillon de volaille clarifié ; garni de dés de royale d'asperges blanches, de billes microscopiques (perles) de carottes et de courgettes prélevées à la cuillère parisienne, et de petits dés réguliers de blanc de volaille cuit.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 20, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 9, "name": "Crème Monte-Carlo", "portions": "4 personnes", "ingredients": "300g de blancs de volaille, 200g de cèpes, 40g de beurre de truffe, 1 litre de bouillon de volaille, 3 jaunes d'œufs, 15cl de crème liquide, mini-croûtons.", "method": "Pocher la volaille dans le bouillon. Sauter les cèpes émincés dans la moitié du beurre de truffe. Mixer la volaille et les cèpes avec le bouillon de cuisson, puis passer au tamis fin pour faire un velouté lisse. Battre les jaunes avec la crème. Verser dans le velouté chaud hors du feu en fouettant. Frire les croûtons dans le reste de beurre de truffe et les ajouter sur la crème chaude.", "key": "creme monte carlo", "histoire": "Ce velouté onctueux est né de la cueillette des cèpes dans les forêts des Alpes-Maritimes. Les chefs de palace achetaient ces champignons aux montagnards descendus à Monaco. Le velouté de volaille et de cèpes était passé à travers un tamis de soie pour obtenir une texture de crème unie sans aucune fibre. Liée aux jaunes d'œufs et enrichie de croûtons frits au beurre de truffe, cette crème était le réconfort des journées d'hiver pluvieuses sur la Riviera.", "resume": "Blanches de volaille pochés et cèpes sautés au beurre de truffe, mixés longuement avec le bouillon et passés au tamis de soie ; la crème obtenue est liée hors du feu aux jaunes d'œufs et crème, parsemée de croûtons au beurre de truffe.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 21, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 10, "name": "Crème de Volaille à la Monégasque", "portions": "4 personnes", "ingredients": "1 litre de velouté de volaille (bouillon lié au roux), 2 jaunes d'œufs, 10cl de crème fraîche, 50g de jambon cru, 50g de champignons, 1 truffe noire.", "method": "Chauffer le velouté. Mélanger les jaunes et la crème, puis incorporer cette liaison au velouté chaud hors du feu en remuant pour obtenir une texture onctueuse. Couper le jambon, les champignons étuvés au beurre et la truffe en julienne très fine. Mettre cette julienne au fond des assiettes et verser la crème chaude par-dessus.", "key": "creme de volaille a la monegasque", "histoire": "C'est la version bourgeoise et enrichie du velouté de volaille. Les carnets de votre grand-père rappellent que le secret de cette crème réside dans sa garniture tricolore ajoutée au dernier moment. Les filaments de jambon cru de pays apportaient le goût salé et rustique, les champignons la douceur, et la truffe noire le faste des grandes tables. Une entrée très douce qui plaisait beaucoup aux dames lors des déjeuners mondains.", "resume": "Velouté de volaille lié hors du feu à la crème épaisse et aux jaunes d'œufs pour obtenir une texture nappante ; versé chaud dans les assiettes sur une très fine julienne de jambon cru de pays, champignons et truffe noire.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 22, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 11, "name": "Velouté Monte-Carlo", "portions": "4 personnes", "ingredients": "1 faisan, 1 carotte, 1 oignon, 1 bouquet garni, 50g de poudre d'amandes amères, 1 litre de bouillon de gibier, 30g de beurre de truffe, 1 truffe noire.", "method": "Rôtir le faisan au four avec la carotte et l'oignon. Le désosser et garder la chair. Cuire la carcasse dans le bouillon de gibier avec le bouquet garni 30 minutes, puis filtrer. Mixer la chair du faisan avec la poudre d'amandes et le bouillon chaud. Passer au tamis de soie. Chauffer, ajouter le beurre de truffe pour lier. Couper la truffe fraîche en petites billes (perles) et les mettre dans le velouté chaud au moment de servir.", "key": "veloute monte carlo", "histoire": "Le gibier à plumes était très apprécié lors des banquets d'hiver à Monte-Carlo. Pour ce velouté de grand luxe, le faisan était d'abord rôti entier au four pour concentrer ses sucs. Sa chair était ensuite mixée avec une poudre fine d'amandes amères, une technique ancienne qui apportait une douceur subtile masquant la force de la venaison. Agrémenté de petites perles de truffe noire, ce velouté était servi dans des tasses en porcelaine fine lors des soupers fins après le Casino.", "resume": "Chair de faisan rôtie mixée avec de la poudre d'amandes amères et un bouillon de gibier corsé, passée au tamis de soie ; liée au beurre de truffe noire et garnie à l'envoi de petites billes (perles) façonnées dans de la truffe fraîche.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 23, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 12, "name": "Velouté des Princes de Monaco", "portions": "4 personnes", "ingredients": "200g de pois chiches secs (trempés la veille), 1 litre de bouillon de veau blanc, 1 oignon, 1 branche de sauge, 40g de beurre, 1 truffe noire, 80g de blanc de volaille cuit.", "method": "Cuire les pois chiches dans le bouillon de veau avec l'oignon et la sauge pendant 1h15. Retirer la sauge. Mixer longuement et passer au tamis fin pour enlever les peaux et obtenir une crème lisse. Chauffer, ajouter le beurre à la spatule pour lier. Couper la truffe et la volaille en julienne très fine. Mettre la julienne au centre des bols et verser le velouté chaud.", "key": "veloute des princes de monaco", "histoire": "Ce potage d'une grande originalité s'inspire directement de la socca et de la panisse, ces spécialités à base de farine de pois chiches très populaires à Monaco. Les pois chiches étaient cuits longuement avec de la sauge fraîche, puis passés au tamis de crin pour obtenir une crème d'une douceur absolue, sans aucune peau. Monté au beurre fin et garni d'une julienne de truffe et de volaille, ce velouté rustique-chic était le trait d'union parfait entre le terroir populaire et la table des princes.", "resume": "Pois chiches secs cuits au bouillon de veau avec oignon et sauge, mixés et passés au tamis pour éliminer les peaux ; le velouté lié au beurre fin est garni d'une julienne de truffe noire et de blanc de volaille.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 24, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 13, "name": "Potage Velouté à la Monégasque", "portions": "4 personnes", "ingredients": "3 blancs de poireaux, 3 pommes de terre, 50g de beurre, 1 litre de bouillon de légumes, 15cl de crème fraîche double, 5cl d'huile d'olive, 10 feuilles de basilic.", "method": "Suer les poireaux émincés au beurre sans coloration. Ajouter les pommes de terre en dés, le bouillon, le sel et le poivre. Cuire 25 minutes. Mixer et passer au tamis. Ajouter la crème double. Piler le basilic au mortier avec l'huile d'olive en filet pour faire une huile verte. Servir le velouté chaud avec un cordon d'huile de basilic sur le dessus.", "key": "potage veloute a la monegasque", "histoire": "Ce potage familial met à l'honneur les légumes des jardins de Menton et de Roquebrune : le poireau et la pomme de terre. Pour en faire un plat digne de Monaco, les cuisiniers remplaçaient le beurre ordinaire par une liaison finale à la crème double et, surtout, par un cordon d'huile d'olive d'un vert éclatant infusée au basilic frais pillé au mortier. C’était le mariage parfait entre la douceur de la soupe et la force de l'huile d'olive de pays.", "resume": "Soupe de blancs de poireaux sués au beurre et de pommes de terre, mixée et passée au tamis fin, enrichie de crème double ; servie décorée d'une collerette d'huile d'olive verte infusée au basilic frais pilé au mortier.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 25, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 14, "name": "Potage à la Monégasque (XIXe siècle)", "portions": "4 personnes", "ingredients": "1 kg de poissons de roche, 1 oignon, 2 gousses d'ail, 2 tomates, 1 dosette de safran, 1 baguette de pain, 1 branche de fenouil sauvage, 10cl d'huile d'olive.", "method": "Suer l'oignon et l'ail à l'huile d'olive. Ajouter les tomates concassées, le fenouil et les poissons de roche. Saisir 5 minutes en écrasant les poissons. Mouiller avec 2 litres d'eau bouillante, ajouter le safran et bouillir 30 minutes. Passer au moulin à légumes grille fine, puis filtrer. Frotter les tranches de pain d'ail et d'un filet d'huile. Les mettre au fond de la soupière et verser le bouillon bouillant par-dessus.", "key": "potage a la monegasque xixe siecle", "histoire": "Avant l'arrivée des palaces et du luxe, Monaco vivait de la pêche. Ce potage rustique du XIXe siècle était préparé par les familles de marins avec les petits poissons de roche invendus au marché du port. Le bouillon, fortement safrané et aillé, n'était pas mixé mais filtré, puis versé bouillant sur de grosses tranches de pain de campagne rassis frottées d'ail. C’était le repas chaud qui réchauffait les pêcheurs après les nuits en mer.", "resume": "Bouillon de petits poissons de roche safrané, concentré à l'ail, tomates et fenouil sauvage, filtré à l'étamine ; versé bouillant dans la soupière sur des tranches de pain de campagne frottées d'ail et à l'huile.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 26, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 15, "name": "Soupe de Poissons de Roche à la Monégasque", "portions": "4 personnes", "ingredients": "1500g de poissons de roche (rougets de roche, rascasses, girelles), les foies des rougets réservés crus, 1 oignon, 3 gousses d'ail, 1 branche de céleri, 1 cuillère à soupe de concentré de tomate, 1 dose de safran, 10cl d'huile d'olive, 1 pincée de piment de Cayenne, sel, poivre, croûtons frottés à l'ail.", "method": "Vider et écailler les poissons de roche en réservant précieusement les foies des rougets, crus, dans un bol. Émincer l'oignon, l'ail et le céleri. Dans une grande marmite, chauffer l'huile d'olive et y saisir les poissons à feu vif jusqu'à ce que les chairs éclatent. Ajouter l'oignon, l'ail, le céleri et le concentré de tomate, puis remuer 5 minutes sans laisser attacher. Mouiller à hauteur d'eau bouillante, saler, poivrer et ajouter le safran. Laisser bouillir à gros bouillons 20 minutes pour que les chairs se défassent. Passer la soupe au moulin à légumes, puis au chinois en pressant fortement pour extraire tous les sucs. Écraser au pilon les foies de rougets crus avec un filet d'huile d'olive jusqu'à obtenir une pommade lisse. Hors du feu, dans le bouillon encore bouillant, incorporer cette pommade au fouet : la soupe épaissit aussitôt et prend son velouté. Rectifier l'assaisonnement et servir brûlant avec des croûtons frottés à l'ail.", "method_note": "Méthode reconstituée d'après le procédé décrit dans la notice du manuscrit : poissons de roche saisis à feu vif, mouillement safrané, puis liaison au pilon avec les foies de rougets crus et l'huile d'olive.", "key": "soupe de poissons de roche a la monegasque", "histoire": "C’est la reine des soupes marines de la Principauté, la cousine monégasque de la bouillabaisse. Sa texture est beaucoup plus dense et liée que le potage au pain. Le grand secret des pêcheurs du Rocher, scrupuleusement consigné par votre grand-père, était de récupérer les foies des rougets de roche crus, de les écraser au pilon avec un filet d'huile d'olive et d'ajouter cette pommade directement dans le bouillon bouillant. C'est cette liaison aux foies qui donne à la soupe son goût puissant et sa texture veloutée unique.", "resume": "Poissons de roche (rougets, rascasses, girelles) saisis à feu vif avec ail, oignon, céleri et concentré de tomate, mouillés à l'eau et safranés ; la soupe passée est liée au pilon avec les foies des rougets et de l'huile.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "infos": [{"fact": "Jusqu'au XIXe siècle, la bouillabaisse était un plat de pêcheurs marseillais anti-gaspillage : on y cuisinait les poissons de roche abîmés, trop petits ou invendables au marché (rascasse, grondin, congre, saint-pierre…).", "source_url": "https://generationvoyage.fr/bouillabaisse-marseille/", "source_name": "generationvoyage.fr"}], "id": 27, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 2, "tome_title": "Les Potages, Consommés & Soupes Claires", "icon": "🥣", "num": 1, "name": "Consommé Alexandra Monte-Carlo", "portions": "pour 4 personnes", "ingredients": "1 litre de bouillon de volaille, 2 cailles prêtes à cuire, 3 jaunes d'œufs, 5cl de crème liquide entière, 10cl de purée d'asperges vertes fine, 30g de parmesan râpé, sel fin, poivre du moulin.", "method": "1. Préchauffez le four à 200°C et faites rôtir les cailles pendant 15 minutes. Lorsqu'elles sont bien dorées, levez les filets et réservez-les. Récupérez toutes les carcasses et les sucs de cuisson du plat. 2. Jetez les carcasses écrasées et les sucs dans le bouillon de volaille. Portez à ébullition, puis baissez le feu et laissez mijoter à petits frémissements pendant 45 minutes pour corser le bouillon. Filtrez le tout à travers un tamis de soie ou un linge fin. 3. Préparez la royale d'asperges : dans un bol, fouettez énergiquement les jaunes d'œufs, la crème liquide et la purée d'asperges vertes. Salez et poivrez. 4. Versez cette préparation dans un petit moule plat (sur une épaisseur d'un centimètre). Faites cuire au bain-marie dans un four préchauffé à 120°C pendant 20 minutes jusqu'à ce que l'appareil soit parfaitement pris. Laissez refroidir complètement, puis découpez la royale en petits dés réguliers. 5. Préparez les paillettes : mélangez le parmesan râpé avec une cuillère à soupe de blanc d'œuf. Étalez ce mélange très finement sur une plaque recouverte de papier sulfurisé et faites dorer au four pendant 5 minutes. Laissez refroidir et cassez en éclats (paillettes). 6. Pour le service : répartissez les dés de royale d'asperges et les filets de cailles coupés en morceaux au fond de la soupière. Versez le consommé de caille brûlant par-dessus et parsemez de paillettes de parmesan croustillantes au dernier moment.", "key": "consomme alexandra monte carlo", "histoire": "Ce consommé royal a été baptisé en l'honneur de la reine Alexandra, épouse du roi Édouard VII d'Angleterre, qui aimait passer ses hivers sur la Côte d'Azur et dînait souvent à Monte-Carlo. Pour plaire à la souveraine, les cuisiniers ont corsé un bouillon de volaille avec des cailles rôties. La \"royale d'asperges\" apportait une texture fondante sur la langue, tandis que les paillettes de parmesan dorées rappelaient la proximité et l'influence de l'Italie.", "resume": "Bouillon de volaille corsé par l'infusion de carcasses de cailles rôties et de leurs sucs, clarifié ; garni de cubes de royale d'asperges (jaunes, crème, purée d'asperges cuits au bain-marie) et de paillettes de parmesan dorées.", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 28, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 1, "name": "Canapés à la Monégasque", "portions": "4 personnes", "ingredients": "1 pain de mie entier, 80g de beurre à la Monégasque, 1 boîte de thon blanc à l'huile d'olive, 3 œufs de caille, 6 filets d'anchois à l'huile, 1 cuillère de câpres.", "method": "Tailler des disques de pain de mie de 5 cm. Les faire frire à la poêle dans du beurre jusqu'à ce qu'ils soient bien dorés. Laisser refroidir. Cuire les œufs de caille à l'eau bouillante 4 minutes, les écaler et les couper en rondelles. Tartiner les toasts froids de beurre d'anchois. Émietter le thon blanc et en déposer un petit dôme sur chaque toast. Poser une rondelle d'œuf de caille au sommet. Enrouler un filet d'anchois autour d'une câpre et poser ce dôme au sommet du canapé. Servir frais.", "key": "canapes a la monegasque", "histoire": "Avec l'arrivée de la Haute Société britannique à Monte-Carlo vers 1880, la mode des \"savouries\" et des toasts apéritifs s'est installée dans la Principauté. Les cuisiniers locaux ont adapté cette tradition anglaise en créant un canapé mariant le thon blanc, le beurre d'anchois et l'œuf de caille. Ce toast graphique, couronné d'une câpre, ouvrait les banquets d'apparat au bord de la Méditerranée.", "resume": "Disques de pain de mie frits au beurre, masqués de beurre d'anchois ; surmontés d'un dôme de thon blanc à l'huile émulsionné, d'une rondelle d'œuf de caille dur et d'un filet d'anchois roulé sur une câpre fine.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 29, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 2, "name": "Canapés Monte-Carlo", "portions": "4 personnes", "ingredients": "6 tranches de pain de mie, 50g de beurre fin, 6 tranches de langue de bœuf écarlate cuite, 2 truffes noires, 2 œufs durs, 20cl de gelée de viande ambrée liquide.", "method": "Tartiner le pain de mie de beurre. Utiliser un emporte-pièce rond pour couper ensemble le pain et la langue de bœuf afin d'obtenir des disques parfaits. Hacher séparément et finement les truffes, les blancs d'œufs durs et les jaunes d'œufs durs. Déposer ces trois éléments sur la langue de bœuf pour former des motifs géométriques (comme un blason). Poser les canapés sur une grille. Napper doucement le dessus avec la gelée de viande tiède liquide. Mettre au frais 30 minutes pour faire figer la gelée avant de servir.", "key": "canapes monte carlo", "histoire": "Ce canapé est une création purement géométrique imaginée par les maîtres d'hôtel de la Belle Époque pour impressionner les joueurs fortunés du Casino. Le hachis tricolore (noir pour la truffe, blanc et jaune pour l'œuf) était disposé en losanges pour reproduire fidèlement les fusées rouges et blanches des armoiries de la Maison Grimaldi. Un chef-d'œuvre visuel servi sur des plateaux d'argent.", "resume": "Croûtons de pain de mie beurrés, surmontés d'un disque parfait de langue de bœuf écarlate cuite ; décor géométrique tricolore de truffe noire hachée, blanc d'œuf et jaune d'œuf dur ; lustrés à la gelée de viande ambrée.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 30, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 3, "name": "Cassolettes Monte-Carlo", "portions": "4 personnes", "ingredients": "200g de champignons de Paris, 30g de beurre, 10cl de crème fraîche double, 150g de ris de veau blanchis, 1 petite truffe noire, 15cl de sauce veloutée de volaille.", "method": "Hacher très finement les champignons et les faire suer au beurre jusqu'à évaporation de l'eau. Ajouter la crème double, saler, poivrer et laisser réduire pour faire une duxelles liée. Couper les ris de veau et la truffe en petits dés (salpicon). Dans des cassolettes individuelles, mettre un lit de duxelles de champignons. Répartir le salpicon de ris de veau et de truffe par-dessus. Napper de sauce veloutée blanche. Passer sous le gril du foir 3 minutes pour glacer avant de servir brûlant.", "key": "cassolettes monte carlo", "histoire": "À la Belle Époque, Monte-Carlo était le centre du monde pour la colonie russe fortunée et les ducs européens. Ces cassolettes individuelles en porcelaine ont été créées dans les grands palaces pour offrir une entrée chaude, riche et raffinée. Le mariage de la duxelles de champignons crémée, du ris de veau et de la truffe noire était le symbole du luxe absolu exigé par cette clientèle cosmopolite.", "resume": "Ramequins individuels tapissés d'une duxelles de champignons de couche liée à la crème double ; garnies d'un salpicon de ris de veau braisés et de truffes noires ; nappées de velouté blanc et glacées sous la salamandre.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 31, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title": "Les Entrées, Hors-d'œuvre & l'Art des Œufs", "icon": "🥖", "num": 4, "name": "Crépinettes de Ris de Veau à la Monégasque", "portions": "4 personnes", "ingredients": "200g de ris de veau blanchis, 100g de cèpes, 4 filets d'anchois, 15cl de sauce tomate très réduite, 1 crépine de porc, 40g de beurre noisette.", "method": "Couper les ris de veau, les cèpes sautés et les filets d'anchois en petits dés (salpicon). Mélanger ce salpicon avec la sauce tomate serrée pour faire un mélange compact. Laver la crépine de porc à l'eau froide et l'étaler. Diviser la farce en portions, les déposer sur la crépine et les envelopper pour former des crépinettes plates. Chauffer le beurre dans une poêle jusqu'à ce qu'il devienne noisette. Cuire les crépinettes à feu moyen pendant 4 à 5 minutes de chaque côté jusqu'à ce qu'elles soient bien dorées.", "key": "crepinettes de ris de veau a la monegasque", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 32, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 3, "tome_title":
