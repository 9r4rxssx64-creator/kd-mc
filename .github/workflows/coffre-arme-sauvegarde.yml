name: Coffre — arme la sauvegarde quotidienne (pose le jeton GitHub sur le worker kdmc-outlook)

# ─────────────────────────────────────────────────────────────────────────────
# Audit 30.09.2026, R7 : aucune sauvegarde Firebase depuis le 14.08 (les crons GitHub ont été retirés le
# 15.08 après la suspension du compte). Le réveil quotidien vient maintenant du worker Cloudflare
# kdmc-outlook (cron toutes les 2 h) : au premier passage après 03h UTC il envoie `repository_dispatch`
# `sauvegarde-quotidienne` au coffre, et `firebase-backup.yml` fait l'archive (30 jours).
#
# Pour parler à GitHub, le worker a besoin d'un jeton (portée repo). Ce robot le pose UNE FOIS comme secret
# Cloudflare `GITHUB_SAUVEGARDE_TOKEN`, depuis le coffre (le dépôt public n'a pas ce secret, et n'en a pas
# besoin : un secret Cloudflare survit aux déploiements suivants). À relancer seulement si le jeton change.
# Destination : GitHub, coffre, à la main. 0 cron. ≤ 3 min.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  armer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Installer wrangler
        run: npm i -g wrangler@3
      - name: Poser le jeton sur le worker kdmc-outlook (secret Cloudflare)
        working-directory: services/kdmc-outlook
        shell: bash -eo pipefail {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAT: ${{ secrets.APEX_GITHUB_PAT }}
        run: |
          trap 'echo "::error title=Arme la sauvegarde::ARRÊT ligne $LINENO : $BASH_COMMAND"' ERR
          [ -n "$PAT" ] || { echo "::error::APEX_GITHUB_PAT absent des secrets du coffre"; exit 1; }
          # Le jeton sait-il vraiment déclencher ? On le demande à GitHub (portée repo), sans rien lancer.
          PORTEES=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $PAT" https://api.github.com/user | grep -i '^x-oauth-scopes:' | cut -d: -f2- | tr -d '\r' | xargs || true)
          echo "portées du jeton : ${PORTEES:-(jeton fin / non classique)}"
          if printf '%s' "$PAT" | wrangler secret put GITHUB_SAUVEGARDE_TOKEN >/tmp/s.log 2>&1; then
            tail -2 /tmp/s.log; echo "::notice title=Sauvegarde quotidienne::jeton posé sur kdmc-outlook — la prochaine sauvegarde partira au premier passage du cron après 03h UTC"
          else
            tail -10 /tmp/s.log; echo "::error::le secret n'a PAS été posé sur kdmc-outlook"; exit 1
          fi
          echo "secrets présents sur le worker :"; wrangler secret list 2>/dev/null | grep -o '"name": *"[A-Z_]*"' || true
