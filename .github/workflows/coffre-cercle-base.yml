name: Coffre — Cercle Lingua, base D1 (créer si absente, lecture du schéma)

# Kevin 2.10.2026 : invitations, cercle d'amis, cadeaux, messages, présence dans Lingua.
# Ces données écrivent souvent : PAS dans le KV (1 000 écritures/jour, déjà saturé le 27.09 et le 2.10)
# mais dans une base D1 gratuite (100 000 écritures/jour). Ce robot crée `kdmc-cercle` si elle n'existe
# pas (idempotent), écrit son identifiant en annotation (un id D1 n'est pas un secret), et liste ses tables.
# Le routeur crée lui-même ses tables au premier appel (CREATE TABLE IF NOT EXISTS).
# Lancement à la main / API uniquement — jamais de cron (gratuit par défaut).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 6   # gratuit par défaut (Kevin 30.09) : borné
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Créer kdmc-cercle si absente, donner son id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash -eo pipefail {0}
        run: |
          npm install -g wrangler@3 --no-audit --no-fund >/dev/null 2>&1
          LISTE=$(wrangler d1 list --json 2>/dev/null || echo '[]')
          ID=$(printf '%s' "$LISTE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);const b=a.find(x=>x.name==='kdmc-cercle');process.stdout.write(b?b.uuid:'')}catch(e){}})")
          if [ -z "$ID" ]; then
            OUT=$(wrangler d1 create kdmc-cercle --location weur 2>&1 || true)
            echo "$OUT" | tail -5
            ID=$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            [ -n "$ID" ] || { echo "::error title=Cercle::création refusée — $(echo "$OUT" | tail -2 | tr '\n' ' ' | cut -c1-200)"; exit 1; }
            echo "::notice title=Cercle base::créée — database_id = $ID"
          else
            echo "::notice title=Cercle base::existe déjà — database_id = $ID"
          fi
          TABLES=$(wrangler d1 execute kdmc-cercle --remote --command "SELECT name FROM sqlite_master WHERE type='table'" --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j[0].results.map(r=>r.name).join(', ')||'aucune')}catch(e){process.stdout.write('illisible')}})")
          echo "::notice title=Cercle tables::$TABLES"
