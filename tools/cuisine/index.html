a poêle. Déglacez immédiatement la poêle avec le Cognac vieux et flambez hors du feu. Versez la sauce Poivrade chaude dans la poêle et laissez réduire une minute pour récupérer tous les sucs de cuisson. Dressez les noisettes de chevreuil sur un plat chaud, entourez-les avec les figues caramélisées au miel et nappez généreusement avec la sauce réduite.", "key": "noisettes de chevreuil aux figues de l arriere pays monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 80, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 7, "name": "Noisettes de Sanglier aux Châtaignes Confites de Saorge Monte-Carlo", "portions": "4 personnes", "ingredients": "8 noisettes de jeune sanglier, 40g de beurre clarifié, 200g de châtaignes fraîches de Saorge (ou marrons nature), 50cl de bouillon de viande, 20cl de sauce Grand Veneur, 1 pincée de quatre-épices, sel, poivre.", "method": "Incisez la peau des châtaignes et faites-les blanchir dans de l'eau bouillante pendant 10 minutes pour pouvoir retirer les deux peaux. Faites-les ensuite confire doucement dans une casserole avec le bouillon de viande et une pincée de quatre-épices jusqu'à ce qu'elles soient tendres mais entières. Saisissez les noisettes de sanglier à la poêle dans le beurre clarifié à feu vif pendant 3 minutes de chaque côté. Dans une casserole, faites chauffer la sauce Grand Veneur. Dressez les noisettes de sanglier sur un plat de gala chaud, répartissez les châtaignes confites tout autour et nappez généreusement de sauce Grand Veneur bien noire et brillante.", "key": "noisettes de sanglier aux chataignes confites de saorge monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 81, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 8, "name": "Les Ganses de la Saint-Jean au Zeste de Cédrat de Menton", "portions": "pour un grand plat", "ingredients": "250g de farine de blé, 50g de sucre, 50g de beurre mou, 2 œufs, le zeste râpé d'un demi-cédrat de Menton, 2 cuillères à soupe d'eau de fleur d'oranger, 1 pincée de sel, huile de friture, sucre glace.", "method": "Dans un grand saladier, mélangez la farine, le sucre, le sel et le zeste très fin du cédrat. Incorporez les œufs entiers, le beurre mou coupé en morceaux et la fleur d'oranger. Pétrir la pâte vigoureusement sur le plan de travail pendant 5 à 10 minutes jusqu'à ce qu'elle devienne souple, élastique et lisse. Enveloppez-la dans un film alimentaire et laissez reposer 1 heure. Étalez la pâte au rouleau le plus finement possible. À l'aide d'une roulette dentelée, découpez des rectangles de 4 x 10 cm. Pratiquez une entaille au centre de chaque rectangle, puis passez un coin de la pâte dans la fente pour former un nœud lâche (la ganse). Plonger les ganses dans un bain de friture bien chaud (180°C) : elles vont souffler et dorer en moins de deux minutes. Égouttez sur du papier absorbant et poudrer généreusement de sucre glace.", "key": "les ganses de la saint jean au zeste de cedrat de menton", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "infos": [{"fact": "À Nice, pendant le Carnaval, on prépare les « ganses » : de petites lanières de pâte à la fleur d'oranger, façonnées, frites et saupoudrées de sucre glace ; leur forme rappellerait le foulard du costume traditionnel des hommes du Carnaval.", "source_url": "https://culture-crunch.com/2021/02/17/ganses-de-nice/", "source_name": "culture-crunch.com"}], "id": 82, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 7, "tome_title": "L'Anthologie Céleste de la Haute Cuisine & du Terroir", "icon": "✨", "num": 9, "name": "Le Panettone de la Saint-Nicolas aux Agrumes Confits du Rocher", "portions": "1 gros gâteau d'apparat", "ingredients": "500g de farine de gruau, 20g de levure de boulanger fraîche, 15cl de lait tiède, 150g de sucre, 1 pincée de sel, 4 œufs, 150g de beurre fondu, 80g de raisins secs, 50g de pignons de pin, 50g d'amandes concassées, 150g de fruits confits de la Riviera en dés (orange, cédrat, citron), le zeste râpé d'une orange.", "method": "Délayer la levure dans le lait tiède avec une cuillère de sucre. Mélanger la farine, le reste du sucre et une pincée de sel. Incorporez les œufs battus, le beurre fondu et le lait avec la levure. Pétrir longuement jusqu'à ce que la pâte se détache des parois. Laisser lever 2 heures sous un linge. Incorporer ensuite à la pâte les raisins secs, les pignons, les amandes concassées et les dés de fruits confits de la Riviera. Déposer la pâte dans un moule à bords très hauts et laisser lever à nouveau 1 heure. Enfourner à 170°C pendant 45 à 50 minutes jusqu'à ce que la brioche soit bien haute et dorée.", "key": "le panettone de la saint nicolas aux agrumes confits du rocher", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 1, "infos": [{"fact": "Originaire de Milan, le panettone trouve ses racines au Moyen Âge, où l'on enrichissait le pain pour célébrer Noël. Une légende attribue sa création à un commis nommé Toni (« pan di Toni ») à la cour des Sforza.", "source_url": "https://easygusto.fr/blogs/easygusto-blog-cuisine-italienne/lhistoire-du-panettone-de-milan-a-votre-table", "source_name": "easygusto.fr"}], "method_note": "La méthode détaillée manquait dans le manuscrit pour cette variante. Elle reprend celle du Panettone « U Panetùn » du même répertoire (recette sœur). Les quantités ont été rétablies d'après les ingrédients cités dans la méthode.", "id": 83, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 1, "name": "Le Loup de Mer Grillé au Beurre de Cédrat Monte-Carlo", "portions": "4 personnes", "ingredients": "1 loup de mer (bar) de 1,5 kg vidé et écaillé, 150g de beurre doux (pommade), le zeste fin et le jus d'un cédrat de pays, 1 branche de thym frais, 3cl d'huile d'olive, salt, poivre blanc.", "method": "Pratiquez trois légères entailles sur les flancs du poisson. Glissez le thym à l'intérieur, salez et poivrez. Badigeonnez le loup d'huile d'olive et faites-le griller au barbecue ou sous le gril du four pendant 10 à 12 minutes de chaque côté jusqu'à ce que la peau soit bien saisie. Pendant ce temps, préparez le beurre composé : dans un bol, malaxez le beurre pommade à la spatule avec le zeste de cédrat râpé très fin et son jus versé en filet. Le beurre doit devenir crémeux et homogène. Levez les filets du poisson cuit, dressez-les sur un plat chaud et déposez de belles rosaces de beurre de cédrat frais par-dessus pour qu'il fonde doucement à table.", "key": "le loup de mer grille au beurre de cedrat monte carlo", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "infos": [{"fact": "Le bar commun (Dicentrarchus labrax) s'appelle « bar » dans l'Atlantique et « loup » en Méditerranée. Ce nom de « loup » lui vient de sa voracité : il se gave de tout ce qu'il croise (sardines, anchois, crustacés).", "source_url": "https://fr.wikipedia.org/wiki/Loup_(poisson)", "source_name": "Wikipédia"}], "id": 84, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 2, "name": "Les Petits Beignets de Calamars à la Sauce Monégasque", "portions": "4 personnes", "ingredients": "600g de petits calamars nettoyés. Pâte à frire : 150g de farine, 1 œuf, 15cl d'eau gazeuse très glacée, 1 pincée de sel, huile de friture. Sauce : 4 cuillères à soupe de sauce Monégasque froide (voir recette Tome 3).", "method": "Taillez les blancs de calamars en anneaux réguliers de 1 cm et séchez-les parfaitement dans un linge propre. Préparez la pâte : dans un bol, mélangez la farine, le sel, le jaune d'œuf et l'eau gazeuse glacée (la pâte doit rester légèrement grumeleuse pour être croustillante). Montez le blanc d'œuf en neige et incorporez-le délicatement. Faites chauffer l'huile de friture à 180°C. Trempez les anneaux de calamar dans la pâte et plongez-les par petites séries dans l'huile chaude pendant 2 à 3 minutes jusqu'à ce qu'ils soient gonflés et d'un blond léger. Égouttez sur du papier absorbant et servez brûlant avec la sauce Monégasque froide à part.", "key": "les petits beignets de calamars a la sauce monegasque", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 85, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 3, "name": "Les Gnocchis de Farine de Pois Chiches à la Monégasque", "portions": "4 personnes", "ingredients": "200g de farine de pois chiches (base de la socca), 50cl d'eau, 2cl d'huile d'olive, 1 œuf, 50g de parmesan râpé. Sauce : 30cl de sauce tomate de pays réduite, 1 gousse d'ail, 50g d'olives de Nice hachées.", "method": "Dans une casserole, portez l'eau à ébullition avec l'huile d'olive et une pincée de sel. Versez la farine de pois chiches en pluie tout en fouettant vigoureusement pour éviter les grumeaux. Laissez cuire à feu doux pendant 5 minutes sans cesser de remuer avec une spatule en bois. Hors du feu, incorporez l'œuf et le parmesan. Étalez cette pâte sur une plaque huilée sur une épaisseur de 1,5 cm et laissez refroidir. Taillez ensuite la pâte en petits carrés (gnocchis) et marquez-les avec les dents d'une fourchette. Faites-les dorer à la poêle dans un filet d'huile d'olive pendant 2 minutes de chaque côté. Servez les gnocchis bien croustillants nappés de sauce tomate chaude aux olives de Nice.", "key": "les gnocchis de farine de pois chiches a la monegasque", "cat": "Spécialités du Terroir", "cat_icon": "🌿", "base": 4, "infos": [{"fact": "La socca, galette de farine de pois chiches emblématique de Nice, serait apparue au XVIIe siècle (héritée de la « farinata » ligure). C'était un en-cas populaire et bon marché, le repas des pêcheurs et des ouvriers.", "source_url": "https://lasocca.fr/blog/lhistoire-de-la-socca.html", "source_name": "lasocca.fr"}], "id": 86, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}, "dialectes": [{"lang": "niçard", "name": "Panissa", "fr": "panisse : préparation frite à base de farine de pois chiches", "url": "https://www.etymologie-occitane.fr/2011/10/panisso-panisse/", "quote": "panisso « sorte de millet », panissa à Nice, panisso dans la Vaucluse"}]}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 4, "name": "La Salade de Poulpe Tiède aux Câpres et Citron de Menton", "portions": "4 personnes", "ingredients": "800g de poulpe de roche, 1 bouchon de liège (astuce de marin pour attendrir), 1 oignon, 1 carotte, 1 bouquet garni. Garniture : 2 cuillères à soupe de câpres fines, le jus et le zeste d'un citron de Menton, 5cl d'huile d'olive vierge, persil plat ciselé.", "method": "Placez le poulpe dans une grande marmite d'eau froide avec l'oignon, la carotte, le bouquet garni et le bouchon de liège. Portez à ébullition et laissez cuire à petits bouillons pendant 1 heure jusqu'à ce que la chair soit tendre. Égouttez le poulpe et coupez les tentacules en morceaux réguliers pendant qu'il est encore chaud. Dans un grand saladier, mélangez le jus de citron, le zeste râpé fin, l'huile d'olive, le sel et le poivre. Ajoutez les morceaux de poulpe tièdes, les câpres fines et le persil plat ciselé. Mélangez délicatement et servez aussitôt à température ambiante.", "key": "la salade de poulpe tiede aux capres et citron de menton", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "infos": [{"fact": "Le citron de Menton bénéficie d'une IGP depuis 2015. Sa spécificité ne tient pas aux variétés mais aux conditions pédoclimatiques d'une petite zone microclimatique littorale ; la Fête du Citron attire chaque année plus de 250 000 visiteurs.", "source_url": "https://fr.wikipedia.org/wiki/Citron_de_Menton", "source_name": "Wikipédia"}], "id": 87, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 5, "name": "Tournedos Henri IV au Beurre de Truffe Monte-Carlo", "portions": "4 personnes", "ingredients": "4 tournedos de filet de bœuf, 4 fonds d'artichauts cuits, 15cl de sauce béarnaise bien relevée, 50g de beurre de truffe noire (voir recette Tome 4), 1 petite truffe noire fraîche, 30g de beurre fin, salt, poivre.", "method": "Faites chauffer les fonds d'artichauts au beurre et garnissez leur centre avec la sauce béarnaise chaude. Dans une grande poêle avec le beurre fin, saisissez les tournedos à feu vif pour les garder saignants. Déposez chaque tournedos sur le plat de service chaud, flanqué d'un fond d'artichaut à la béarnaise. Déposez immédiatement un beau morceau de beurre de truffe noire sur la viande brûlante pour qu'il nappe la pièce en fondant. Pour finir, râpez quelques lamelles de truffe noire fraîche par-dessus et servez ce classique des grands banquets de palace.", "key": "tournedos henri iv au beurre de truffe monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 88, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 6, "name": "Les Suprêmes de Poularde aux Morilles et Champagne Monte-Carlo", "portions": "4 personnes", "ingredients": "4 suprêmes de poularde de Bresse, 200g de morilles fraîches (ou réhydratées), 20cl de Champagne brut, 1 échalote, 15cl de crème fraîche double, 40g de beurre fin, salt, poivre blanc.", "method": "Nettoyez soigneusement les morilles. Dans une sauteuse avec la moitié du beurre, faites dorer les suprêmes de poularde côté peau pendant 5 minutes, puis retournez-les et laissez cuire encore 5 minutes à feu doux. Retirez-les et gardez-les au chaud. Dans la même sauteuse, faites suer l'échalote hachée menu, ajoutez les morilles et laissez sauter 3 minutes. Mouillez avec le Champagne brut et laissez réduire de moitié. Ajoutez la crème fraîche double, salez, poivrez et laissez mijoter jusqu'à ce que la sauce soit onctueuse. Remettez les suprêmes dans la crème aux morilles pour les enrober pendant une minute et dressez sur un plat chaud.", "key": "les supremes de poularde aux morilles et champagne monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 89, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 7, "name": "Les Noisettes d'Agneau en Croûte de Parmesan à la Monégasque", "portions": "4 personnes", "ingredients": "8 noisettes de filet d'agneau, 1 œuf, 50g de chapelure fine, 50g de parmesan râpé, 1 cuillère à café de marjolaine, 40g de beurre, 20cl de jus d'agneau lié, de petites tomates confites pour le décor.", "method": "Dans une assiette creuse, mélangez la chapelure fine, le parmesan râpé et la marjolaine séchée. Battez l'œuf dans une autre assiette. Salez et poivrez les noisettes d'agneau. Trempez chaque pièce dans l'œuf battu, puis roulez-les généreusement dans le mélange de chapelure au fromage en pressant avec les doigts pour bien faire adhérer la croûte. Faites chauffer le beurre dans une poêle et faites-y cuire les noisettes à feu moyen pendant 3 à 4 minutes de chaque côté jusqu'à ce que la croûte soit bien dorée et croustillante, tout en gardant la viande rosée à cœur. Servez avec le jus d'agneau chaud et les tomates confites.", "key": "les noisettes d agneau en croute de parmesan a la monegasque", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 90, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 8, "name": "Le Flan Artisanal à la Fleur d'Oranger et Pignons de Monaco", "portions": "6 personnes", "ingredients": "50cl de lait entier, 4 œufs entiers, 100g de sucre en poudre, 2 cuillères à soupe d'eau de fleur d'oranger pure, 40g de pignons de pin sauvages, un peu de beurre pour le moule.", "method": "Préchauffez le four à 160°C. Dans une poêle sèche, faites torréfier les pignons de pin pendant 2 minutes jusqu'à ce qu'ils soient blonds et parfumés. Disposez-les au fond d'un moule à flan préalablement beurré. Dans un saladier, fouettez les œufs entiers avec le sucre en poudre sans chercher à faire mousser. Faites chauffer le lait entier dans une casserole, puis versez-le lentement sur les œufs tout en remuant doucement. Incorporez l'eau de fleur d'oranger. Versez délicatement cet appareil dans le moule sur les pignons (les pignons vont remonter légèrement). Cuisez au bain-marie au four pendant 40 minutes. Laissez refroidir complètement à température ambiante, puis réservez au frais 3 heures avant de démouler.", "key": "le flan artisanal a la fleur d oranger et pignons de monaco", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 91, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 9, "name": "La Tarte aux Cerises Confites et Frangipane de Monaco", "portions": "6 personnes", "ingredients": "1 pâte sablée fine. Farce : 100g de poudre d'amandes, 80g de beurre pommade, 80g de sucre, 1 œuf, 1 cuillère d’eau de fleur d'oranger, 150g de véritables cerises confites au sirop.", "method": "Foncer un moule à tarte avec la pâte sablée et piquez le fond avec une fourchette. Préparer la crème frangipane : dans un bol, travaillez le beurre pommade avec le sucre, ajoutez l'œuf entier, la poudre d'amandes et la fleur d'oranger. Mélangez vigoureusement jusqu'à obtention d'une texture lisse. Étalez cette crème sur le fond de tarte. Coupez les cerises confites en deux et enfoncez-les harmonieusement dans la crème d'amandes. Enfournez à 180°C pendant 30 minutes : la pâte doit être bien dorée et la crème prise. Laissez refroidir avant de déguster.", "key": "la tarte aux cerises confites et frangipane de monaco", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 92, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 8, "tome_title": "Le Trésor des Archives & Recettes Inédites de la Riviera", "icon": "📜", "num": 10, "name": "Le Parfait Glacé au Grand-Marnier & Éclats de Nougatine Monte-Carlo", "portions": "6 personnes", "ingredients": "4 jaunes d'œufs, 120g de sucre, 5cl d'eau, 5cl de liqueur de Grand-Marnier, 30cl de crème liquide entière, 50g de nougatine croustillante.", "method": "Concassez grossièrement la nougatine en petits éclats. Cuisez le sucre et l'eau à 115°C dans une casserole pour faire un sirop. Battez les jaunes d'œufs au fouet électrique tout en versant le sirop chaud en filet jusqu'à refroidissement complet de l'appareil (appareil à bombe). Ajoutez la liqueur de Grand-Marnier. Monter la crème liquide en chantilly ferme. Incorporez délicatement la chantilly et les éclats de nougatine croustillante à la préparation à l'aide d'une maryse. Verser dans un moule tapissé de film étirable et bloquer au congélateur pendant au moins 6 heures avant de couper en tranches pour le service.", "key": "le parfait glace au grand marnier eclats de nougatine monte carlo", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 93, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 1, "name": "Les Poivrons Doux Farcis à la Monégasque", "portions": "4 personnes", "ingredients": "4 poivrons doux de taille moyenne (rouges ou jaunes), 200g de thon blanc à l'huile d'olive, 2 œufs durs, 1 cuillère à soupe de câpres fines, 6 filets d'anchois à l'huile, 1 bouquet de persil plat, 2 cuillères à soupe de mayonnaise maison.", "method": "Lavez les poivrons. Coupez le chapeau et retirez délicatement toutes les graines et les membranes blanches à l'intérieur sans percer la peau. Faites-les blanchir 3 minutes dans une casserole d'eau bouillante salée, puis plongez-les dans l'eau glacée pour qu'ils restent fermes ; égouttez-les bien la tête en bas. Préparez la farce froide : dans un saladier, écrasez le thon blanc égoutté et les œufs durs à la fourchette. Ajoutez les câpres fines, les anchois et le persil plat hachés menu. Liez le tout avec la mayonnaise maison, salez légèrement et poivrez. Garnissez généreusement l'intérieur des poivrons froids avec cette farce. Replacez les chapeaux et réservez au frais pendant 1 heure avant de servir en entrée d'été.", "key": "les poivrons doux farcis a la monegasque", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "infos": [{"fact": "Les petits farcis niçois (légumes évidés puis garnis) étaient à l'origine une façon astucieuse d'utiliser les restes de viande braisée, de rôti ou de pot-au-feu avant de devenir un plat à part entière.", "source_url": "https://www.jours-de-marche.fr/specialites/petits-farcis-nicois.html", "source_name": "jours-de-marche.fr"}], "id": 94, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 2, "name": "Le Filet de Loup de Mer en Papillote de Vigne à la Monégasque", "portions": "4 personnes", "ingredients": "4 beaux filets de loup de mer (bar) de 150g chacun, 8 grandes feuilles de vigne fraîches (ou en saumure), 1 bulbe de fenouil, 1 citron de pays, 4 filets d'anchois, 5cl d'huile d'olive vierge extra, sel fin, poivre.", "method": "Si vous utilisez des feuilles de vigne en saumure, rincez-les bien à l'eau tiède et séchez-les. Émincez le bulbe de fenouil le plus finement possible à la mandoline. Taillez le citron en tranches très minces. Pour chaque papillote, étalez deux feuilles de vigne en les faisant se chevaucher sur votre plan de travail. Déposez un petit lit de fenouil émincé au centre. Posez un filet de loup de mer assaisonné par-dessus. Déposez une rondelle de citron et un filet d'anchois sur le poisson. Arrosez d'un filet d'huile d'olive. Repliez soigneusement les feuilles de vigne par-dessus le poisson pour former un paquet étanche (vous pouvez le ficeler lâchement). Disposez les quatre papillotes sur une plaque et enfournez à 200°C pendant 12 à 15 minutes. Servir fermé directement dans l'assiette.", "key": "le filet de loup de mer en papillote de vigne a la monegasque", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "infos": [{"fact": "Le bar commun (Dicentrarchus labrax) s'appelle « bar » dans l'Atlantique et « loup » en Méditerranée. Ce nom de « loup » lui vient de sa voracité : il se gave de tout ce qu'il croise (sardines, anchois, crustacés).", "source_url": "https://fr.wikipedia.org/wiki/Loup_(poisson)", "source_name": "Wikipédia"}], "id": 95, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 3, "name": "Les Petits Raviolis de Homard Sauce Américaine Monte-Carlo", "portions": "4 personnes", "ingredients": "300g de pâte fraîche aux œufs fine, 150g de chair de homard cuite, 50g de ricotta, 1 petite truffe noire hachée menu, 1 œuf. Sauce : 25cl de sauce américaine (crustacés) très réduite, 5cl de crème liquide entière, 20g de beurre fin, sel, piment de Cayenne.", "method": "Préparez la farce : hachez très finement la chair de homard cuite au couteau. Dans un bol, mélangez-la avec la ricotta écrasée, la truffe noire hachée et un blanc d'œuf. Salez et ajoutez une pointe de piment de Cayenne. Étalez la pâte fraîche le plus finement possible. Déposez de petites cuillères de farce, dorez le tour au jaune d'œuf, recouvrez de pâte et découpez de petits raviolis ronds. Faites-les pocher dans une grande casserole d'eau frémissante salée pendant 3 minutes, puis égouttez-les délicatement. Pendant ce temps, chauffez la sauce américaine avec la crème et montez-la hors du feu avec le beurre en morceaux pour la faire briller. Nappez les raviolis chauds de cette sauce de palace et servez.", "key": "les petits raviolis de homard sauce americaine monte carlo", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 96, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 4, "name": "La Salade de Filets de Soles Froids à la Monégasque", "portions": "4 personnes", "ingredients": "4 filets de sole nets, 15cl de vin blanc sec, 1 oignon, 1 bouquet garni, 1 cœur de laitue romaine, 1 cuillère à soupe de câpres, 12 petites olives de Nice, 4 filets d'anchois. Vinaigrette : 5cl d'huile d'olive vierge, 2 cuillères de vinaigre de vin vieux, persil haché, sel, poivre.", "method": "Préparez un petit court-bouillon avec le vin blanc, un peu d'eau, l'oignon émincé et le bouquet garni. Faites-y pocher les filets de sole à petits frémissements pendant 4 à 5 minutes. Retirez-les délicatement à l'écumoire et laissez-les refroidir complètement au réfrigérateur. Pour le dressage : lavez et séchez la laitue romaine, coupez-la en lanières et tapissez-en le fond d'un grand plat. Disposez les filets de sole froids par-dessus. Décorez le plat avec les câpres fines, les olives de Nice dénoyautées et les filets d'anchois croisés. Réalisez la vinaigrette à l'huile d'olive et au vinaigre de vin vieux, ajoutez le persil haché et arrosez la salade de la mer juste avant de servir.", "key": "la salade de filets de soles froids a la monegasque", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "id": 97, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 5, "name": "Les Tournedos de Filet de Bœuf à la Sauce Madère & Cèpes Monte-Carlo", "portions": "4 personnes", "ingredients": "4 beaux tournedos de bœuf bien épais, 150g de cèpes frais (ou bouchons), 40g de beurre doux, 10cl de vin de Madère vieux, 15cl de jus de bœuf corsé réduit, 1 petite truffe noire fraîche, salt, poivre du moulin.", "method": "Nettoyez les cèpes et coupez-les en tranches épaisses. Faites-les sauter à la poêle avec une noisette de beurre pendant 5 minutes jusqu'à ce qu'ils soient bien dorés, puis réservez-les. Dans une grande poêle avec le reste de beurre très chaud, saisissez les tournedos de bœuf à feu vif pendant 2 à 3 minutes de chaque côté selon la cuisson désirée (la viande doit rester saignante). Retirez la viande et réservez-la au chaud sous une feuille d'aluminium. Déglacez immédiatement la poêle chaude avec le vin de Madère vieux en grattant bien les sucs de cuisson. Ajoutez le jus de bœuf réduit et la truffe hachée menu, laissez bouillonner 2 minutes pour épaissir la sauce. Remettez les cèpes. Dressez les tournedos sur un plat chaud, nappez-les avec la sauce onctueuse au Madère et aux cèpes, et décorez le dessus de chaque pièce de fines lamelles de truffe fraîche.", "key": "les tournedos de filet de b uf a la sauce madere cepes monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 98, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 6, "name": "Les Suprêmes de Chapon aux Truffes Noires & Crème de Porto Monte-Carlo", "portions": "4 personnes", "ingredients": "4 beaux suprêmes de chapon (ou de grosse poularde), 1 grande truffe noire fraîche du Périgord, 15cl de vin de Porto rouge de qualité, 20cl de crème fraîche double, 40g de beurre doux, sel fin, poivre blanc.", "method": "Glissez avec précaution des lamelles de truffe noire fraîche directement sous la peau de chaque suprême de chapon (c'est la technique du \"truffage sous la peau\"). Hachez le reste de la truffe noire très finement. Dans une grande sauteuse, faites fondre le beurre et déposez-y les suprêmes côté peau. Laissez-les dorer doucement pendant 6 minutes, puis retournez-les, couvrez et poursuivez la cuisson à feu doux pendant 10 minutes pour que la chair reste très moelleuse. Retirez-les et gardez-les au chaud. Déglacez la sauteuse avec le Porto rouge, laissez réduire de moitié, puis ajoutez la crème fraîche double et la truffe noire hachée. Laissez mijoter à petits bouillons jusqu'à ce que la crème soit onctueuse et nappe la cuillère. Dressez les suprêmes truffés sur le plat et nappez-les de cette sauce riche au Porto.", "key": "les supremes de chapon aux truffes noires creme de porto monte carlo", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "id": 99, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 7, "name": "Les Côtelettes d'Agneau en Croûte d'Herbes du Maquis à la Monégasque", "portions": "4 personnes", "ingredients": "8 belles côtelettes d'agneau premières, 1 œuf, 50g de chapelure de pain très fine, 1 cuillère à soupe de thym frais, 1 cuillère de sarriette, 1 cuillère de marjolaine hachée, 40g de beurre fin, sel, poivre.", "method": "Dans une assiette creuse, mélangez intimement la chapelure fine avec l'ensemble des herbes du maquis hachées menu (thym, sarriette, marjolaine). Battez l'œuf entier dans une seconde assiette avec du sel et du poivre. Assaisonnez les côtelettes d'agneau. Trempez chaque côtelette dans l'œuf battu, puis roulez-les généreusement dans la chapelure aux herbes en pressant bien avec la paume des mains pour que la croûte soit régulière. Faites chauffer le beurre dans une grande poêle. Dès qu'il est mousseux, déposez les côtelettes et faites-les cuire à feu moyen pendant 3 minutes de chaque côté : la croûte doit être bien dorée et croustillante, et la viande d'un rose tendre à cœur. Servir immédiatement avec un filet de citron.", "key": "les cotelettes d agneau en croute d herbes du maquis a la monegasque", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 100, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 8, "name": "Le Flan Moelleux à l'Eau de Fleur d'Oranger et Amandes Effilées de Monaco", "portions": "6 personnes", "ingredients": "50cl de lait entier, 4 œufs frais, 100g de sucre blanc en poudre, 2 cuillères à soupe d'eau de fleur d'oranger pure, 40g d'amandes effilées, une noisette de beurre pour le moule.", "method": "Préchauffez votre four à 160°C. Dans une poêle sèche sans aucune matière grasse, faites dorer les amandes effilées pendant 2 minutes en remuant constamment pour les torréfier légèrement ; déposez-les au fond d'un moule à flan préalablement beurré. Dans un grand saladier, cassez les œufs entiers et fouettez-les doucement avec le sucre en poudre (sans chercher à faire mousser l'appareil). Portez le lait à frémissement dans une casserole, puis versez-le lentement sur les œufs tout en mélangeant à la spatule. Incorporez l'eau de fleur d'oranger pure. Versez délicatement cet appareil dans le moule sur le lit d'amandes (les amandes vont flotter et remonter légèrement). Faites cuire au bain-marie au four pendant 40 minutes. Laissez refroidir complètement à température ambiante, puis réservez au frais pendant au moins 3 heures avant de démouler délicatement sur le plat de service.", "key": "le flan moelleux a l eau de fleur d oranger et amandes effilees de monaco", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 101, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 9, "tome_title": "Les Formules Retrouvées des Grands Maîtres & Traditions du Port", "icon": "⚓", "num": 9, "name": "La Tarte aux Fruits Confits de la Riviera & Crème Frangipane", "portions": "6 personnes", "ingredients": "1 pâte sablée fine. Crème frangipane : 100g de poudre d'amandes, 80g de beurre pommade, 80g de sucre, 1 œuf, 1 cuillère à soupe d'eau de fleur d'oranger. Garniture : 200g de fruits confits de la Riviera (orange, cédrat, melon, cerises, angélique), 2 cuillères à soupe de confiture d'abricot, 30g d'amandes effilées.", "method": "Foncer un moule à tarte avec la pâte sablée et piquer le fond à la fourchette. Préparer la crème frangipane : travailler le beurre pommade avec le sucre, ajouter l'œuf entier, la poudre d'amandes et l'eau de fleur d'oranger, puis mélanger jusqu'à obtenir une crème parfaitement lisse. Étaler cette crème en couche régulière sur le fond de tarte cru. Détailler les fruits confits en lamelles et en dés, puis les disposer en couronne sur la crème en alternant les couleurs. Enfoncer légèrement les fruits dans la frangipane pour qu'ils ne brûlent pas à la cuisson. Parsemer d'amandes effilées. Enfourner à 180°C pendant 30 à 35 minutes : la pâte doit être bien dorée et la crème prise. À la sortie du four, lustrer les fruits au pinceau avec la confiture d'abricot tiédie et allongée d'une cuillère d'eau. Laisser refroidir complètement avant de servir.", "method_note": "Le manuscrit ne donnait que le titre. Recette reconstituée d'après La Tarte aux Cerises Confites et Frangipane de Monaco du même répertoire, en substituant l'assortiment de fruits confits de la Riviera aux cerises.", "key": "la tarte aux fruits confits de la riviera creme frangipane", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "infos": [{"fact": "La méthode détaillée n'était pas dans le manuscrit. Recette sœur avec méthode complète dans ce répertoire : « Tarte aux Cerises Confites et Frangipane de Monaco » (même technique : fond sablé, crème frangipane, garniture de fruits confits, cuisson puis lustrage à la gelée d'abricot).", "source_url": "", "source_name": ""}], "id": 102, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 1, "name": "Le Flanchet de Veau Miroton à la Monégasque", "portions": "4 personnes", "ingredients": "800g de flanchet (ou poitrine) de veau, 2 oignons, 2 gousses d'ail, 4 cuillères à soupe d'huile d'olive, 20cl de sauce tomate de pays, 1 cuillère à soupe de vinaigre de vin vieux, 1 cuillère à café de sucre, 1 cuillère de câpres, 8 olives de Nice.", "method": "Faites pocher le veau dans un grand faitout d'eau aromatisée pendant 1 heure pour le rendre tendre, puis taillez-le en tranches épaisses. Dans une sauteuse, faites dorer les oignons émincés à l'huile d'olive. Ajoutez le vinaigre, le sucre et laissez réduire une minute. Ajoutez la sauce tomate, l'ail écrasé, les câpres et les olives de Nice. Disposez les tranches de veau cuites dans cette sauce relevée et laissez mijoter à feu doux pendant 20 minutes (façon miroton) pour que la viande s'imprègne de toutes les saveurs méridionales.", "key": "le flanchet de veau miroton a la monegasque", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 4, "id": 103, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 2, "name": "Les Escalopes de Volaille Panées à la Milanaise de Monte-Carlo", "portions": "4 personnes", "ingredients": "4 fines escalopes de poulet (ou de dinde), 1 œuf, 50g de chapelure fine, 50g de parmesan râpé, 40g de beurre fin, 1 citron. Garniture : 1 truffe noire fraîche hachée, 10cl de jus de viande corsé.", "method": "Mélangez la chapelure fine et le parmesan râpé dans une assiette creuse. Battez l'œuf dans une autre assiette. Passez les escalopes assaisonnées dans l'œuf battu, puis enrobez-les généreusement du mélange chapelure/parmesan. Faites chauffer le beurre dans une grande poêle et faites-y dorer les escalopes à feu moyen pendant 4 minutes de chaque côté jusqu'à ce qu'elles soient croustillantes. Préparez la sauce : chauffez le jus de viande avec la truffe noire hachée. Servez les escalopes milanaises brûlantes, nappées du cordon de jus truffé de palace et décorées de quartiers de citron.", "key": "les escalopes de volaille panees a la milanaise de monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 104, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 3, "name": "Les Ris de Veau Demi-Deuil en Vol-au-Vent Monte-Carlo", "portions": "4 personnes", "ingredients": "300g de ris de veau blanchis, 1 grande truffe noire fraîche, 20cl de sauce veloutée blanche (bouillon lié au roux et crème), 4 grandes croûtes de vol-au-vent en pâte feuilletée.", "method": "Taillez la truffe noire en fines lamelles. Insérez une partie des lamelles directement au cœur des ris de veau blanchis et parés, puis faites-les braiser doucement au four avec un peu de bouillon. Coupez le reste de la truffe et les parures de ris de veau en petits dés, et incorporez-les à la sauce veloutée blanche chaude. Passez les croûtes de feuilletage au four pour les réchauffer. Coupez les ris de veau braisés en morceaux (qui présentent un aspect bicolore noir et blanc dit \"en demi-deuil\"). Remplissez les vol-au-vent de sauce onctueuse truffée et déposez les morceaux de ris de veau par-dessus avant de replacer le chapeau de pâte.", "key": "les ris de veau demi deuil en vol au vent monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "infos": [{"fact": "La cuisine « demi-deuil » consiste à glisser des lamelles de truffe noire sous la peau d'une volaille (ou d'un ris) : le blanc de la chair et le noir de la truffe évoquent une tenue de demi-deuil. Spécialité lyonnaise popularisée par la Mère Fillioux puis Eugénie Brazier.", "source_url": "https://fr.wikipedia.org/wiki/Poularde_demi-deuil", "source_name": "Wikipédia"}], "id": 105, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 4, "name": "Le Ragoût d'Agneau de Lait aux Artichauts Violets à la Monégasque", "portions": "4 personnes", "ingredients": "800g d'épaule d'agneau de lait coupée en morceaux, 6 petits artichauts violets sauvages, 1 citron, 4 cuillères à soupe d'huile d'olive, 1 oignon, 2 gousses d'ail, 10cl de vin blanc sec, un bouquet de sarriette fraîche.", "method": "Parez les petits artichauts violets en enlevant les feuilles dures, coupez-les en quatre et plongez-les dans de l'eau citronnée. Dans une cocotte, faites chauffer l'huile d'olive et faites-y dorer les morceaux d'agneau de lait. Ajoutez l'oignon émincé et l'ail écrasé. Mouillez avec le vin blanc sec et laissez s'évaporer. Ajoutez les quartiers d'artichauts égouttés et le bouquet de sarriette. Couvrez d'un peu d'eau chaude, salez, poivrez et laissez mijoter à couvert et à feu très doux pendant 45 minutes jusqu'à ce que l'agneau et les artichauts soient fondants.", "key": "le ragout d agneau de lait aux artichauts violets a la monegasque", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 106, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 5, "name": "Les Médaillons de Homard au Sabayon de Champagne Monte-Carlo", "portions": "4 personnes", "ingredients": "1 homard entier cuit au court-bouillon, 20cl de Champagne brut, 2 jaunes d'œufs frais, 60g de beurre doux, une pincée de piment de Cayenne, sel fin.", "method": "Décortiquez le homard cuit, récupérez la chair de la queue et des pinces, et coupez-la en médaillons réguliers. Disposez-les dans un plat allant au four. Préparez le sabayon de palace : dans un cul-de-poule posé sur un bain-marie doux, fouettez énergiquement les jaunes d'œufs avec le Champagne brut. Battez sans cesser jusqu'à ce que le mélange double de volume, devienne très mousseux et onctueux. Hors du feu, incorporez le beurre en petits morceaux tout en continuant de fouetter, ajoutez le sel et le piment de Cayenne. Versez ce sabayon aérien sur les médaillons de homard et passez le plat sous le gril du four (salamandre) pendant 45 secondes, juste pour glacer et dorer le dessus avant de servir brûlant.", "key": "les medaillons de homard au sabayon de champagne monte carlo", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "id": 107, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 6, "name": "Le Sauté de Seiche au Beurre d'Anchois & Romarin à la Monégasque", "portions": "4 personnes", "ingredients": "800g de blancs de seiche, 40g de beurre d'anchois (voir recette Tome 4), 2 cuillères à soupe d'huile d'olive, 1 branche de romarin frais, 1 citron jaune, poivre du moulin.", "method": "Nettoyez les blancs de seiche et taillez-les en petits carrés réguliers. Pratiquez des incisions en quadrillage sur la chair pour qu'ils cuisent uniformément. Dans une grande poêle très chaude avec l'huile d'olive et la branche de romarin, jetez les morceaux de seiche et faites-les sauter à feu très vif pendant 3 à 4 minutes seulement (ils vont se recroqueviller et cuire sans durcir). Retirez du feu et jetez le romarin. Incorporez immédiatement le beurre d'anchois froid dans la poêle chaude avec la seiche, remuez vivement pour créer une sauce liée et enrobante grâce à la chaleur résiduelle. Ajoutez un trait de jus de citron frais et servez chaud.", "key": "le saute de seiche au beurre d anchois romarin a la monegasque", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "infos": [{"fact": "L'encre de seiche parfume et teinte en noir profond les préparations méditerranéennes. Historiquement, la seiche faisait partie des produits « modestes » que les pêcheurs gardaient, les poissons nobles partant à la criée.", "source_url": "https://www.saporissimo.fr/articles/histoire-de-l-encre-de-seiche-en-cuisine-pa177/", "source_name": "saporissimo.fr"}], "id": 108, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "terroir", "label": "Terroir monégasque", "icon": "🏡"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 7, "name": "Les Cailles en Gelée de Madère aux Losanges de Truffe Monte-Carlo", "portions": "4 personnes", "ingredients": "4 belles cailles, 40g de beurre, 40cl de gelée de viande claire, 5cl de vin de Madère vieux, 1 petite truffe noire fraîche.", "method": "Faites rôtir les cailles entières au beurre dans une cocotte pendant 15 minutes pour qu'elles restent moelleuses, puis laissez-les refroidir. Mélangez la gelée de viande liquide avec le vin de Madère vieux. Prenez un grand plat de présentation froid, versez-y un fond de gelée au Madère et placez au frais pour faire figer. Découpez la truffe noire en tranches, puis en petits losanges réguliers (rappelant les fusées des armes de Monaco). Désossez les cailles froides en gardant les suprêmes nets. Trempez chaque morceau de caille dans de la gelée liquide froide, déposez-les sur le lit de gelée figée, et décorez chaque morceau avec les losanges de truffe. Nappez à nouveau de gelée pour fixer le décor et réservez au frais 2 heures avant de présenter ce plat de grand buffet.", "key": "les cailles en gelee de madere aux losanges de truffe monte carlo", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "id": 109, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 8, "name": "Le Gâteau de Semoule à la Poudre d'Amandes & Sirop de Mandarine", "portions": "6 personnes", "ingredients": "100g de semoule de blé fine, 50cl de lait entier, 80g de sucre, 50g de poudre d'amandes, 3 œufs, 30g de beurre. Sirop : 10cl d'eau, 80g de sucre, le jus et le zeste d'une mandarine locale.", "method": "Faites bouillir le lait avec le beurre et le sucre. Versez la semoule en pluie tout en fouettant, laissez épaissir 3 minutes sur feu doux. Hors du feu, ajoutez la poudre d'amandes et les œufs battus. Verser dans un moule beurré et cuire au four à 180°C pendant 30 minutes. Pendant la cuisson, préparez le sirop en cuisant l'eau, le sucre, le jus et le zeste fin de la mandarine pendant 5 minutes. À la sortie du four, arrosez le gâteau de semoule chaud avec ce sirop d'agrumes parfumé pour qu'il s'imbibe totalement avant de laisser refroidir.", "key": "le gateau de semoule a la poudre d amandes sirop de mandarine", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "id": 110, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 9, "name": "La Tarte aux Pignons Sauvages & Marmelade d'Oranges Amères", "portions": "6 personnes", "ingredients": "1 pâte sablée fine, 150g de marmelade artisanale d'oranges amères (oranges de la Principauté), 80g de pignons de pin sauvages, 1 œuf (pour la dorure).", "method": "Foncer un moule à tarte avec la pâte sablée, piquez le fond et réservez au frais. Étalez une couche épaisse et régulière de marmelade d'oranges amères directement sur le fond de tarte cru. Parsemez généreusement toute la surface avec les pignons de pin sauvages de manière à recouvrir la confiture. À l'aide des chutes de pâte, vous pouvez dessiner de fines lanières de pâte croisées sur le dessus pour décorer et les dorer à l'œuf. Enfournez à 180°C pendant 25 à 30 minutes : les pignons de pin doivent être bien torréfiés et la pâte croustillante. Servir froid avec un café.", "key": "la tarte aux pignons sauvages marmelade d oranges ameres", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "infos": [{"fact": "Classique provençal, la tarte aux pignons associe une pâte sucrée et une crème d'amande, recouverte de pignons de pin — fruit du pin parasol (Pinus pinea).", "source_url": "https://culture-crunch.com/2021/09/14/tarte-aux-pignons-provencale/", "source_name": "culture-crunch.com"}], "id": 111, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 10, "tome_title": "Le Grand Final du Répertoire de la Riviera", "icon": "🎆", "num": 10, "name": "Les Petits Fours à la Fleur d'Oranger & Macarons Croustillants de Monaco", "portions": "pour une belle plaque", "ingredients": "150g de poudre d'amandes douces, 150g de sucre glace, 2 blancs d'œufs frais, 1 cuillère à soupe d'eau de fleur d'oranger pure, quelques dragées blanches pour le décor.", "method": "Dans un grand saladier, mélangez intimement la poudre d'amandes douces et le sucre glace. Ajoutez l'eau de fleur d'oranger pure. Incorporez les blancs d'œufs un par un (non montés) en travaillant la pâte à la spatule ou à la main pour obtenir une pâte d'amandes souple, homogène et malléable. Mettez la préparation dans une poche munie d'une douille cannelée. Sur une plaque de cuisson recouverte de papier sulfurisé, dressez de petits dômes réguliers (petits fours). Déposez un éclat de dragée blanche au sommet de chaque pièce. Enfournez à 170°C pendant 12 à 15 minutes seulement : les petits fours doivent rester moelleux à l'intérieur et former une fine croûte croustillante à l'extérieur. Laisser refroidir sur une grille.", "key": "les petits fours a la fleur d oranger macarons croustillants de monaco", "cat": "Spécialités du Terroir", "cat_icon": "🌿", "base": 4, "id": 112, "origine": {"key": "monaco", "label": "Monaco — cuisine monégasque", "flag": "🇲🇨"}, "style": {"key": "palace", "label": "Grande cuisine des palaces · Monte-Carlo", "icon": "👑"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 1, "name": "Trofie au pesto génois (Trofie al pesto genovese)", "portions": "2 personnes", "ingredients": "180 g de trofie, 25 g de feuilles de basilic génois frais, 15 g de pignons, 30 g de Parmigiano Reggiano DOP râpé, 20 g de pecorino DOP (Fiore Sardo) râpé, ½ gousse d'ail doux, huile d'olive extra-vierge de la Riviera ligure, sel gros ; facultatif traditionnel : quelques pommes de terre et haricots verts cuits avec les pâtes.", "method": "Réduire d'abord l'ail en crème dans le mortier avec le sel gros. Ajouter les pignons et les écraser. Incorporer les feuilles de basilic par petites poignées en écrasant doucement contre les parois du mortier. Ajouter le Parmigiano et le pecorino pour lier. Verser l'huile d'olive en filet à la fin jusqu'à une crème homogène. Cuire les trofie (avec pommes de terre et haricots verts pour la version complète) à l'eau salée. Détendre le pesto avec une cuillère d'eau de cuisson, puis mélanger hors du feu aux pâtes égouttées, sans jamais les chauffer.", "key": "trofie au pesto genois trofie al pesto genovese", "histoire": "Plat symbole de Gênes : le pesto alla genovese, préparé au mortier avec le basilic génois DOP (cultivé notamment à Prà).", "resume": "Plat symbole de Gênes : le pesto alla genovese, préparé au mortier avec le basilic génois DOP (cultivé notamment à Prà).", "cat": "Spécialités du Terroir", "cat_icon": "🌿", "base": 2, "method_source": "Dissapore", "method_source_url": "https://www.dissapore.com/ricette/trofie-al-pesto-genovese/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Plat symbole de Gênes : le pesto alla genovese, préparé au mortier avec le basilic génois DOP (cultivé notamment à Prà).", "source_url": "https://www.dissapore.com/ricette/trofie-al-pesto-genovese/", "source_name": "Dissapore"}], "id": 113, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}, "dialectes": [{"lang": "ligure", "name": "Pesto", "fr": "sauce au basilic pilée au mortier (nom du verbe « piler »)", "url": "https://en.wikipedia.org/wiki/Pesto", "quote": "The name is the past participle of the Genoese verb pestâ (Italian: pestare), meaning 'to pound', 'to crush'."}, {"lang": "ligure", "name": "Trofie", "fr": "petites pâtes torsadées de la Riviera di Levante", "url": "https://doeatbetterexperience.com/it/blog/trofie-liguri/", "quote": "alcuni ritengono che derivi dal dialetto genovese « struffuggià » (strofinare)"}]}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 2, "name": "Focaccia génoise (Focaccia genovese / fügassa)", "portions": "4 à 6 personnes", "ingredients": "Farine type 00 (W 260-280), eau, huile d'olive extra-vierge, levure de bière, sel ; parfois un peu de malt ou de sucre ; saumure : eau, huile d'olive extra-vierge, sel gros.", "method": "Dissoudre la levure dans l'eau tiède avec le malt, ajouter progressivement la farine, puis le sel et l'huile d'olive. Pétrir au moins 10 minutes jusqu'à une pâte lisse et élastique. Laisser lever ~2 heures jusqu'au doublement. Étaler sur une plaque huilée et laisser reposer en longue levée (4 à 6 heures). Du bout des doigts huilés, creuser les alvéoles profondes. Émulsionner huile, eau et sel gros et verser cette saumure dans les trous. Cuire à four chaud jusqu'à ce qu'elle soit dorée dehors, moelleuse dedans.", "key": "focaccia genoise focaccia genovese fugassa", "histoire": "Emblème de la tradition ligure (présidium Slow Food) : la fügassa se reconnaît à sa saumure versée dans les alvéoles.", "resume": "Emblème de la tradition ligure (présidium Slow Food) : la fügassa se reconnaît à sa saumure versée dans les alvéoles.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "method_source": "Cuocoterapia (Giallo Zafferano)", "method_source_url": "https://blog.giallozafferano.it/matteobancala/ricetta-focaccia-genovese-ricetta-originale-della-vera-fugassa-genovese/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Emblème de la tradition ligure (présidium Slow Food) : la fügassa se reconnaît à sa saumure versée dans les alvéoles.", "source_url": "https://blog.giallozafferano.it/matteobancala/ricetta-focaccia-genovese-ricetta-originale-della-vera-fugassa-genovese/", "source_name": "Cuocoterapia (Giallo Zafferano)"}], "id": 114, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}, "dialectes": [{"lang": "ligure", "name": "Fugàssa", "fr": "focaccia génoise (pain plat huilé et salé)", "url": "https://blog.giallozafferano.it/cioccovaniglia/focaccia-genovese/", "quote": "Focaccia genovese o detta la \"fugàssa\" nel dialetto ligure"}]}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 3, "name": "Farinata de pois chiches (Farinata di ceci)", "portions": "4 à 6 personnes", "ingredients": "300 g de farine de pois chiches, 900 ml d'eau, 50 ml d'huile d'olive extra-vierge, 10 g de sel (proportion : 3 parts d'eau pour 1 part de farine) ; facultatif : romarin, poivre.", "method": "Tamiser la farine de pois chiches. Verser l'eau en filet en fouettant pour éviter les grumeaux. Ajouter le sel et laisser reposer au moins 4 heures (idéalement toute la nuit). Retirer l'écume de surface à la louche. Incorporer l'huile d'olive. Huiler généreusement une plaque (traditionnellement en cuivre étamé) et y verser une fine couche de pâte. Enfourner à four très chaud (250-270 °C) jusqu'à ce que la farinata soit bien dorée. Servir chaude au poivre du moulin.", "key": "farinata de pois chiches farinata di ceci", "histoire": "Street food génois à base de farine de pois chiches, cousine directe de la « socca » niçoise, servie de Gênes à la Riviera.", "resume": "Street food génois à base de farine de pois chiches, cousine directe de la « socca » niçoise, servie de Gênes à la Riviera.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "method_source": "Ricette Fuori Fuoco", "method_source_url": "https://www.ricettefuorifuoco.it/farinata-di-ceci/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Street food génois à base de farine de pois chiches, cousine directe de la « socca » niçoise, servie de Gênes à la Riviera.", "source_url": "https://www.ricettefuorifuoco.it/farinata-di-ceci/", "source_name": "Ricette Fuori Fuoco"}], "id": 115, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}, "dialectes": [{"lang": "ligure", "name": "Fainâ", "fr": "farinata : galette de farine de pois chiches (dialecte génois)", "url": "https://blog.giallozafferano.it/renatabriano/farinata-di-ceci-o-faina-fatta-in-casa/", "quote": "La farinata di ceci o fainà (in dialetto genovese) fatta in casa"}]}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 4, "name": "Sardenaira / Pissalandrea de San Remo", "portions": "4 à 6 personnes", "ingredients": "Pâte levée : farine, eau, huile d'olive extra-vierge, levure, sel ; garniture : pulpe de tomate, anchois (ou sardines) sous sel, olives taggiasche, câpres, gousses d'ail en chemise, origan séché, huile d'olive extra-vierge.", "method": "Préparer une pâte levée (farine, eau, huile, levure), la laisser lever puis l'étaler sur une plaque huilée. Badigeonner d'huile avant d'étaler la tomate. Répartir la tomate, puis les câpres et les olives taggiasche. Ajouter les anchois (ou sardines) et les gousses d'ail entières en chemise. Saupoudrer d'origan et arroser d'huile d'olive. Cuire à four chaud (200 °C) 25 à 30 minutes, bords croustillants et intérieur moelleux.", "key": "sardenaira pissalandrea de san remo", "histoire": "Spécialité du ponant ligure (San Remo, Vintimille), cousine de la pissaladière ; son nom vient de la sardine, remplacée au fil du temps par l'anchois.", "resume": "Spécialité du ponant ligure (San Remo, Vintimille), cousine de la pissaladière ; son nom vient de la sardine, remplacée au fil du temps par l'anchois.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "method_source": "Dissapore", "method_source_url": "https://www.dissapore.com/ricette/sardenaira-ricetta-originale/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Spécialité du ponant ligure (San Remo, Vintimille), cousine de la pissaladière ; son nom vient de la sardine, remplacée au fil du temps par l'anchois.", "source_url": "https://www.dissapore.com/ricette/sardenaira-ricetta-originale/", "source_name": "Dissapore"}], "id": 116, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 5, "name": "Tourte pascale (Torta pasqualina)", "portions": "6 à 8 personnes", "ingredients": "Pâte : farine, huile d'olive extra-vierge, eau, sel (feuilles très fines) ; garniture : ~700 g de blettes (ou herbes sauvages, ou artichauts), 350 g de prescinsêua (caillé ligure) ou ricotta très fraîche égouttée, Parmigiano râpé, œufs entiers, marjolaine, huile d'olive, sel.", "method": "Préparer une pâte souple (farine, huile, eau, sel), la diviser en pâtons et laisser reposer. Faire suer les blettes, les hacher, les mêler à la prescinsêua (ou ricotta), au Parmigiano, à la marjolaine et au sel. Abaisser plusieurs feuilles très fines et en tapisser un moule huilé (nombreuses couches huilées entre elles). Étaler la garniture, creuser des puits et y casser les œufs entiers. Recouvrir des feuilles restantes huilées une à une, souder les bords. Cuire au four jusqu'à ce que la tourte soit dorée ; les œufs restent coulants ou juste pris.", "key": "tourte pascale torta pasqualina", "histoire": "Tourte rustique de l'ancienne tradition ligure, plat symbole de Pâques, préparée jadis avec 33 feuilles de pâte (comme les années du Christ).", "resume": "Tourte rustique de l'ancienne tradition ligure, plat symbole de Pâques, préparée jadis avec 33 feuilles de pâte (comme les années du Christ).", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 6, "method_source": "Riviera dei Bambini", "method_source_url": "https://rivieradeibambini.it/torta-pasqualina-genovese/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Tourte rustique de l'ancienne tradition ligure, plat symbole de Pâques, préparée jadis avec 33 feuilles de pâte (comme les années du Christ).", "source_url": "https://rivieradeibambini.it/torta-pasqualina-genovese/", "source_name": "Riviera dei Bambini"}], "id": 117, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}, "dialectes": [{"lang": "ligure", "name": "Gattafura", "fr": "torta pasqualina : tourte pascale aux blettes/artichauts, ricotta (prescinseua) et œufs (ancien nom ligure)", "url": "https://it.wikipedia.org/wiki/Torta_pasqualina", "quote": "conosciuta con il nome di torta gattafura, un nome che nel dialetto ligure sembra significasse \"rubata dalla gatta\""}]}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 6, "name": "Pansoti sauce aux noix (Pansoti con salsa di noci)", "portions": "4 personnes", "ingredients": "Pâte : farine, œuf/eau, un peu de vin blanc, sel ; farce : 500 g de preboggion (herbes sauvages : bourrache, cerfeuil, pimprenelle, ortie, blettes, pissenlit…), 250 g de prescinsêua (ou ricotta), 40 g de Parmigiano, 1 œuf, marjolaine, muscade ; sauce : 200 g de cerneaux de noix, 30 g de pignons, la mie d'un petit pain trempée au lait et essorée, ail, huile d'olive extra-vierge, sel.", "method": "Préparer une pâte à pâtes fine. Blanchir et hacher le preboggion, le mêler à la prescinsêua, au Parmigiano, à l'œuf, à la marjolaine et à la muscade. Étaler la pâte, déposer de petits tas de farce et former les pansoti (en triangle ou en « ventre »), bien souder. Pour la sauce, piler noix et pignons avec l'ail, la mie essorée et l'huile jusqu'à une crème lisse (détendre au lait si besoin). Cuire les pansoti à l'eau salée, égoutter et napper de la sauce aux noix tiédie, sans la faire bouillir.", "key": "pansoti sauce aux noix pansoti con salsa di noci", "histoire": "Raviolis du Levant génois (cités dès 1931) ; leur nom vient de leur forme « panciuta » (ventrue), à la farce maigre d'herbes (preboggion).", "resume": "Raviolis du Levant génois (cités dès 1931) ; leur nom vient de leur forme « panciuta » (ventrue), à la farce maigre d'herbes (preboggion).", "cat": "Spécialités du Terroir", "cat_icon": "🌿", "base": 4, "method_source": "Gazzetta del Gusto", "method_source_url": "https://www.gazzettadelgusto.it/ricette/primi/salsa-di-noci-e-pansoti-storia-e-ricetta-di-un-classico-ligure/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Raviolis du Levant génois (cités dès 1931) ; leur nom vient de leur forme « panciuta » (ventrue), à la farce maigre d'herbes (preboggion).", "source_url": "https://www.gazzettadelgusto.it/ricette/primi/salsa-di-noci-e-pansoti-storia-e-ricetta-di-un-classico-ligure/", "source_name": "Gazzetta del Gusto"}], "id": 118, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}, "dialectes": [{"lang": "ligure", "name": "Pansòti", "fr": "raviolis « ventrus » aux herbes (preboggion) et fromage, sauce aux noix", "url": "https://www.cookist.it/storia-dei-pansoti-la-pasta-panciuta-che-esalta-le-erbe-liguri/", "quote": "La parola pansòti significa « panciuti » in dialetto genovese"}]}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 7, "name": "Cima farcie à la génoise (Cima alla genovese)", "portions": "8 à 10 personnes", "ingredients": "Une poche de veau ; farce : veau haché, abats (cervelle et ris de veau), œufs entiers, petits pois, carotte en dés, ail, pignons, pistaches, marjolaine, muscade, Parmigiano râpé, sel, poivre ; cuisson : bouillon de légumes ou de viande.", "method": "Ouvrir la poche de veau pour former une poche à farcir. Préparer une farce moelleuse (viande hachée, abats, œufs, petits pois, carotte, ail, pignons, pistaches, marjolaine, muscade, Parmigiano). Remplir la poche aux deux tiers maximum (sinon elle éclate). Coudre l'ouverture au fil de cuisine en scellant bien. Plonger dans une marmite de bouillon et cuire ~2 heures à feu moyen, en piquant la surface pour éviter qu'elle gonfle. Retirer et laisser refroidir sous un poids, puis trancher.", "key": "cima farcie a la genoise cima alla genovese", "histoire": "Un des grands plats ligures : une recette humble qui réinventait les restes, poche de veau farcie servie froide en tranches.", "resume": "Un des grands plats ligures : une recette humble qui réinventait les restes, poche de veau farcie servie froide en tranches.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 8, "method_source": "Patty e i suoi piatti (Giallo Zafferano)", "method_source_url": "https://blog.giallozafferano.it/pattyeisuoipiatti/cima-ripiena-alla-genovese/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Un des grands plats ligures : une recette humble qui réinventait les restes, poche de veau farcie servie froide en tranches.", "source_url": "https://blog.giallozafferano.it/pattyeisuoipiatti/cima-ripiena-alla-genovese/", "source_name": "Patty e i suoi piatti (Giallo Zafferano)"}], "id": 119, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}, "dialectes": [{"lang": "ligure", "name": "Çìmma", "fr": "poitrine de veau farcie cuite au bouillon, servie froide en tranches", "url": "https://www.mangiareinliguria.it/ricette-tipiche-liguri/secondi/cima-genovese", "quote": "CIMA RIPIENA ALLA GENOVESE ~ ÇÌMMA PÌNN-A À ZENÉIZE"}]}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 8, "name": "Buridda ligure (Buridda)", "portions": "4 personnes", "ingredients": "Assortiment de poisson en morceaux (mérou, chien de mer, poulpe, grondin, rouget), oignon, ail, filets d'anchois, tomates mûres, vin blanc, câpres, champignons secs, persil, laurier, huile d'olive extra-vierge, galette du marin ou pain grillé, sel, poivre.", "method": "Faire revenir doucement dans l'huile l'oignon et l'ail émincés avec les anchois jusqu'à ce qu'ils fondent. Ajouter les champignons réhydratés, les câpres et le laurier. Déglacer au vin blanc et laisser évaporer. Incorporer les tomates mûres et laisser mijoter la sauce. Ajouter le poisson par ordre de cuisson (les plus fermes d'abord), sans trop remuer pour ne pas le défaire. Parsemer de persil en fin de cuisson. Servir dans des bols avec les galettes du marin ou du pain grillé.", "key": "buridda ligure buridda", "histoire": "Ragoût/soupe de poisson typique de Gênes ; le nom viendrait de l'arabe désignant le poisson coupé « en morceaux ».", "resume": "Ragoût/soupe de poisson typique de Gênes ; le nom viendrait de l'arabe désignant le poisson coupé « en morceaux ».", "cat": "Potages & Soupes", "cat_icon": "🥣", "base": 4, "method_source": "Cookist", "method_source_url": "https://www.cookist.it/buridda-ligure-ricetta/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Ragoût/soupe de poisson typique de Gênes ; le nom viendrait de l'arabe désignant le poisson coupé « en morceaux ».", "source_url": "https://www.cookist.it/buridda-ligure-ricetta/", "source_name": "Cookist"}], "id": 120, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 9, "name": "Lapin à la ligure (Coniglio alla ligure)", "portions": "4 personnes", "ingredients": "1 lapin en morceaux, olives taggiasca, pignons de pin, ail, oignon, vin rouge (idéalement Rossese di Dolceacqua), bouillon de viande, thym, romarin, laurier, huile d'olive extra-vierge, sel, poivre.", "method": "Préparer un soffritto d'oignon et d'ail dans l'huile jusqu'à ce qu'il soit translucide. Ajouter les morceaux de lapin et les dorer sur toutes les faces. Monter le feu, verser le vin rouge et laisser l'alcool s'évaporer. Ajouter le bouquet aromatique et les pignons. Mouiller d'une louche de bouillon chaud, couvrir et cuire à feu doux ~1 heure jusqu'à ce que la viande soit tendre. Ajouter les olives taggiasca en fin de cuisson. Servir avec des pommes de terre au four.", "key": "lapin a la ligure coniglio alla ligure", "histoire": "Plat traditionnel de la province d'Imperia : lapin, olives taggiasca et pignons, arrosé de vin rouge Rossese di Dolceacqua.", "resume": "Plat traditionnel de la province d'Imperia : lapin, olives taggiasca et pignons, arrosé de vin rouge Rossese di Dolceacqua.", "cat": "Viandes, Volailles & Gibiers", "cat_icon": "🍖", "base": 4, "method_source": "Sale & Pepe", "method_source_url": "https://www.salepepe.it/ricette/secondi/di-carne/animali-da-cortile-volatili/coniglio/coniglio-alla-ligure-la-ricetta-della-tradizione/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Plat traditionnel de la province d'Imperia : lapin, olives taggiasca et pignons, arrosé de vin rouge Rossese di Dolceacqua.", "source_url": "https://www.salepepe.it/ricette/secondi/di-carne/animali-da-cortile-volatili/coniglio/coniglio-alla-ligure-la-ricetta-della-tradizione/", "source_name": "Sale & Pepe"}], "id": 121, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 10, "name": "Stockfish à la génoise (Stoccafisso accomodato)", "portions": "4 à 6 personnes", "ingredients": "Stockfish déjà trempé et détaillé, pommes de terre, pignons de pin, olives taggiasca, tomates pelées et concentré de tomate, oignon, ail, persil, anchois salés, câpres, huile d'olive extra-vierge, sel, poivre.", "method": "Préparer un battuto de persil, ail et oignon et le faire revenir dans une cocotte avec l'huile et les anchois salés jusqu'à ce qu'ils fondent. Ajouter les morceaux de stockfish et les faire revenir quelques minutes. Incorporer les tomates concassées et le concentré dilué, ainsi que les pignons ; cuire ~20 minutes à feu doux. Ajouter les olives taggiasca et les pommes de terre en gros morceaux. Poursuivre ~30 minutes jusqu'à ce que les pommes de terre soient tendres. Servir avec du pain grillé (ou de la polenta).", "key": "stockfish a la genoise stoccafisso accomodato", "histoire": "Stockfish (morue séchée) mijoté, dit « accomodato » pour son assaisonnement aux ingrédients ligures.", "resume": "Stockfish (morue séchée) mijoté, dit « accomodato » pour son assaisonnement aux ingrédients ligures.", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 4, "method_source": "A Small Kitchen in Genoa", "method_source_url": "https://www.asmallkitcheningenoa.com/it/stoccafisso-accomodato-alla-ligure-ricetta-e-storia/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Stockfish (morue séchée) mijoté, dit « accomodato » pour son assaisonnement aux ingrédients ligures.", "source_url": "https://www.asmallkitcheningenoa.com/it/stoccafisso-accomodato-alla-ligure-ricetta-e-storia/", "source_name": "A Small Kitchen in Genoa"}], "id": 122, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 11, "name": "Focaccia de Recco au fromage (Focaccia di Recco col formaggio)", "portions": "4 personnes", "ingredients": "Farine, huile d'olive extra-vierge, eau, sel, crescenza (ou stracchino ; à l'origine prescinsêua), huile pour badigeonner.", "method": "Mélanger la farine avec ~80 g d'huile d'olive et ajouter de l'eau jusqu'à une pâte souple. Laisser reposer la boule 1 heure, couverte. Repétrir et laisser reposer 5 minutes. Étirer la pâte en une feuille transparente et en tapisser une plaque huilée. Répartir des flocons de crescenza sur toute la surface. Recouvrir d'une seconde feuille étirée, souder les bords et pratiquer quelques ouvertures. Filet d'huile et un peu de sel. Cuire à four très chaud (280 °C) 10 à 12 minutes, jusqu'à ce qu'elle soit dorée par endroits.", "key": "focaccia de recco au fromage focaccia di recco col formaggio", "histoire": "Spécialité de Recco : deux feuilles de pâte très fines garnies de fromage frais (crescenza), sans levain.", "resume": "Spécialité de Recco : deux feuilles de pâte très fines garnies de fromage frais (crescenza), sans levain.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "method_source": "Giallo Zafferano", "method_source_url": "https://blog.giallozafferano.it/dulcisinforno/focaccia-di-recco/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Spécialité de Recco : deux feuilles de pâte très fines garnies de fromage frais (crescenza), sans levain.", "source_url": "https://blog.giallozafferano.it/dulcisinforno/focaccia-di-recco/", "source_name": "Giallo Zafferano"}], "id": 123, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 12, "name": "Cappon magro (Cappon magro)", "portions": "6 à 8 personnes", "ingredients": "Galette du marin trempée eau-vinaigre, poissons et fruits de mer variés, betteraves, pommes de terre, haricots verts, carottes, chou-fleur, salsa verde génoise (persil, ail, câpres, anchois, mie de pain, vinaigre, huile d'olive), huile d'olive extra-vierge, sel.", "method": "Cuire séparément les légumes et le poisson/fruits de mer, puis les assaisonner. Préparer la salsa verde en mixant persil, ail, câpres, anchois, mie trempée, vinaigre et huile. Tremper les galettes du marin dans un mélange eau-vinaigre. Monter en dôme dans un moule : une couche de betteraves au fond, puis alterner poisson et légumes en intercalant une fine couche de salsa verde. Terminer par les galettes. Couvrir et réserver au frais au moins 12 heures. Démouler et décorer.", "key": "cappon magro cappon magro", "histoire": "Grande salade génoise de poisson et légumes montée en pièce, plat des jours maigres et de Noël, d'origine marine et populaire.", "resume": "Grande salade génoise de poisson et légumes montée en pièce, plat des jours maigres et de Noël, d'origine marine et populaire.", "cat": "Poissons & Fruits de mer", "cat_icon": "🐟", "base": 6, "method_source": "Cookaround", "method_source_url": "https://www.cookaround.com/ricetta/Cappon-magro.html", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Grande salade génoise de poisson et légumes montée en pièce, plat des jours maigres et de Noël, d'origine marine et populaire.", "source_url": "https://www.cookaround.com/ricetta/Cappon-magro.html", "source_name": "Cookaround"}], "id": 124, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 13, "name": "Pandolce génois (Pandolce genovese)", "portions": "6 à 8 personnes", "ingredients": "Farine, beurre mou, sucre, œuf, lait, sel, extrait de vanille, extrait d'amande, raisins secs (trempés au rhum), écorces d'orange et de cédrat confites, pignons de pin, levure chimique.", "method": "Faire tremper les raisins dans le rhum ~20 minutes. Travailler le beurre mou avec le sucre en crème, incorporer l'œuf. Ajouter sel, vanille, extrait d'amande et lait. Incorporer l'orange et le cédrat confits, les raisins essorés et les pignons. Ajouter enfin la farine et la levure tamisées, amalgamer sans trop travailler (pâte peu levée). Former une boule aplatie, l'inciser d'un triangle sur le dessus. Cuire à 210 °C ~40 minutes, jusqu'à ce qu'un cure-dent ressorte sec.", "key": "pandolce genois pandolce genovese", "histoire": "Gâteau des fêtes de Noël en Ligurie, aux pignons, raisins secs et fruits confits, à pâte peu levée.", "resume": "Gâteau des fêtes de Noël en Ligurie, aux pignons, raisins secs et fruits confits, à pâte peu levée.", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 6, "method_source": "Sonia Peronaci", "method_source_url": "https://www.soniaperonaci.it/pandolce-genovese/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Gâteau des fêtes de Noël en Ligurie, aux pignons, raisins secs et fruits confits, à pâte peu levée.", "source_url": "https://www.soniaperonaci.it/pandolce-genovese/", "source_name": "Sonia Peronaci"}], "id": 125, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}, "dialectes": [{"lang": "ligure", "name": "Pandöçe", "fr": "pandolce : gâteau génois de Noël aux fruits secs et confits", "url": "https://it.wikipedia.org/wiki/Pandolce", "quote": "in Ligurian pandöçe o pan döçe"}]}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 14, "name": "Baci di Alassio (Baci di Alassio)", "portions": "≈ 20 baci", "ingredients": "250 g de noisettes (idéalement du Piémont), 50 g de sucre (avec les noisettes), 30 g de cacao amer, 80 g de blancs d'œufs, 110 g de sucre (avec les blancs), 15 g de miel ; ganache : 70 g de crème, 70 g de chocolat noir 50-55 %.", "method": "Mixer finement les noisettes avec 50 g de sucre et le cacao. Monter légèrement les blancs avec 110 g de sucre et le miel, puis les incorporer aux noisettes pour une pâte souple. À la poche cannelée, dresser de petites demi-sphères sur une plaque. Cuire pour obtenir des coques friables, puis laisser refroidir. Préparer la ganache en versant la crème chaude sur le chocolat et en mélangeant ; laisser épaissir. Assembler deux coques par une couche de ganache. Conserver hors du réfrigérateur, au frais et au sec.", "key": "baci di alassio baci di alassio", "histoire": "Petits gâteaux d'Alassio à la noisette et au cacao fourrés de ganache, créés au début du XXe s. par le pâtissier Rinaldo Balzola.", "resume": "Petits gâteaux d'Alassio à la noisette et au cacao fourrés de ganache, créés au début du XXe s. par le pâtissier Rinaldo Balzola.", "cat": "Desserts & Pâtisseries", "cat_icon": "🍰", "base": 20, "method_source": "Sonia Peronaci", "method_source_url": "https://ww
