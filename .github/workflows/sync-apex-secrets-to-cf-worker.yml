name: Sync Apex Secrets to Cloudflare Worker

# Demande Kevin 2026-05-15 : "J'ai rentré dans les secrets tous les codes API.
# Tu peux tout tester et intégrer ça à Apex dans sa mémoire pour ne pas oublier."
#
# PATTERN SÉCURISÉ (NE PAS exposer les secrets à Apex client) :
# 1. Workflow lit les secrets GitHub Actions (jamais visibles côté client)
# 2. Deploy un Cloudflare Worker `apex-secrets-proxy` avec les secrets en env vars
# 3. Apex appelle le Worker proxy qui forward vers les APIs avec les vraies clés
# 4. Les clés API ne quittent JAMAIS Cloudflare server-side
#
# Avantages :
# - Kevin ne re-saisit jamais ses clés dans Apex
# - Apex ne peut pas leak les clés (il ne les voit jamais)
# - Rotation = mettre à jour secret GitHub + re-run workflow
# - Audit log Cloudflare = qui a appelé quel proxy quand
#
# Re-sync 2026-05-20 : Kevin a créé XAI_API_KEY, MISTRAL_API_KEY,
# COHERE_API_KEY, TOGETHER_API_KEY, FINNHUB_API_KEY dans GitHub Secrets.
# Ce commit re-déclenche le workflow pour les pousser au Worker proxy.

# Kevin 2026-09-06 « pourquoi tu es bloqué par GitHub ? trouve des solutions » :
# l'API GitHub est fermée à cette session (app non connectée pour l'organisation) →
# impossible de lancer un déploiement à la main depuis l'agent. La voie qui MARCHE est
# le push sur claude/** (schéma déjà éprouvé par deploy-apex-chat.yml). Un push =
# un déploiement, sans API, sans clic, sans attendre la fusion (leçon #213).
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/sync-apex-secrets-to-cf-worker.yml'
      - 'services/apex-secrets-proxy/**'

permissions:
  contents: read

concurrency:
  group: sync-apex-secrets
  cancel-in-progress: false

jobs:
  deploy-secrets-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22 (anti-deprecation Node 20)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Pre-flight check secrets requis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APEX_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
        run: |
          set -e
          MISSING=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          [ -z "$APEX_ADMIN_PIN_SHA256" ] && MISSING="$MISSING APEX_ADMIN_PIN_SHA256"
          if [ -n "$MISSING" ]; then
            echo "❌ Secrets GitHub manquants :$MISSING"
            echo ""
            echo "Pour les ajouter :"
            echo "1. Va sur https://github.com/9r4rxssx64-creator/cmcteams/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Add chaque secret manquant :"
            echo "   • CLOUDFLARE_API_TOKEN  → https://dash.cloudflare.com/profile/api-tokens"
            echo "     (Use template 'Edit Cloudflare Workers')"
            echo "   • CLOUDFLARE_ACCOUNT_ID → https://dash.cloudflare.com (sidebar droite, copier 32 chars hex)"
            echo "   • APEX_ADMIN_PIN_SHA256 → echo -n 'ton-PIN' | sha256sum | awk '{print \$1}'"
            exit 1
          fi
          echo "✅ Tous les secrets requis sont configurés"
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"

      - name: Validate Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          echo "Testing Cloudflare API token..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Token Cloudflare INVALIDE (HTTP $HTTP_CODE)"
            echo "$BODY" | head -5
            echo ""
            echo "Régénère le token : https://dash.cloudflare.com/profile/api-tokens"
            echo "Template : 'Edit Cloudflare Workers' (donne les permissions nécessaires)"
            exit 1
          fi
          echo "✅ Cloudflare API token valide"

      - name: Create proxy worker source
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/apex-secrets-proxy
          cat > /tmp/apex-secrets-proxy/wrangler.toml << EOF
          name = "apex-secrets-proxy"
          main = "src/index.js"
          compatibility_date = "2026-01-01"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          # v13.4.366 (Kevin 2026-09-05 « Fait tourner Apex sur Qwen l'IA gratuite ») :
          # binding Workers AI → Qwen (@cf/qwen/*) répond depuis Cloudflare, SANS aucune
          # clé externe ni compte tiers (même mécanisme que kdmc-crea-ai, déjà en prod).
          # [ai] est une TABLE → toujours APRÈS les clés simples (règle TOML scoping).
          [ai]
          binding = "AI"
          EOF

          mkdir -p /tmp/apex-secrets-proxy/src
          cat > /tmp/apex-secrets-proxy/src/index.js << 'EOF'
          /**
           * Apex Secrets Proxy — Cloudflare Worker
           *
           * Forwards Apex requests to LLM/external APIs avec les clés stockées
           * dans Worker env (jamais exposées au client Apex).
           *
           * Kevin 2026-05-15 : "Apex doit pouvoir tout utiliser sans avoir les clés".
           *
           * Endpoints :
           *   /anthropic/v1/messages → api.anthropic.com (header x-api-key)
           *   /openai/v1/* → api.openai.com (Bearer)
           *   /groq/v1/* → api.groq.com
           *   /gemini/v1beta/* → generativelanguage.googleapis.com
           *   /deepseek/v1/* → api.deepseek.com
           *   /perplexity/* → api.perplexity.ai
           *   /tavily/* → api.tavily.com
           *   /pinecone/* → api.pinecone.io
           *
           * Auth : header `x-apex-pin` doit matcher SHA-256(APEX_ADMIN_PIN env var)
           *        Cela protège contre abus (rate-limit gratuit Cloudflare 100k req/jour).
           */

          const PROXY_MAP = {
            anthropic: {
              upstream: 'https://api.anthropic.com',
              keyEnv: 'ANTHROPIC_API_KEY',
              authHeader: 'x-api-key',
              extraHeaders: { 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
            },
            openai: {
              upstream: 'https://api.openai.com',
              keyEnv: 'OPEN_AI_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            groq: {
              upstream: 'https://api.groq.com',
              keyEnv: 'GROQ_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            gemini: {
              upstream: 'https://generativelanguage.googleapis.com',
              keyEnv: 'GEMINI_API_KEY',
              queryKey: 'key', /* Google uses ?key= */
            },
            deepseek: {
              upstream: 'https://api.deepseek.com',
              keyEnv: 'DEEPSEEK_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            perplexity: {
              upstream: 'https://api.perplexity.ai',
              keyEnv: 'PERPLEXITI_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            tavily: {
              upstream: 'https://api.tavily.com',
              keyEnv: 'TAVILY_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            pinecone: {
              upstream: 'https://api.pinecone.io',
              keyEnv: 'PINECONE_API_KEY',
              authHeader: 'Api-Key',
            },
            telegram: {
              upstream: 'https://api.telegram.org',
              keyEnv: 'TELEGRAM_API_KEY',
              urlInject: '/bot{key}', /* telegram puts token in URL */
            },
            vonage: {
              upstream: 'https://api.nexmo.com',
              keyEnv: 'VONAGE_API_KEY',
              secretEnv: 'VONAGE_API_SECRET',
              queryKey: 'api_key',
              querySecret: 'api_secret',
            },
            opnLego: {
              upstream: 'https://api.openlego.io',
              keyEnv: 'API_OPEN_LEGO',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            emailjs: {
              upstream: 'https://api.emailjs.com',
              keyEnv: 'EMAILJS_PRIVATE_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            /* Kevin 2026-05-20 : providers IA + data additionnels. push_if_set
             * skip proprement si le secret GitHub n'existe pas encore — quand
             * Kevin crée le secret (nom EXACT ci-dessous), le proxy le sert auto. */
            xai: {
              upstream: 'https://api.x.ai',
              keyEnv: 'XAI_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            mistral: {
              upstream: 'https://api.mistral.ai',
              keyEnv: 'MISTRAL_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            cerebras: {
              upstream: 'https://api.cerebras.ai',
              keyEnv: 'CEREBRAS_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            cohere: {
              upstream: 'https://api.cohere.com',
              keyEnv: 'COHERE_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            together: {
              upstream: 'https://api.together.xyz',
              keyEnv: 'TOGETHER_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
            finnhub: {
              upstream: 'https://finnhub.io',
              keyEnv: 'FINNHUB_API_KEY',
              queryKey: 'token', /* finnhub.io utilise ?token= */
            },
            pexels: {
              upstream: 'https://api.pexels.com',
              keyEnv: 'PEXELS_API_KEY',
              authHeader: 'Authorization', /* Pexels : pas de prefix Bearer */
            },
            replicate: {
              /* Kevin 2026-06-01 : clé Replicate (r8_...) dans GitHub Secrets,
               * doit être servie par le proxy comme les autres. Replicate accepte
               * Authorization: Bearer <token>. */
              upstream: 'https://api.replicate.com',
              keyEnv: 'REPLICATE_API_KEY',
              authHeader: 'Authorization',
              authPrefix: 'Bearer ',
            },
          };

          /* ── v13.4.366 — Qwen GRATUIT via Cloudflare Workers AI (Kevin 2026-09-05) ──
           * Route /qwen/v1/chat/completions : entrée + sortie au format OpenAI (le client
           * Apex réutilise son lecteur SSE `choices[0].delta.content` tel quel). Le worker
           * appelle `env.AI.run(model, {messages, stream})` — aucune clé, aucun compte.
           * Modèles essayés DANS L'ORDRE (le 1er qui répond gagne, un identifiant mort =
           * on passe au suivant, la réponse nomme le modèle EXACT qui a servi) :
           *   qwen3.8-27b (262k, le plus récent) → qwen3-30b-a3b (raisonnement) →
           *   qwen2.5-coder-32b (code) → qwq-32b (raisonnement lourd).
           * Qwen3 peut écrire son raisonnement entre <think>…</think> : filtré pour que
           * Kevin ne voie que la réponse. Fail-open : 503 clair si Workers AI absent —
           * le client passe alors au provider suivant de sa chaîne (jamais bloqué). */
          const QWEN_MODELS = [
            '@cf/qwen/qwen3.8-27b',
            '@cf/qwen/qwen3-30b-a3b-fp8',
            '@cf/qwen/qwen2.5-coder-32b-instruct',
            '@cf/qwen/qwq-32b',
          ];
          const QWEN_MAX_TOKENS = 2048;

          /* Filtre <think>…</think> sur un flux texte découpé arbitrairement (état conservé
           * entre les morceaux) → renvoie le texte visible. */
          function makeThinkFilter() {
            let inThink = false;
            let buf = '';
            return function push(chunk, flush) {
              buf += chunk;
              let out = '';
              for (;;) {
                if (inThink) {
                  const end = buf.indexOf('</think>');
                  if (end < 0) { buf = buf.slice(-8); return out; }
                  buf = buf.slice(end + 8);
                  inThink = false;
                } else {
                  const start = buf.indexOf('<think>');
                  if (start < 0) {
                    /* garde un éventuel début de balise coupé ("<thi") sauf en flush */
                    let keep = 0;
                    if (!flush) {
                      const lt = buf.lastIndexOf('<');
                      const tail = lt >= 0 ? buf.slice(lt) : '';
                      if (tail && tail.length < 7 && '<think>'.startsWith(tail)) keep = tail.length;
                    }
                    out += buf.slice(0, buf.length - keep);
                    buf = buf.slice(buf.length - keep);
                    return out;
                  }
                  out += buf.slice(0, start);
                  buf = buf.slice(start + 7);
                  inThink = true;
                }
              }
            };
          }

          function openaiChunk(model, content, finish) {
            return 'data: ' + JSON.stringify({
              id: 'qwen-cf', object: 'chat.completion.chunk', model,
              choices: [{ index: 0, delta: content ? { content } : {}, finish_reason: finish || null }],
            }) + '\n\n';
          }

          async function handleQwen(req, env, CORS) {
            if (!env.AI) {
              return new Response(JSON.stringify({ error: { message: 'qwen not configured (Workers AI binding absent)' } }),
                { status: 503, headers: Object.assign({ 'Content-Type': 'application/json' }, CORS) });
            }
            let body;
            try { body = await req.json(); } catch (_) {
              return new Response(JSON.stringify({ error: { message: 'body JSON invalide' } }),
                { status: 400, headers: Object.assign({ 'Content-Type': 'application/json' }, CORS) });
            }
            const messages = Array.isArray(body && body.messages) ? body.messages
              .filter((m) => m && typeof m.role === 'string')
              .map((m) => ({ role: m.role, content: typeof m.content === 'string' ? m.content : JSON.stringify(m.content == null ? '' : m.content) })) : [];
            if (!messages.length) {
              return new Response(JSON.stringify({ error: { message: 'messages[] requis' } }),
                { status: 400, headers: Object.assign({ 'Content-Type': 'application/json' }, CORS) });
            }
            const wantStream = !!(body && body.stream);
            const input = {
              messages,
              stream: wantStream,
              max_tokens: Math.min(Math.max(Number(body.max_tokens) || QWEN_MAX_TOKENS, 64), 8192),
            };
            if (typeof body.temperature === 'number') input.temperature = body.temperature;
            const tried = [];
            for (const model of QWEN_MODELS) {
              let out;
              try {
                out = await env.AI.run(model, input);
              } catch (e) {
                tried.push({ model, error: String(e && e.message || e).slice(0, 200) });
                continue;
              }
              const hdr = Object.assign({ 'x-apex-provider': 'cloudflare:' + model, 'x-apex-model': model }, CORS);
              if (!wantStream) {
                const text = (out && typeof out.response === 'string') ? out.response
                  : (out && out.result && typeof out.result.response === 'string') ? out.result.response : '';
                if (!text) { tried.push({ model, error: 'réponse vide' }); continue; }
                const filt = makeThinkFilter();
                const visible = filt(text, true);
                return new Response(JSON.stringify({
                  id: 'qwen-cf', object: 'chat.completion', model,
                  choices: [{ index: 0, message: { role: 'assistant', content: visible }, finish_reason: 'stop' }],
                  usage: out.usage || null,
                }), { status: 200, headers: Object.assign({ 'Content-Type': 'application/json' }, hdr) });
              }
              /* Streaming : Workers AI renvoie un flux SSE `data: {"response":"…"}` puis
               * `data: [DONE]` → traduit à la volée en morceaux OpenAI. */
              if (!out || typeof out.getReader !== 'function') { tried.push({ model, error: 'pas de flux' }); continue; }
              const filt = makeThinkFilter();
              const dec = new TextDecoder();
              const enc = new TextEncoder();
              let pending = '';
              let emitted = false;
              const ts = new TransformStream({
                transform(chunk, ctrl) {
                  pending += dec.decode(chunk, { stream: true });
                  const lines = pending.split('\n');
                  pending = lines.pop() || '';
                  for (const line of lines) {
                    if (!line.startsWith('data:')) continue;
                    const payload = line.slice(5).trim();
                    if (!payload || payload === '[DONE]') continue;
                    try {
                      const j = JSON.parse(payload);
                      const t = typeof j.response === 'string' ? j.response : '';
                      if (!t) continue;
                      const vis = filt(t, false);
                      if (vis) { emitted = true; ctrl.enqueue(enc.encode(openaiChunk(model, vis, null))); }
                    } catch (_) { /* ligne partielle : ignorée */ }
                  }
                },
                flush(ctrl) {
                  const rest = filt('', true);
                  if (rest) { emitted = true; ctrl.enqueue(enc.encode(openaiChunk(model, rest, null))); }
                  ctrl.enqueue(enc.encode(openaiChunk(model, '', 'stop')));
                  ctrl.enqueue(enc.encode('data: [DONE]\n\n'));
                  void emitted;
                },
              });
              return new Response(out.pipeThrough(ts), {
                status: 200,
                headers: Object.assign({ 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-store' }, hdr),
              });
            }
            return new Response(JSON.stringify({ error: { message: 'qwen: aucun modèle Workers AI n\'a répondu', tried } }),
              { status: 502, headers: Object.assign({ 'Content-Type': 'application/json' }, CORS) });
          }

          async function verifyPin(req, env) {
            const pin = req.headers.get('x-apex-pin');
            if (!pin) return false;
            if (!env.APEX_ADMIN_PIN_SHA256) return false; /* v9 SÉCU : fail-CLOSED — jamais ouvert si le PIN n'est pas configuré (audit 2026-08-09) */
            const target = env.APEX_ADMIN_PIN_SHA256.toLowerCase();
            /* v322 fix (Kevin « code pris mais IA KO ») : le client envoie DÉJÀ
             * sha256(PIN) dans x-apex-pin (apex-secrets-proxy-client). L'ancien code
             * re-hashait → comparait sha256(sha256(PIN)) à sha256(PIN) → 401 partout.
             * On accepte les 2 conventions : header == sha256(PIN) (client actuel)
             * OU sha256(header) == secret (header = PIN en clair). Robuste. */
            if (pin.toLowerCase() === target) return true;
            const enc = new TextEncoder().encode(pin);
            const hash = await crypto.subtle.digest('SHA-256', enc);
            const hex = [...new Uint8Array(hash)].map((b) => b.toString(16).padStart(2, '0')).join('');
            return hex.toLowerCase() === target;
          }

          export default {
            async fetch(req, env) {
              const url = new URL(req.url);
              /* v322 fix (Kevin « Pas de réseau ») : préflight CORS. Un POST avec le
               * header custom x-apex-pin déclenche un OPTIONS préliminaire SANS ce
               * header → l'ancien code tombait dans verifyPin → 401 sans en-têtes CORS
               * → le navigateur bloquait le POST → "Failed to fetch" = "Pas de réseau".
               * On répond AVANT l'auth, avec les en-têtes CORS (Safari iOS exige une
               * liste explicite des headers autorisés). */
              const CORS = {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Methods': 'GET, POST, PUT, PATCH, DELETE, OPTIONS',
                'Access-Control-Allow-Headers': 'authorization, content-type, x-apex-pin, x-api-key, x-goog-api-key, anthropic-version, anthropic-dangerous-direct-browser-access, openai-organization, accept',
                'Access-Control-Max-Age': '86400',
              };
              if (req.method === 'OPTIONS') {
                return new Response(null, { status: 204, headers: CORS });
              }
              /* Health check */
              if (url.pathname === '/' || url.pathname === '/health') {
                const available = Object.entries(PROXY_MAP)
                  .filter(([, c]) => env[c.keyEnv])
                  .map(([k]) => k);
                /* v13.4.366 : Qwen = Workers AI, 0 clé → disponible dès que le binding existe.
                 * Le client Apex lit cette liste pour décider s'il peut router vers qwen. */
                if (env.AI) available.push('qwen');
                return new Response(JSON.stringify({
                  ok: true,
                  proxy: 'apex-secrets-proxy',
                  available_providers: available,
                  total: Object.keys(PROXY_MAP).length + 1,
                  qwen_models: env.AI ? QWEN_MODELS : [],
                }), { headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });
              }
              /* PIN auth pour tout le reste */
              if (!(await verifyPin(req, env))) {
                return new Response('Unauthorized', { status: 401, headers: CORS });
              }
              /* Match /provider/path */
              const m = url.pathname.match(/^\/([a-z-]+)(\/.*)?$/);
              if (!m) return new Response('Not Found', { status: 404, headers: CORS });
              const [, provider, rest] = m;
              /* v13.4.366 : Qwen gratuit = natif au worker (Workers AI), pas un relais. */
              if (provider === 'qwen') {
                if (req.method !== 'POST') return new Response('Method Not Allowed', { status: 405, headers: CORS });
                return handleQwen(req, env, CORS);
              }
              const cfg = PROXY_MAP[provider];
              if (!cfg) return new Response('Provider unknown', { status: 404, headers: CORS });
              const key = env[cfg.keyEnv];
              if (!key) return new Response(`Provider ${provider} not configured`, { status: 503, headers: CORS });
              if (!cfg.upstream) return new Response('Provider not a proxy', { status: 400, headers: CORS });
              /* Build upstream URL */
              let upstreamPath = rest || '';
              if (cfg.urlInject) upstreamPath = cfg.urlInject.replace('{key}', key) + (rest || '');
              const upstreamUrl = new URL(cfg.upstream + upstreamPath);
              /* Copy query */
              url.searchParams.forEach((v, k) => upstreamUrl.searchParams.set(k, v));
              /* Inject key in query if needed */
              if (cfg.queryKey) upstreamUrl.searchParams.set(cfg.queryKey, key);
              if (cfg.querySecret) upstreamUrl.searchParams.set(cfg.querySecret, env[cfg.secretEnv] || '');
              /* Build headers */
              const headers = new Headers();
              req.headers.forEach((v, k) => {
                /* On NE transmet PAS les en-têtes propres au navigateur : origin/referer font
                   qu'Anthropic exige anthropic-dangerous-direct-browser-access (401 CORS) ;
                   un appel serveur→serveur ne doit pas les porter. */
                if (k === 'host' || k === 'x-apex-pin' || k === 'origin' || k === 'referer' || k === 'cookie') return;
                headers.set(k, v);
              });
              if (cfg.authHeader) {
                headers.set(cfg.authHeader, (cfg.authPrefix || '') + key);
              }
              if (cfg.extraHeaders) {
                Object.entries(cfg.extraHeaders).forEach(([k, v]) => headers.set(k, v));
              }
              /* Forward */
              const upstreamResp = await fetch(upstreamUrl.toString(), {
                method: req.method,
                headers,
                body: req.body,
              });
              /* CORS */
              const respHeaders = new Headers(upstreamResp.headers);
              respHeaders.set('Access-Control-Allow-Origin', '*');
              respHeaders.set('Access-Control-Allow-Headers', '*');
              return new Response(upstreamResp.body, {
                status: upstreamResp.status,
                headers: respHeaders,
              });
            },
          };
          EOF

      - name: Deploy worker + secrets
        working-directory: /tmp/apex-secrets-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --compatibility-date 2026-01-01

      - name: Push all secrets to worker
        working-directory: /tmp/apex-secrets-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PERPLEXITI_API_KEY: ${{ secrets.PERPLEXITI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VONAGE_API_KEY: ${{ secrets.VONAGE_API_KEY }}
          VONAGE_API_SECRET: ${{ secrets.VONAGE_API_SECRET }}
          API_OPEN_LEGO: ${{ secrets.API_OPEN_LEGO }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.AX_REPLICATE_KEY }}
          APEX_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
        run: |
          push_if_set() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "Pushing $name..."
              echo "$value" | wrangler secret put "$name" 2>&1 | tail -2
            else
              echo "Skip $name (not set in GitHub Secrets)"
            fi
          }
          push_if_set ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          push_if_set OPEN_AI_API_KEY "$OPEN_AI_API_KEY"
          push_if_set GROQ_API_KEY "$GROQ_API_KEY"
          push_if_set GEMINI_API_KEY "$GEMINI_API_KEY"
          push_if_set DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
          push_if_set PERPLEXITI_API_KEY "$PERPLEXITI_API_KEY"
          push_if_set TAVILY_API_KEY "$TAVILY_API_KEY"
          push_if_set PINECONE_API_KEY "$PINECONE_API_KEY"
          push_if_set TELEGRAM_API_KEY "$TELEGRAM_API_KEY"
          push_if_set RAILWAY_TOKEN "$RAILWAY_TOKEN"
          push_if_set CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          push_if_set VONAGE_API_KEY "$VONAGE_API_KEY"
          push_if_set VONAGE_API_SECRET "$VONAGE_API_SECRET"
          push_if_set API_OPEN_LEGO "$API_OPEN_LEGO"
          push_if_set JWT_SECRET "$JWT_SECRET"
          push_if_set EMAILJS_PRIVATE_KEY "$EMAILJS_PRIVATE_KEY"
          push_if_set VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          push_if_set XAI_API_KEY "$XAI_API_KEY"
          push_if_set MISTRAL_API_KEY "$MISTRAL_API_KEY"
          push_if_set CEREBRAS_API_KEY "$CEREBRAS_API_KEY"
          push_if_set COHERE_API_KEY "$COHERE_API_KEY"
          push_if_set TOGETHER_API_KEY "$TOGETHER_API_KEY"
          push_if_set FINNHUB_API_KEY "$FINNHUB_API_KEY"
          push_if_set PEXELS_API_KEY "$PEXELS_API_KEY"
          push_if_set REPLICATE_API_KEY "$REPLICATE_API_KEY"
          # Le code admin N'EST PLUS pose ici : push_if_set utilise `| tail`, donc un
          # echec ressortait VERT. Il a son etape stricte juste apres.

      - name: Poser le code admin (strict — un echec doit ROUGIR)
        working-directory: /tmp/apex-secrets-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APEX_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
        run: |
          # Ce relais garde TOUTES les cles payantes de Kevin. S'il reste sur un ANCIEN
          # code admin, l'ancien code permet encore de les faire tourner a ses frais.
          # Donc, contrairement aux autres cles, celle-ci n'a PAS le droit d'echouer
          # en silence (`| tail` renvoie le code de sortie de `tail`, toujours 0).
          if [ -z "${APEX_ADMIN_PIN_SHA256:-}" ]; then
            echo "::error::APEX_ADMIN_PIN_SHA256 absent des secrets GitHub : le relais garderait l'ANCIEN code."
            exit 1
          fi
          if printf '%s' "$APEX_ADMIN_PIN_SHA256" | wrangler secret put APEX_ADMIN_PIN_SHA256 >/tmp/pin.log 2>&1; then
            tail -2 /tmp/pin.log
            echo "Code admin pose sur le relais des cles d'Apex."
          else
            tail -10 /tmp/pin.log
            echo "::error::Le code admin n'a PAS ete pose sur le relais des cles : il garde l'ANCIEN."
            exit 1
          fi

      - name: Verify deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APEX_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
        run: |
          set +e
          WORKER_URL="https://apex-secrets-proxy.9r4rxssx64.workers.dev"
          # Health check (no PIN required) — v13.4.366 : doit annoncer qwen (Workers AI)
          HEALTH=$(curl -s --max-time 20 "$WORKER_URL/health")
          echo "health: $HEALTH"
          echo "$HEALTH" | grep -q '"qwen"' && echo "✅ qwen annoncé par /health" || echo "❌ qwen ABSENT de /health (binding [ai] non déployé ?)"
          # v13.4.366 — PREUVE RÉELLE (leçon #135 : l'agent ne peut pas atteindre le worker,
          # la CI si) : un vrai appel Qwen via le proxy, avec le hash PIN comme le client.
          # Ne casse pas le déploiement si Qwen est momentanément muet (fail-open), mais
          # imprime STATUS + BODY exacts pour savoir POURQUOI (règle « cause exacte »).
          if [ -n "$APEX_ADMIN_PIN_SHA256" ]; then
            RESP=$(curl -s --max-time 60 -w '\n__HTTP__%{http_code}' -X POST "$WORKER_URL/qwen/v1/chat/completions" \
              -H "content-type: application/json" -H "x-apex-pin: $APEX_ADMIN_PIN_SHA256" \
              --data '{"messages":[{"role":"user","content":"Réponds en 3 mots : bonjour Kevin"}],"max_tokens":64}')
            CODE=$(echo "$RESP" | sed -n 's/.*__HTTP__//p')
            BODY=$(echo "$RESP" | sed 's/__HTTP__.*//')
            echo "qwen HTTP $CODE : $(echo "$BODY" | head -c 600)"
            if [ "$CODE" = "200" ]; then echo "✅ Qwen gratuit répond réellement via le proxy"; else echo "⚠️ Qwen n'a pas répondu (HTTP $CODE) — voir body ci-dessus"; fi
          else
            echo "PIN secret absent → appel Qwen réel sauté (health seulement)"
          fi
          exit 0
