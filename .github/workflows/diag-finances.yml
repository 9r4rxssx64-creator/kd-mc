name: Diagnostic — que garde le serveur du coffre Finances ? (lecture seule)

# 12.10.2026 — Kevin : « Plus d'historique. Plus rien nulle part » (Finances). On lit UNIQUEMENT des métadonnées du KV : fiche de la sauvegarde
# (date, taille, nombre d'opérations), taille du bloc chiffré, clés fin:*, événements fin_backup du journal d'audit. Jamais le contenu (il est
# chiffré avec le code de Kevin). Aucune écriture, aucune dépense. Lancé à la main.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diag-finances
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # gratuit par défaut : quelques appels d'API, aucun navigateur
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lire les métadonnées du coffre Finances (lecture seule)
        shell: bash -eo pipefail {0}
        run: node tools/audit/diag-finances.mjs
