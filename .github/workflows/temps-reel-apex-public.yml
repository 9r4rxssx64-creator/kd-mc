name: Temps réel d'Apex Chat — deux téléphones, vrai domaine (dépôt PUBLIC, comptes de test)

# 21.10.2026 (Kevin : « Rémi m'a envoyé un message, je ne reçois rien… vérifie la mise à jour en temps réel »).
# Deux comptes de TEST (« Temps ReelA… » / « Temps ReelB… ») entrent dans Apex Chat sur deux téléphones neufs simulés ; A écrit à B, B répond : on mesure le délai d'arrivée
# SANS recharger. Les deux comptes du domaine sont SUPPRIMÉS à la fin. AU DÉPÔT PUBLIC (minutes gratuites) : journal sans nom réel, sans code, sans jeton.
# À la main / API uniquement — jamais de cron.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temps-reel-apex
  cancel-in-progress: false

jobs:
  temps-reel:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud).
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Deux téléphones, un message dans chaque sens — verdicts seulement
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
        shell: bash -eo pipefail {0}
        run: node tests/temps-reel-apex.mjs
