name: Coffre — comptes KDMC, réparer un nom abîmé

# Kevin 8.10.2026 : « Répare et corrige tout ce qui doit l'être. »
# Vécu : la fiche d'une collègue porte « NoÃ«lle » au lieu de « Noëlle » (UTF-8 relu en latin-1 le 27.09) :
# son dossier `nm:` ne correspond plus au nom qu'elle tape. Ce robot remet le vrai nom — UNIQUEMENT si le nom
# voulu est la relecture UTF-8 exacte du nom abîmé (on répare un encodage, on ne renomme personne), jamais Kevin.
# Essai à blanc par défaut ; avec appliquer=oui, sauvegarde d'abord la fiche (corbeille 90 jours).
# Lancement à la main / API uniquement — jamais de cron. Reste au coffre.

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "uid du compte dont le nom est abîmé"
        required: true
      nom:
        description: "le vrai nom (prénom + nom), tel qu'il doit s'écrire"
        required: true
      appliquer:
        description: "oui = réparer pour de vrai (sinon essai à blanc)"
        default: "non"

permissions:
  contents: read

jobs:
  reparer:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 6   # gratuit par défaut (Kevin 30.09) : borné
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Réparer le nom (essai à blanc par défaut)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UID: ${{ inputs.uid }}
          NOM: ${{ inputs.nom }}
          APPLIQUER: ${{ inputs.appliquer }}
        shell: bash -eo pipefail {0}
        run: |
          NS=$(node -e "const t=require('fs').readFileSync('services/kdmc-router/wrangler.toml','utf8');const m=t.match(/binding\s*=\s*\"ACCOUNTS\"\s*\n\s*id\s*=\s*\"([a-f0-9]+)\"/);process.stdout.write(m?m[1]:'')")
          [ -n "$NS" ] || { echo "::error::espace KV ACCOUNTS introuvable dans wrangler.toml"; exit 1; }
          NS="$NS" node tools/audit/comptes-reparer-nom.mjs
