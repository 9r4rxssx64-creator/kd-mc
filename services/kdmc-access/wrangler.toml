name = "kdmc-access"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# ⚠️ TOML : `routes` DOIT rester AVANT toute [table]/[[table]] (cf. kdmc-router).
# custom_domain auto-provisionne DNS + SSL sur la zone kd-mc.com (compte Cloudflare
# de Kevin) — aucune manip DNS manuelle. Sous-domaine dédié = isolation (une panne
# de ce worker ne touche AUCUN autre sous-domaine).
routes = [
  { pattern = "admin.kd-mc.com", custom_domain = true },
]

# 🔒 « Aucune consultation sans compte, nulle part » (Kevin 3.10 ; appliqué ici le 15.10.2026).
# keep_vars : un déploiement n'efface pas une variable posée à la main dans Cloudflare.
keep_vars = true

[vars]
# "1" = la page « Qui se connecte » n'est servie qu'à un compte du domaine ouvert et non révoqué
#       (sinon la porte 401 « Cette page est réservée »). "0" = retour à l'ancien comportement
#       (la page s'affiche à tous ; ses données restent protégées par la session admin ou le code).
#       Variable absente = porte active (fail-closed).
ACCES_PAGE_COMPTE = "1"
