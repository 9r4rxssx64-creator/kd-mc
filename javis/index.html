<!-- Audit complet 30.09 (mesuré, Slow 4G, CPU ×4) : la page, puis le widget, puis « qui es-tu ? »,
     puis UNE NOUVELLE connexion à Lingua pour le dessin : tout à la suite. Ouvrir la connexion et
     demander le dessin dès maintenant (script ci-dessous, selon la mascotte) : LCP 3,20 → 2,36 s. -->
<link rel="preconnect" href="https://lingua.kd-mc.com" crossorigin>
<link rel="preconnect" href="https://lingua.kd-mc.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bee">
<!-- img-src : les images de Bee viennent de Lingua (source unique du dessin).
     media-src : ses VRAIES vidéos (bee/live/*.mp4), hébergées par Lingua elles aussi.
       ⚠ une balise <video> n'est PAS couverte par img-src : sans media-src, la vidéo est
       bloquée SANS message et on ne verrait que la marionnette (piège CSP⇄fetch, CLAUDE.md).
     connect-src : 'self' (le domaine : identité, Face ID, et le cerveau de Bee /__javis/ai,
       réservé à Kevin) + la météo. Un hôte oublié ici = échec SILENCIEUX.
     script-src : PLUS de 'unsafe-inline' (audit Bee 27.09) — les 2 petits scripts de cette page
       sont autorisés par leur EMPREINTE. Modifier l'un d'eux sans recalculer son empreinte le
       bloque : test:javis-bee recalcule et compare (npm run test:javis-bee). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-2zjIMI+xlCZglbFOtqsiouJEuXO7u7cCkvpTRGde1Tg=' 'sha256-LGv35tdmI2UFdBR65d8r8VUIzKy3qyDn8G9ovo3g2Zg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lingua.kd-mc.com; media-src 'self' blob: https://lingua.kd-mc.com; connect-src 'self' https://lingua.kd-mc.com https://api.open-meteo.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<style>
  html,body{margin:0;height:100%;background:#0e0a04;color:#f7efd9;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a4906a;font-size:14px}
</style>
</head>
<body>

<!-- Cette app n'est qu'une COQUILLE : tout (Bee, ses animations, le chat, le gate
     SSO) vit dans javis-widget.js, le MEME fichier que le bouton flottant du
     domaine. Une seule Bee a maintenir — pas deux versions qui divergent
     (lecon #142). JAVIS_MODE='app' lui dit juste de s'afficher en plein ecran. -->
<div id="boot">Bee arrive…</div>

<script>window.JAVIS_MODE = 'app';
/* le dessin de LA mascotte choisie, demandé tout de suite — seulement sur un appareil déjà reconnu
   (contre-audit 30.09 : l'abeille était préchargée pour Bourricot, et sur l'écran verrou) */
try { if (localStorage.getItem('kdmc_sso_token')) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.crossOrigin = 'anonymous';
  l.href = 'https://lingua.kd-mc.com/' + (localStorage.getItem('javis_mascotte') === 'donkey' ? 'donkey' : 'bee/v2') + '/rig/base.webp';
  document.head.appendChild(l); } } catch (e) {}</script>
<script src="javis-widget.js" defer></script>
<script>
  window.addEventListener('load', function () {
    /* « Bee arrive… » reste jusqu'au verdict du domaine (le widget le retire) ; filet : 6 s */
    setTimeout(function () { var b = document.getElementById('boot'); if (b) b.remove(); }, 6000);
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  });
</script>
<!-- Bulle de version (Kevin 9.10 « chaque page a sa bulle, cliquable ») : toucher = forcer la mise à jour -->
<script src="/CMCteams/tools/shared/version-badge-pwa.js" data-project="bee" data-version="v1.18" data-version-global="JAVIS_VER" data-own-badge="#javis-ver" data-auto-update="false" data-color="#f4c542" defer></script>
</body>
</html>
