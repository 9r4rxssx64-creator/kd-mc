name: Vérif RÉELLE — Liens cliquables partout + bouton installer (iPhone)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verif-live-liens
  cancel-in-progress: false

jobs:
  verif:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud).
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: "Toutes les applis, connecté en admin — liens ouverts pour de vrai, informations cliquables, bouton installer (nombres seulement)"
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          SANS_NOMS: "1"
        # `pipefail` OBLIGATOIRE : sans lui le code de sortie est celui de `tee` (toujours 0) et un robot qui dit « ÉCHEC » ressortirait vert.
        shell: bash -euo pipefail {0}
        run: |
          set +e
          stdbuf -oL -eL node tests/verif-live-liens.mjs 2>&1 | tee /tmp/verif-liens.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rapport lisible depuis l'agent (annotations, nombres seulement)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/verif-liens.log ] || { echo "::notice title=Vérif Liens::(pas de journal)"; exit 0; }
          grep -aE '✅|❌|⚠|ℹ️|^===|^   ↳' /tmp/verif-liens.log \
            | grep -avE 'code admin|pinhash|PIN_HASH' | sed -E 's/[0-9a-f]{16,}/…/g' \
            | head -80 > /tmp/rap.txt || tail -40 /tmp/verif-liens.log > /tmp/rap.txt
          split -l 12 -d /tmp/rap.txt /tmp/bl_
          n=0
          for f in /tmp/bl_*; do
            n=$((n+1))
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Vérif Liens ${n}::${msg}"
          done
          echo "::notice title=Vérif Liens bilan::${n} bloc(s) publiés en annotations"

      - name: Verdict
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
