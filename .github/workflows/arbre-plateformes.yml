name: Arbre — TOUTES LES PLATEFORMES (Chromium + WebKit/Safari + Firefox, famille fictive)

# Kevin 22.10.2026 : « teste toujours tout sur l'ordinateur, iPhone, Android, toutes les plateformes… aucun bug visuel, fonctionnel, de fluidité ». WebKit = le moteur de Safari
# (iPhone / iPad), absent des sessions : ce robot le fournit. AU DÉPÔT PUBLIC (minutes gratuites et illimitées, 0 minute du coffre). Famille FICTIVE seulement
# (tools/arbre/fixture-famille.mjs) : aucune vraie donnée, aucun secret, aucune connexion. À la main seulement, jamais de cron.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbre-plateformes
  cancel-in-progress: false

jobs:
  plateformes:
    # un travail PAR MOTEUR, en parallèle : la matrice complète sur 3 moteurs dépassait 14 min d'un seul bloc (22.10)
    strategy:
      fail-fast: false
      matrix:
        moteur: [chromium, webkit, firefox]
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/coffre   # l'arbre est privé (code famille) : lu au coffre en lecture seule, comme les autres robots publics
        with:
          cle: ${{ secrets.COFFRE_CLE_LECTURE }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le moteur ${{ matrix.moteur }}
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud).
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps ${{ matrix.moteur }}

      - name: La matrice d'appareils (iPhone, Android, tablettes, portables, grand écran)
        timeout-minutes: 20   # un moteur figé ne tient plus le robot : l'étape s'arrête, les annotations restent lisibles
        env:
          ENGINES: ${{ matrix.moteur }}
          EXIGE_PLAYWRIGHT: "1"
        run: node tools/plateformes/verif-plateformes.mjs
