name: Ouvrir / fermer une app pour tout le monde

# Kevin 18.11.2026 : « Dans le domaine ferme de base CMCteams pour tous. J'ouvrirai quand tout sera ok. Possible 1 clic ouvert fermé pour tous, sur chaque app ».
# Le même geste que le bouton du tableau de bord admin, fait par le robot quand Kevin le demande : connexion admin (code = SECRET, empreinte, jamais écrite
# ni journalisée), puis /__admin/app-bascule. Le domaine ne touche QUE l'app nommée ; l'admin y entre toujours ; le portail ne se ferme jamais.
# AU DÉPÔT PUBLIC : l'app, l'état, la liste des apps fermées — aucun nom de personne. À la main seulement.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Nom de l'app dans le domaine (ex. cmcteams, departs, lingua) — vide avec « lire »"
        required: false
        default: ""
      etat:
        description: "fermee (pour tout le monde), ouverte, ou lire (ne change rien)"
        required: true
        default: "lire"
        type: choice
        options: ["lire", "fermee", "ouverte"]

permissions:
  contents: read

concurrency:
  group: app-ouvrir-fermer
  cancel-in-progress: false

jobs:
  bascule:
    runs-on: ubuntu-24.04   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ouvrir ou fermer l'app sur le vrai domaine — état relu ensuite
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          APP: ${{ inputs.app }}
          ETAT: ${{ inputs.etat }}
        # `pipefail` OBLIGATOIRE : sans lui le code de sortie est celui de `tee` (toujours 0) et un robot qui dit « ÉCHEC » ressortirait vert.
        shell: bash -euo pipefail {0}
        run: |
          set +e
          stdbuf -oL -eL node tools/admin/app-bascule.mjs 2>&1 | tee /tmp/app-bascule.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rapport lisible depuis l'agent (annotations)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/app-bascule.log ] || { echo "::notice title=App ouvrir fermer::(pas de journal)"; exit 0; }
          msg=$(grep -aE '✅|❌|ℹ️' /tmp/app-bascule.log | sed -E 's/[0-9a-f]{16,}/…/g' | head -12 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=App ouvrir fermer::${msg}"

      - name: Verdict
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
