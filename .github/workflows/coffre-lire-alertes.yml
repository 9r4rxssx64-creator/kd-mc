name: Coffre — lire les alertes du domaine, brutes (journal + fiches, lecture seule)

# 8.10.2026 (Kevin : « Vérifie Marie Curie, l'alerte domaine et le reste des connexions ») : la boîte montre une carte,
# ici on lit la SOURCE (KV ACCOUNTS du routeur) : qui, quel appareil, quel réseau (opérateur, AS, VPN), d'où, quand —
# jamais l'adresse IP (liste blanche des champs dans tools/audit/lire-alertes.mjs). Reste au COFFRE : ces lignes
# parlent de vraies personnes. Lecture seule, 0 requête au domaine, 0 écriture. À la main / API — jamais de cron.

on:
  workflow_dispatch:
    inputs:
      uids:
        description: "Comptes à détailler (uid séparés par des virgules), ex. laurence-saint-polit,marie-curie"
        required: false
        default: ""
      n:
        description: "Nombre d'alertes à lire (les plus récentes)"
        required: false
        default: "25"
      ev:
        description: "Types à garder (ex. new_device,geo_anomaly) — vide = toutes les alertes utiles"
        required: false
        default: ""
      tous:
        description: "1 = le journal entier même quand des comptes sont demandés (sinon : filtré sur ces comptes)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lire:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 5   # gratuit par défaut (Kevin 30.09) : quelques lectures d'API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lire le journal et les fiches (lecture seule)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash -eo pipefail {0}
        run: |
          NS=$(node -e "const t=require('fs').readFileSync('services/kdmc-router/wrangler.toml','utf8');const m=t.match(/binding\s*=\s*\"ACCOUNTS\"\s*\n\s*id\s*=\s*\"([a-f0-9]+)\"/);process.stdout.write(m?m[1]:'')")
          [ -n "$NS" ] || { echo "::error::espace KV ACCOUNTS introuvable dans wrangler.toml"; exit 1; }
          N="${{ inputs.n }}"; case "$N" in ''|*[!0-9]*) N=25;; esac
          NS="$NS" node tools/audit/lire-alertes.mjs "--uids=${{ inputs.uids }}" "--n=$N" "--ev=${{ inputs.ev }}" "--tous=${{ inputs.tous }}"
