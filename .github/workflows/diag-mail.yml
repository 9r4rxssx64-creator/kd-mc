name: Diagnostic — la réception des factures (factures@kd-mc.com) fonctionne-t-elle ?

# 12.10.2026 — Kevin : « Tjs 0 récup » (Finances → « Récupérer mes factures »). Le scan répond ok mais ne trouve rien. Avant de corriger, on MESURE :
# Email Routing actif ? règle factures@ → worker kdmc-mail ? combien d'appels reçus par jour, avec quelle issue ? Lecture seule : l'API
# Cloudflare (configuration + compteurs), aucun contenu de mail, aucune écriture. Lancé à la main.
on:
  workflow_dispatch:
    inputs:
      jours:
        description: "Nombre de jours à lire (1 à 14)"
        default: "7"

permissions:
  contents: read

concurrency:
  group: diag-mail
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # gratuit par défaut : trois appels d'API, aucun navigateur
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lire la configuration de réception et les compteurs du worker (lecture seule)
        shell: bash -eo pipefail {0}
        env:
          JOURS_IN: ${{ inputs.jours }}   # par l'environnement, jamais dans le shell (injection)
        run: |
          JOURS="$JOURS_IN"; case "$JOURS" in ''|*[!0-9]*) JOURS=7;; esac
          node tools/audit/diag-mail.mjs "$JOURS"
