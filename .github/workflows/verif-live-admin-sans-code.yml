name: Vérif RÉELLE — Admin reconnu partout, aucune appli ne demande de code (iPhone)

# Kevin 21.10.2026 : « quand je me connecte avec FaceID, je n'ai besoin d'aucun code sur tout mon domaine… reconnu partout, à chaque fois que je change d'application ».
# Le code admin vient du SECRET (empreinte, jamais écrite ni journalisée) et part au DOMAINE (/__admin/login). Le robot ouvre CHAQUE appli du domaine en admin et dit
# si un champ « code / mot de passe » est visible. LECTURE seule (toute écriture est absorbée). AU DÉPÔT PUBLIC : seulement des verdicts par appli (annotations). À la main seulement.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verif-live-admin-sans-code
  cancel-in-progress: false

jobs:
  verif:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium
        # Version figée, aucun script d'installation exécuté, le binaire du paquet installé (jamais npx : qualité/sécurité SonarCloud).
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Toutes les applis, connecté en admin, sur le vrai domaine — verdicts seulement
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          SANS_NOMS: "1"
        # `pipefail` OBLIGATOIRE : sans lui le code de sortie est celui de `tee` (toujours 0) et un robot qui dit « ÉCHEC » ressortirait vert.
        shell: bash -euo pipefail {0}
        run: |
          set +e
          stdbuf -oL -eL node tests/verif-live-admin-sans-code.mjs 2>&1 | tee /tmp/verif-admin.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rapport lisible depuis l'agent (annotations, nombres seulement)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/verif-admin.log ] || { echo "::notice title=Vérif Admin sans code::(pas de journal)"; exit 0; }
          grep -aE '✅|❌|⚠|ℹ️|=== VÉRIF|^   ↳' /tmp/verif-admin.log \
            | grep -avE 'code admin|pinhash|PIN_HASH' | sed -E 's/[0-9a-f]{16,}/…/g' \
            | head -60 > /tmp/rap.txt || tail -40 /tmp/verif-admin.log > /tmp/rap.txt
          split -l 12 -d /tmp/rap.txt /tmp/bl_
          n=0
          for f in /tmp/bl_*; do
            n=$((n+1))
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Vérif Admin sans code ${n}::${msg}"
          done
          echo "::notice title=Vérif Admin sans code bilan::${n} bloc(s) publiés en annotations"

      - name: Verdict
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
