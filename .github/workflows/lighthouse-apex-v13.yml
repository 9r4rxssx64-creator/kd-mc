name: 'Lighthouse CI Apex v13'
# Une seule execution a la fois par branche : un nouveau commit remplace
# l'ancien au lieu de s'empiler dans la file d'attente GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# Audit cascade v13.3.82 — validation MESURABLE de la perf 100/100.
# Trigger : push sur main qui touche apex-ai/v13/**.
# Job : build + serve preview + lighthouse autorun + assert seuils config.

on:
  # v13.4.126 (Kevin "qualité pro App Store-ready") :
  # Ajout pull_request → Lighthouse bloque merge si score < seuils config.
  # Avant : seulement push main (détecte trop tard).
  pull_request:
    branches: [main]
    paths:
      - 'apex-ai/v13/**'
      - '.github/workflows/lighthouse-apex-v13.yml'
  push:
    branches: [main]
    paths:
      - 'apex-ai/v13/**'
      - '.github/workflows/lighthouse-apex-v13.yml'
  workflow_dispatch: {}

# Droits minimum (24.09.2026) : ce robot ne fait que lire. Explicite, pour ne jamais dépendre du
# réglage par défaut du dépôt (le dépôt public est réglé en lecture seule).
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apex-ai/v13

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Récupérer la source privée d’Apex (3 fichiers au coffre ; dans le coffre, rien à faire)"
        # 16.10.2026 : au dépôt public ces fichiers manquent → la construction échouait (TS2307). Ce robot ne mesure
        # que des tailles / scores : son journal n’imprime rien de la source.
        uses: ./.github/actions/coffre
        with:
          cle: ${{ secrets.COFFRE_CLE_LECTURE }}

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Build production bundle
        run: npm run build

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # 24.10.2026 (studio-crea, tâche 26 du pont) : l'artefact du run 40000661325 ne contenait QUE les deux
      # fichiers `lighthouse-v13.3.73*.json` figés dans le dépôt (mesure du 8 MAI 2026, 99/100), et PAS la
      # mesure fraîche du jour (`.lighthouseci/`, 51/100 en mobile) : `upload-artifact` ignore les dossiers
      # cachés tant que `include-hidden-files` n'est pas posé. Qui lisait l'artefact lisait un vieux score.
      # → on n'archive que la mesure du jour, et le résumé imprime les VRAIS scores et les VRAIS seuils.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: apex-ai/v13/.lighthouseci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        working-directory: apex-ai/v13
        run: |
          node -e '
            const fs = require("fs");
            const out = [];
            out.push("## 🚦 Lighthouse CI Apex v13", "");
            const cfg = JSON.parse(fs.readFileSync("lighthouse.config.json", "utf8")).ci || {};
            const asserts = (cfg.assert || {}).assertions || {};
            out.push("Seuils requis (lus dans lighthouse.config.json) :");
            for (const [k, v] of Object.entries(asserts)) {
              if (!k.startsWith("categories:")) continue;
              const [niveau, opts] = Array.isArray(v) ? v : [v, {}];
              const min = opts && opts.minScore != null ? Math.round(opts.minScore * 100) : null;
              out.push("- " + k.slice(11) + (min != null ? " ≥ " + min : "") + (niveau === "warn" ? " (warn)" : ""));
            }
            out.push("");
            // Prouvé par le run 40099928754 (24.10) : avec la cible « temporary-public-storage », lhci
            // n écrit PAS de manifest.json — seulement les rapports lhr-*.json. On lit donc les rapports.
            let rapports = [];
            try {
              rapports = fs.readdirSync(".lighthouseci").filter((f) => /^lhr-.*\.json$/.test(f)).sort()
                .map((f) => JSON.parse(fs.readFileSync(".lighthouseci/" + f, "utf8")));
            } catch (e) {}
            if (!rapports.length) {
              out.push("⚠️ Aucune mesure du jour dans .lighthouseci/ (aucun lhr-*.json) : rien à afficher (le robot n a pas mesuré).");
            } else {
              out.push("Scores MESURÉS aujourd hui (" + rapports.length + " passage(s), " + (rapports[0].configSettings || {}).formFactor + ", version mesurée = " + (rapports[0].finalDisplayedUrl || "?") + ") :", "");
              out.push("| passage | mesuré à | perf | accessibilité | bonnes pratiques | seo | LCP | TBT |", "|---|---|---|---|---|---|---|---|");
              rapports.forEach((r, i) => {
                const c = r.categories || {}, a = r.audits || {};
                const pc = (k) => (c[k] && c[k].score != null ? Math.round(c[k].score * 100) : "—");
                const dv = (k) => (a[k] && a[k].displayValue) || "—";
                out.push("| " + (i + 1) + " | " + String(r.fetchTime || "").slice(0, 16).replace("T", " ") + " | " + pc("performance") + " | " + pc("accessibility") + " | " + pc("best-practices") + " | " + pc("seo") + " | " + dv("largest-contentful-paint") + " | " + dv("total-blocking-time") + " |");
              });
            }
            out.push("", "Rapports JSON du jour archivés dans l artefact (30 jours).");
            const texte = out.join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, texte);
            process.stdout.write(texte); // aussi dans le journal : lisible par l API, pas seulement dans la page du run
          '
