name: Vérif RÉELLE — Affichage de toutes les apps (téléphones + ordinateurs, connecté en admin)

# Kevin 25.10.2026 : « Dans bcp d'apps du domaine, que ce soit sur tel ou ordi, il y a pas mal d'erreurs d'affichage. Des boutons qui en
# cachent d'autres, manque une flèche retour, le haut est caché dans l'écran, page mal positionnée… Vérifie tout partout en réel ».
# 33 adresses × 7 écrans (iPhone SE / 13 / paysage et iPad par le moteur de SAFARI, Android, portable, grand écran), connecté en ADMIN
# (le code vient du SECRET, empreinte jamais écrite ni journalisée, envoyée au DOMAINE comme quand Kevin le tape). LECTURE SEULE : toute
# requête qui écrit est bloquée. AU DÉPÔT PUBLIC (gratuit, illimité) : le journal n'imprime AUCUN texte de page (noms possibles) —
# seulement balise#id.classe des éléments en cause et des nombres. À la main seulement, jamais de cron.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Adresses à vérifier, séparées par des espaces (vide = les 33)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verif-affichage-domaine
  cancel-in-progress: false

jobs:
  verif:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium et WebKit (Safari)
        # Version figée, aucun script d'installation exécuté, binaires du paquet (jamais npx).
        run: |
          npm i -D playwright@1.49.1 --no-audit --no-fund --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Affichage de toutes les apps, connecté en admin — nombres et sélecteurs seulement
        id: robot
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          WEBKIT: "1"
          APPS: ${{ inputs.apps }}
        # `pipefail` OBLIGATOIRE : sans lui le code de sortie serait celui de `tee`.
        shell: bash -euo pipefail {0}
        run: |
          set +e
          # shellcheck disable=SC2086
          stdbuf -oL -eL node tools/plateformes/verif-affichage-domaine.mjs $APPS 2>&1 | tee /tmp/affichage.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rapport lisible depuis l'agent (annotations)
        if: always()
        shell: bash
        run: |
          [ -s /tmp/affichage.log ] || { echo "::notice title=Affichage::(pas de journal)"; exit 0; }
          # Le BILAN : une ligne par app (nombres + exemples de sélecteurs), rien d'autre (pas de texte de page). 5 lignes par note (≤ 10 notes par étape).
          sed -n '/=== BILAN/,$p' /tmp/affichage.log | sed -E 's/[0-9a-f]{16,}/…/g' | cut -c1-600 > /tmp/bilan.txt
          split -l 5 -d /tmp/bilan.txt /tmp/bl_
          n=0
          for f in /tmp/bl_*; do n=$((n+1)); msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::notice title=Affichage ${n}::${msg}"; done

      - name: Verdict (le robot a tourné jusqu'au bout)
        if: always()
        run: test "${{ steps.robot.outputs.rc }}" = "0"
