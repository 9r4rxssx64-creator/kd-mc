name: Security Suite — arsenal hacker (audit autorisé kd-mc.com)

# Kevin 2026-07-07 (« récupère tous les outils des hackers et installe dans Apex »).
# Suite de sécurité offensive + défensive = l'arsenal OSS que les pentesters/hackers
# éthiques utilisent, appliqué UNIQUEMENT aux propres apps de Kevin (kd-mc.com / ce
# repo). C'est du pentest AUTORISÉ sur son domaine — jamais contre un tiers.
#
# Outils embarqués (tous gratuits, OSS, réputés — cf. recherche 2026) :
#  🔑 gitleaks + TruffleHog  → secrets exposés (clés Anthropic/Firebase/aisstream…)
#  📦 OSV-Scanner + Trivy    → failles des dépendances (npm workers/tests) + IaC/SBOM
#  🧬 Semgrep (règles OSS)   → SAST du JS/TS (XSS, injections) — complète esc()/CSP
#  ⚙️ zizmor                 → durcit les GitHub Actions (injection, secrets, pinning)
# (Strix = pentest IA offensif dynamique dans strix-scan.yml, séparé car coûteux.)
#
# Déclencheurs : workflow_dispatch (moi/Kevin) + repository_dispatch [security-suite]
# (Apex, commande /audit). Cron hebdo léger (dimanche 3h UTC) = veille sécurité auto
# (règle anti-spam : 1×/sem, aucun mail, résultat en artifact + Firebase).
#
# Résultat : artifact `security-report-*` + résumé Firebase /apex/ax_security_last
# (Apex lit → Kevin voit l'état sécu dans son chat). Non-bloquant (fail-open : un
# outil qui plante n'arrête pas les autres) — c'est un RAPPORT, pas un gate.
#
# Sécurité : permissions contents:read ; secrets Firebase QUE sur le step de push.

on:
  workflow_dispatch:
    inputs:
      exec_id:
        description: 'ID exécution (callback Apex, optionnel)'
        required: false
        default: ''
      detail_path:
        description: 'Préfixes (séparés par des virgules) pour lister les signalements UN PAR UN dans le check-run — ex. messaging-app,.github/workflows/apex-chat'
        required: false
        default: ''
  repository_dispatch:
    types: [security-suite]
  # ⛔ Exécutions programmées RETIRÉES le 15/08/2026.
  #    GitHub a suspendu le compte : « repositories that use GitHub Actions
  #    solely to interact with 3rd party websites […] or for general
  #    computing purposes may fall afoul of the Additional Product Terms ».
  #    Ce workflow reste lançable À LA MAIN (workflow_dispatch), mais plus
  #    rien ne tourne tout seul. Ne PAS remettre de cron ici.
concurrency:
  group: security-suite
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write     # pour le « check-run » de fin (rapport lisible par l'API, voir plus bas)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # gitleaks/trufflehog scannent l'historique

      - name: Préparer la sortie
        run: mkdir -p /tmp/sec

      # ── 🔑 SECRETS ──────────────────────────────────────────────
      - name: gitleaks (secrets, historique git)
        continue-on-error: true
        shell: bash -eo pipefail {0}
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gl.tgz
          tar xzf /tmp/gl.tgz -C /tmp gitleaks 2>/dev/null || tar xzf /tmp/gl.tgz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --report-format json --report-path /tmp/sec/gitleaks.json --no-banner --exit-code 0 2>&1 | tail -20 | tee /tmp/sec/gitleaks.log

      - name: TruffleHog (secrets vérifiés = encore actifs)
        continue-on-error: true
        run: |
          curl -sSL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /tmp 2>&1 | tail -3 || true
          /tmp/trufflehog filesystem . --json --no-update > /tmp/sec/trufflehog.jsonl 2>/tmp/sec/trufflehog.log || true
          echo "TruffleHog: $(wc -l < /tmp/sec/trufflehog.jsonl 2>/dev/null || echo 0) résultats"

      # ── 📦 DÉPENDANCES ──────────────────────────────────────────
      - name: OSV-Scanner (vulns dépendances)
        continue-on-error: true
        shell: bash -eo pipefail {0}
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 -o /tmp/osv
          chmod +x /tmp/osv
          /tmp/osv scan --recursive --format json --output /tmp/sec/osv.json . 2>&1 | tail -15 | tee /tmp/sec/osv.log || true

      - name: Trivy (filesystem + IaC + secrets)
        continue-on-error: true
        shell: bash -eo pipefail {0}
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp v0.58.1 2>&1 | tail -5 || true
          # Guard : si l'install trivy a échoué, on saute proprement (OSV couvre déjà les deps)
          # au lieu d'un « /tmp/trivy: No such file » bruyant + un faux 0 dans le résumé.
          if [ -x /tmp/trivy ]; then
            /tmp/trivy fs --scanners vuln,misconfig,secret \
              --severity CRITICAL,HIGH,MEDIUM --format json --output /tmp/sec/trivy.json \
              --exit-code 0 --skip-dirs node_modules . 2>&1 | tail -15 | tee /tmp/sec/trivy.log || true
          else
            echo "trivy non installé — étape sautée (OSV-Scanner couvre les dépendances)" | tee /tmp/sec/trivy.log
          fi

      # ── 🧬 CODE (SAST) ──────────────────────────────────────────
      - name: Semgrep (SAST JS/TS, règles OSS)
        continue-on-error: true
        shell: bash -eo pipefail {0}
        run: |
          python3 -m pip install --quiet semgrep 2>&1 | tail -2 || true
          semgrep scan --config p/default --config p/javascript --config p/xss --config p/secrets \
            --json --output /tmp/sec/semgrep.json --quiet --timeout 120 \
            --exclude node_modules --exclude '*.min.js' . 2>&1 | tail -15 | tee /tmp/sec/semgrep.log || true

      # ── ⚙️ GITHUB ACTIONS ───────────────────────────────────────
      - name: zizmor (durcissement des workflows)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet zizmor 2>&1 | tail -2 || true
          zizmor --format json .github/workflows/ > /tmp/sec/zizmor.json 2>/tmp/sec/zizmor.log || true
          echo "zizmor terminé"

      # ── SYNTHÈSE ────────────────────────────────────────────────
      - name: Synthèse (compte les findings par outil)
        id: sum
        run: |
          python3 - <<'PYEOF' | tee /tmp/sec/summary.txt
          import json, os
          def loadj(p):
              try: return json.load(open(p))
              except Exception: return None
          def countlines(p):
              try: return sum(1 for l in open(p) if l.strip())
              except Exception: return 0
          res = {}
          gl = loadj('/tmp/sec/gitleaks.json'); res['gitleaks (secrets)'] = len(gl) if isinstance(gl, list) else 0
          res['trufflehog (secrets vérifiés)'] = countlines('/tmp/sec/trufflehog.jsonl')
          osv = loadj('/tmp/sec/osv.json'); res['osv (deps)'] = sum(len(r.get('packages',[])) for r in (osv or {}).get('results',[])) if osv else 0
          tv = loadj('/tmp/sec/trivy.json')
          res['trivy (vulns-secrets)'] = sum(len(r.get('Vulnerabilities',[]))+len(r.get('Secrets',[])) for r in (tv or {}).get('Results',[])) if tv else 0
          sg = loadj('/tmp/sec/semgrep.json'); res['semgrep (SAST)'] = len((sg or {}).get('results',[])) if sg else 0
          zz = loadj('/tmp/sec/zizmor.json'); res['zizmor (workflows)'] = len(zz) if isinstance(zz, list) else (len((zz or {}).get('findings',[])) if zz else 0)
          total = sum(res.values())
          lines = [f"{k}: {v}" for k,v in res.items()]
          print("TOTAL findings: %d" % total)
          for l in lines: print("  "+l)
          open('/tmp/sec/summary.json','w').write(json.dumps({'total':total,'by_tool':res}, ensure_ascii=False))
          # exposer pour le step summary
          import os as _o
          with open(_o.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write("## 🛡️ Security Suite — arsenal\n**%d findings** (rapport = artifact, pas un blocage)\n\n" % total)
              for l in lines: f.write("- "+l+"\n")
          PYEOF
          echo "done"

      # ── TRIER, pas seulement COMPTER ────────────────────────────────────────
      #    Le compte brut ci-dessus dit « trufflehog (secrets vérifiés) : 149 »
      #    alors qu'il compte TOUTES les lignes du fichier, vérifiées ou non. Un
      #    chiffre qui porte le mauvais nom fait paniquer pour rien — ou rassure
      #    à tort. Cette étape lit les rapports et dit ce qu'il en est VRAIMENT :
      #    combien sont confirmés VIVANTS par le fournisseur, avec quelle règle,
      #    dans quels fichiers. Elle n'imprime JAMAIS la valeur d'un secret : le
      #    journal d'un dépôt PUBLIC n'est pas l'endroit pour ça.
      - name: Triage des secrets (vivants ? faux positifs ? où ?)
        if: always()
        env:
          DETAIL_PATH: ${{ inputs.detail_path }}
        run: |
          # Écrit dans un fichier (repris par le check-run plus bas) PUIS dans le résumé.
          python3 - <<'PYEOF' | tee /tmp/sec/triage.txt
          import json, collections, os
          print("")
          print("=== TRUFFLEHOG — combien sont VRAIMENT vivants ? ===")
          vivants, total, par_detecteur, fichiers = 0, 0, collections.Counter(), collections.Counter()
          try:
              for l in open('/tmp/sec/trufflehog.jsonl'):
                  l = l.strip()
                  if not l: continue
                  total += 1
                  d = json.loads(l)
                  det = d.get('DetectorName', '?')
                  if d.get('Verified'):
                      vivants += 1
                      par_detecteur[det] += 1
                      md = (d.get('SourceMetadata') or {}).get('Data') or {}
                      src = (md.get('Git') or md.get('Filesystem') or {})
                      fichiers[src.get('file', '?')] += 1
          except FileNotFoundError:
              print("  (pas de rapport trufflehog)")
          print("  lignes au total          : %d" % total)
          print("  CONFIRMÉS VIVANTS        : %d" % vivants)
          if vivants:
              print("  par détecteur :")
              for k, v in par_detecteur.most_common(15): print("    - %s : %d" % (k, v))
              print("  fichiers concernés (top 15) :")
              for k, v in fichiers.most_common(15): print("    - %s : %d" % (k, v))
              print("  ⚠️ Un secret CONFIRMÉ VIVANT dans un dépôt PUBLIC est à révoquer AUJOURD'HUI.")
          else:
              print("  ✅ aucun secret confirmé vivant — le reste est non vérifié ou faux positif")

          print("")
          print("=== GITLEAKS — quelles règles, quels fichiers ? ===")
          try:
              gl = json.load(open('/tmp/sec/gitleaks.json')) or []
          except Exception:
              gl = []
          regles, chemins, tests = collections.Counter(), collections.Counter(), 0
          MOTIF_TEST = ('test', 'fixture', 'spec', 'exemple', 'sample', 'mock', 'placeholder')
          for f in gl:
              regles[f.get('RuleID', '?')] += 1
              ch = f.get('File', '?')
              chemins[ch] += 1
              if any(m in ch.lower() for m in MOTIF_TEST): tests += 1
          print("  signalements : %d — dont %d dans des fichiers de TEST/fixture" % (len(gl), tests))
          print("  par règle :")
          for k, v in regles.most_common(15): print("    - %s : %d" % (k, v))
          print("  fichiers les plus concernés :")
          for k, v in chemins.most_common(15): print("    - %s : %d" % (k, v))
          print("")
          print("=== SEMGREP — 1155 signalements, mais dans QUOI ? ===")
          try:
              sg = (json.load(open('/tmp/sec/semgrep.json')) or {}).get('results', [])
          except Exception:
              sg = []
          sev, regles_sg, dossiers = collections.Counter(), collections.Counter(), collections.Counter()
          # Le code VENDORISÉ (bundles minifiés, copies de bibliothèques) n'est pas
          # notre code : le compter avec le reste noie ce qu'on peut réellement corriger.
          VENDOR = ('/chunks/', 'node_modules', '.min.js', 'pages-upload', '_archive', 'vendor/')
          notre_code = 0
          for r in sg:
              p2 = r.get('path', '?')
              sev[(r.get('extra') or {}).get('severity', '?')] += 1
              regles_sg[r.get('check_id', '?').split('.')[-1]] += 1
              dossiers[p2.split('/')[0]] += 1
              if not any(v in p2 for v in VENDOR): notre_code += 1
          print("  total : %d — dont %d dans NOTRE code (le reste est vendorisé/minifié)" % (len(sg), notre_code))
          print("  par gravité : %s" % dict(sev))
          print("  règles les plus fréquentes :")
          for k, v in regles_sg.most_common(10): print("    - %s : %d" % (k, v))
          print("  dossiers les plus concernés :")
          for k, v in dossiers.most_common(10): print("    - %s : %d" % (k, v))

          print("")
          print("=== ZIZMOR — durcissement des workflows ===")
          try:
              zz = json.load(open('/tmp/sec/zizmor.json'))
          except Exception:
              zz = []
          if isinstance(zz, dict): zz = zz.get('findings', [])
          regles_zz, sev_zz = collections.Counter(), collections.Counter()
          for f in (zz or []):
              regles_zz[f.get('ident') or f.get('rule') or '?'] += 1
              sev_zz[f.get('determinations', {}).get('severity') if isinstance(f.get('determinations'), dict) else f.get('severity', '?')] += 1
          print("  total : %d" % len(zz or []))
          print("  par gravité : %s" % dict(sev_zz))
          print("  par règle :")
          for k, v in regles_zz.most_common(12): print("    - %s : %d" % (k, v))

          # ── DÉTAIL PAR CHEMIN (à la demande) ─────────────────────────────────
          #    Les comptes ci-dessus disent « 11 dans messaging-app » sans dire
          #    LESQUELS : impossible de trier (vérifier chacun, écarter les faux
          #    positifs avec preuve) sans la ligne exacte. Ajouté le 10/09 pendant
          #    l'audit Apex Chat : `detail_path=messaging-app` liste chaque
          #    signalement (règle · fichier:ligne · gravité), plafonné, sans jamais
          #    imprimer la valeur d'un secret (gitleaks : règle + ligne seulement).
          prefixes = [p.strip() for p in os.environ.get('DETAIL_PATH', '').split(',') if p.strip()]
          if prefixes:
              CAP = 400
              def garde(p): return any(p.startswith(x) or p.startswith('./' + x) for x in prefixes)
              print("")
              print("=== DÉTAIL — signalements un par un pour : %s (plafond %d lignes) ===" % (', '.join(prefixes), CAP))
              n = 0
              for r in sg:
                  p2 = r.get('path', '?')
                  if not garde(p2): continue
                  n += 1
                  if n > CAP: break
                  ex = r.get('extra') or {}
                  print("  semgrep  %-8s %s:%s  %s" % (ex.get('severity', '?'), p2, (r.get('start') or {}).get('line', '?'), r.get('check_id', '?').split('.')[-1]))
              for f in gl:
                  ch = f.get('File', '?')
                  if not garde(ch): continue
                  n += 1
                  if n > CAP: break
                  print("  gitleaks %-8s %s:%s  %s" % ('secret?', ch, f.get('StartLine', '?'), f.get('RuleID', '?')))
              for f in (zz or []):
                  loc = ''
                  try:
                      locs = f.get('locations') or []
                      sym = (locs[0].get('symbolic') or {}) if locs else {}
                      loc = ((sym.get('key') or {}).get('Local') or {}).get('given_path') or sym.get('key', {}).get('Remote', {}).get('path') or ''
                      if not loc:
                          loc = str(sym.get('key', ''))[:80]
                  except Exception:
                      loc = ''
                  if not garde(loc): continue
                  n += 1
                  if n > CAP: break
                  sevz = f.get('determinations', {}).get('severity') if isinstance(f.get('determinations'), dict) else f.get('severity', '?')
                  print("  zizmor   %-8s %s  %s" % (sevz, loc, f.get('ident') or f.get('rule') or '?'))
              print("  → %d signalement(s) listé(s)" % min(n, CAP))

          print("")
          print("Aucune valeur de secret n'est imprimée ici — ce dépôt est public.")
          PYEOF
          cat /tmp/sec/triage.txt >> "$GITHUB_STEP_SUMMARY"

      # ── LE RAPPORT, LÀ OÙ L'AGENT PEUT LE LIRE ──────────────────────────────
      #    Mesuré le 2026-09-10 : depuis une session d'agent, l'artifact (blob Azure)
      #    et le résumé de l'exécution (github.com) sont derrière un proxy qui répond
      #    403 — seule `api.github.com` passe. Un rapport qu'on ne peut pas lire est
      #    un rapport qui n'existe pas (erreur #28). Donc la synthèse + le triage
      #    sont AUSSI posés dans un « check-run » sur le commit : c'est lu par
      #    `node tools/ci/ci.mjs report <run_id>`. Même contenu que le résumé, même
      #    règle : aucune valeur de secret, jamais.
      - name: Résumé → check-run (lisible par l'API depuis une session d'agent)
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const rd = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
            const synthese = rd('/tmp/sec/summary.txt').trim() || '(pas de synthèse — un outil a planté avant)';
            const triage = rd('/tmp/sec/triage.txt').trim() || '(pas de triage)';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: `security-suite — rapport (run ${process.env.RUN_ID})`,
              head_sha: context.sha,
              status: 'completed', conclusion: 'neutral',   // rapport, pas un gate
              output: {
                title: 'Security Suite — synthèse + triage',
                summary: synthese.slice(0, 60000),
                text: triage.slice(0, 65000),
              },
            });
            core.info(`check-run créé sur ${context.sha.slice(0, 9)}`);

      - name: Rapport en artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-report-${{ github.run_id }}
          path: /tmp/sec/
          retention-days: 30

      # ⛔ Étape « Résumé → Firebase » RETIRÉE le 15/08/2026 : c'était la SEULE
      #    partie de ce workflow qui parlait à un service tiers, et c'est ce que
      #    GitHub reproche. Les 8 analyses ci-dessus portent sur CE dépôt —
      #    analyser son propre code est l'usage prévu d'Actions. Le rapport
      #    reste disponible en artifact et dans le résumé de l'exécution.