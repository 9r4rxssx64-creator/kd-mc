name = "kdmc-apis"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# ⚠️ TOML SCOPING (leçon kdmc-router) : `routes` DOIT rester AVANT toute [[table]]/[table].
# apis.kd-mc.com n'est PAS revendiqué par kdmc-router → ce worker peut le prendre en
# custom_domain (auto-provisionne DNS + certificat SSL sur la zone kd-mc.com, 0 manip).
routes = [
  { pattern = "apis.kd-mc.com", custom_domain = true },
]

# Binding Workers AI : LLM (Llama 3.3…) SANS aucun compte provider externe ni KYC.
# Fallback ultime de /ai → l'IA marche même avec zéro clé externe configurée.
# [ai] est une TABLE → placée APRÈS `routes` (règle TOML scoping kdmc-router).
[ai]
binding = "AI"

# KV ACCOUNTS = le MÊME que kdmc-router, lu en LECTURE SEULE (aucune écriture ici) : « déconnecter
# partout » doit couper AUSSI les moteurs payants d'apis (audit complet Bee 30.09). Les clés
# externes sont posées en secrets par deploy-kdmc-apis.yml.
[[kv_namespaces]]
binding = "ACCOUNTS"
id = "8cfa33a28ac045adb7b7a9556ca8a073"

# PLAFOND PAR APPAREIL sur /ai (audit Bee 27.09.2026, mesuré : l'en-tête Origin se falsifie
# d'une ligne, 200 appels Anthropic payés d'un seul script, AUCUN plafond). Binding « Rate
# Limiting » de Cloudflare : compteur en mémoire, GRATUIT, ZÉRO écriture KV (le plafond
# d'écritures KV du compte a été atteint le 27.09). Forme « unsafe » : celle que wrangler 3
# (épinglé dans le déploiement) comprend ; Cloudflare la garde en service après le GA.
# Si le binding manque, le worker laisse passer (jamais de panne) — voir limiteOk().
[[unsafe.bindings]]
name = "LIMITE_IA"
type = "ratelimit"
namespace_id = "2701"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "LIMITE_IA_PREMIUM"
type = "ratelimit"
namespace_id = "2702"
simple = { limit = 6, period = 60 }
