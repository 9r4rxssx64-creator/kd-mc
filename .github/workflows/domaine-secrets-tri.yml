name: 🔐 Protéger le domaine — quels secrets fuient VRAIMENT ?

# Pourquoi cet outil existe
# -------------------------
# La suite sécurité annonce des COMPTEURS : « gitleaks 109, trufflehog 52 ».
# Un compteur n'est pas une faille : il faut savoir LESQUELS sont réels.
# Et ça compte double ici, parce que le dépôt est PUBLIC.
#
# « Vérifié » chez TruffleHog n'est PAS « ça ressemble à une clé » : l'outil a
# appelé le vrai service avec la clé et elle a RÉPONDU. C'est donc une clé
# vivante, lisible par tout le monde.
#
# Ce workflow ne modifie rien. Il répond à trois questions :
#   1. Quelles clés sont VIVANTES aujourd'hui ? (à révoquer en priorité)
#   2. Dans quels fichiers ? (pour les retirer)
#   3. Sont-elles seulement dans l'HISTORIQUE, ou encore dans le code actuel ?
#
# ⚠️ RÈGLE ABSOLUE DE CE FICHIER : il n'affiche JAMAIS la valeur d'un secret.
# Un journal d'exécution GitHub est lisible par tous sur un dépôt public —
# publier les clés dans le rapport qui les dénonce serait absurde.

on:
  workflow_dispatch:
    inputs:
      profondeur:
        description: "actuel = seulement le code d'aujourd'hui · historique = tout le passé"
        type: choice
        options: [actuel, historique]
        default: actuel

permissions:
  contents: read

jobs:
  trier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.profondeur == 'historique' && 0 || 1 }}

      - name: TruffleHog — uniquement les clés qui RÉPONDENT ENCORE
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          MODE="filesystem ."
          [ "${{ inputs.profondeur }}" = "historique" ] && MODE="git file://."
          # --only-verified : on ne veut PAS les « ça ressemble à », seulement
          # les clés que le vrai service a acceptées.
          trufflehog $MODE --only-verified --json > /tmp/th.json 2>/dev/null || true
          wc -l < /tmp/th.json | xargs echo "Résultats bruts :"

      - name: Le rapport (sans jamais montrer une seule clé)
        shell: bash -eo pipefail {0}   # sans pipefail, un echec ressort VERT
        run: |
          # `tee` : le rapport part À LA FOIS dans le beau résumé de la page
          # ET dans le journal d'exécution. Sans ça, le détail (quel service,
          # quel fichier) n'existe QUE dans le résumé — que je ne peux pas
          # relire depuis l'agent. Résultat vécu : je savais qu'il y avait
          # « 7 » clés, sans pouvoir dire lesquelles. Un rapport qu'on ne
          # peut pas lire ne sert à rien.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, collections

          lignes = []
          try:
              with open('/tmp/th.json') as f:
                  for l in f:
                      l = l.strip()
                      if l.startswith('{'):
                          try: lignes.append(json.loads(l))
                          except json.JSONDecodeError: pass
          except FileNotFoundError:
              pass

          print("# 🔐 Clés VIVANTES trouvées dans le dépôt public\n")
          if not lignes:
              print("## ✅ Aucune clé vérifiée vivante.\n")
              print("Les compteurs de la suite sécurité comptaient donc des")
              print("**ressemblances**, pas des clés actives. C'est une très")
              print("bonne nouvelle — et ça valait la peine de le vérifier")
              print("plutôt que de le supposer.\n")
              raise SystemExit(0)

          # ── Trier le VRAI du BRUIT ────────────────────────────────────
          # Mesuré le 2026-08-12 : les 7 « clés vérifiées » annoncées étaient
          # 7 NOMS DE FONCTIONS DE TEST (« def test_… », 40 caractères), pas
          # une seule vraie clé. Le détecteur « Lob » les accepte parce que
          # le bac à sable de ce service répond OK à n'importe quelle chaîne
          # commençant par « test_ » — donc « vérifié » n'y veut rien dire.
          #
          # Pourquoi c'est important : un rapport qui crie « 7 clés
          # vivantes ! » alors qu'il n'y en a aucune finit par être ignoré.
          # Et le jour où il y aura une VRAIE clé, elle sera noyée dedans.
          # On sépare donc, en RELISANT la ligne réelle du fichier.
          import re as _re

          def est_du_bruit(r):
              md = (r.get('SourceMetadata') or {}).get('Data') or {}
              src = md.get('Filesystem') or md.get('Git') or {}
              chemin, num = src.get('file'), src.get('line')
              if not chemin or not num:
                  return None
              try:
                  with open(chemin, encoding='utf-8', errors='replace') as fh:
                      ligne = fh.readlines()[int(num) - 1]
              except Exception:
                  return None
              if _re.match(r'\s*(?:def |async def |function |class )', ligne):
                  return 'nom de fonction ou de classe, pas une clé'
              return None

          vrais, bruit = [], []
          for r in lignes:
              raison = est_du_bruit(r)
              (bruit if raison else vrais).append((r, raison))

          if bruit:
              print(f"### 🟢 {len(bruit)} fausse(s) alerte(s) écartée(s)\n")
              print("Vérifié en relisant la ligne dans le fichier : ce ne sont pas")
              print("des clés. Écartées pour qu'une VRAIE fuite ne soit jamais")
              print("noyée dans le bruit.\n")
              for r, raison in bruit[:15]:
                  md = (r.get('SourceMetadata') or {}).get('Data') or {}
                  src = md.get('Filesystem') or md.get('Git') or {}
                  print(f"- `{src.get('file','?')}` l.{src.get('line','?')} — {raison}")
              print()

          if not vrais:
              print("## ✅ Aucune vraie clé active dans le code d'aujourd'hui.\n")
              print("Toutes les alertes étaient de fausses alertes, vérifiées une")
              print("par une. **Rien à révoquer.**\n")
              raise SystemExit(0)

          lignes = [r for r, _ in vrais]
          print(f"## ⚠️ {len(lignes)} clé(s) ACTIVE(S) — testées, elles répondent\n")
          print("Chacune est lisible par n'importe qui. **À révoquer d'abord,")
          print("retirer du code ensuite** — l'ordre compte : tant qu'elle n'est")
          print("pas révoquée, l'effacer du code ne la désactive pas.\n")

          par_service = collections.Counter()
          par_fichier = collections.Counter()
          for r in lignes:
              svc = r.get('DetectorName', '?')
              par_service[svc] += 1
              md = (r.get('SourceMetadata') or {}).get('Data') or {}
              src = md.get('Filesystem') or md.get('Git') or {}
              par_fichier[src.get('file', '?')] += 1

          print("### Par service — l'ordre de révocation\n")
          print("| Service | Combien | Où révoquer |")
          print("|---|---:|---|")
          OU = {
              'Anthropic': 'console.anthropic.com/settings/keys',
              'OpenAI': 'platform.openai.com/api-keys',
              'Github': 'github.com/settings/tokens',
              'GitHub': 'github.com/settings/tokens',
              'FirebaseCloudMessaging': 'console.firebase.google.com',
              'GCP': 'console.cloud.google.com/apis/credentials',
              'Cloudflare': 'dash.cloudflare.com/profile/api-tokens',
              'SendGrid': 'app.sendgrid.com/settings/api_keys',
              'Twilio': 'console.twilio.com',
              'Stripe': 'dashboard.stripe.com/apikeys',
          }
          for svc, n in par_service.most_common():
              print(f"| **{svc}** | {n} | {OU.get(svc, '— le tableau de bord du service')} |")

          print("\n### Fichiers concernés\n")
          for f, n in par_fichier.most_common(25):
              print(f"- `{f}` — {n}")

          # Numéro de ligne + longueur, JAMAIS la valeur.
          # Pourquoi c'est indispensable : sans le repère exact, impossible de
          # distinguer une vraie clé d'une fausse alerte. Vécu : 7 « clés
          # vérifiées » annoncées, toutes dans des fichiers de tests qui n'en
          # contiennent aucune. Sans le numéro de ligne, on révoque à
          # l'aveugle — ou pire, on ignore une vraie fuite en croyant à un
          # faux positif. Le fichier est déjà public : donner la ligne
          # n'ajoute AUCUNE information à un attaquant, alors que la valeur,
          # elle, en donnerait tout.
          print("\n### Repères exacts (valeur jamais affichée)\n")
          print("| Fichier | Ligne | Service | Longueur | Début |")
          print("|---|---:|---|---:|---|")
          for r in lignes[:40]:
              md = (r.get('SourceMetadata') or {}).get('Data') or {}
              src = md.get('Filesystem') or md.get('Git') or {}
              brut = str(r.get('Raw') or '')
              # 4 premiers caractères seulement : de quoi reconnaître une
              # famille de clé (« sk-a… », « ghp_… ») sans rien révéler
              # d'utilisable.
              debut = (brut[:4] + '…') if brut else '?'
              print(f"| `{src.get('file','?')}` | {src.get('line','?')} | "
                    f"{r.get('DetectorName','?')} | {len(brut)} | `{debut}` |")

          print("\n> 🔒 Aucune valeur de clé n'est affichée ici : ce journal est")
          print("> lisible par tous sur un dépôt public. Les valeurs restent")
          print("> dans le fichier de résultats, qui n'est pas publié.\n")
          PY

      - name: Rappel de la marche à suivre
        if: always()
        run: |
          {
            echo "---"
            echo "## L'ordre des opérations (il compte)"
            echo "1. **RÉVOQUER** chaque clé vivante chez son service."
            echo "   Tant qu'elle n'est pas révoquée, l'effacer du code ne sert à rien :"
            echo "   elle est déjà copiée dans l'historique public, et sans doute ailleurs."
            echo "2. **RECRÉER** une clé neuve et la mettre en secret GitHub (jamais dans le code)."
            echo "3. **RETIRER** l'ancienne du code."
            echo "4. Seulement après : envisager de réécrire l'historique."
          } >> "$GITHUB_STEP_SUMMARY"
