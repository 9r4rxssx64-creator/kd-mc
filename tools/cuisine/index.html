w.soniaperonaci.it/baci-di-alassio/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Petits gâteaux d'Alassio à la noisette et au cacao fourrés de ganache, créés au début du XXe s. par le pâtissier Rinaldo Balzola.", "source_url": "https://www.soniaperonaci.it/baci-di-alassio/", "source_name": "Sonia Peronaci"}], "id": 126, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}, {"tome": 11, "tome_title": "La Ligurie — la cuisine de la Riviera italienne (voisine de Monaco)", "icon": "🇮🇹", "num": 15, "name": "Panissa ligure (Panissa)", "portions": "4 personnes", "ingredients": "Farine de pois chiches, eau, sel ; pour servir : huile d'olive et citron, ou huile de friture et romarin.", "method": "Verser la farine de pois chiches et le sel dans un saladier, ajouter l'eau petit à petit en fouettant pour éviter les grumeaux. Verser dans une casserole et cuire à feu doux comme une polenta, en remuant sans cesse, jusqu'à une masse épaisse qui se détache des parois. Étaler la préparation chaude dans un plat huilé pour la faire refroidir et prendre. Servir soit fraîche, coupée en lanières avec huile d'olive et citron, soit détaillée en fines tranches et frite (panissa fritta), parfois au romarin.", "key": "panissa ligure panissa", "histoire": "Galette de farine de pois chiches typique de Gênes, cousine de la panisse niçoise, street food populaire.", "resume": "Galette de farine de pois chiches typique de Gênes, cousine de la panisse niçoise, street food populaire.", "cat": "Entrées, Œufs & Hors-d'œuvre", "cat_icon": "🥖", "base": 4, "method_source": "Cookist", "method_source_url": "https://www.cookist.it/panissa-ligure/", "method_note": "Recette traditionnelle ligure, d’après :", "infos": [{"fact": "Galette de farine de pois chiches typique de Gênes, cousine de la panisse niçoise, street food populaire.", "source_url": "https://www.cookist.it/panissa-ligure/", "source_name": "Cookist"}], "id": 127, "origine": {"key": "ligurie", "label": "Ligurie — Italie voisine", "flag": "🇮🇹"}}], "biblio": "# LE GRAND RÉPERTOIRE CULINAIRE DE LA RIVIERA\n## BIBLIOGRAPHIE OFFICIELLE ET SOURCES HISTORIQUES\n\nCe répertoire original s'appuie sur le croisement des archives familiales et des plus grands ouvrages de référence de la gastronomie française et azuréenne du XIXe et du XXe siècle.\n\n### 👑 1. Les Sources de la Haute Cuisine et des Palaces (Monte-Carlo)\n*   **Auguste Escoffier – *Le Guide Culinaire* (1903) & *Le Livre des Menus* (1912) :**\n    C'est la source maîtresse pour toutes les recettes labellisées « Monte-Carlo » (tournedos, poulardes bicolores, consommés de gala, soufflés en surprise). Escoffier fut le premier chef de l'Hôtel de Paris à Monte-Carlo, où il codifia cette cuisine de palace d'une blancheur et d'un faste immaculés pour les rois et les ducs européens.\n*   **Urbain Dubois – *La Cuisine Classique* (1856) & *Grand Allemand* :**\n    Grand théoricien de la cuisine d'apparat au service des empereurs, ses travaux ont fortement inspiré les apprêts de gibiers (perdreaux, noisettes de chevreuil) et les côtelettes de pigeonneaux masquées de foies blonds servies dans la Principauté.\n*   **Joseph Favre – *Dictionnaire Universel de Cuisine Pratique* (1905) :**\n    Une encyclopédie monumentale qui détaille scientifiquement les techniques de clarification des consommés au blanc d'œuf, les liaisons douces « à la nappe » et l'art des pièces montées froides « en Bellevue » présentées sur les buffets des grands casinos.\n*   **Henri Babinski (dit Ali-Bab) – *Gastronomie Pratique* (1907) :**\n    Une bible culinaire de la Belle Époque, essentielle pour comprendre l'introduction des produits exotiques et de la marée noble (langouste des souverains, huîtres au caviar) sur la Côte d'Azur au début du XXe siècle.\n\n### 🐟 2. Les Sources du Terroir et de la Cuisine Populaire (Monaco)\n*   **Les Archives Historiques du Palais de Monaco :**\n    Utiles pour retrouver les traces de la cuisine locale primitive, notamment les ordonnances du XVIIIe siècle décrivant les volailles « en crapaudine » grillées au feu de bois d'olivier et les ragoûts de pigeons de volière (formule de 1740).\n*   **Jean-Baptiste Reboul – *La Cuisinière Provençale* (1897) :**\n    L'ouvrage de référence absolu pour le terroir azuréen et méridional. C'est ici que l'on puise les racines des barbajuans, des légumes farcis à la mie au lait, de l'alose au fenouil sauvage, de l'estocafic (stockfish) familial et de la pissaladière authentique avec son confit de tomates.\n*   **Les Cahiers de Recettes des Ménagères du Rocher & de la Condamine :**\n    Traditions orales et manuscrits familiaux transmettant de génération en génération les secrets des ganses de la Saint-Jean au cédrat, du pain de Noël (*U Pan de Natale*) entouré de noix, et de la liaison secrète de la soupe de poisson à l'aide des foies de rougets écrasés au pilon.\n\n### 🏛️ 3. Les Grandes Bibliothèques et Fonds Numériques Consultés\n*   **Gallica (Bibliothèque nationale de France - BnF) :**\n    Le plus grand réservoir numérique au monde pour la gastronomie française. Il a permis de consulter les éditions originales d'Escoffier, les revues d'Art Culinaire du XIXe siècle et les anciens menus imprimés des banquets présidentiels donnés à Monaco.\n*   **The New York Public Library (NYPL - Menu Collection) :**\n    Cette institution américaine conserve l'une des plus riches collections au monde de menus d'époque. Ses archives numérisées ont permis de redécouvrir la composition exacte et la formulation des dîners historiques servis à l'Hôtel de Paris, au Casino de Monte-Carlo et sur les yachts amarrés dans le port de la Principauté à la Belle Époque.\n### 📜 4. Les Chroniques des Coulisses & Mémoires de Palaces (Monte-Carlo)\n*   **Les Archives des Menus de l'Hôtel de Paris (Monaco) :**\n    C'est la collection interne de la Société des Bains de Mer (SBM). Elle contient les double-feuillets de cuisine écrits à la main par les chefs successifs pour les grands ducs, répertoriant les caprices de table et les créations de la minute (comme le Tournedos Rossini au caviar ou la Langouste des Souverains).\n*   **Charles Ranhofer – *The Epicurean* (1893) :**\n    Bien que chef du célèbre restaurant Delmonico's à New York, Ranhofer a consigné dans ce monument de 1200 pages toutes les influences de la cuisine franco-italienne de la Riviera ramenées par les riches voyageurs américains ayant séjourné à Monte-Carlo à la fin du XIXe siècle.\n*   **Phileas Gilbert – *La Cuisine de Tous les Mois* (1893) :**\n     Gilbert fut le grand collaborateur de l'ombre d'Auguste Escoffier. Son ouvrage est indispensable pour comprendre l'évolution saisonnière des menus de la Côte d'Azur, notamment l'utilisation des premiers artichauts violets de printemps et des mandarines locales au cœur de l'hiver.\n*   **Les Revues Éditées par la « Société Culinaire de Paris » (1880-1910) :**\n    Ces bulletins professionnels mensuels rapportaient les concours de cuisine et les innovations des chefs travaillant à Monte-Carlo, décrivant en direct la création de l'Omelette Norvégienne à la Monégasque ou des crêpes soufflées.\n\n### 🍋 5. Les Traités d'Agriculture & Recueils de Terroir Oubliés (Monaco)\n*   **L'Abbé Dominique J.B. Grimaldi – *Traité sur la Culture de l'Olivier et la Pâtisserie Provençale* (1783) :**\n    Un ouvrage historique rarissime qui détaille l'importance de l'huile d'olive pressée sur le Rocher et la confection primitive des oreillettes et des ganses de fête parfumées à l'eau de fleur d'oranger pour la Saint-Jean.\n*   **Les Bulletins de la Société Littéraire et Scientifique de Monaco (XIXe siècle) :**\n    Ces recueils d'érudits locaux décrivent l'alimentation quotidienne des marins du port de la Condamine, la pêche aux casserons (petites seiches), la tradition séculaire du Stockfish lors du carême, et le rituel du Pain de Noël grillé.\n*   **Anatole Camarsac – *La Cuisine d'Azur et de l'Arrière-Pays* (1924) :**\n    Un petit carnet de recettes régionales qui capture la cuisine des villages reliés à Monaco (Saorge, Roquebrune, Menton), essentiel pour l'histoire des tourtons de blettes au brocciu et des noisettes de sanglier aux châtaignes confites.\n", "history_note": {"fact": "L'Hôtel de Paris de Monte-Carlo (ouvert en 1864 par la Société des Bains de Mer) est le lieu où César Ritz et Auguste Escoffier se rencontrent et s'associent au début des années 1880 — un partenariat qui les mènera à ouvrir le Ritz Paris en 1898. Escoffier y codifia une grande partie de la cuisine « Monte-Carlo ».", "source_url": "https://fr.wikipedia.org/wiki/Auguste_Escoffier", "source_name": "Wikipédia"}, "dialectes": [{"lang": "munegascu", "name": "Barba Giuàn (« Oncle Jean »)", "fr": "étymologie du barbagiuàn : « Oncle Jean » en ligurien occidental / monégasque", "url": "https://en.wikipedia.org/wiki/Barbajuan", "quote": "The word means Uncle John in western Ligurian and Monégasque dialect."}, {"lang": "munegascu", "name": "Barbagiuàn", "fr": "chausson / gros raviolo frit farci aux blettes (ou courge l'hiver), riz, poireaux, oignons et ricotta — plat national de Monaco", "url": "https://monaconow.com/monegasque-gastronomy-a-cuisine-of-the-sun-with-a-rich-history/", "quote": "Being Monaco's national dish, Barbagiuan is most notably eaten on the Principality's national day, on November 19. This is a small turnover or large raviolo filled with stuffing and fried in oil."}, {"lang": "munegascu", "name": "Brandamincium", "fr": "brandade de morue (morue pilée à l'ail, huile et crème) entourée de cardons, en sauce blanche", "url": "https://www.italyrivieralps.com/read-more/argomenti/local-products/articolo/the-cuisine-of-the-principality-of-monaco.html", "quote": "Brandamincium is salt cod pounded with garlic, oil and cream, surrounded by cardoons, in white sauce."}, {"lang": "munegascu", "name": "Fugassa (fougasse monégasque)", "fr": "brioche/fougasse sucrée à la fleur d'oranger et à l'anis, décorée de grains d'anis confits (fenuglieti) rouge et blanc aux couleurs du drapeau monégasque", "url": "https://www.fougasse.org/la-fougasse-de-monaco/", "quote": "la tradition veut qu'elle soit décorée aux couleurs du drapeau monégasque avec des grains d'anis confits appelés « fenuglieti » en monégasque, en rouge et blanc"}, {"lang": "munegascu", "name": "Pichade", "fr": "variante mentonnaise/monégasque de la pissaladière : sauce tomate aux oignons cuits sur pâte, ail, olives noires et anchois", "url": "http://www.montecarlodailyphoto.com/2013/01/pissaladierepichade.html", "quote": "Pichade is a dish from Menton and is a kind of pizza: a tomato sauce made with cooked onions placed on dough and decorated with cloves of garlic, black olives and anchovies."}, {"lang": "munegascu", "name": "Stocafi", "fr": "ragoût de stockfish (morue séchée) réhydraté et mijoté en sauce tomate à l'ail, olives noires et petits légumes", "url": "https://www.gastronomiac.com/lexique_culinaire/stocafi-cuisine-monegasque/", "quote": "Stocafi is a dish of dried cod, stewed in tomato sauce and flavored with black olives and small vegetables."}, {"lang": "niçard", "name": "A truccia", "fr": "omelette épaisse aux feuilles de blettes (spécialité niçoise partagée avec Monaco)", "url": "https://www.vanessacuisine.fr/truccia-nicoise/", "quote": "La truccia niçoise is a type of omelette made with chard leaves."}, {"lang": "niçard", "name": "Capon (chou farci)", "fr": "feuilles de chou farcies de viande, riz et légumes", "url": "https://www.france.fr/en/article/monaco-food-and-drinks-specialties/", "quote": "capon (cabbages stuffed with meat, rice and vegetables)"}, {"lang": "niçard", "name": "Estocafic", "fr": "stockfish (poisson séché) mijoté à la niçoise ; le mets se dit aussi estocaficada", "url": "https://fr.wikipedia.org/wiki/Estocafic", "quote": "les résidents anglais à Nice le nommèrent ironiquement « Stockfish » et les Niçois « Estocafic »"}, {"lang": "niçard", "name": "Li gansa nissardi", "fr": "ganse noires de Nice", "url": "https://www.france.fr/en/article/monaco-food-and-drinks-specialties/", "quote": "A speciality made from bread dough, onions, pissalat or anchovies, tomatoes, olive oil and small black olives from Nice."}, {"lang": "niçard", "name": "Salada nissarda", "fr": "salade niçoise de crudités, œufs durs, anchois/thon et olives de Nice", "url": "https://www.legourmeur.fr/portfolio-items/salade-nicoise-salada-nissarda-de-la-cote-dazur/", "quote": "Salade niçoise - salada nissarda de la Côte d'Azur"}, {"lang": "niçard", "name": "Socca", "fr": "galette fine de farine de pois chiche, eau et huile d'olive, cuite au four, croustillante sur les bords", "url": "https://esim.holafly.com/travel-tips/monaco-food/", "quote": "Socca ... is a Chickpea flour pancake that hails from the broader Ligurian region shared by France and Italy. The socca is cooked in a large, round, and flat pan, then cut into irregular pieces."}, {"lang": "niçard", "name": "Soupe au pistou", "fr": "soupe épaisse de légumes et haricots liée au pistou (basilic, ail, huile d'olive)", "url": "https://trip101.com/article/traditional-food-in-monaco", "quote": "Soupe au Pistou is a thick, rich Provencal vegetable & bean soup with basil dressing."}, {"lang": "niçard", "name": "Tourta de bléa (tourte de blettes)", "fr": "tourte à deux abaisses garnie de blettes, parmesan, persil, œufs, oignons et riz (versions salée et sucrée)", "url": "http://gourmetpedia.net/countries/flavors-of-monaco/", "quote": "Two layers of pastry filled with a mixture of Swiss chard blette, parmesan cheese, parsley, eggs, onions, and rice."}, {"lang": "niçard", "name": "Tourta de blea nissarda", "fr": "tourte de blettes niçoise (version sucrée aux raisins, pignons et pommes)", "url": "https://byacb4you.com/tourta-de-blea-nissarda-tourte-blettes.html", "quote": "Tourta de blea nissarda, tourte de blettes sucrée niçoise"}, {"lang": "ligure", "name": "Canestrelli", "fr": "biscuits sablés ligures en forme de fleur ajourée", "ur t.wikipedia.org/wiki/Pandolce", "quote": "in Ligurian pandöçe o pan döçe"}, {"lang": "ligure", "name": "Pansòti", "fr": "raviolis « ventrus » aux herbes (preboggion) et fromage, sauce aux noix", "url": "https://www.cookist.it/storia-dei-pansoti-la-pasta-panciuta-che-esalta-le-erbe-liguri/", "quote": "La parola pansòti significa « panciuti » in dialetto genovese"}, {"lang": "ligure", "name": "Pesto", "fr": "sauce au basilic pilée au mortier (nom du verbe « piler »)", "url": "https://en.wikipedia.org/wiki/Pesto", "quote": "The name is the past participle of the Genoese verb pestâ (Italian: pestare), meaning 'to pound', 'to crush'."}, {"lang": "ligure", "name": "Porchetta", "fr": "rôti de porc désossé aux herbes, adopté à Monaco par proximité avec l'Italie, servi lors des grandes fêtes de famille", "url": "https://esim.holafly.com/travel-tips/monaco-food/", "quote": "Porchetta has been adopted by locals due to the country's proximity to the Italian border and eventually become a staple in Monaco's cuisine, traditionally served for large family celebrations."}, {"lang": "ligure", "name": "Trenette", "fr": "pâtes plates typiques, servies au pesto", "url": "https://blog.giallozafferano.it/cucinaconnene/trenette-avvantaggiate/", "quote": "TRENETTE AVVANTAGGIATE tipica ricetta ligure"}, {"lang": "ligure", "name": "Trofie", "fr": "petites pâtes torsadées de la Riviera di Levante", "url": "https://doeatbetterexperience.com/it/blog/trofie-liguri/", "quote": "alcuni ritengono che derivi dal dialetto genovese « struffuggià » (strofinare)"}]}</script>

var ILLU_MOTIF={
 "Desserts & Pâtisseries":'<path d="M40 78 h40 l-4 -30 h-32 z"/><path d="M40 66 q20 -8 40 0" fill="none"/><path d="M40 72 q20 -8 40 0" fill="none"/><circle cx="60" cy="40" r="5" fill="currentColor" stroke="none"/><path d="M60 35 q3 -8 8 -9" fill="none"/><path d="M32 82 h56" stroke-width="2.4"/>',

 "Potages & Soupes":'<path d="M34 58 h52 a26 22 0 0 1 -52 0 z" fill="rgba(203,161,76,.10)"/><path d="M30 58 h60" stroke-width="2.4"/><path d="M50 44 q-4 -7 2 -13 M60 44 q-4 -8 2 -14 M70 44 q-4 -7 2 -13" fill="none"/>',
 "Viandes, Volailles & Gibiers":'<path d="M38 66 a22 15 0 1 1 44 0 z" fill="rgba(203,161,76,.10)"/><path d="M60 44 v-8 M55 40 a6 6 0 0 1 10 0" fill="none"/><path d="M32 70 h56" stroke-width="2.4"/>',
 "Poissons & Fruits de mer":'<path d="M34 60 q16 -16 40 0 q-16 16 -40 0 z" fill="rgba(203,161,76,.10)"/><path d="M74 60 l12 -8 v16 z" fill="rgba(203,161,76,.10)"/><circle cx="46" cy="57" r="2.2" fill="currentColor" stroke="none"/><path d="M28 74 q32 10 62 0" fill="none" stroke-width="2.2"/>',
 "Spécialités du Terroir":'<path d="M60 82 q0 -30 0 -44" fill="none"/><path d="M60 52 q-14 -4 -18 -16 q14 0 18 12 M60 62 q14 -4 18 -16 q-14 0 -18 12 M60 72 q-12 -4 -15 -13 q12 0 15 10" fill="rgba(203,161,76,.12)"/>'
};

var CATS=[];
(function(){var seen={};R.forEach(function(r){if(!seen[r.cat]){seen[r.cat]=r.cat_icon;CATS.push({name:r.cat,icon:r.cat_icon});}});})();
var TOMES=[];
(function(){var seen={};R.forEach(function(r){if(!seen[r.tome]){seen[r.tome]=1;TOMES.push({num:r.tome,title:r.tome_title,icon:r.icon});}});TOMES.sort(function(a,b){return a.num-b.num;});})();

function nrm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
var LANG_LBL={munegascu:'munegascu (mon\u00e9gasque)',monegasque:'munegascu (mon\u00e9gasque)',nicard:'ni\u00e7ard (nissart)','ni\u00e7ard':'ni\u00e7ard (nissart)',ligure:'ligure (g\u00e9nois)',genois:'ligure (g\u00e9nois)',provencal:'proven\u00e7al',intemelien:'int\u00e9m\u00e9lien (Vintimille)'};
function langLabel(l){return LANG_LBL[nrm(l)]||l||'dialecte';}
function langFlag(l){var n=nrm(l);if(n.indexOf('mune')>=0||n.indexOf('mone')>=0)return '\ud83c\uddf2\ud83c\udde8';if(n.indexOf('lig')>=0||n.indexOf('genoi')>=0)return '\ud83c\uddee\ud83c\uddf9';if(n.indexOf('nic')>=0||n.indexOf('prov')>=0)return '\ud83c\uddeb\ud83c\uddf7';return '\ud83d\udde3\ufe0f';}
function origBadge(r){
  if(!r.origine)return '';
  var o=r.origine;

  return '<span class="rorig"><span class="orig '+o.key+'">'+o.flag+' '+esc(o.key==='monaco'?'Monaco':'Ligurie \u00b7 Italie')+'</span>'+s+'</span>';
}

/* ---------- portion scaling ---------- */
function frFrac(n){
  var whole=Math.floor(n+1e-9); var frac=n-whole;
  var map=[[0.25,'¼'],[0.5,'½'],[0.75,'¾'],[0.33,'⅓'],[0.66,'⅔']];
  for(var i=0;i<map.length;i++){ if(Math.abs(frac-map[i][0])<0.04){ return (whole?whole+' ':'')+map[i][1]; } }
  if(frac<0.04) return String(whole);
  var v=Math.round(n*100)/100;
  return String(v).replace('.',',');
}
function scaleIng(text,ratio){
  if(ratio===1) return text;
  var units='(?:kg|g|cl|dl|ml|l|litres?|cuill[eè]res?|c\\.?\\s?[àa]\\.?\\s?[sc]\\.?|cs|cc|pinc[eé]es?|pi[eè]ces?|tranches?|gousses?|feuilles?|branches?|dosettes?|sachets?|bouquets?|verres?|zestes?|filets?|boules?|tasses?|œufs?|oeufs?|jaunes?|blancs?|oignons?|tomates?|citrons?|carottes?|poireaux?|artichauts?|aubergines?|poivrons?|p[eê]ches?|poires?|pommes?)';
  var re=new RegExp('(\\d+[.,]?\\d*)(\\s*(?:/\\s*\\d+)?\\s*'+units+')','gi');
  return text.replace(re,function(m,num,rest){
    var val=parseFloat(num.replace(',','.'))*ratio;
    return frFrac(val)+rest;
  });
}

/* ---------- steps + timers ---------- */
var TIMERS={};
/* Découpe la méthode en étapes (même découpage pour l'affichage ET la lecture à voix haute). */
function splitSteps(method){
  if(!method) return [];
  var parts=method.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+/g)||[method];
  var merged=[]; var buf='';
  parts.forEach(function(p){ buf+=(buf?' ':'')+p.trim(); if(buf.length>60||/[.!?]$/.test(p.trim())&&buf.length>30){merged.push(buf);buf='';} });
  if(buf)merged.push(buf);
  return merged;
}
function buildSteps(method){
  var merged=splitSteps(method);
  if(!merged.length) return '';
  var out='<ol class="steps">';
  merged.forEach(function(s){
    s=esc(s).replace(/(\d+)\s*(?:[àa]\s*(\d+)\s*)?(minutes?|min\b|heures?|h\b)/gi,function(m,a,b,u){
      var mins; var uu=u.toLowerCase();
      var base=parseInt(b||a,10);
      if(uu[0]==='h') mins=base*60; else mins=base;
      return '<button class="timer ui" onclick="startTimer(this,'+mins+')">⏱ '+esc(m)+'</button>';
    });
    out+='<li>'+s+'</li>';
  });
  return out+'</ol>';
}
var beepCtx;
function beep(){
  try{ beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)();
    var o=beepCtx.createOscillator(),g=beepCtx.createGain();o.connect(g);g.connect(beepCtx.destination);
    o.type='sine';o.frequency.value=880;g.gain.value=.001;o.start();
    g.gain.exponentialRampToValueAtTime(.4,beepCtx.currentTime+.05);
    g.gain.exponentialRampToValueAtTime(.001,beepCtx.currentTime+1.1);o.stop(beepCtx.currentTime+1.2);
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
}
function startTimer(btn,mins){
  if(btn._iv){ clearInterval(btn._iv);btn._iv=null;btn.classList.remove('run');btn.textContent=btn._orig;return; }
  btn._orig=btn.textContent; var end=Date.now()+mins*60000;
  btn.classList.add('run');
  function tick(){
    var left=Math.max(0,Math.round((end-Date.now())/1000));
    var m=Math.floor(left/60),s=left%60;
    btn.textContent='⏱ '+m+':'+(s<10?'0':'')+s;
    if(left<=0){ clearInterval(btn._iv);btn._iv=null;btn.classList.remove('run');btn.textContent='✓ Prêt !';beep();toast('⏱ Minuteur terminé !'); }
  }
  tick(); btn._iv=setInterval(tick,1000);
  toast('⏱ Minuteur lancé : '+mins+' min');
}

/* ---------- lecture à voix haute (Web Speech) ----------
 * Jusqu'au 10.09.2026 : toute la recette (600 caractères en moyenne, 1 442 au maximum) partait en UNE
 * seule phrase vocale, précédée d'un cancel() et gardée dans une variable locale. Sur iPhone,
 * cancel() collé à speak() fait sauter la lecture et une phrase trop longue se coupe net ; sur Chrome,
 * l'objet non référencé est ramassé → silence au bout de ~15 s. Résultat : « Lire les étapes ne
 * fonctionne pas » (Kevin, 10.09.2026). Ici : une phrase par étape, toutes gardées en mémoire,
 * enchaînées à la fin de la précédente ; l'étape lue est surlignée ; un échec dit sa cause exacte. */
var TTS={active:false,id:null,btn:null,utts:[],idx:0,started:false,watchdog:null};
var TTS_ERR={'not-allowed':'la lecture doit partir d\'un appui sur le bouton',
  'synthesis-unavailable':'aucune voix disponible sur cet appareil','synthesis-failed':'la voix a planté',
  'language-unavailable':'aucune voix française installée','voice-unavailable':'aucune voix française installée',
  'audio-busy':'le son est pris par une autre application','audio-hardware':'problème de haut-parleur',
  'network':'cette voix a besoin d\'internet','text-too-long':'texte trop long'};
function ttsSupported(){ return ('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined'); }
function ttsVoice(){
  try{
    var vs=speechSynthesis.getVoices()||[];
    var fr=vs.filter(function(v){return /^fr/i.test(v.lang||'');});
    fr.sort(function(a,b){return ((b.localService?1:0)-(a.localService?1:0))||((b.default?1:0)-(a.default?1:0));});
    return fr[0]||null;
  }catch(e){return null;}
}
/* Coupe un texte en morceaux ≤ max : ponctuation forte, puis virgules, puis espaces (jamais un mot coupé). */
function ttsCut(txt,max){
  var out=[]; var parts=txt.match(/[^.!?;:]+[.!?;:]*/g)||[txt];
  parts.forEach(function(p){
    if(p.length<=max){ out.push(p); return; }
    var cur=''; (p.match(/[^,]+,?/g)||[p]).forEach(function(q){ if(cur&&(cur+q).length>max){out.push(cur);cur='';} cur+=q; });
    if(cur)out.push(cur);
  });
  var fin=[];
  out.forEach(function(p){ while(p.length>max){ var i=p.lastIndexOf(' ',max); if(i<40)i=max; fin.push(p.slice(0,i)); p=p.slice(i); } if(p.trim())fin.push(p); });
  return fin;
}
/* Une phrase par étape (numérotée) ; une étape trop longue est coupée en morceaux ≤ 220 caractères (iPhone coupe les phrases longues). */
function ttsChunks(r){
  var out=[{text:'Recette : '+r.name+'.',step:-1}];
  splitSteps(r.method).forEach(function(s,i){
    var txt='Étape '+(i+1)+'. '+s.replace(/^\d+\s*[.)]\s*/,'');
    var buf='';
    ttsCut(txt,220).forEach(function(p){ if(buf&&(buf+' '+p).trim().length>220){out.push({text:buf.trim(),step:i});buf='';} buf+=(buf&&!/\s$/.test(buf)?' ':'')+p; });
    if(buf.trim())out.push({text:buf.trim(),step:i});
  });
  return out;
}
function ttsMakeUtt(chunk){
  var u=new SpeechSynthesisUtterance(chunk.text); u.lang='fr-FR'; u.rate=.95;
  var v=ttsVoice(); if(v)u.voice=v;
  u._step=chunk.step;
  u.onstart=function(){ TTS.started=true; clearTimeout(TTS.watchdog); };
  u.onend=function(){ if(!TTS.active||TTS.utts[TTS.idx]!==u)return; TTS.idx++; ttsSpeakNext(); };
  u.onerror=function(e){ var c=(e&&e.error)||'inconnue'; if(c==='interrupted'||c==='canceled')return; ttsFail(c); };
  return u;
}
function ttsSpeakNext(){
  if(!TTS.active)return;
  if(TTS.idx>=TTS.utts.length){ ttsStop(false,true); toast('✅ Lecture terminée'); return; }
  var u=TTS.utts[TTS.idx];
  ttsHighlight(u._step);
  clearTimeout(TTS.watchdog);
  TTS.watchdog=setTimeout(function(){ if(TTS.active&&!TTS.started)toast('🔇 Aucun son ? Monte le volume et vérifie le bouton silencieux de l\'iPhone.'); },3000);
  try{ speechSynthesis.speak(u); }catch(e){ ttsFail('speak : '+(e&&e.message||e)); }
}
function ttsFail(code){
  ttsStop(false);
  toast('🔇 Lecture impossible ('+code+') : '+(TTS_ERR[code]||'réessaie dans un instant'));
}
function ttsStop(byUser,finished){
  var wasActive=TTS.active; TTS.active=false; clearTimeout(TTS.watchdog);
  if(!finished){ try{ speechSynthesis.cancel(); }catch(e){} } /* fin naturelle : rien à annuler */
  ttsHighlight(-2); ttsButton(false); TTS.utts=[]; TTS.id=null; TTS.idx=0;
  if(byUser&&wasActive)toast('⏹ Lecture arrêtée');
}
function ttsButton(on){
  var b=TTS.btn; if(!b||!b.isConnected)b=document.querySelector('[data-tts]'); if(!b)return;
  b.textContent=on?'⏹ Arrêter la lecture':'🔊 Lire les étapes';
  b.classList.toggle('on',!!on); b.setAttribute('aria-pressed',on?'true':'false');
}
function ttsHighlight(step){
  var lis=document.querySelectorAll('.steps li');
  for(var i=0;i<lis.length;i++){
    var on=(i===step); lis[i].classList.toggle('reading',on);
    if(on&&lis[i].scrollIntoView){ try{ lis[i].scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} }
  }
}
/* iPhone : un élément <audio> qui joue (même muet) fait passer la page en session audio « lecture » —
 * la voix de synthèse n'est alors plus coupée par l'interrupteur silencieux. Le son (0,1 s de silence,
 * WAV fabriqué en mémoire) est créé une fois ; ne fait rien hors iPhone/iPad. */
function ttsUnlockAudio(){
  try{
    var ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(!ios)return;
    if(!TTS.audio){
      var n=800,b=new Uint8Array(44+n),v=new DataView(b.buffer),i;
      var S=function(o,s){for(var k=0;k<s.length;k++)b[o+k]=s.charCodeAt(k);};
      S(0,'RIFF');v.setUint32(4,36+n,true);S(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
      v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);S(36,'data');v.setUint32(40,n,true);
      for(i=0;i<n;i++)b[44+i]=128;
      var a=document.createElement('audio');a.setAttribute('playsinline','');a.preload='auto';
      a.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));TTS.audio=a;
    }
    var p=TTS.audio.play(); if(p&&p.catch)p.catch(function(){});
  }catch(e){}
}
function readAloud(id,btn){
  if(!ttsSupported()){ toast('🔇 Lecture vocale non disponible sur ce navigateur'); return; }
  if(TTS.active){ ttsStop(true); return; }
  var r=R[id]; if(!r||!r.method){ toast('Pas d\'étapes à lire pour cette recette'); return; }
  var chunks=ttsChunks(r);
  TTS.active=true; TTS.id=id; TTS.btn=btn||null; TTS.idx=0; TTS.started=false;
  TTS.utts=chunks.map(ttsMakeUtt); /* gardées en mémoire : Chrome coupe la voix si l'objet est ramassé */
  ttsButton(true);
  toast('🔊 Lecture de '+(chunks.length-1)+' phrases… (v2)');
  /* iPhone : la voix de synthèse est coupée par le bouton silencieux (catégorie « ambiante »). iOS 17+ permet
   * de passer la page en catégorie « lecture » (comme une app de musique) → la voix passe même en mode silencieux. */
  try{ if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'; }catch(e){}
  ttsUnlockAudio(); /* iPhone plus anciens : même effet en jouant un son muet dans le même appui */
  try{ if(speechSynthesis.paused)speechSynthesis.resume(); }catch(e){} /* iPhone : moteur parfois figé « en pause » */
  var busy=false; try{ busy=!!(speechSynthesis.speaking||speechSynthesis.pending); }catch(e){}
  /* Jamais cancel() collé à speak() : sur iPhone la phrase saute. On n'annule que s'il reste quelque chose, et on laisse respirer. */
  if(busy){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(ttsSpeakNext,150); }
  else ttsSpeakNext();
}
try{ if(ttsSupported()){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; } }catch(e){} /* précharge la liste des voix (iPhone la remplit en différé) */

function doSearch(){
  var q=nrm(STATE.q).trim();
  var list=R.slice();
  if(STATE.cat)list=list.filter(function(r){return r.cat===STATE.cat;});
  if(q){var terms=q.split(/\s+/);list=list.filter(function(r){
    var dnames=(r.dialectes||[]).map(function(d){return d.name;}).join(' ');
    var hay=nrm(r.name+' '+dnames+' '+r.cat+' '+(r.ingredients||'')+' '+(r.resume||'')+' '+(r.histoire||'')+' '+(r.method||''));
    return terms.every(function(t){return hay.indexOf(t)>=0;});
  });}
  list.sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
  // update chips active state
  var cs=el('qchips'); if(cs){cs.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
    var chips=cs.querySelectorAll('.chip'); chips[0].classList.toggle('on',!STATE.cat);
    CATS.forEach(function(c,i){ if(STATE.cat===c.name)chips[i+1].classList.add('on'); });}
  var res=el('qres');
  if(!list.length){res.innerHTML='<div class="empty">Aucune recette trouvée.<br>Essaie « truffe », « citron », « soufflé »…</div>';return;}
  var h=''; list.forEach(function(r){h+=recipeItem(r);}); res.innerHTML=h;
}

    h+=buildSteps(r.method);
    if(r.method_source){h+='<div class="note-src">'+esc(r.method_note||'Méthode reconstituée d’après une source documentée (la méthode exacte n’était pas dans le manuscrit).')+
      (r.method_source_url?' — <a href="'+esc(r.method_source_url)+'" target="_blank" rel="noopener" style="color:var(--gold)">'+esc(r.method_source)+'</a>':' — '+esc(r.method_source))+'</div>';}
  } else {
    h+='<div class="block-h"><span class="bt">👨‍🍳</span><h2 style="font-size:19px">Préparation</h2><span class="hl"></span></div>';
    if(r.resume){h+='<p style="font-size:15.5px;line-height:1.6">'+esc(r.resume)+'</p>';}
    h+='<div class="note-src">📜 La méthode détaillée de cette recette n\'a pas été retrouvée dans le manuscrit source — seuls les ingrédients (et sa description) ont été conservés, fidèlement, sans invention.</div>';
  }

  // actions
  var isFav=FAV[r.id];
  h+='<div class="rp-actions">';
  h+='<button class="'+(isFav?'on':'')+'" onclick="toggleFav('+r.id+',this)">'+(isFav?'♥ Favori':'♡ Favori')+'</button>';
  /* On passe l'IDENTIFIANT, plus le texte entier dans l'attribut : le texte est relu au moment de l'appui. */
  if(r.method&&r.method.length>40){ var lit=TTS.active&&TTS.id===r.id;
    h+='<button data-tts class="'+(lit?'on':'')+'" aria-pressed="'+(lit?'true':'false')+'" onclick="readAloud('+r.id+',this)">'+(lit?'⏹ Arrêter la lecture':'🔊 Lire les étapes')+'</button>'; }
  h+='<button onclick="window.print()">🖨 Imprimer</button>';
  h+='</div>';
  h+='<div style="text-align:center;margin-top:18px"><button class="ui" style="color:var(--gold);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase" onclick="shareRecipe('+r.id+')">Partager cette recette</button></div>';
  h+='</div></div>';
  APP.innerHTML=h;
  /* re-rendu pendant une lecture (portions, favori) : on garde l'étape surlignée et le bouton « Arrêter » */
  if(TTS.active&&TTS.id===r.id){ TTS.btn=document.querySelector('[data-tts]'); var cu=TTS.utts[TTS.idx]; if(cu)ttsHighlight(cu._step); }
}
function splitIngredients(text,ratio){
  // split on commas but keep sub-headers like "Pâte :" attached
  var raw=text.split(/,\s*(?![^()]*\))/);
  return raw.map(function(s){s=s.trim();return {base:s,scaled:scaleIng(s,ratio)};}).filter(function(x){return x.base;});
}
function chPort(d){
  var r=R[STATE.id]; var cur=STATE._portions||r.base;
  cur=Math.max(1,cur+d); STATE._portions=cur; renderRecipe();
}

/* ---------- favorites / courses ---------- */
function toggleFav(id,node){
  if(FAV[id])delete FAV[id];else FAV[id]=1; saveFav();
  toast(FAV[id]?'♥ Ajouté aux favoris':'Retiré des favoris');
  if(STATE.view==='recipe')renderRecipe(); else if(node){node.classList.toggle('on',!!FAV[id]);node.textContent=FAV[id]?'♥':'♡';}
  if(STATE.view==='favoris')renderFav();
  refreshBadge();
}
function toggleCourse(rid,idx,node){
  var r=R[rid]; var ratio=(STATE._portions||r.base)/r.base;
  var items=splitIngredients(r.ingredients,ratio); var it=items[idx];
  var pos=-1; COURSES.forEach(function(c,i){if(c.rid===rid&&c.base===it.base)pos=i;});
  if(pos>=0){COURSES.splice(pos,1);node.classList.remove('got');}
  else{COURSES.push({rid:rid,recipe:r.name,base:it.base,text:it.scaled,done:false});node.classList.add('got');toast('🧺 Ajouté aux courses');}
  saveCourses();
}

function clearCourses(){if(confirm('Vider toute la liste de courses ?')){COURSES=[];saveCourses();renderCourses();}}
function printCourses(){window.print();}
function shareCourses(){
  var txt='🧺 Liste de courses — Répertoire de la Riviera\n\n';
  var groups={},order=[];COURSES.forEach(function(c){var k=c.recipe||'Divers';if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(c);});
  order.forEach(function(k){txt+='• '+k+'\n';groups[k].forEach(function(c){txt+='   - '+c.text+'\n';});txt+='\n';});

function shareRecipe(id){

}
function doShare(title,text){
  if(navigator.share){navigator.share({title:title,text:text}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast('📋 Copié dans le presse-papier');},function(){toast('Copie impossible');});}
  else toast('Partage non disponible');
}

  h+='</div>'; APP.innerHTML=h;

/* ---------- Connexion sécurisée par le domaine kd-mc.com (SSO central, tout pareil) ----------
   On demande au domaine « qui es-tu ? » via /__sso/whoami (comme les boutiques, Départs,
   Créa Studio). Reconnaissance AUTO : si le domaine renvoie un nom (Face ID prouvé), on
   salue la personne. FAIL-OPEN total : hors du domaine (github.io) ou SSO injoignable →
   le livre reste ouvert à tous, rien n'est cassé, rien n'est bloqué. */
var KDMC_USER=null;
(function(){ try{var m=(location.hash||'').match(/[#&]kdmc_sso=([^&]+)/);
  if(m){try{localStorage.setItem('kdmc_sso_token',decodeURIComponent(m[1]));}catch(e){}
        try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}}catch(e){} })();
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||'';}
function domBadge(){
  if(KDMC_USER&&KDMC_USER.name){
    return '<span class="dom-badge">🔒 Connecté par kd-mc.com — Bonjour '+esc(firstName(KDMC_USER.name))+(KDMC_USER.admin&&KDMC_USER.verified?' · admin ✓':'')+'</span>';
  }
  return '<span class="dom-badge off">🔒 Connexion sécurisée · kd-mc.com</span>';
}
function kdmcWhoami(){
  (async function(){
    try{
      var tok=''; try{tok=localStorage.getItem('kdmc_sso_token')||'';}catch(e){}
      var hdr={}; if(tok)hdr.Authorization='Bearer '+tok;
      var rs=await fetch('/__sso/whoami',{credentials:'include',cache:'no-store',headers:hdr});
      var j=(rs&&rs.ok)?await rs.json():null;
      if(j&&j.ok&&j.name){ KDMC_USER={name:j.name,admin:j.admin===true,verified:j.verified===true};
        if(STATE.view==='home')renderHome(); renderTabs(); }
    }catch(e){/* SSO injoignable → fail-open, livre ouvert à tous */}
  })();
}
