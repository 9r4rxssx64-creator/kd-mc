name = "kdmc-crea-ai"
main = "worker.js"
compatibility_date = "2024-11-01"

# Worker IA de Créa Studio (détourage / cartoon / upscale / fond IA / photo→vidéo).
# Servi sur https://crea-ai.kd-mc.com (custom_domain = DNS + SSL auto sur la zone
# kd-mc.com, même mécanisme fiable que les autres apps — évite les soucis workers.dev).
# workers_dev reste actif en repli. Le secret REPLICATE_API_TOKEN est injecté par
# deploy-kdmc-crea-ai.yml (depuis AX_REPLICATE_KEY) — jamais dans ce fichier ni client.
routes = [
  { pattern = "crea-ai.kd-mc.com", custom_domain = true }
]
workers_dev = true

# Cloudflare Workers AI — 2e moteur GRATUIT (free tier quotidien du compte, déjà
# actif pour kdmc-rag/kdmc-apis). Aucune clé à gérer : binding direct.
# Sert de SECOURS RÉEL (le secours Replicate était mort : crédit épuisé = 402)
# et de renfort en PARALLÈLE quand deux moteurs valent mieux qu'un.
[ai]
binding = "AI"

# Interrupteur du PAYANT (Replicate) : « 0 » = coupé (tout gratuit, Kevin 02.10). Passer à "1"
# seulement en connaissance de cause ; sans lui, /animate et /job répondent 503 payant_coupe et
# les secours Replicate sont ignorés.
[vars]
BEE_SECOURS_PAYANT = "0"

# PLAFOND PAR COMPTE (audit 2026-10-08) : toute génération exige un compte vérifié du domaine
# (Authorization: Bearer validé par kd-mc.com/__sso/whoami) puis 30 demandes / minute / compte.
# Même binding « ratelimit » que kdmc-apis (gratuit, compteur mémoire, 0 écriture KV). Si le
# binding manque, le worker compte en mémoire avec le même plafond (voir limiteOk()).
[[unsafe.bindings]]
name = "LIMITE_CREA"
type = "ratelimit"
namespace_id = "2703"
simple = { limit = 30, period = 60 }
