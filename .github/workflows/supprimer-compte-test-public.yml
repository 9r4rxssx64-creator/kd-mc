name: Supprimer un compte de TEST oublié (dépôt PUBLIC, uid de robot seulement)

# 19.10.2026 (Kevin : « le compte parcours n'est pas à moi, vérifie qui c'est »). Supprime UN compte créé par nos robots (uid « testparcours-… » ou « parcours-robot… »),
# jamais un autre. Sans confirmer=oui : essai à blanc. Journal public : verdicts seulement. À la main / API — jamais de cron.

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "uid exact d'un compte de test (testparcours-, testmail-, testvitesse-, testdecoupe-, testsecours-, testrapide-, testlot-, testlecture-, testfinal-, testcache-, testpass-… ou parcours-robot…) — ou TOUS-LES-TESTS (tous les comptes de test) ou ATTENTE-DU-26-10 (inscriptions jamais validées du 26.10) ou VIDER-JOURNAL (vide le journal des alertes)"
        required: true
      confirmer:
        description: "oui = supprimer pour de vrai (sinon essai à blanc)"
        default: "non"

permissions:
  contents: read

jobs:
  supprimer:
    runs-on: ubuntu-latest   # interrupteur Lenovo (garde test:runner-interrupteur)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Supprimer le compte de test (verdicts seulement)
        env:
          KDMC_ADMIN_PIN_SHA256: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
          UID_TEST: ${{ inputs.uid }}
          CONFIRMER: ${{ inputs.confirmer }}
        shell: bash -eo pipefail {0}
        run: node tools/smoke/supprimer-compte-test.mjs "$UID_TEST" "--confirmer=$CONFIRMER"
